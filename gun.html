<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 第一人稱殭屍射擊 - 全功能開鏡與地雷版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            background-color: #000;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            margin-top: -4px;
            margin-left: -4px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }

        #scope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 50px solid rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            pointer-events: none;
            display: none;
            z-index: 9;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #weapon-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
            cursor: pointer;
        }

        #instructions h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #ff3333;
        }

        #instructions p {
            font-size: 16px;
            margin: 4px 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="scope-overlay"></div>
    <div id="hud">
        血量: <span id="health" style="color: #00ff00;">100</span> | 
        得分: <span id="score">0</span>
    </div>
    <div id="weapon-status">當前武器: 1. 連發步槍</div>

    <div id="instructions">
        <h1>殭屍包圍戰 - 開鏡與地雷突擊</h1>
        <p>點擊螢幕開始遊戲</p>
        <p>【W, A, S, D】移動 | 【Space】跳躍</p>
        <p>【滑鼠右鍵】開鏡瞄準 (所有槍枝適用)</p>
        <p>【數字鍵 1~6 / 滾輪】切換武器</p>
        <p>1.步槍 | 2.RPG | 3.十字弓 | 4.榴彈砲 | 5.狙擊槍 | 6.地雷發射器</p>
        <p>【爆頭機制】命中頭部造成 2 倍爆頭傷害！</p>
        <p>【滑鼠左鍵】開槍 / 【F 鍵】投擲手榴彈</p>
    </div>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let playerVelocityY = 0;
        const GRAVITY = 28;

        let isMouseDown = false;
        let isAiming = false;
        let lastShotTime = 0;
        let prevTime = performance.now();

        const MAP_SIZE = 80;
        const PLAYER_HEIGHT = 1.6;
        const zombies = [];
        const obstacles = [];
        const bullets = [];
        const grenades = [];
        const mines = [];
        const explosions = [];

        let health = 100;
        let score = 0;
        let isGameOver = false;

        // 武器設定
        const weaponList = ['rifle', 'rpg', 'crossbow', 'grenadeLauncher', 'sniper', 'mineLauncher'];
        const weaponNames = {
            'rifle': '1. 連發步槍',
            'rpg': '2. RPG火箭筒',
            'crossbow': '3. 十字弓',
            'grenadeLauncher': '4. 榴彈砲',
            'sniper': '5. 狙擊槍 (一擊必殺)',
            'mineLauncher': '6. 地雷發射器 (近接爆炸)'
        };
        let currentWeaponIndex = 0;
        let weaponMeshes = {};
        let weaponGroup;
        let muzzleFlash;

        const hudHealth = document.getElementById('health');
        const hudScore = document.getElementById('score');
        const weaponStatus = document.getElementById('weapon-status');
        const instructions = document.getElementById('instructions');
        const scopeOverlay = document.getElementById('scope-overlay');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            scene.fog = new THREE.FogExp2(0x111122, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 光源
            const ambientLight = new THREE.AmbientLight(0x777777);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 地面
            const floorGeometry = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createMapBoundaries();
            createObstacles();

            controls = new THREE.PointerLockControls(camera, document.body);
            controls.getObject().position.set(0, PLAYER_HEIGHT, 0);

            instructions.addEventListener('click', () => {
                if (!isGameOver) controls.lock();
                else restartGame();
            });

            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => {
                if (!isGameOver) instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            createWeapons();

            // 事件監聽
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('contextmenu', (e) => e.preventDefault()); // 禁用預設右鍵選單
            document.addEventListener('wheel', onMouseWheel);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            setInterval(spawnZombie, 1800);

            animate();
        }

        // --- 建立槍枝 3D 模型 ---
        function createWeapons() {
            weaponGroup = new THREE.Group();

            // 1. 連發步槍
            const rifleGroup = new THREE.Group();
            rifleGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 })));
            const rifleBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            rifleBarrel.position.set(0, 0.02, -0.4);
            rifleGroup.add(rifleBarrel);
            rifleGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['rifle'] = rifleGroup;

            // 2. RPG 火箭筒
            const rpgGroup = new THREE.Group();
            const rpgTube = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12), new THREE.MeshLambertMaterial({ color: 0x2d4f1e }));
            rpgTube.rotation.x = Math.PI / 2;
            const rpgRocket = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.25, 12), new THREE.MeshLambertMaterial({ color: 0xcc3333 }));
            rpgRocket.rotation.x = -Math.PI / 2;
            rpgRocket.position.set(0, 0, -0.55);
            rpgGroup.add(rpgTube, rpgRocket);
            rpgGroup.position.set(0.3, -0.25, -0.5);
            weaponMeshes['rpg'] = rpgGroup;

            // 3. 十字弓
            const cbGroup = new THREE.Group();
            const cbStock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.6), new THREE.MeshLambertMaterial({ color: 0x5c4033 }));
            const cbBow = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.04), new THREE.MeshLambertMaterial({ color: 0x888888 }));
            cbBow.position.set(0, 0, -0.25);
            cbGroup.add(cbStock, cbBow);
            cbGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['crossbow'] = cbGroup;

            // 4. 榴彈砲
            const glGroup = new THREE.Group();
            const glBody = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.5, 12), new THREE.MeshLambertMaterial({ color: 0x222222 }));
            glBody.rotation.x = Math.PI / 2;
            const glDrum = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.2, 12), new THREE.MeshLambertMaterial({ color: 0x444444 }));
            glDrum.position.set(0, -0.05, 0);
            glGroup.add(glBody, glDrum);
            glGroup.position.set(0.25, -0.22, -0.45);
            weaponMeshes['grenadeLauncher'] = glGroup;

            // 5. 狙擊槍
            const snpGroup = new THREE.Group();
            const snpBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
            const snpScope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.35, 12), new THREE.MeshLambertMaterial({ color: 0x000000 }));
            snpScope.rotation.x = Math.PI / 2;
            snpScope.position.set(0, 0.08, -0.1);
            snpGroup.add(snpBody, snpScope);
            snpGroup.position.set(0.25, -0.2, -0.5);
            weaponMeshes['sniper'] = snpGroup;

            // 6. 地雷發射器
            const mlGroup = new THREE.Group();
            const mlBody = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.5), new THREE.MeshLambertMaterial({ color: 0x444422 }));
            const mlTop = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.2, 8), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
            mlTop.position.set(0, 0.1, 0);
            mlGroup.add(mlBody, mlTop);
            mlGroup.position.set(0.28, -0.22, -0.45);
            weaponMeshes['mineLauncher'] = mlGroup;

            // 槍口閃光
            const flashGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0, -0.8);
            muzzleFlash.visible = false;

            Object.keys(weaponMeshes).forEach(key => {
                weaponMeshes[key].visible = (key === 'rifle');
                weaponGroup.add(weaponMeshes[key]);
            });

            weaponGroup.add(muzzleFlash);
            camera.add(weaponGroup);
        }

        // --- 移動與開鏡控制 ---
        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': 
                    if (canJump) {
                        playerVelocityY = 10.0;
                        canJump = false;
                    }
                    break;
                case 'Digit1': selectWeapon(0); break;
                case 'Digit2': selectWeapon(1); break;
                case 'Digit3': selectWeapon(2); break;
                case 'Digit4': selectWeapon(3); break;
                case 'Digit5': selectWeapon(4); break;
                case 'Digit6': selectWeapon(5); break;
                case 'KeyF': throwGrenade(); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseDown(e) {
            if (!controls.isLocked || isGameOver) return;
            if (e.button === 0) { // 左鍵開槍
                isMouseDown = true;
                tryShoot();
            } else if (e.button === 2) { // 右鍵開鏡
                isAiming = true;
                camera.fov = 30; // 放大視角
                camera.updateProjectionMatrix();
                scopeOverlay.style.display = 'block';
                weaponGroup.position.set(-0.25, 0.02, 0.1); // 武器拉至中心
            }
        }

        function onMouseUp(e) {
            if (e.button === 0) {
                isMouseDown = false;
            } else if (e.button === 2) {
                isAiming = false;
                camera.fov = 75; // 恢復標準視角
                camera.updateProjectionMatrix();
                scopeOverlay.style.display = 'none';
                weaponGroup.position.set(0, 0, 0);
            }
        }

        function onMouseWheel(e) {
            if (!controls.isLocked) return;
            if (e.deltaY > 0) {
                currentWeaponIndex = (currentWeaponIndex + 1) % weaponList.length;
            } else {
                currentWeaponIndex = (currentWeaponIndex - 1 + weaponList.length) % weaponList.length;
            }
            selectWeapon(currentWeaponIndex);
        }

        function selectWeapon(index) {
            currentWeaponIndex = index;
            const selectedKey = weaponList[index];

            Object.keys(weaponMeshes).forEach(key => {
                weaponMeshes[key].visible = (key === selectedKey);
            });

            weaponStatus.textContent = "當前武器: " + weaponNames[selectedKey];
        }

        // --- 射擊邏輯 ---
        function tryShoot() {
            const now = performance.now();
            const curWeapon = weaponList[currentWeaponIndex];

            const fireRates = {
                'rifle': 120,
                'rpg': 1000,
                'crossbow': 600,
                'grenadeLauncher': 700,
                'sniper': 900,
                'mineLauncher': 800
            };

            if (now - lastShotTime < fireRates[curWeapon]) return;
            lastShotTime = now;

            muzzleFlash.visible = true;
            setTimeout(() => { muzzleFlash.visible = false; }, 40);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.6));

            if (curWeapon === 'rifle') {
                const bullet = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
                bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                bullet.position.copy(spawnPos);
                bullets.push({ mesh: bullet, dir: dir, speed: 80, type: 'rifle', damage: 1, life: 2.0 });
                scene.add(bullet);
            } else if (curWeapon === 'rpg') {
                const rocket = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 8), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
                rocket.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                rocket.position.copy(spawnPos);
                bullets.push({ mesh: rocket, dir: dir, speed: 35, type: 'rpg', damage: 3, life: 3.0 });
                scene.add(rocket);
            } else if (curWeapon === 'crossbow') {
                const arrow = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.4), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
                arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                arrow.position.copy(spawnPos);
                bullets.push({ mesh: arrow, dir: dir, speed: 55, type: 'crossbow', damage: 2, life: 2.5 });
                scene.add(arrow);
            } else if (curWeapon === 'grenadeLauncher') {
                const grenadeBall = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff8800 }));
                grenadeBall.position.copy(spawnPos);
                const vel = dir.clone().multiplyScalar(22);
                vel.y += 2.0;
                bullets.push({ mesh: grenadeBall, vel: vel, type: 'grenadeLauncher', damage: 3, life: 3.0 });
                scene.add(grenadeBall);
            } else if (curWeapon === 'sniper') {
                const sniperBullet = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.6), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                sniperBullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                sniperBullet.position.copy(spawnPos);
                bullets.push({ mesh: sniperBullet, dir: dir, speed: 130, type: 'sniper', damage: 999, life: 1.5 });
                scene.add(sniperBullet);
            } else if (curWeapon === 'mineLauncher') {
                // 發射地雷
                const mineMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 12), new THREE.MeshLambertMaterial({ color: 0x33aa33 }));
                mineMesh.position.copy(spawnPos);
                const vel = dir.clone().multiplyScalar(15);
                bullets.push({ mesh: mineMesh, vel: vel, type: 'mineLauncher', life: 5.0 });
                scene.add(mineMesh);
            }
        }

        // --- 投擲手榴彈 ---
        function throwGrenade() {
            if (!controls.isLocked || isGameOver) return;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const nade = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshLambertMaterial({ color: 0x114411 }));
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.5));
            nade.position.copy(spawnPos);
            const velocity = dir.clone().multiplyScalar(15);
            velocity.y += 4;
            grenades.push({ mesh: nade, velocity: velocity, timer: 2.0 });
            scene.add(nade);
        }

        function createExplosion(pos, radius, damage) {
            const expMesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 })
            );
            expMesh.position.copy(pos);
            scene.add(expMesh);
            explosions.push({ mesh: expMesh, timer: 0.3 });

            for (let i = zombies.length - 1; i >= 0; i--) {
                const zGroup = zombies[i];
                if (zGroup.position.distanceTo(pos) <= radius) {
                    zGroup.userData.health -= damage;
                    if (zGroup.userData.health <= 0) {
                        scene.remove(zGroup);
                        zombies.splice(i, 1);
                        score += 30;
                        hudScore.textContent = score;
                    }
                }
            }
        }

        // --- 生成多種類具體型態殭屍（包含頭部與四肢） ---
        function spawnZombie() {
            if (!controls.isLocked || isGameOver) return;

            const types = [
                { type: 'normal', color: 0x22aa44, speed: 2.6, health: 3, scale: 1.0 },
                { type: 'runner', color: 0xcc2222, speed: 4.8, health: 2, scale: 0.8 },
                { type: 'tank', color: 0x224488, speed: 1.5, health: 10, scale: 1.6 }
            ];

            const randType = types[Math.floor(Math.random() * types.length)];
            const zombieGroup = new THREE.Group();

            // 1. 身體
            const bodyGeo = new THREE.BoxGeometry(0.8 * randType.scale, 1.2 * randType.scale, 0.4 * randType.scale);
            const bodyMat = new THREE.MeshLambertMaterial({ color: randType.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6 * randType.scale;
            zombieGroup.add(body);

            // 2. 頭部（特別標記，用於爆頭檢測）
            const headGeo = new THREE.BoxGeometry(0.45 * randType.scale, 0.45 * randType.scale, 0.45 * randType.scale);
            const headMat = new THREE.MeshLambertMaterial({ color: 0x33ff66 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.45 * randType.scale;
            head.userData.isHead = true; // 爆頭標記！
            zombieGroup.add(head);

            // 3. 手臂
            const armGeo = new THREE.BoxGeometry(0.2 * randType.scale, 0.8 * randType.scale, 0.2 * randType.scale);
            const leftArm = new THREE.Mesh(armGeo, bodyMat);
            leftArm.position.set(-0.5 * randType.scale, 0.7 * randType.scale, -0.2 * randType.scale);
            leftArm.rotation.x = -Math.PI / 3;

            const rightArm = new THREE.Mesh(armGeo, bodyMat);
            rightArm.position.set(0.5 * randType.scale, 0.7 * randType.scale, -0.2 * randType.scale);
            rightArm.rotation.x = -Math.PI / 3;
            zombieGroup.add(leftArm, rightArm);

            // 自訂數據
            zombieGroup.userData = {
                type: randType.type,
                speed: randType.speed,
                health: randType.health,
                scale: randType.scale,
                headMesh: head,
                bodyMesh: body
            };

            const half = MAP_SIZE / 2 - 5;
            zombieGroup.position.x = (Math.random() - 0.5) * half * 2;
            zombieGroup.position.z = (Math.random() - 0.5) * half * 2;
            zombieGroup.position.y = 0;

            if (zombieGroup.position.distanceTo(controls.getObject().position) < 10) return;

            scene.add(zombieGroup);
            zombies.push(zombieGroup);
        }

        // --- 碰撞檢測系統 ---
        function checkCollision(newPos, radius) {
            const halfMap = MAP_SIZE / 2 - radius;
            if (Math.abs(newPos.x) > halfMap || Math.abs(newPos.z) > halfMap) return true;

            const box = new THREE.Box3().setFromCenterAndSize(
                newPos,
                new THREE.Vector3(radius * 2, 2.0, radius * 2)
            );

            for (let obs of obstacles) {
                const obsBox = new THREE.Box3().setFromObject(obs);
                if (box.intersectsBox(obsBox)) return true;
            }
            return false;
        }

        function createMapBoundaries() {
            const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x444455 });
            const wallThickness = 2;
            const wallHeight = 6;
            const halfSize = MAP_SIZE / 2;

            const walls = [
                { size: [MAP_SIZE, wallHeight, wallThickness], pos: [0, wallHeight / 2, -halfSize] },
                { size: [MAP_SIZE, wallHeight, wallThickness], pos: [0, wallHeight / 2, halfSize] },
                { size: [wallThickness, wallHeight, MAP_SIZE], pos: [halfSize, wallHeight / 2, 0] },
                { size: [wallThickness, wallHeight, MAP_SIZE], pos: [-halfSize, wallHeight / 2, 0] }
            ];

            walls.forEach(w => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(...w.size), wallMaterial);
                wall.position.set(...w.pos);
                scene.add(wall);
                obstacles.push(wall);
            });
        }

        function createObstacles() {
            const boxMaterial = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            const obstacleData = [
                [ -10, -10, 4, 3, 4 ], [ 12, 15, 6, 4, 2 ],
                [ -15, 10, 2, 3, 8 ],  [ 10, -15, 5, 3, 5 ],
                [ 0, 18, 8, 3, 2 ],    [ -20, -20, 6, 5, 6 ]
            ];

            obstacleData.forEach(d => {
                const box = new THREE.Mesh(new THREE.BoxGeometry(d[2], d[3], d[4]), boxMaterial);
                box.position.set(d[0], d[3] / 2, d[1]);
                scene.add(box);
                obstacles.push(box);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function restartGame() {
            health = 100;
            score = 0;
            isGameOver = false;

            hudHealth.textContent = health;
            hudHealth.style.color = '#00ff00';
            hudScore.textContent = score;

            zombies.forEach(z => scene.remove(z));
            bullets.forEach(b => scene.remove(b.mesh));
            grenades.forEach(g => scene.remove(g.mesh));
            mines.forEach(m => scene.remove(m.mesh));

            zombies.length = 0;
            bullets.length = 0;
            grenades.length = 0;
            mines.length = 0;

            controls.getObject().position.set(0, PLAYER_HEIGHT, 0);
            controls.lock();
        }

        // --- 遊戲主循環 ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked && !isGameOver) {
                if (isMouseDown && weaponList[currentWeaponIndex] === 'rifle') tryShoot();

                // 1. 玩家移動與跳躍物理
                const moveSpeed = 12.0 * delta;
                const playerObj = controls.getObject();
                const oldPos = playerObj.position.clone();

                const frontDir = new THREE.Vector3();
                camera.getWorldDirection(frontDir);
                frontDir.y = 0;
                frontDir.normalize();

                const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();

                if (moveForward) playerObj.position.addScaledVector(frontDir, moveSpeed);
                if (moveBackward) playerObj.position.addScaledVector(frontDir, -moveSpeed);
                if (moveLeft) playerObj.position.addScaledVector(sideDir, moveSpeed);
                if (moveRight) playerObj.position.addScaledVector(sideDir, -moveSpeed);

                if (checkCollision(playerObj.position, 0.6)) {
                    playerObj.position.x = oldPos.x;
                    playerObj.position.z = oldPos.z;
                }

                // 重力與跳躍
                playerVelocityY -= GRAVITY * delta;
                playerObj.position.y += playerVelocityY * delta;

                if (playerObj.position.y <= PLAYER_HEIGHT) {
                    playerObj.position.y = PLAYER_HEIGHT;
                    playerVelocityY = 0;
                    canJump = true;
                }

                // 2. 子彈飛行與爆頭打擊判定
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];

                    if (b.vel) {
                        b.vel.y -= 9.8 * delta;
                        b.mesh.position.addScaledVector(b.vel, delta);

                        // 地雷落地轉化為感應地雷
                        if (b.type === 'mineLauncher' && b.mesh.position.y <= 0.05) {
                            b.mesh.position.y = 0.05;
                            mines.push({ mesh: b.mesh });
                            bullets.splice(i, 1);
                            continue;
                        }
                    } else {
                        b.mesh.position.addScaledVector(b.dir, b.speed * delta);
                    }

                    b.life -= delta;
                    let hit = false;

                    // 擊中殭屍判定 (精確區分頭部爆頭與身體)
                    for (let j = zombies.length - 1; j >= 0; j--) {
                        const zGroup = zombies[j];
                        const headPos = new THREE.Vector3();
                        const bodyPos = new THREE.Vector3();

                        zGroup.userData.headMesh.getWorldPosition(headPos);
                        zGroup.userData.bodyMesh.getWorldPosition(bodyPos);

                        const distToHead = b.mesh.position.distanceTo(headPos);
                        const distToBody = b.mesh.position.distanceTo(bodyPos);

                        if (distToHead < 0.4 * zGroup.userData.scale || distToBody < 0.7 * zGroup.userData.scale) {
                            hit = true;

                            if (b.type === 'rpg' || b.type === 'grenadeLauncher') {
                                createExplosion(b.mesh.position, 5.0, b.damage);
                            } else {
                                // 爆頭傷害判定：若離頭部更近，觸發 2 倍爆頭傷害！
                                let finalDamage = b.damage;
                                if (distToHead < distToBody) {
                                    finalDamage *= 2; 
                                }

                                zGroup.userData.health -= finalDamage;

                                if (zGroup.userData.health <= 0) {
                                    scene.remove(zGroup);
                                    zombies.splice(j, 1);
                                    score += 30;
                                    hudScore.textContent = score;
                                }
                            }
                            break;
                        }
                    }

                    // 牆壁碰撞
                    if (!hit) {
                        for (let obs of obstacles) {
                            const obsBox = new THREE.Box3().setFromObject(obs);
                            if (obsBox.containsPoint(b.mesh.position)) {
                                hit = true;
                                if (b.type === 'rpg' || b.type === 'grenadeLauncher') {
                                    createExplosion(b.mesh.position, 5.0, b.damage);
                                }
                                break;
                            }
                        }
                    }

                    if (hit || b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                // 3. 地雷感應與爆炸檢測
                for (let i = mines.length - 1; i >= 0; i--) {
                    const mine = mines[i];
                    for (let j = zombies.length - 1; j >= 0; j--) {
                        const zGroup = zombies[j];
                        if (mine.mesh.position.distanceTo(zGroup.position) < 2.2) {
                            createExplosion(mine.mesh.position, 6.0, 5);
                            scene.remove(mine.mesh);
                            mines.splice(i, 1);
                            break;
                        }
                    }
                }

                // 4. 手榴彈物理拋物線
                for (let i = grenades.length - 1; i >= 0; i--) {
                    const g = grenades[i];
                    g.velocity.y -= 9.8 * delta;
                    g.mesh.position.addScaledVector(g.velocity, delta);

                    if (g.mesh.position.y <= 0.1) {
                        g.mesh.position.y = 0.1;
                        g.velocity.set(0, 0, 0);
                    }

                    g.timer -= delta;
                    if (g.timer <= 0) {
                        createExplosion(g.mesh.position, 6.0, 5);
                        scene.remove(g.mesh);
                        grenades.splice(i, 1);
                    }
                }

                // 5. 爆炸效果淡出
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const exp = explosions[i];
                    exp.timer -= delta;
                    exp.mesh.material.opacity = exp.timer / 0.3;
                    if (exp.timer <= 0) {
                        scene.remove(exp.mesh);
                        explosions.splice(i, 1);
                    }
                }

                // 6. 殭屍 AI 與嚴格防穿牆追逐
                const playerPos = playerObj.position;
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const zGroup = zombies[i];
                    const oldZPos = zGroup.position.clone();

                    zGroup.lookAt(playerPos.x, zGroup.position.y, playerPos.z);
                    zGroup.translateZ(zGroup.userData.speed * delta);

                    // 殭屍防穿牆物理判定
                    if (checkCollision(zGroup.position, 0.5 * zGroup.userData.scale)) {
                        zGroup.position.copy(oldZPos);
                    }

                    // 玩家傷害判定
                    if (zGroup.position.distanceTo(playerPos) < 1.3) {
                        health -= 10;
                        hudHealth.textContent = Math.max(0, health);

                        scene.remove(zGroup);
                        zombies.splice(i, 1);

                        if (health <= 0) {
                            isGameOver = true;
                            controls.unlock();
                            instructions.querySelector('h1').textContent = "戰敗！";
                            instructions.querySelector('p').textContent = `最終得分: ${score}！點擊重新開始`;
                            instructions.style.display = 'flex';
                        }
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
