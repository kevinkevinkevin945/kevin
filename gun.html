<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 第一人稱殭屍射擊遊戲</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            background-color: #000;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-top: -5px;
            margin-left: -5px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
            cursor: pointer;
        }

        #instructions h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ff3333;
        }

        #instructions p {
            font-size: 20px;
            margin: 5px 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hud">
        血量: <span id="health" style="color: #00ff00;">100</span> | 
        得分: <span id="score">0</span>
    </div>

    <div id="instructions">
        <h1>殭屍包圍戰</h1>
        <p>點擊螢幕開始遊戲</p>
        <p>【W, A, S, D】移動</p>
        <p>【滑鼠】控制視角</p>
        <p>【滑鼠左鍵】開槍射擊</p>
    </div>

    <script>
        // --- 變數宣告 ---
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const zombies = [];
        let health = 100;
        let score = 0;
        let isGameOver = false;

        const hudHealth = document.getElementById('health');
        const hudScore = document.getElementById('score');
        const instructions = document.getElementById('instructions');

        // --- 初始化遊戲場景 ---
        function init() {
            // 創建場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            scene.fog = new THREE.FogExp2(0x111122, 0.05);

            // 創建攝影機
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6; // 人眼高度

            // 光源設置
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 地面
            const floorGeometry = new THREE.PlaneGeometry(200, 200);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 第一人稱控制器
            controls = new THREE.PointerLockControls(camera, document.body);

            instructions.addEventListener('click', () => {
                if (!isGameOver) {
                    controls.lock();
                } else {
                    restartGame();
                }
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                if (!isGameOver) {
                    instructions.style.display = 'flex';
                }
            });

            scene.add(controls.getObject());

            // 鍵盤事件監聽
            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // 射擊事件
            document.addEventListener('mousedown', (event) => {
                if (controls.isLocked && event.button === 0 && !isGameOver) {
                    shoot();
                }
            });

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);

            // 定時生成殭屍
            setInterval(spawnZombie, 2000);

            animate();
        }

        // --- 生成殭屍 ---
        function spawnZombie() {
            if (!controls.isLocked || isGameOver) return;

            const zombieGeo = new THREE.BoxGeometry(1, 2, 1);
            const zombieMat = new THREE.MeshLambertMaterial({ color: 0x00ff55 });
            const zombie = new THREE.Mesh(zombieGeo, zombieMat);

            // 隨機在玩家周圍距離生成
            const angle = Math.random() * Math.PI * 2;
            const distance = 20 + Math.random() * 20;
            const playerPos = controls.getObject().position;

            zombie.position.x = playerPos.x + Math.sin(angle) * distance;
            zombie.position.z = playerPos.z + Math.cos(angle) * distance;
            zombie.position.y = 1;

            scene.add(zombie);
            zombies.push(zombie);
        }

        // --- 射擊邏輯 ---
        function shoot() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(zombies);

            if (intersects.length > 0) {
                const hitZombie = intersects[0].object;
                scene.remove(hitZombie);
                
                const index = zombies.indexOf(hitZombie);
                if (index > -1) {
                    zombies.splice(index, 1);
                }

                score += 10;
                hudScore.textContent = score;
            }
        }

        // --- 視窗調整 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 重置遊戲 ---
        function restartGame() {
            health = 100;
            score = 0;
            isGameOver = false;

            hudHealth.textContent = health;
            hudHealth.style.color = '#00ff00';
            hudScore.textContent = score;

            // 清除現有殭屍
            zombies.forEach(z => scene.remove(z));
            zombies.length = 0;

            controls.getObject().position.set(0, 1.6, 0);
            controls.lock();
        }

        // --- 遊戲主循環 ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked && !isGameOver) {
                // 玩家移動邏輯
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                const playerPos = controls.getObject().position;

                // 殭屍移動與碰撞傷害邏輯
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const zombie = zombies[i];
                    
                    // 殭屍轉向玩家並移動
                    zombie.lookAt(playerPos.x, zombie.position.y, playerPos.z);
                    zombie.translateZ(2.5 * delta);

                    // 檢查是否接觸到玩家
                    const dist = zombie.position.distanceTo(playerPos);
                    if (dist < 1.2) {
                        health -= 10;
                        hudHealth.textContent = Math.max(0, health);

                        if (health <= 50) hudHealth.style.color = '#ffff00';
                        if (health <= 20) hudHealth.style.color = '#ff0000';

                        // 扣血後移除該殭屍
                        scene.remove(zombie);
                        zombies.splice(i, 1);

                        // 遊戲結束判定
                        if (health <= 0) {
                            isGameOver = true;
                            controls.unlock();
                            instructions.querySelector('h1').textContent = "遊戲結束";
                            instructions.querySelector('p').textContent = `最終得分: ${score}！點擊畫面重新開始`;
                            instructions.style.display = 'flex';
                        }
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
