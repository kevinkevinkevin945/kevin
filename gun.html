<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 極限高空跑酷射擊 - 多地圖與動態滑行版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            background-color: #000;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            margin-top: -4px;
            margin-left: -4px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }

        #scope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
            z-index: 9;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #skill-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #55ffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #weapon-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
            cursor: pointer;
        }

        #instructions h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #ff3333;
        }

        #instructions p {
            font-size: 16px;
            margin: 4px 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="scope-container"></div>

    <div id="hud">
        血量: <span id="health" style="color: #00ff00;">100</span> | 
        得分: <span id="score">0</span> | 
        當前關卡: <span id="level-display" style="color: #ffaa00;">1</span>
    </div>
    <div id="skill-hud">
        【!】補血: <span id="cd-heal">就緒</span> | 
        【Q】衝刺: <span id="cd-q">就緒</span> | 
        【E】冰凍彈: <span id="cd-e">就緒</span> | 
        【G】秒殺: <span id="cd-g">就緒</span>
    </div>
    <div id="weapon-status">當前武器: 1. 連發步槍</div>

    <div id="instructions">
        <h1>極限高空跑酷戰場</h1>
        <p>點擊螢幕開始遊戲</p>
        <p>【跑酷機制】挑戰登上最高處觸發水晶通關！後續關卡下方為「死亡虛空」</p>
        <p>【動態滑行】移動中按住【Ctrl】或按【C】可極速滑行！滑行中按【Space】可跳躍取消滑行並極速跳躍！</p>
        <p>【!】（Shift + 1）緊急補血 +30 HP | 【V】切換第一/第三人稱視角</p>
        <p>【W, A, S, D】移動 | 【Space】跳躍 | 【滑鼠左鍵】開槍 | 【滑鼠右鍵】瞄準</p>
    </div>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        // 移動與滑行變數
        let isCrouching = false;
        let isSliding = false;
        let slideTimer = 0;
        let slideDirection = new THREE.Vector3();
        let isThirdPerson = false;
        let canJump = false;
        let playerVelocityY = 0;
        const GRAVITY = 28;

        let isMouseDown = false;
        let isAiming = false;
        let lastShotTime = 0;
        let prevTime = performance.now();

        const MAP_SIZE = 80;
        const BASE_Y = 15; // 起始高度
        const STAND_HEIGHT = 1.6;
        const CROUCH_HEIGHT = 0.8;
        let currentEyeHeight = STAND_HEIGHT;

        let currentLevel = 1;
        let rewardCrystal = null; // 頂端通關獎勵

        const zombies = [];
        const obstacles = [];
        const bullets = [];
        const enemyBullets = [];
        const grenades = [];
        const mines = [];
        const explosions = [];

        let health = 100;
        let score = 0;
        let isGameOver = false;

        const cooldowns = {
            HEAL: { current: 0, max: 3.0 },
            Q: { current: 0, max: 3.0 },
            E: { current: 0, max: 8.0 },
            G: { current: 0, max: 20.0 }
        };

        const weaponList = ['rifle', 'rpg', 'crossbow', 'grenadeLauncher', 'sniper', 'mineLauncher'];
        const weaponNames = {
            'rifle': '1. 連發步槍',
            'rpg': '2. RPG火箭筒',
            'crossbow': '3. 十字弓',
            'grenadeLauncher': '4. 榴彈砲',
            'sniper': '5. 狙擊槍 (一擊必殺)',
            'mineLauncher': '6. 地雷發射器'
        };
        const weaponZoomFov = {
            'rifle': 45, 'rpg': 40, 'crossbow': 35,
            'grenadeLauncher': 42, 'sniper': 15, 'mineLauncher': 50
        };

        let currentWeaponIndex = 0;
        let weaponMeshes = {};
        let weaponGroup;
        let muzzleFlash;
        let playerBodyMesh;

        const hudHealth = document.getElementById('health');
        const hudScore = document.getElementById('score');
        const hudLevel = document.getElementById('level-display');
        const weaponStatus = document.getElementById('weapon-status');
        const instructions = document.getElementById('instructions');
        const scopeContainer = document.getElementById('scope-container');
        const crosshair = document.getElementById('crosshair');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const ambientLight = new THREE.AmbientLight(0x888888);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 80, 20);
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);
            
            // 建立玩家與跑酷場景
            createPlayerBody();
            buildLevelScene(currentLevel);

            instructions.addEventListener('click', () => {
                if (!isGameOver) controls.lock();
                else restartGame();
            });

            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => {
                if (!isGameOver) instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            createWeapons();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            document.addEventListener('wheel', onMouseWheel);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            setInterval(spawnZombie, 2000);

            animate();
        }

        // 地圖建構器（依關卡難度動態調整跑酷佈局）
        function buildLevelScene(level) {
            // 清除舊障礙與獎勵
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;
            if (rewardCrystal) scene.remove(rewardCrystal);

            hudLevel.textContent = level;

            // 1. 起始基本平台
            const baseGeo = new THREE.BoxGeometry(20, 2, 20);
            const baseMat = new THREE.MeshLambertMaterial({ color: 0x223344 });
            const basePlatform = new THREE.Mesh(baseGeo, baseMat);
            basePlatform.position.set(0, BASE_Y - 1, 0);
            scene.add(basePlatform);
            obstacles.push(basePlatform);

            // 第一關提供底部地板防跌落，第二關開始完全改為虛空死亡
            if (level === 1) {
                const floorGeo = new THREE.BoxGeometry(200, 2, 200);
                const floorMat = new THREE.MeshLambertMaterial({ color: 0x111115 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.position.set(0, 0, 0);
                scene.add(floor);
                obstacles.push(floor);
            }

            // 2. 動態生成高難度跑酷步道
            const stepCount = 10 + level * 3;
            let lastPos = new THREE.Vector3(0, BASE_Y, -8);

            for (let i = 0; i < stepCount; i++) {
                const stepWidth = Math.max(2.5, 5.0 - level * 0.5);
                const stepGeo = new THREE.BoxGeometry(stepWidth, 1, stepWidth);
                const stepMat = new THREE.MeshLambertMaterial({ 
                    color: (i % 2 === 0) ? 0x00aaff : 0xff5500 
                });
                const step = new THREE.Mesh(stepGeo, stepMat);

                // 隨關卡增加跳躍間距與爬升高度
                const dist = 6 + level * 1.2 + Math.random() * 3;
                const angle = (Math.random() - 0.5) * 1.5;
                const heightGain = 1.5 + Math.random() * 2.0;

                lastPos.x += Math.sin(angle) * dist;
                lastPos.z -= Math.cos(angle) * dist;
                lastPos.y += heightGain;

                step.position.copy(lastPos);
                scene.add(step);
                obstacles.push(step);
            }

            // 3. 頂端獎勵通關台與獎勵水晶
            const topPlatformGeo = new THREE.BoxGeometry(8, 1, 8);
            const topMat = new THREE.MeshLambertMaterial({ color: 0xffdd00 });
            const topPlatform = new THREE.Mesh(topPlatformGeo, topMat);
            topPlatform.position.set(lastPos.x, lastPos.y + 2, lastPos.z - 6);
            scene.add(topPlatform);
            obstacles.push(topPlatform);

            // 獎勵水晶 (八面體)
            const crystalGeo = new THREE.OctahedronGeometry(1.2, 0);
            const crystalMat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
            rewardCrystal = new THREE.Mesh(crystalGeo, crystalMat);
            rewardCrystal.position.set(topPlatform.position.x, topPlatform.position.y + 2.5, topPlatform.position.z);
            scene.add(rewardCrystal);

            // 重置玩家位置至起點
            controls.getObject().position.set(0, BASE_Y + STAND_HEIGHT, 0);
        }

        function createPlayerBody() {
            playerBodyMesh = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x0088ff });
            const bodyGeo = new THREE.BoxGeometry(0.6, 1.2, 0.4);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = -0.6;

            const headGeo = new THREE.SphereGeometry(0.25, 12, 12);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 0.15;

            playerBodyMesh.add(body, head);
            playerBodyMesh.visible = false;
            controls.getObject().add(playerBodyMesh);
        }

        function createWeapons() {
            weaponGroup = new THREE.Group();

            const rifleGroup = new THREE.Group();
            rifleGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 })));
            const rifleBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            rifleBarrel.position.set(0, 0.02, -0.4);
            rifleGroup.add(rifleBarrel);
            rifleGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['rifle'] = rifleGroup;

            const rpgGroup = new THREE.Group();
            const rpgTube = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12), new THREE.MeshLambertMaterial({ color: 0x2d4f1e }));
            rpgTube.rotation.x = Math.PI / 2;
            const rpgRocket = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.25, 12), new THREE.MeshLambertMaterial({ color: 0xcc3333 }));
            rpgRocket.rotation.x = -Math.PI / 2;
            rpgRocket.position.set(0, 0, -0.55);
            rpgGroup.add(rpgTube, rpgRocket);
            rpgGroup.position.set(0.3, -0.25, -0.5);
            weaponMeshes['rpg'] = rpgGroup;

            const cbGroup = new THREE.Group();
            const cbStock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.6), new THREE.MeshLambertMaterial({ color: 0x5c4033 }));
            const cbBow = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.04), new THREE.MeshLambertMaterial({ color: 0x888888 }));
            cbBow.position.set(0, 0, -0.25);
            cbGroup.add(cbStock, cbBow);
            cbGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['crossbow'] = cbGroup;

            const glGroup = new THREE.Group();
            const glBody = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.5, 12), new THREE.MeshLambertMaterial({ color: 0x222222 }));
            glBody.rotation.x = Math.PI / 2;
            const glDrum = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.2, 12), new THREE.MeshLambertMaterial({ color: 0x444444 }));
            glDrum.position.set(0, -0.05, 0);
            glGroup.add(glBody, glDrum);
            glGroup.position.set(0.25, -0.22, -0.45);
            weaponMeshes['grenadeLauncher'] = glGroup;

            const snpGroup = new THREE.Group();
            const snpBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
            const snpScope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.35, 12), new THREE.MeshLambertMaterial({ color: 0x000000 }));
            snpScope.rotation.x = Math.PI / 2;
            snpScope.position.set(0, 0.08, -0.1);
            snpGroup.add(snpBody, snpScope);
            snpGroup.position.set(0.25, -0.2, -0.5);
            weaponMeshes['sniper'] = snpGroup;

            const mlGroup = new THREE.Group();
            const mlBody = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.5), new THREE.MeshLambertMaterial({ color: 0x444422 }));
            const mlTop = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.2, 8), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
            mlTop.position.set(0, 0.1, 0);
            mlGroup.add(mlBody, mlTop);
            mlGroup.position.set(0.28, -0.22, -0.45);
            weaponMeshes['mineLauncher'] = mlGroup;

            const flashGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0, -0.8);
            muzzleFlash.visible = false;

            Object.keys(weaponMeshes).forEach(key => {
                weaponMeshes[key].visible = (key === 'rifle');
                weaponGroup.add(weaponMeshes[key]);
            });

            weaponGroup.add(muzzleFlash);
            camera.add(weaponGroup);
        }

        function getScopeSVG(weaponType) {
            const svgHeader = `<svg width="100%" height="100%" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <mask id="scope-mask">
                        <rect width="1000" height="1000" fill="white"/>
                        <circle cx="500" cy="500" r="350" fill="black"/>
                    </mask>
                </defs>
                <rect width="1000" height="1000" fill="rgba(0,0,0,0.85)" mask="url(#scope-mask)"/>
                <circle cx="500" cy="500" r="350" fill="none" stroke="#222" stroke-width="12"/>`;

            let innerContent = "";

            if (weaponType === 'rifle') {
                innerContent = `
                    <circle cx="500" cy="500" r="348" fill="none" stroke="#00ffcc" stroke-width="3" opacity="0.6"/>
                    <circle cx="500" cy="500" r="5" fill="#ff0000"/>
                    <line x1="500" y1="180" x2="500" y2="460" stroke="#00ffcc" stroke-width="2"/>
                    <line x1="500" y1="540" x2="500" y2="820" stroke="#00ffcc" stroke-width="2"/>
                    <line x1="180" y1="500" x2="460" y2="500" stroke="#00ffcc" stroke-width="2"/>
                    <line x1="540" y1="500" x2="820" y2="500" stroke="#00ffcc" stroke-width="2"/>`;
            } else if (weaponType === 'rpg') {
                innerContent = `
                    <circle cx="500" cy="500" r="348" fill="none" stroke="#ff5500" stroke-width="4"/>
                    <line x1="150" y1="500" x2="850" y2="500" stroke="#ff5500" stroke-width="2"/>
                    <line x1="500" y1="150" x2="500" y2="850" stroke="#ff5500" stroke-width="2"/>`;
            } else if (weaponType === 'crossbow') {
                innerContent = `
                    <circle cx="500" cy="500" r="348" fill="none" stroke="#aaff22" stroke-width="2"/>
                    <line x1="500" y1="150" x2="500" y2="850" stroke="#aaff22" stroke-width="1.5"/>
                    <circle cx="500" cy="500" r="4" fill="#ff0000"/>`;
            } else if (weaponType === 'grenadeLauncher') {
                innerContent = `
                    <circle cx="500" cy="500" r="348" fill="none" stroke="#ffaa00" stroke-width="3"/>
                    <circle cx="500" cy="500" r="2" fill="#ffaa00"/>`;
            } else if (weaponType === 'sniper') {
                innerContent = `
                    <circle cx="500" cy="500" r="348" fill="none" stroke="#ffffff" stroke-width="3"/>
                    <line x1="150" y1="500" x2="850" y2="500" stroke="#ffffff" stroke-width="1.5"/>
                    <line x1="500" y1="150" x2="500" y2="850" stroke="#ffffff" stroke-width="1.5"/>
                    <circle cx="500" cy="500" r="3" fill="#ff0000"/>`;
            } else if (weaponType === 'mineLauncher') {
                innerContent = `
                    <circle cx="500" cy="500" r="348" fill="none" stroke="#00ff55" stroke-width="2"/>
                    <rect x="475" y="475" width="50" height="50" fill="none" stroke="#00ff55" stroke-width="2"/>`;
            }

            return svgHeader + innerContent + `</svg>`;
        }

        // 觸發動態滑行
        function startSlide() {
            if (isSliding || !canJump) return;
            isSliding = true;
            slideTimer = 0.6; // 滑行持續時間（秒）
            currentEyeHeight = CROUCH_HEIGHT;

            // 計算滑行方向
            const frontDir = new THREE.Vector3();
            camera.getWorldDirection(frontDir);
            frontDir.y = 0;
            frontDir.normalize();

            // 若正有移動按鍵按住則依移動方向滑行，否則預設向前
            if (moveForward || moveBackward || moveLeft || moveRight) {
                const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();
                slideDirection.set(0, 0, 0);
                if (moveForward) slideDirection.add(frontDir);
                if (moveBackward) slideDirection.sub(frontDir);
                if (moveRight) slideDirection.add(sideDir);
                if (moveLeft) slideDirection.sub(sideDir);
                slideDirection.normalize();
            } else {
                slideDirection.copy(frontDir);
            }
        }

        function cancelSlide() {
            isSliding = false;
            isCrouching = false;
            currentEyeHeight = STAND_HEIGHT;
        }

        function healPlayer() {
            if (cooldowns.HEAL.current > 0 || health >= 100 || isGameOver) return;
            cooldowns.HEAL.current = cooldowns.HEAL.max;

            health = Math.min(100, health + 30);
            updateHealthHUD();
        }

        function updateHealthHUD() {
            hudHealth.textContent = health;
            if (health < 30) hudHealth.style.color = '#ff0000';
            else if (health < 60) hudHealth.style.color = '#ffaa00';
            else hudHealth.style.color = '#00ff00';
        }

        function onKeyDown(e) {
            if (!controls.isLocked || isGameOver) return;

            if (e.key === '!' || (e.shiftKey && e.code === 'Digit1')) {
                healPlayer();
                return;
            }

            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'ControlLeft':
                case 'ControlRight':
                    if (moveForward || moveBackward || moveLeft || moveRight) {
                        startSlide();
                    } else {
                        isCrouching = true;
                        currentEyeHeight = CROUCH_HEIGHT;
                    }
                    break;
                case 'KeyC':
                    // 按 C 直接向前衝刺滑行
                    startSlide();
                    break;
                case 'KeyV':
                    isThirdPerson = !isThirdPerson;
                    if (isThirdPerson) {
                        camera.position.set(0, 1.2, 3.5);
                        playerBodyMesh.visible = true;
                    } else {
                        camera.position.set(0, 0, 0);
                        playerBodyMesh.visible = false;
                    }
                    break;
                case 'Space': 
                    if (canJump) {
                        playerVelocityY = 11.5; // 跳躍高度
                        canJump = false;
                        if (isSliding) {
                            cancelSlide(); // 滑行中跳躍：取消滑行並保留向前衝勢
                        }
                    }
                    break;
                case 'KeyQ': useSkillQ(); break;
                case 'KeyE': useSkillE(); break;
                case 'KeyG': useSkillG(); break;
                case 'Digit1': selectWeapon(0); break;
                case 'Digit2': selectWeapon(1); break;
                case 'Digit3': selectWeapon(2); break;
                case 'Digit4': selectWeapon(3); break;
                case 'Digit5': selectWeapon(4); break;
                case 'Digit6': selectWeapon(5); break;
                case 'KeyF': throwGrenade(); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ControlLeft':
                case 'ControlRight':
                    if (!isSliding) {
                        isCrouching = false;
                        currentEyeHeight = STAND_HEIGHT;
                    }
                    break;
            }
        }

        function useSkillQ() {
            if (cooldowns.Q.current > 0) return;
            cooldowns.Q.current = cooldowns.Q.max;

            const playerObj = controls.getObject();
            const frontDir = new THREE.Vector3();
            camera.getWorldDirection(frontDir);
            frontDir.y = 0;
            frontDir.normalize();

            const dashDistance = 9.0;
            const targetPos = playerObj.position.clone().addScaledVector(frontDir, dashDistance);
            playerObj.position.copy(targetPos);
        }

        function useSkillE() {
            if (cooldowns.E.current > 0) return;
            cooldowns.E.current = cooldowns.E.max;

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            const iceBall = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0x00ffff })
            );

            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.5));
            iceBall.position.copy(spawnPos);

            const velocity = dir.clone().multiplyScalar(18);
            velocity.y += 3;

            grenades.push({ mesh: iceBall, velocity: velocity, timer: 1.5, isFreeze: true });
            scene.add(iceBall);
        }

        function useSkillG() {
            if (cooldowns.G.current > 0) return;
            cooldowns.G.current = cooldowns.G.max;

            const playerPos = controls.getObject().position;
            const radius = 16.0;

            const shockwave = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 32, 32),
                new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 })
            );
            shockwave.position.copy(playerPos);
            scene.add(shockwave);
            explosions.push({ mesh: shockwave, timer: 0.5 });

            for (let i = zombies.length - 1; i >= 0; i--) {
                const zGroup = zombies[i];
                if (zGroup.position.distanceTo(playerPos) <= radius) {
                    scene.remove(zGroup);
                    zombies.splice(i, 1);
                    score += 50;
                }
            }
            hudScore.textContent = score;
        }

        function onMouseDown(e) {
            if (!controls.isLocked || isGameOver) return;
            if (e.button === 0) {
                isMouseDown = true;
                tryShoot();
            } else if (e.button === 2) {
                isAiming = true;
                const curWeapon = weaponList[currentWeaponIndex];
                camera.fov = weaponZoomFov[curWeapon];
                camera.updateProjectionMatrix();

                scopeContainer.innerHTML = getScopeSVG(curWeapon);
                scopeContainer.style.display = 'block';
                crosshair.style.display = 'none';
                weaponGroup.visible = false;
            }
        }

        function onMouseUp(e) {
            if (e.button === 0) {
                isMouseDown = false;
            } else if (e.button === 2) {
                isAiming = false;
                camera.fov = 75;
                camera.updateProjectionMatrix();

                scopeContainer.style.display = 'none';
                crosshair.style.display = 'block';
                weaponGroup.visible = true;
            }
        }

        function onMouseWheel(e) {
            if (!controls.isLocked) return;
            if (e.deltaY > 0) {
                currentWeaponIndex = (currentWeaponIndex + 1) % weaponList.length;
            } else {
                currentWeaponIndex = (currentWeaponIndex - 1 + weaponList.length) % weaponList.length;
            }
            selectWeapon(currentWeaponIndex);
        }

        function selectWeapon(index) {
            currentWeaponIndex = index;
            const selectedKey = weaponList[index];

            Object.keys(weaponMeshes).forEach(key => {
                weaponMeshes[key].visible = (key === selectedKey);
            });

            weaponStatus.textContent = "當前武器: " + weaponNames[selectedKey];

            if (isAiming) {
                camera.fov = weaponZoomFov[selectedKey];
                camera.updateProjectionMatrix();
                scopeContainer.innerHTML = getScopeSVG(selectedKey);
            }
        }

        function tryShoot() {
            const now = performance.now();
            const curWeapon = weaponList[currentWeaponIndex];

            const fireRates = {
                'rifle': 120, 'rpg': 1000, 'crossbow': 600,
                'grenadeLauncher': 700, 'sniper': 900, 'mineLauncher': 800
            };

            if (now - lastShotTime < fireRates[curWeapon]) return;
            lastShotTime = now;

            if (!isAiming) {
                muzzleFlash.visible = true;
                setTimeout(() => { muzzleFlash.visible = false; }, 40);
            } else {
                muzzleFlash.visible = false;
            }

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.6));

            if (curWeapon === 'rifle') {
                const bullet = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
                bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                bullet.position.copy(spawnPos);
                bullets.push({ mesh: bullet, dir: dir, speed: 80, type: 'rifle', damage: 1, life: 2.0 });
                scene.add(bullet);
            } else if (curWeapon === 'rpg') {
                const rocket = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 8), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
                rocket.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                rocket.position.copy(spawnPos);
                bullets.push({ mesh: rocket, dir: dir, speed: 35, type: 'rpg', damage: 3, life: 3.0 });
                scene.add(rocket);
            } else if (curWeapon === 'crossbow') {
                const arrow = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.4), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
                arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                arrow.position.copy(spawnPos);
                bullets.push({ mesh: arrow, dir: dir, speed: 55, type: 'crossbow', damage: 2, life: 2.5 });
                scene.add(arrow);
            } else if (curWeapon === 'grenadeLauncher') {
                const grenadeBall = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff8800 }));
                grenadeBall.position.copy(spawnPos);
                const vel = dir.clone().multiplyScalar(22);
                vel.y += 2.0;
                bullets.push({ mesh: grenadeBall, vel: vel, type: 'grenadeLauncher', damage: 3, life: 3.0 });
                scene.add(grenadeBall);
            } else if (curWeapon === 'sniper') {
                const sniperBullet = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.6), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                sniperBullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                sniperBullet.position.copy(spawnPos);
                bullets.push({ mesh: sniperBullet, dir: dir, speed: 130, type: 'sniper', damage: 999, life: 1.5 });
                scene.add(sniperBullet);
            } else if (curWeapon === 'mineLauncher') {
                const mineMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 12), new THREE.MeshLambertMaterial({ color: 0x33aa33 }));
                mineMesh.position.copy(spawnPos);
                const vel = dir.clone().multiplyScalar(15);
                bullets.push({ mesh: mineMesh, vel: vel, type: 'mineLauncher', life: 5.0 });
                scene.add(mineMesh);
            }
        }

        function enemyShoot(enemyGroup) {
            const gunPos = new THREE.Vector3();
            enemyGroup.userData.gunMesh.getWorldPosition(gunPos);

            const playerPos = controls.getObject().position.clone();
            const shootDir = new THREE.Vector3().subVectors(playerPos, gunPos).normalize();

            const enemyBullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.06, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff0000 })
            );
            enemyBullet.position.copy(gunPos);

            enemyBullets.push({
                mesh: enemyBullet,
                dir: shootDir,
                speed: 25.0,
                life: 3.0
            });
            scene.add(enemyBullet);
        }

        function throwGrenade() {
            if (!controls.isLocked || isGameOver) return;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const nade = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshLambertMaterial({ color: 0x114411 }));
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.5));
            nade.position.copy(spawnPos);
            const velocity = dir.clone().multiplyScalar(15);
            velocity.y += 4;
            grenades.push({ mesh: nade, velocity: velocity, timer: 2.0 });
            scene.add(nade);
        }

        function createExplosion(pos, radius, damage) {
            const expMesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 })
            );
            expMesh.position.copy(pos);
            scene.add(expMesh);
            explosions.push({ mesh: expMesh, timer: 0.3 });

            for (let i = zombies.length - 1; i >= 0; i--) {
                const zGroup = zombies[i];
                if (zGroup.position.distanceTo(pos) <= radius) {
                    zGroup.userData.health -= damage;
                    if (zGroup.userData.health <= 0) {
                        scene.remove(zGroup);
                        zombies.splice(i, 1);
                        score += 30;
                        hudScore.textContent = score;
                    }
                }
            }
        }

        function createFreezeExplosion(pos, radius) {
            const freezeMesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 })
            );
            freezeMesh.position.copy(pos);
            scene.add(freezeMesh);
            explosions.push({ mesh: freezeMesh, timer: 0.4 });

            for (let zGroup of zombies) {
                if (zGroup.position.distanceTo(pos) <= radius) {
                    zGroup.userData.freezeTimer = 4.0;
                }
            }
        }

        function takeDamage(amount) {
            if (isGameOver) return;
            health -= amount;
            if (health < 0) health = 0;

            updateHealthHUD();

            if (health <= 0) {
                triggerGameOver("戰敗！你已陣亡");
            }
        }

        function triggerGameOver(reason) {
            isGameOver = true;
            controls.unlock();
            instructions.querySelector('h1').textContent = reason;
            instructions.querySelector('p').textContent = `關卡: ${currentLevel} | 最終得分: ${score}！點擊重新開始`;
            instructions.style.display = 'flex';
        }

        function spawnZombie() {
            if (!controls.isLocked || isGameOver) return;

            const types = [
                { type: 'normal', color: 0x22aa44, speed: 2.8 + currentLevel * 0.3, health: 3, scale: 1.0, shootInterval: 2.2 },
                { type: 'runner', color: 0xcc2222, speed: 5.0 + currentLevel * 0.4, health: 2, scale: 0.8, shootInterval: 1.5 },
                { type: 'tank', color: 0x224488, speed: 1.6 + currentLevel * 0.2, health: 10, scale: 1.6, shootInterval: 2.8 }
            ];

            const randType = types[Math.floor(Math.random() * types.length)];
            const zombieGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(0.8 * randType.scale, 1.2 * randType.scale, 0.4 * randType.scale);
            const bodyMat = new THREE.MeshLambertMaterial({ color: randType.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6 * randType.scale;
            zombieGroup.add(body);

            const headGeo = new THREE.BoxGeometry(0.45 * randType.scale, 0.45 * randType.scale, 0.45 * randType.scale);
            const headMat = new THREE.MeshLambertMaterial({ color: 0x33ff66 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.45 * randType.scale;
            zombieGroup.add(head);

            const enemyGun = new THREE.Mesh(
                new THREE.BoxGeometry(0.12 * randType.scale, 0.12 * randType.scale, 0.5 * randType.scale),
                new THREE.MeshBasicMaterial({ color: 0x111111 })
            );
            enemyGun.position.set(0.5 * randType.scale, 0.7 * randType.scale, -0.6 * randType.scale);
            zombieGroup.add(enemyGun);

            zombieGroup.userData = {
                type: randType.type,
                speed: randType.speed,
                health: randType.health,
                scale: randType.scale,
                headMesh: head,
                bodyMesh: body,
                gunMesh: enemyGun,
                shootTimer: Math.random() * randType.shootInterval,
                shootInterval: randType.shootInterval,
                freezeTimer: 0,
                velocityY: 0,
                canJump: true
            };

            // 在障礙物平台上隨機生成
            const targetObs = obstacles[Math.floor(Math.random() * obstacles.length)];
            const obsBox = new THREE.Box3().setFromObject(targetObs);

            zombieGroup.position.x = (obsBox.min.x + obsBox.max.x) / 2;
            zombieGroup.position.z = (obsBox.min.z + obsBox.max.z) / 2;
            zombieGroup.position.y = obsBox.max.y;

            if (zombieGroup.position.distanceTo(controls.getObject().position) < 8) return;

            scene.add(zombieGroup);
            zombies.push(zombieGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function restartGame() {
            currentLevel = 1;
            health = 100;
            score = 0;
            isGameOver = false;

            updateHealthHUD();
            hudScore.textContent = score;

            zombies.forEach(z => scene.remove(z));
            bullets.forEach(b => scene.remove(b.mesh));
            enemyBullets.forEach(eb => scene.remove(eb.mesh));
            grenades.forEach(g => scene.remove(g.mesh));
            mines.forEach(m => scene.remove(m.mesh));

            zombies.length = 0;
            bullets.length = 0;
            enemyBullets.length = 0;
            grenades.length = 0;
            mines.length = 0;

            buildLevelScene(currentLevel);
            controls.lock();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked && !isGameOver) {
                if (isMouseDown && weaponList[currentWeaponIndex] === 'rifle') tryShoot();

                // 旋轉水晶獎勵
                if (rewardCrystal) {
                    rewardCrystal.rotation.y += 2.0 * delta;
                }

                // 冷卻 UI 處理
                Object.keys(cooldowns).forEach(key => {
                    const elemId = key === 'HEAL' ? 'cd-heal' : `cd-${key.toLowerCase()}`;
                    const targetElem = document.getElementById(elemId);
                    if (targetElem) {
                        if (cooldowns[key].current > 0) {
                            cooldowns[key].current -= delta;
                            targetElem.textContent = `${Math.ceil(cooldowns[key].current)}s`;
                        } else {
                            targetElem.textContent = "就緒";
                        }
                    }
                });

                // 1. 玩家移動與動態滑行邏輯
                const playerObj = controls.getObject();
                
                if (isSliding) {
                    // 滑行時的高速度 (22.0)
                    const slideSpeed = 22.0 * delta;
                    playerObj.position.addScaledVector(slideDirection, slideSpeed);

                    slideTimer -= delta;
                    if (slideTimer <= 0) {
                        cancelSlide();
                    }
                } else {
                    let moveSpeed = (isCrouching ? 6.0 : 12.0) * delta;

                    const frontDir = new THREE.Vector3();
                    camera.getWorldDirection(frontDir);
                    frontDir.y = 0;
                    frontDir.normalize();

                    const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();

                    if (moveForward) playerObj.position.addScaledVector(frontDir, moveSpeed);
                    if (moveBackward) playerObj.position.addScaledVector(frontDir, -moveSpeed);
                    if (moveLeft) playerObj.position.addScaledVector(sideDir, moveSpeed);
                    if (moveRight) playerObj.position.addScaledVector(sideDir, -moveSpeed);
                }

                // 玩家重力與落地檢測 (基於障礙物 Box)
                playerVelocityY -= GRAVITY * delta;
                playerObj.position.y += playerVelocityY * delta;

                let isOnGround = false;
                const playerFeetY = playerObj.position.y - currentEyeHeight;

                for (let obs of obstacles) {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    
                    // 腳底接觸判定
                    if (playerObj.position.x >= obsBox.min.x - 0.4 &&
                        playerObj.position.x <= obsBox.max.x + 0.4 &&
                        playerObj.position.z >= obsBox.min.z - 0.4 &&
                        playerObj.position.z <= obsBox.max.z + 0.4) {

                        if (playerFeetY <= obsBox.max.y && playerFeetY >= obsBox.max.y - 0.6 && playerVelocityY <= 0) {
                            playerObj.position.y = obsBox.max.y + currentEyeHeight;
                            playerVelocityY = 0;
                            canJump = true;
                            isOnGround = true;
                            break;
                        }
                    }
                }

                // 跌入虛空判定 (若落入起點以下直接死亡)
                if (playerObj.position.y < (currentLevel === 1 ? -10 : BASE_Y - 8)) {
                    takeDamage(100);
                }

                // 2. 檢測觸發頂端水晶通關獎勵
                if (rewardCrystal && playerObj.position.distanceTo(rewardCrystal.position) < 2.0) {
                    score += 100;
                    health = 100; // 補滿血量
                    updateHealthHUD();
                    hudScore.textContent = score;

                    currentLevel++;
                    buildLevelScene(currentLevel);
                }

                // 3. 玩家子彈
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];

                    if (b.vel) {
                        b.vel.y -= 9.8 * delta;
                        b.mesh.position.addScaledVector(b.vel, delta);
                    } else {
                        b.mesh.position.addScaledVector(b.dir, b.speed * delta);
                    }

                    b.life -= delta;
                    let hit = false;

                    for (let j = zombies.length - 1; j >= 0; j--) {
                        const zGroup = zombies[j];
                        const headPos = new THREE.Vector3();
                        const bodyPos = new THREE.Vector3();

                        zGroup.userData.headMesh.getWorldPosition(headPos);
                        zGroup.userData.bodyMesh.getWorldPosition(bodyPos);

                        const distToHead = b.mesh.position.distanceTo(headPos);
                        const distToBody = b.mesh.position.distanceTo(bodyPos);

                        if (distToHead < 0.4 * zGroup.userData.scale || distToBody < 0.7 * zGroup.userData.scale) {
                            hit = true;

                            if (b.type === 'rpg' || b.type === 'grenadeLauncher') {
                                createExplosion(b.mesh.position, 5.0, b.damage);
                            } else {
                                let finalDamage = b.damage;
                                if (distToHead < distToBody) finalDamage *= 2;

                                zGroup.userData.health -= finalDamage;

                                if (zGroup.userData.health <= 0) {
                                    scene.remove(zGroup);
                                    zombies.splice(j, 1);
                                    score += 30;
                                    hudScore.textContent = score;
                                }
                            }
                            break;
                        }
                    }

                    if (hit || b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                // 4. 敵軍子彈
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const eb = enemyBullets[i];
                    eb.mesh.position.addScaledVector(eb.dir, eb.speed * delta);
                    eb.life -= delta;

                    if (eb.mesh.position.distanceTo(playerObj.position) < 0.8) {
                        takeDamage(10);
                        scene.remove(eb.mesh);
                        enemyBullets.splice(i, 1);
                        continue;
                    }

                    if (eb.life <= 0) {
                        scene.remove(eb.mesh);
                        enemyBullets.splice(i, 1);
                    }
                }

                // 5. 手榴彈與爆炸
                for (let i = grenades.length - 1; i >= 0; i--) {
                    const g = grenades[i];
                    g.velocity.y -= 9.8 * delta;
                    g.mesh.position.addScaledVector(g.velocity, delta);

                    g.timer -= delta;
                    if (g.timer <= 0) {
                        if (g.isFreeze) {
                            createFreezeExplosion(g.mesh.position, 7.0);
                        } else {
                            createExplosion(g.mesh.position, 6.0, 5);
                        }
                        scene.remove(g.mesh);
                        grenades.splice(i, 1);
                    }
                }

                for (let i = explosions.length - 1; i >= 0; i--) {
                    const exp = explosions[i];
                    exp.timer -= delta;
                    exp.mesh.material.opacity = exp.timer / 0.3;
                    if (exp.timer <= 0) {
                        scene.remove(exp.mesh);
                        explosions.splice(i, 1);
                    }
                }

                // 6. 怪物跳躍 AI 與追擊
                const playerPos = playerObj.position;
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const zGroup = zombies[i];

                    if (zGroup.userData.freezeTimer > 0) {
                        zGroup.userData.freezeTimer -= delta;
                        continue;
                    }

                    // 怪物朝向與移動
                    zGroup.lookAt(playerPos.x, zGroup.position.y, playerPos.z);
                    zGroup.translateZ(zGroup.userData.speed * delta);

                    // 怪物隨機跳躍機制
                    if (zGroup.userData.canJump && Math.random() < 0.015) {
                        zGroup.userData.velocityY = 9.0;
                        zGroup.userData.canJump = false;
                    }

                    // 怪物重力計算
                    zGroup.userData.velocityY -= GRAVITY * delta;
                    zGroup.position.y += zGroup.userData.velocityY * delta;

                    // 怪物與平台落地檢測
                    for (let obs of obstacles) {
                        const obsBox = new THREE.Box3().setFromObject(obs);
                        if (zGroup.position.x >= obsBox.min.x && zGroup.position.x <= obsBox.max.x &&
                            zGroup.position.z >= obsBox.min.z && zGroup.position.z <= obsBox.max.z) {
                            
                            if (zGroup.position.y <= obsBox.max.y && zGroup.position.y >= obsBox.max.y - 1.0) {
                                zGroup.position.y = obsBox.max.y;
                                zGroup.userData.velocityY = 0;
                                zGroup.userData.canJump = true;
                                break;
                            }
                        }
                    }

                    // 怪物墜入虛空清除
                    if (zGroup.position.y < -10) {
                        scene.remove(zGroup);
                        zombies.splice(i, 1);
                        continue;
                    }

                    // 怪物開槍
                    zGroup.userData.shootTimer += delta;
                    if (zGroup.userData.shootTimer >= zGroup.userData.shootInterval) {
                        zGroup.userData.shootTimer = 0;
                        enemyShoot(zGroup);
                    }

                    // 近戰扣血
                    if (zGroup.position.distanceTo(playerPos) < 1.3) {
                        takeDamage(10);
                        scene.remove(zGroup);
                        zombies.splice(i, 1);
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
