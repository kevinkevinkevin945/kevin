<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 懸空方塊跑酷 (Roblox/Minecraft Obby)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background-color: #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin-top: -4px; margin-left: -4px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.8); border: 2px solid rgba(0, 0, 0, 0.5); pointer-events: none; z-index: 10; }
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #wind-warning { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); color: #ff3333; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 8px #ff0000; display: none; pointer-events: none; z-index: 10; }
        #weapon-status { position: absolute; bottom: 20px; right: 20px; color: #ffcc00; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 20; cursor: pointer; }
        #instructions h1 { font-size: 42px; margin-bottom: 10px; color: #ff3333; text-shadow: 2px 2px 8px #ff9999; }
        #instructions p { font-size: 16px; margin: 4px 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hud">
        血量: <span id="health" style="color: #00ff00;">100</span> | 
        得分: <span id="score">0</span> | 
        層數: <span id="level-display" style="color: #ffaa00;">1</span> | 
        剩餘跳躍: <span id="jumps-left" style="color: #00ffff;">3</span>
    </div>
    <div id="wind-warning">⚠️ 警報：高空強烈陣風吹襲中！</div>
    <div id="weapon-status">當前武器: 1. 連發步槍 | 按 F 丟手榴彈</div>

    <div id="instructions">
        <h1>懸空方塊跑酷 Obby</h1>
        <p>點擊螢幕開始遊戲！</p>
        <p>【零樓梯！】告別樓梯，挑戰獨立的懸空方塊（Floating Cubes）！</p>
        <p>【極限跳躍】考驗精準落地與三段跳（Space）的空中控制！</p>
        <p>【狂暴 Hazard】移動方塊與高空強風依然存在！</p>
        <p>【移動操作】W/A/S/D 移動 | Space 三段跳 | Ctrl 滑行 | <b>F 丟手榴彈</b> | 1-4 換槍</p>
    </div>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        let isCrouching = false;
        let isSliding = false;
        let slideTimer = 0;
        let slideSpeedCurrent = 0;
        let slideDirection = new THREE.Vector3();
        
        let jumpsLeft = 3;
        const MAX_JUMPS = 3;

        let playerVelocity = new THREE.Vector3();
        const GRAVITY = 30;

        let isMouseDown = false;
        let lastShotTime = 0;
        let lastGrenadeTime = 0;
        let prevTime = performance.now();

        const STAND_HEIGHT = 1.6;
        const CROUCH_HEIGHT = 0.7;
        let currentEyeHeight = STAND_HEIGHT;

        let currentLevel = 1;
        let rewardCrystal = null;
        let centerTower = null;

        let towerRadius = 13;
        let centerTowerSolidRadius = 11.0;

        let windForce = new THREE.Vector3();
        let windTimer = 0;
        let isWindActive = false;

        let respawnPosition = new THREE.Vector3(0, 4, 15);

        const zombies = [];
        const obstacles = [];
        const movingPlatforms = [];
        const bullets = [];
        const grenades = [];
        const explosions = [];

        let health = 100;
        let score = 0;
        let isGameOver = false;

        const weaponList = ['rifle', 'rpg', 'crossbow', 'sniper'];
        const weaponNames = {
            'rifle': '1. 連發步槍',
            'rpg': '2. RPG火箭筒 (火箭跳)',
            'crossbow': '3. 十字弓',
            'sniper': '4. 狙擊槍'
        };

        let currentWeaponIndex = 0;
        let weaponMeshes = {};
        let weaponGroup;

        const hudHealth = document.getElementById('health');
        const hudScore = document.getElementById('score');
        const hudLevel = document.getElementById('level-display');
        const hudJumps = document.getElementById('jumps-left');
        const windWarning = document.getElementById('wind-warning');
        const weaponStatus = document.getElementById('weapon-status');
        const instructions = document.getElementById('instructions');

        const candyColors = [0xff6b81, 0xffa502, 0xeccc68, 0x70a1ff, 0x7bed9f, 0xff78ae];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a052b);
            scene.fog = new THREE.FogExp2(0x1a052b, 0.006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(30, 100, 30);
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);
            
            buildTowerScene(currentLevel);

            instructions.addEventListener('click', () => {
                if (!isGameOver) controls.lock();
                else restartGame();
            });

            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => {
                if (!isGameOver) instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            createWeapons();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('wheel', onMouseWheel);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            setInterval(spawnZombie, 2000);

            animate();
        }

        // 建造完全懸空的 Obby 方塊關卡（非樓梯）
        function buildTowerScene(level) {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;
            movingPlatforms.length = 0;
            if (rewardCrystal) scene.remove(rewardCrystal);
            if (centerTower) scene.remove(centerTower);

            hudLevel.textContent = level;

            towerRadius = 13;
            centerTowerSolidRadius = towerRadius - 1.0;
            const towerHeight = 70 + level * 35;

            const towerGeo = new THREE.CylinderGeometry(centerTowerSolidRadius, centerTowerSolidRadius, towerHeight, 32);
            const towerMat = new THREE.MeshLambertMaterial({ color: 0x9b59b6 }); // 紫色中央柱
            centerTower = new THREE.Mesh(towerGeo, towerMat);
            centerTower.position.set(0, towerHeight / 2, 0);
            scene.add(centerTower);

            // 起始大平台
            const startPlat = new THREE.Mesh(
                new THREE.BoxGeometry(6, 2, 6),
                new THREE.MeshLambertMaterial({ color: 0x00ffff })
            );
            startPlat.position.set(0, 2, towerRadius + 3);
            startPlat.userData = { type: 'checkpoint' };
            scene.add(startPlat);
            obstacles.push(startPlat);

            respawnPosition.set(0, 5, towerRadius + 3);

            const segmentCount = 20 + level * 6;

            let angle = 0;
            let currentY = 2;

            for (let i = 0; i < segmentCount; i++) {
                // 大幅拉開角度與高度差距，形成跳躍間隔
                angle += 0.55 + Math.random() * 0.15; 
                currentY += 2.2 + Math.random() * 1.5; 

                const posX = Math.cos(angle) * (towerRadius + 3.0);
                const posZ = Math.sin(angle) * (towerRadius + 3.0);

                let platType = 'normal';
                let platColor = candyColors[i % candyColors.length];
                
                // 獨立立方體尺寸 (Cube)
                let cubeSize = Math.max(2.2, 4.0 - level * 0.3);

                const isMoving = (level >= 2 && i % 3 === 1);

                if (i > 0 && i % 6 === 0) {
                    platType = 'checkpoint';
                    platColor = 0x00ffff;
                    cubeSize += 1.5;
                } else if (i % 4 === 2) {
                    platType = 'spring';
                    platColor = 0x00ff44;
                }

                const stepGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
                const stepMat = new THREE.MeshLambertMaterial({ color: platColor });
                const step = new THREE.Mesh(stepGeo, stepMat);

                step.position.set(posX, currentY, posZ);
                step.userData = { 
                    type: platType,
                    isMoving: isMoving,
                    basePos: new THREE.Vector3(posX, currentY, posZ),
                    moveOffset: Math.random() * Math.PI * 2,
                    moveSpeed: 1.8 + level * 0.6
                };

                scene.add(step);
                obstacles.push(step);
                if (isMoving) movingPlatforms.push(step);
            }

            const topAngle = angle + 0.6;
            const topY = currentY + 4;
            // 頂層終點平台
            const topPlat = new THREE.Mesh(
                new THREE.BoxGeometry(7, 2, 7),
                new THREE.MeshLambertMaterial({ color: 0xffdd00 })
            );
            topPlat.position.set(Math.cos(topAngle) * (towerRadius + 3.0), topY, Math.sin(topAngle) * (towerRadius + 3.0));
            topPlat.userData = { type: 'normal' };
            scene.add(topPlat);
            obstacles.push(topPlat);

            const crystalGeo = new THREE.OctahedronGeometry(1.5, 0);
            const crystalMat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
            rewardCrystal = new THREE.Mesh(crystalGeo, crystalMat);
            rewardCrystal.position.set(topPlat.position.x, topY + 3.0, topPlat.position.z);
            scene.add(rewardCrystal);

            controls.getObject().position.copy(respawnPosition);
        }

        function createWeapons() {
            weaponGroup = new THREE.Group();
            const rifleGroup = new THREE.Group();
            rifleGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 })));
            rifleGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['rifle'] = rifleGroup;
            const rpgGroup = new THREE.Group();
            rpgGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 12), new THREE.MeshLambertMaterial({ color: 0x2d4f1e })));
            rpgGroup.position.set(0.3, -0.25, -0.5);
            weaponMeshes['rpg'] = rpgGroup;
            const cbGroup = new THREE.Group();
            cbGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.4), new THREE.MeshLambertMaterial({ color: 0x5c4033 })));
            cbGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['crossbow'] = cbGroup;
            const snpGroup = new THREE.Group();
            snpGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x1a1a1a })));
            snpGroup.position.set(0.25, -0.2, -0.5);
            weaponMeshes['sniper'] = snpGroup;
            Object.keys(weaponMeshes).forEach(key => { weaponMeshes[key].visible = (key === 'rifle'); weaponGroup.add(weaponMeshes[key]); });
            camera.add(weaponGroup);
        }

        function triggerExplosiveShockwave(epicenter, radius, knockbackForce) {
            const expMesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.85 }));
            expMesh.position.copy(epicenter);
            scene.add(expMesh);
            explosions.push({ mesh: expMesh, timer: 0.35 });
            const playerPos = controls.getObject().position;
            const distToPlayer = playerPos.distanceTo(epicenter);
            if (distToPlayer <= radius + 2.0) {
                const pushDir = new THREE.Vector3().subVectors(playerPos, epicenter).normalize();
                pushDir.y = Math.max(pushDir.y + 0.4, 0.7); 
                pushDir.normalize();
                const falloff = 1 - (distToPlayer / (radius + 2.5));
                playerVelocity.addScaledVector(pushDir, knockbackForce * Math.max(falloff, 0.5));
                jumpsLeft = MAX_JUMPS; 
                hudJumps.textContent = jumpsLeft;
            }
            for (let i = zombies.length - 1; i >= 0; i--) {
                const z = zombies[i]; const distToZombie = z.position.distanceTo(epicenter);
                if (distToZombie <= radius) {
                    const zPushDir = new THREE.Vector3().subVectors(z.position, epicenter).normalize();
                    zPushDir.y = Math.max(zPushDir.y, 0.5); z.userData.velocity.addScaledVector(zPushDir, knockbackForce * 1.2);
                    z.userData.health -= 3;
                    if (z.userData.health <= 0) { scene.remove(z); zombies.splice(i, 1); score += 30; hudScore.textContent = score; }
                }
            }
        }

        function throwGrenade() {
            const now = performance.now(); if (now - lastGrenadeTime < 1000) return; lastGrenadeTime = now;
            const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.8));
            const gGeo = new THREE.SphereGeometry(0.18, 12, 12);
            const gMat = new THREE.MeshLambertMaterial({ color: 0x336622 });
            const grenadeMesh = new THREE.Mesh(gGeo, gMat); grenadeMesh.position.copy(spawnPos);
            const throwVel = dir.clone().multiplyScalar(22.0); throwVel.y += 6.0;
            grenades.push({ mesh: grenadeMesh, velocity: throwVel, timer: 1.5 }); scene.add(grenadeMesh);
        }

        function startSlide() {
            if (isSliding) return; isSliding = true;
            slideTimer = 0.7; slideSpeedCurrent = 24.0; currentEyeHeight = CROUCH_HEIGHT;
            const frontDir = new THREE.Vector3(); camera.getWorldDirection(frontDir); frontDir.y = 0; frontDir.normalize();
            if (moveForward || moveBackward || moveLeft || moveRight) {
                const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();
                slideDirection.set(0, 0, 0);
                if (moveForward) slideDirection.add(frontDir); if (moveBackward) slideDirection.sub(frontDir);
                if (moveRight) slideDirection.add(sideDir); if (moveLeft) slideDirection.sub(sideDir);
                slideDirection.normalize();
            } else { slideDirection.copy(frontDir); }
        }

        function cancelSlide() { isSliding = false; isCrouching = false; currentEyeHeight = STAND_HEIGHT; }

        function onKeyDown(e) {
            if (!controls.isLocked || isGameOver) return;
            switch (e.code) {
                case 'KeyW': moveForward = true; break; case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break; case 'KeyD': moveRight = true; break;
                case 'KeyF': throwGrenade(); break;
                case 'ControlLeft': case 'ControlRight':
                    if (moveForward || moveBackward || moveLeft || moveRight) startSlide();
                    else { isCrouching = true; currentEyeHeight = CROUCH_HEIGHT; }
                    break;
                case 'KeyC': startSlide(); break;
                case 'Space': 
                    if (jumpsLeft > 0) { playerVelocity.y = 13.0; jumpsLeft--; hudJumps.textContent = jumpsLeft; if (isSliding) cancelSlide(); }
                    break;
                case 'Digit1': selectWeapon(0); break; case 'Digit2': selectWeapon(1); break;
                case 'Digit3': selectWeapon(2); break; case 'Digit4': selectWeapon(3); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break; case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break; case 'KeyD': moveRight = false; break;
                case 'ControlLeft': case 'ControlRight': if (!isSliding) { isCrouching = false; currentEyeHeight = STAND_HEIGHT; } break;
            }
        }

        function onMouseDown(e) { if (!controls.isLocked || isGameOver) return; if (e.button === 0) { isMouseDown = true; tryShoot(); } }
        function onMouseUp(e) { if (e.button === 0) isMouseDown = false; }
        function onMouseWheel(e) { if (!controls.isLocked) return; currentWeaponIndex = (e.deltaY > 0) ? (currentWeaponIndex + 1) % weaponList.length : (currentWeaponIndex - 1 + weaponList.length) % weaponList.length; selectWeapon(currentWeaponIndex); }

        function selectWeapon(index) {
            currentWeaponIndex = index; const selectedKey = weaponList[index];
            Object.keys(weaponMeshes).forEach(key => weaponMeshes[key].visible = (key === selectedKey));
            weaponStatus.textContent = "當前武器: " + weaponNames[selectedKey] + " | 按 F 丟手榴彈";
        }

        function tryShoot() {
            const now = performance.now(); const curWeapon = weaponList[currentWeaponIndex]; const cooldown = curWeapon === 'rpg' ? 900 : 160;
            if (now - lastShotTime < cooldown) return; lastShotTime = now;
            const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.6));
            if (curWeapon === 'rpg') {
                const rocket = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.5, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
                rocket.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); rocket.position.copy(spawnPos);
                bullets.push({ mesh: rocket, dir: dir, speed: 45, isRPG: true, life: 3.0 }); scene.add(rocket);
            } else {
                const bullet = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
                bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); bullet.position.copy(spawnPos);
                bullets.push({ mesh: bullet, dir: dir, speed: 85, isRPG: false, life: 2.0 }); scene.add(bullet);
            }
        }

        function respawnAtCheckpoint() {
            controls.getObject().position.copy(respawnPosition); playerVelocity.set(0, 0, 0);
            jumpsLeft = MAX_JUMPS; hudJumps.textContent = jumpsLeft; health = 100; hudHealth.textContent = health;
        }

        function spawnZombie() {
            if (!controls.isLocked || isGameOver) return;
            const zombieGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), new THREE.MeshLambertMaterial({ color: 0xcc2222 }));
            body.position.y = 0.6; zombieGroup.add(body);
            zombieGroup.userData = { speed: 2.2 + currentLevel * 0.5, health: 4, velocity: new THREE.Vector3() };
            const targetObs = obstacles[Math.floor(Math.random() * obstacles.length)];
            const obsBox = new THREE.Box3().setFromObject(targetObs);
            zombieGroup.position.x = (obsBox.min.x + obsBox.max.x) / 2;
            zombieGroup.position.z = (obsBox.min.z + obsBox.max.z) / 2;
            zombieGroup.position.y = obsBox.max.y;
            scene.add(zombieGroup); zombies.push(zombieGroup);
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        function restartGame() {
            currentLevel = 1; score = 0; isGameOver = false; hudScore.textContent = score;
            zombies.forEach(z => scene.remove(z)); bullets.forEach(b => scene.remove(b.mesh)); grenades.forEach(g => scene.remove(g.mesh));
            zombies.length = 0; bullets.length = 0; grenades.length = 0; buildTowerScene(currentLevel); controls.lock();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = (time - prevTime) / 1000;
            if (controls.isLocked && !isGameOver) {
                if (isMouseDown && weaponList[currentWeaponIndex] !== 'rpg') tryShoot();
                if (rewardCrystal) rewardCrystal.rotation.y += 2.0 * delta;
                movingPlatforms.forEach(plat => { const u = plat.userData; const offset = Math.sin(time * 0.002 * u.moveSpeed + u.moveOffset) * 4.0; plat.position.x = u.basePos.x + offset; });
                windTimer += delta;
                if (windTimer > 8.0) {
                    isWindActive = Math.random() < 0.5; windTimer = 0;
                    if (isWindActive) { windForce.set((Math.random() - 0.5) * 16.0, 0, (Math.random() - 0.5) * 16.0); windWarning.style.display = 'block'; setTimeout(() => { windWarning.style.display = 'none'; }, 2500); }
                }
                const playerObj = controls.getObject();
                let moveVector = new THREE.Vector3();
                if (isSliding) {
                    moveVector.copy(slideDirection).multiplyScalar(slideSpeedCurrent * delta);
                    slideSpeedCurrent = Math.max(12.0, slideSpeedCurrent - 18.0 * delta); slideTimer -= delta;
                    if (slideTimer <= 0) cancelSlide();
                } else {
                    let moveSpeed = (isCrouching ? 5.5 : 12.0) * delta;
                    const frontDir = new THREE.Vector3(); camera.getWorldDirection(frontDir); frontDir.y = 0; frontDir.normalize();
                    const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();
                    if (moveForward) moveVector.addScaledVector(frontDir, moveSpeed); if (moveBackward) moveVector.addScaledVector(frontDir, -moveSpeed);
                    if (moveLeft) moveVector.addScaledVector(sideDir, moveSpeed); if (moveRight) moveVector.addScaledVector(sideDir, -moveSpeed);
                }
                if (isWindActive && playerObj.position.y > 15) { playerVelocity.addScaledVector(windForce, delta * 0.8); }
                playerVelocity.y -= GRAVITY * delta; playerVelocity.x *= 0.94; playerVelocity.z *= 0.94;
                playerObj.position.add(moveVector); playerObj.position.addScaledVector(playerVelocity, delta);
                
                const playerDistCenter = Math.sqrt(playerObj.position.x * playerObj.position.x + playerObj.position.z * playerObj.position.z);
                const minPlayerDist = centerTowerSolidRadius + 0.4;
                if (playerDistCenter < minPlayerDist && playerDistCenter > 0.001) { playerObj.position.x = (playerObj.position.x / playerDistCenter) * minPlayerDist; playerObj.position.z = (playerObj.position.z / playerDistCenter) * minPlayerDist; }
                
                const playerFeetY = playerObj.position.y - currentEyeHeight;
                for (let obs of obstacles) {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (playerObj.position.x >= obsBox.min.x - 0.3 && playerObj.position.x <= obsBox.max.x + 0.3 && playerObj.position.z >= obsBox.min.z - 0.3 && playerObj.position.z <= obsBox.max.z + 0.3) {
                        const platTop = obsBox.max.y;
                        if (playerFeetY <= platTop && playerFeetY >= platTop - 1.2 && playerVelocity.y <= 0) {
                            playerObj.position.y = platTop + currentEyeHeight; playerVelocity.y = 0; jumpsLeft = MAX_JUMPS; hudJumps.textContent = jumpsLeft;
                            if (obs.userData.type === 'spring') { playerVelocity.y = 26.0; } 
                            else if (obs.userData.type === 'checkpoint') { const newRespawn = new THREE.Vector3((obsBox.min.x + obsBox.max.x) / 2, platTop + STAND_HEIGHT + 1.0, (obsBox.min.z + obsBox.max.z) / 2); respawnPosition.copy(newRespawn); }
                            break;
                        }
                    }
                }
                if (playerObj.position.y < -15) { respawnAtCheckpoint(); }
                if (rewardCrystal && playerObj.position.distanceTo(rewardCrystal.position) < 2.0) { score += 300; hudScore.textContent = score; currentLevel++; buildTowerScene(currentLevel); }
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * delta); b.life -= delta;
                    let hit = false;
                    if (b.isRPG) { const bulletDistCenter = Math.sqrt(b.mesh.position.x * b.mesh.position.x + b.mesh.position.z * b.mesh.position.z); if (bulletDistCenter <= centerTowerSolidRadius) { triggerExplosiveShockwave(b.mesh.position, 9.5, 45.0); hit = true; } }
                    if (!hit) { for (let j = zombies.length - 1; j >= 0; j--) { if (b.mesh.position.distanceTo(zombies[j].position) < 1.2) { hit = true; if (b.isRPG) { triggerExplosiveShockwave(b.mesh.position, 9.5, 45.0); } else { zombies[j].userData.health -= 1; if (zombies[j].userData.health <= 0) { scene.remove(zombies[j]); zombies.splice(j, 1); score += 20; hudScore.textContent = score; } } break; } } }
                    if (!hit && b.isRPG) { for (let obs of obstacles) { const obsBox = new THREE.Box3().setFromObject(obs); if (obsBox.containsPoint(b.mesh.position)) { triggerExplosiveShockwave(b.mesh.position, 9.5, 45.0); hit = true; break; } } }
                    if (hit || b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
                }
                for (let i = grenades.length - 1; i >= 0; i--) {
                    const g = grenades[i]; g.timer -= delta; g.velocity.y -= GRAVITY * delta; g.mesh.position.addScaledVector(g.velocity, delta);
                    const gDistCenter = Math.sqrt(g.mesh.position.x * g.mesh.position.x + g.mesh.position.z * g.mesh.position.z);
                    if (gDistCenter < centerTowerSolidRadius + 0.2) { g.velocity.x *= -0.5; g.velocity.z *= -0.5; }
                    for (let obs of obstacles) { const obsBox = new THREE.Box3().setFromObject(obs); if (obsBox.containsPoint(g.mesh.position)) { g.velocity.y *= -0.4; g.velocity.x *= 0.6; g.velocity.z *= 0.6; g.mesh.position.y = obsBox.max.y + 0.1; break; } }
                    if (g.timer <= 0) { triggerExplosiveShockwave(g.mesh.position, 9.0, 40.0); scene.remove(g.mesh); grenades.splice(i, 1); }
                }
                for (let i = explosions.length - 1; i >= 0; i--) { const exp = explosions[i]; exp.timer -= delta; exp.mesh.material.opacity = exp.timer / 0.35; if (exp.timer <= 0) { scene.remove(exp.mesh); explosions.splice(i, 1); } }
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const z = zombies[i]; z.lookAt(playerObj.position.x, z.position.y, playerObj.position.z); z.translateZ(z.userData.speed * delta);
                    z.userData.velocity.y -= GRAVITY * delta; z.userData.velocity.x *= 0.92; z.userData.velocity.z *= 0.92; z.position.addScaledVector(z.userData.velocity, delta);
                    const zDistCenter = Math.sqrt(z.position.x * z.position.x + z.position.z * z.position.z);
                    const minZDist = centerTowerSolidRadius + 0.4;
                    if (zDistCenter < minZDist && zDistCenter > 0.001) { z.position.x = (z.position.x / zDistCenter) * minZDist; z.position.z = (z.position.z / zDistCenter) * minZDist; }
                    for (let obs of obstacles) { const obsBox = new THREE.Box3().setFromObject(obs); if (z.position.x >= obsBox.min.x && z.position.x <= obsBox.max.x && z.position.z >= obsBox.min.z && z.position.z <= obsBox.max.z) { if (z.position.y <= obsBox.max.y && z.position.y >= obsBox.max.y - 1.0) { z.position.y = obsBox.max.y; z.userData.velocity.y = 0; break; } } }
                    if (z.position.y < -15) { scene.remove(z); zombies.splice(i, 1); continue; }
                    if (z.position.distanceTo(playerObj.position) < 1.2) { respawnAtCheckpoint(); scene.remove(z); zombies.splice(i, 1); }
                }
            }
            prevTime = time; renderer.render(scene, camera);
        }
        window.onload = init;
    </script>
</body>
