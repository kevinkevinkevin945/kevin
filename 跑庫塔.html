<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 環塔跑酷 - 衝擊波與實體螺旋塔</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            background-color: #000;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            margin-top: -4px;
            margin-left: -4px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #checkpoint-msg {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        #weapon-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
            cursor: pointer;
        }

        #instructions h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #ffaa00;
        }

        #instructions p {
            font-size: 16px;
            margin: 4px 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hud">
        血量: <span id="health" style="color: #00ff00;">100</span> | 
        得分: <span id="score">0</span> | 
        巨塔層數: <span id="level-display" style="color: #ffaa00;">1</span>
    </div>
    <div id="checkpoint-msg">★ 檢查點已記錄！★</div>
    <div id="weapon-status">當前武器: 1. 連發步槍</div>

    <div id="instructions">
        <h1>環形跑酷巨塔 (Tower Climb)</h1>
        <p>點擊螢幕開始遊戲</p>
        <p>【爆波物理】爆炸會產生衝擊波，強烈推動角色與怪物！</p>
        <p>【巨塔跑酷】沿著中央巨塔外圍的螺旋步道向上攀爬！</p>
        <p>【特殊平台】藍色=紀錄點 | 綠色=彈簧墊 | 紅色=加速步道</p>
        <p>【移動操作】W/A/S/D 移動 | Ctrl/C 滑行 | Space 跳躍 | 滑鼠滾輪換槍</p>
    </div>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        let isCrouching = false;
        let isSliding = false;
        let slideTimer = 0;
        let slideSpeedCurrent = 0;
        let slideDirection = new THREE.Vector3();
        let canJump = false;
        
        // 玩家速度與向量 (包含衝擊波推力)
        let playerVelocity = new THREE.Vector3();
        const GRAVITY = 28;

        let isMouseDown = false;
        let lastShotTime = 0;
        let prevTime = performance.now();

        const STAND_HEIGHT = 1.6;
        const CROUCH_HEIGHT = 0.7;
        let currentEyeHeight = STAND_HEIGHT;

        let currentLevel = 1;
        let rewardCrystal = null;
        let centerTower = null;

        let respawnPosition = new THREE.Vector3(0, 3, 14);

        const zombies = [];
        const obstacles = [];
        const bullets = [];
        const explosions = [];

        let health = 100;
        let score = 0;
        let isGameOver = false;

        const weaponList = ['rifle', 'rpg', 'crossbow', 'sniper'];
        const weaponNames = {
            'rifle': '1. 連發步槍',
            'rpg': '2. RPG火箭筒 (強烈爆波)',
            'crossbow': '3. 十字弓',
            'sniper': '4. 狙擊槍'
        };

        let currentWeaponIndex = 0;
        let weaponMeshes = {};
        let weaponGroup;

        const hudHealth = document.getElementById('health');
        const hudScore = document.getElementById('score');
        const hudLevel = document.getElementById('level-display');
        const checkpointMsg = document.getElementById('checkpoint-msg');
        const weaponStatus = document.getElementById('weapon-status');
        const instructions = document.getElementById('instructions');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0c1e);
            scene.fog = new THREE.FogExp2(0x0c0c1e, 0.006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const ambientLight = new THREE.AmbientLight(0xaaaaaa);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(30, 100, 30);
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);
            
            buildTowerScene(currentLevel);

            instructions.addEventListener('click', () => {
                if (!isGameOver) controls.lock();
                else restartGame();
            });

            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => {
                if (!isGameOver) instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            createWeapons();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('wheel', onMouseWheel);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            setInterval(spawnZombie, 3000);

            animate();
        }

        // 建造圓柱形實體巨塔與環形螺旋廊道
        function buildTowerScene(level) {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;
            if (rewardCrystal) scene.remove(rewardCrystal);
            if (centerTower) scene.remove(centerTower);

            hudLevel.textContent = level;

            const towerRadius = 12;
            const towerHeight = 80 + level * 30;

            // 1. 中央巨塔核心實體
            const towerGeo = new THREE.CylinderGeometry(towerRadius - 0.5, towerRadius - 0.5, towerHeight, 32);
            const towerMat = new THREE.MeshLambertMaterial({ color: 0x1a1a2e });
            centerTower = new THREE.Mesh(towerGeo, towerMat);
            centerTower.position.set(0, towerHeight / 2, 0);
            scene.add(centerTower);

            // 2. 底層起跑平台（第一個檢查點）
            const startPlat = new THREE.Mesh(
                new THREE.BoxGeometry(8, 1.5, 8),
                new THREE.MeshLambertMaterial({ color: 0x00ffff })
            );
            startPlat.position.set(0, 1, towerRadius + 3);
            startPlat.userData = { type: 'checkpoint' };
            scene.add(startPlat);
            obstacles.push(startPlat);

            respawnPosition.set(0, 3, towerRadius + 3);

            // 3. 沿著塔身建造連續環形廊道與階梯
            const segmentCount = 30 + level * 8;
            let angle = 0;
            let currentY = 2;

            for (let i = 0; i < segmentCount; i++) {
                angle += 0.35;
                currentY += 1.8 + Math.random() * 0.5;

                const posX = Math.cos(angle) * (towerRadius + 2.5);
                const posZ = Math.sin(angle) * (towerRadius + 2.5);

                let platType = 'normal';
                let platColor = 0x3a3d52;
                let width = 5.0;
                let length = 6.0;

                if (i > 0 && i % 7 === 0) {
                    platType = 'checkpoint';
                    platColor = 0x00ffff;
                    width = 7.0;
                } else if (Math.random() < 0.2) {
                    platType = 'spring';
                    platColor = 0x00ff44;
                } else if (Math.random() < 0.25) {
                    platType = 'boost';
                    platColor = 0xff0055;
                }

                const stepGeo = new THREE.BoxGeometry(width, 0.8, length);
                const stepMat = new THREE.MeshLambertMaterial({ color: platColor });
                const step = new THREE.Mesh(stepGeo, stepMat);

                step.position.set(posX, currentY, posZ);
                step.rotation.y = -angle + Math.PI / 2; // 面向環形切線方向
                step.userData = { type: platType };

                scene.add(step);
                obstacles.push(step);
            }

            // 4. 塔頂終點
            const topAngle = angle + 0.4;
            const topY = currentY + 3;
            const topPlat = new THREE.Mesh(
                new THREE.BoxGeometry(8, 1, 8),
                new THREE.MeshLambertMaterial({ color: 0xffcc00 })
            );
            topPlat.position.set(Math.cos(topAngle) * (towerRadius + 2.5), topY, Math.sin(topAngle) * (towerRadius + 2.5));
            topPlat.userData = { type: 'normal' };
            scene.add(topPlat);
            obstacles.push(topPlat);

            const crystalGeo = new THREE.OctahedronGeometry(1.5, 0);
            const crystalMat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
            rewardCrystal = new THREE.Mesh(crystalGeo, crystalMat);
            rewardCrystal.position.set(topPlat.position.x, topY + 2.5, topPlat.position.z);
            scene.add(rewardCrystal);

            controls.getObject().position.copy(respawnPosition);
        }

        function createWeapons() {
            weaponGroup = new THREE.Group();

            const rifleGroup = new THREE.Group();
            rifleGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 })));
            rifleGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['rifle'] = rifleGroup;

            const rpgGroup = new THREE.Group();
            rpgGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 12), new THREE.MeshLambertMaterial({ color: 0x2d4f1e })));
            rpgGroup.position.set(0.3, -0.25, -0.5);
            weaponMeshes['rpg'] = rpgGroup;

            const cbGroup = new THREE.Group();
            cbGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.4), new THREE.MeshLambertMaterial({ color: 0x5c4033 })));
            cbGroup.position.set(0.25, -0.2, -0.45);
            weaponMeshes['crossbow'] = cbGroup;

            const snpGroup = new THREE.Group();
            snpGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x1a1a1a })));
            snpGroup.position.set(0.25, -0.2, -0.5);
            weaponMeshes['sniper'] = snpGroup;

            Object.keys(weaponMeshes).forEach(key => {
                weaponMeshes[key].visible = (key === 'rifle');
                weaponGroup.add(weaponMeshes[key]);
            });

            camera.add(weaponGroup);
        }

        function triggerExplosiveShockwave(epicenter, radius, knockbackForce) {
            // 1. 視覺效果
            const expMesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 })
            );
            expMesh.position.copy(epicenter);
            scene.add(expMesh);
            explosions.push({ mesh: expMesh, timer: 0.35 });

            // 2. 對玩家施加爆波推力 (Knockback)
            const playerPos = controls.getObject().position;
            const distToPlayer = playerPos.distanceTo(epicenter);

            if (distToPlayer <= radius + 1.0) {
                const pushDir = new THREE.Vector3().subVectors(playerPos, epicenter).normalize();
                // 給予向上與向外的強烈推力
                pushDir.y = Math.max(pushDir.y, 0.4); 
                playerVelocity.addScaledVector(pushDir, knockbackForce * (1 - distToPlayer / (radius + 2.0)));
            }

            // 3. 對怪物施加爆波推力與傷害
            for (let i = zombies.length - 1; i >= 0; i--) {
                const z = zombies[i];
                const distToZombie = z.position.distanceTo(epicenter);

                if (distToZombie <= radius) {
                    const zPushDir = new THREE.Vector3().subVectors(z.position, epicenter).normalize();
                    zPushDir.y = Math.max(zPushDir.y, 0.5);
                    z.userData.velocity.addScaledVector(zPushDir, knockbackForce * 1.2);
                    
                    z.userData.health -= 3;
                    if (z.userData.health <= 0) {
                        scene.remove(z);
                        zombies.splice(i, 1);
                        score += 30;
                        hudScore.textContent = score;
                    }
                }
            }
        }

        function startSlide() {
            if (isSliding || !canJump) return;
            isSliding = true;
            slideTimer = 0.7;
            slideSpeedCurrent = 24.0;
            currentEyeHeight = CROUCH_HEIGHT;

            const frontDir = new THREE.Vector3();
            camera.getWorldDirection(frontDir);
            frontDir.y = 0; frontDir.normalize();

            if (moveForward || moveBackward || moveLeft || moveRight) {
                const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();
                slideDirection.set(0, 0, 0);
                if (moveForward) slideDirection.add(frontDir);
                if (moveBackward) slideDirection.sub(frontDir);
                if (moveRight) slideDirection.add(sideDir);
                if (moveLeft) slideDirection.sub(sideDir);
                slideDirection.normalize();
            } else {
                slideDirection.copy(frontDir);
            }
        }

        function cancelSlide() {
            isSliding = false;
            isCrouching = false;
            currentEyeHeight = STAND_HEIGHT;
        }

        function onKeyDown(e) {
            if (!controls.isLocked || isGameOver) return;

            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'ControlLeft':
                case 'ControlRight':
                    if (moveForward || moveBackward || moveLeft || moveRight) startSlide();
                    else { isCrouching = true; currentEyeHeight = CROUCH_HEIGHT; }
                    break;
                case 'KeyC': startSlide(); break;
                case 'Space': 
                    if (canJump) {
                        playerVelocity.y = 12.0;
                        canJump = false;
                        if (isSliding) cancelSlide();
                    }
                    break;
                case 'Digit1': selectWeapon(0); break;
                case 'Digit2': selectWeapon(1); break;
                case 'Digit3': selectWeapon(2); break;
                case 'Digit4': selectWeapon(3); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ControlLeft':
                case 'ControlRight':
                    if (!isSliding) { isCrouching = false; currentEyeHeight = STAND_HEIGHT; }
                    break;
            }
        }

        function onMouseDown(e) {
            if (!controls.isLocked || isGameOver) return;
            if (e.button === 0) { isMouseDown = true; tryShoot(); }
        }

        function onMouseUp(e) { if (e.button === 0) isMouseDown = false; }

        function onMouseWheel(e) {
            if (!controls.isLocked) return;
            currentWeaponIndex = (e.deltaY > 0) ? (currentWeaponIndex + 1) % weaponList.length : (currentWeaponIndex - 1 + weaponList.length) % weaponList.length;
            selectWeapon(currentWeaponIndex);
        }

        function selectWeapon(index) {
            currentWeaponIndex = index;
            const selectedKey = weaponList[index];
            Object.keys(weaponMeshes).forEach(key => weaponMeshes[key].visible = (key === selectedKey));
            weaponStatus.textContent = "當前武器: " + weaponNames[selectedKey];
        }

        function tryShoot() {
            const now = performance.now();
            const curWeapon = weaponList[currentWeaponIndex];
            const cooldown = curWeapon === 'rpg' ? 900 : 160;

            if (now - lastShotTime < cooldown) return;
            lastShotTime = now;

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.6));

            if (curWeapon === 'rpg') {
                const rocket = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
                rocket.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                rocket.position.copy(spawnPos);
                bullets.push({ mesh: rocket, dir: dir, speed: 45, isRPG: true, life: 3.0 });
                scene.add(rocket);
            } else {
                const bullet = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
                bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                bullet.position.copy(spawnPos);
                bullets.push({ mesh: bullet, dir: dir, speed: 85, isRPG: false, life: 2.0 });
                scene.add(bullet);
            }
        }

        function respawnAtCheckpoint() {
            controls.getObject().position.copy(respawnPosition);
            playerVelocity.set(0, 0, 0);
            health = 100;
            hudHealth.textContent = health;
        }

        function spawnZombie() {
            if (!controls.isLocked || isGameOver) return;

            const zombieGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), new THREE.MeshLambertMaterial({ color: 0x22aa44 }));
            body.position.y = 0.6;
            zombieGroup.add(body);

            zombieGroup.userData = { 
                speed: 3.0 + currentLevel * 0.3, 
                health: 3, 
                velocity: new THREE.Vector3(), 
                canJump: true 
            };

            const targetObs = obstacles[Math.floor(Math.random() * obstacles.length)];
            const obsBox = new THREE.Box3().setFromObject(targetObs);

            zombieGroup.position.x = (obsBox.min.x + obsBox.max.x) / 2;
            zombieGroup.position.z = (obsBox.min.z + obsBox.max.z) / 2;
            zombieGroup.position.y = obsBox.max.y;

            scene.add(zombieGroup);
            zombies.push(zombieGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function restartGame() {
            currentLevel = 1;
            score = 0;
            isGameOver = false;
            hudScore.textContent = score;

            zombies.forEach(z => scene.remove(z));
            bullets.forEach(b => scene.remove(b.mesh));
            zombies.length = 0; bullets.length = 0;

            buildTowerScene(currentLevel);
            controls.lock();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked && !isGameOver) {
                if (isMouseDown && weaponList[currentWeaponIndex] !== 'rpg') tryShoot();

                if (rewardCrystal) rewardCrystal.rotation.y += 2.0 * delta;

                const playerObj = controls.getObject();

                // 1. 基本操控移動量計算
                let moveVector = new THREE.Vector3();
                if (isSliding) {
                    moveVector.copy(slideDirection).multiplyScalar(slideSpeedCurrent * delta);
                    slideSpeedCurrent = Math.max(12.0, slideSpeedCurrent - 18.0 * delta);
                    slideTimer -= delta;
                    if (slideTimer <= 0) cancelSlide();
                } else {
                    let moveSpeed = (isCrouching ? 5.5 : 12.0) * delta;
                    const frontDir = new THREE.Vector3();
                    camera.getWorldDirection(frontDir);
                    frontDir.y = 0; frontDir.normalize();
                    const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();

                    if (moveForward) moveVector.addScaledVector(frontDir, moveSpeed);
                    if (moveBackward) moveVector.addScaledVector(frontDir, -moveSpeed);
                    if (moveLeft) moveVector.addScaledVector(sideDir, moveSpeed);
                    if (moveRight) moveVector.addScaledVector(sideDir, -moveSpeed);
                }

                // 2. 疊加衝擊波推力向量與重力
                playerVelocity.y -= GRAVITY * delta;
                
                // 套用衝擊波衰減阻尼
                playerVelocity.x *= 0.95;
                playerVelocity.z *= 0.95;

                playerObj.position.add(moveVector);
                playerObj.position.addScaledVector(playerVelocity, delta);

                // 3. 平台碰撞判定
                const playerFeetY = playerObj.position.y - currentEyeHeight;

                for (let obs of obstacles) {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (playerObj.position.x >= obsBox.min.x - 0.4 && playerObj.position.x <= obsBox.max.x + 0.4 &&
                        playerObj.position.z >= obsBox.min.z - 0.4 && playerObj.position.z <= obsBox.max.z + 0.4) {

                        if (playerFeetY <= obsBox.max.y && playerFeetY >= obsBox.max.y - 0.8 && playerVelocity.y <= 0) {
                            playerObj.position.y = obsBox.max.y + currentEyeHeight;
                            playerVelocity.y = 0;
                            canJump = true;

                            if (obs.userData.type === 'spring') {
                                playerVelocity.y = 24.0; // 綠色彈簧
                                canJump = false;
                            } else if (obs.userData.type === 'boost') {
                                const frontDir = new THREE.Vector3();
                                camera.getWorldDirection(frontDir);
                                frontDir.y = 0; frontDir.normalize();
                                playerVelocity.addScaledVector(frontDir, 30.0); // 紅色加速
                            } else if (obs.userData.type === 'checkpoint') {
                                const newRespawn = new THREE.Vector3(
                                    (obsBox.min.x + obsBox.max.x) / 2,
                                    obsBox.max.y + STAND_HEIGHT + 0.5,
                                    (obsBox.min.z + obsBox.max.z) / 2
                                );
                                if (respawnPosition.distanceTo(newRespawn) > 2.0) {
                                    respawnPosition.copy(newRespawn);
                                    checkpointMsg.style.display = 'block';
                                    setTimeout(() => { checkpointMsg.style.display = 'none'; }, 1500);
                                }
                            }
                            break;
                        }
                    }
                }

                // 跌入無底虛空重生
                if (playerObj.position.y < -15) {
                    respawnAtCheckpoint();
                }

                // 通關頂端
                if (rewardCrystal && playerObj.position.distanceTo(rewardCrystal.position) < 2.0) {
                    score += 200;
                    hudScore.textContent = score;
                    currentLevel++;
                    buildTowerScene(currentLevel);
                }

                // 子彈與爆炸處理
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.mesh.position.addScaledVector(b.dir, b.speed * delta);
                    b.life -= delta;

                    let hit = false;
                    for (let j = zombies.length - 1; j >= 0; j--) {
                        if (b.mesh.position.distanceTo(zombies[j].position) < 1.2) {
                            hit = true;
                            if (b.isRPG) {
                                triggerExplosiveShockwave(b.mesh.position, 8.0, 35.0);
                            } else {
                                zombies[j].userData.health -= 1;
                                if (zombies[j].userData.health <= 0) {
                                    scene.remove(zombies[j]);
                                    zombies.splice(j, 1);
                                    score += 20;
                                    hudScore.textContent = score;
                                }
                            }
                            break;
                        }
                    }

                    if (!hit && b.isRPG) {
                        // 子彈撞擊平台爆破
                        for (let obs of obstacles) {
                            const obsBox = new THREE.Box3().setFromObject(obs);
                            if (obsBox.containsPoint(b.mesh.position)) {
                                triggerExplosiveShockwave(b.mesh.position, 8.0, 35.0);
                                hit = true;
                                break;
                            }
                        }
                    }

                    if (hit || b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                // 爆炸效果動畫
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const exp = explosions[i];
                    exp.timer -= delta;
                    exp.mesh.material.opacity = exp.timer / 0.35;
                    if (exp.timer <= 0) {
                        scene.remove(exp.mesh);
                        explosions.splice(i, 1);
                    }
                }

                // 怪物追擊與物理運動
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const z = zombies[i];
                    z.lookAt(playerObj.position.x, z.position.y, playerObj.position.z);
                    z.translateZ(z.userData.speed * delta);

                    z.userData.velocity.y -= GRAVITY * delta;
                    z.userData.velocity.x *= 0.92;
                    z.userData.velocity.z *= 0.92;
                    z.position.addScaledVector(z.userData.velocity, delta);

                    for (let obs of obstacles) {
                        const obsBox = new THREE.Box3().setFromObject(obs);
                        if (z.position.x >= obsBox.min.x && z.position.x <= obsBox.max.x &&
                            z.position.z >= obsBox.min.z && z.position.z <= obsBox.max.z) {
                            if (z.position.y <= obsBox.max.y && z.position.y >= obsBox.max.y - 1.0) {
                                z.position.y = obsBox.max.y;
                                z.userData.velocity.y = 0;
                                break;
                            }
                        }
                    }

                    if (z.position.y < -15) {
                        scene.remove(z);
                        zombies.splice(i, 1);
                        continue;
                    }

                    if (z.position.distanceTo(playerObj.position) < 1.2) {
                        respawnAtCheckpoint();
                        scene.remove(z);
                        zombies.splice(i, 1);
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
