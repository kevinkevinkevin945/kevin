<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一人稱 · 平台跑酷</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 6px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            font-size: 30px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px 60px;
            border-radius: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,100,100,0.3);
            z-index: 30;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #gameover h2 { font-size: 42px; color: #ff6b6b; margin-bottom: 10px; }
        #gameover .final-score { font-size: 28px; color: #ffd700; margin: 16px 0; }
        #gameover .restart-hint { font-size: 18px; color: #aaa; margin-top: 20px; }
        #gameover .restart-hint kbd { background: #2a2a4a; padding: 4px 14px; border-radius: 6px; color: #88ddff; border: 1px solid #4a6a9a; }
        @media (max-width: 600px) {
            #ui { font-size: 18px; padding: 4px 14px; }
            #controls-hint { font-size: 11px; padding: 4px 14px; white-space: normal; }
            #gameover { padding: 30px 24px; width: 80%; }
            #gameover h2 { font-size: 30px; }
        }
    </style>
</head>
<body>

    <div id="ui">🏆 <span id="score">0</span></div>
    <div id="crosshair">+</div>
    <div id="controls-hint">W A S D 移動 · 空格跳躍 · 收集發光方塊</div>
    <div id="gameover">
        <h2>💥 掉落！</h2>
        <div class="final-score">得分: <span id="finalScore">0</span></div>
        <div class="restart-hint">點擊 或 按 <kbd>R</kbd> 重新開始</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        //  場景 / 相機 / 渲染器 (第一人稱)
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 25, 55);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 80);
        camera.position.set(0, 1.2, 0);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ============================================================
        //  燈光
        // ============================================================
        const ambient = new THREE.AmbientLight(0x40406b, 0.5);
        scene.add(ambient);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        sunLight.position.set(10, 25, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -25;
        sunLight.shadow.camera.right = 25;
        sunLight.shadow.camera.top = 25;
        sunLight.shadow.camera.bottom = -25;
        scene.add(sunLight);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
        fill.position.set(-8, 5, 10);
        scene.add(fill);

        // 地板微光
        const glowLight = new THREE.PointLight(0x4466aa, 0.3, 20);
        glowLight.position.set(0, 0.5, 0);
        scene.add(glowLight);

        // ============================================================
        //  玩家 (第一人稱只有碰撞箱，用一個不可見的球體代表)
        // ============================================================
        const playerHeight = 0.5;
        const playerRadius = 0.3;
        const playerBody = new THREE.Mesh(
            new THREE.SphereGeometry(playerRadius, 8, 8),
            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
        );
        playerBody.position.set(0, playerHeight, 0);
        scene.add(playerBody);

        // 玩家物理
        const player = {
            body: playerBody,
            velocityY: 0,
            gravity: -0.028,
            jumpPower: 0.4,
            isGrounded: false,
            moveSpeed: 0.14,
            posX: 0,
            posZ: 0,
            targetX: 0,
            targetZ: 0,
            height: playerHeight,
        };

        // ============================================================
        //  平台系統
        // ============================================================
        const platforms = [];
        const collectibles = [];
        let score = 0;
        let gameActive = true;
        let gameOver = false;

        // 平台材質
        const platMat = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a5a, 
            roughness: 0.7,
            metalness: 0.2,
            emissive: new THREE.Color(0x0a0a2a),
            emissiveIntensity: 0.3
        });
        const platMatGlow = new THREE.MeshStandardMaterial({ 
            color: 0x4a7a9a, 
            roughness: 0.4,
            metalness: 0.3,
            emissive: new THREE.Color(0x1a4a7a),
            emissiveIntensity: 0.5
        });

        // 收集物材質
        const collectMat = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            emissive: new THREE.Color(0x886600), 
            emissiveIntensity: 0.8,
            roughness: 0.2,
            metalness: 0.3
        });

        // 創建平台
        function createPlatform(x, z, w, d, colorType = 'normal') {
            const mat = colorType === 'glow' ? platMatGlow : platMat;
            const geo = new THREE.BoxGeometry(w, 0.3, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
            
            // 邊緣光條 (裝飾)
            const edgeMat = new THREE.MeshStandardMaterial({ 
                color: 0x6a9acf, 
                emissive: new THREE.Color(0x2a5a8a), 
                emissiveIntensity: 0.3 
            });
            for (let side of [[1,0], [-1,0], [0,1], [0,-1]]) {
                const edge = new THREE.Mesh(
                    new THREE.BoxGeometry(0.06, 0.04, d - 0.2),
                    edgeMat
                );
                edge.position.set(x + side[0] * (w/2 - 0.03), 0.15, z + side[1] * (d/2 - 0.03));
                scene.add(edge);
            }
            return mesh;
        }

        // 創建收集物 (旋轉方塊)
        function createCollectible(x, y, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), collectMat);
            mesh.position.set(x, y + 0.5, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // ---- 生成平台 (無限生成式) ----
        const platformList = [];
        const collectibleList = [];
        const gridSize = 6;
        const spacing = 3.8;
        const startZ = -3;

        // 儲存平台位置
        const platPositions = [];

        function generatePlatformGrid(offsetZ) {
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const x = (i - (gridSize-1)/2) * spacing;
                    const z = (j - (gridSize-1)/2) * spacing + offsetZ;
                    // 隨機跳過一些平台增加難度
                    if (Math.random() < 0.15 && !(i === Math.floor(gridSize/2) && j === Math.floor(gridSize/2))) continue;
                    const isGlow = Math.random() < 0.2;
                    const plat = createPlatform(x, z, 2.2, 2.2, isGlow ? 'glow' : 'normal');
                    platformList.push(plat);
                    platPositions.push({ x, z });
                    
                    // 50% 機率生成收集物
                    if (Math.random() < 0.45) {
                        const col = createCollectible(x, 0.3, z);
                        collectibleList.push(col);
                    }
                }
            }
        }

        // 初始生成
        generatePlatformGrid(startZ);
        // 再生成遠處一批
        generatePlatformGrid(startZ - 20);

        // 初始玩家位置
        player.posX = 0;
        player.posZ = 2;
        player.body.position.set(0, player.height, 2);
        camera.position.set(0, player.height, 2);

        // ============================================================
        //  控制 (第一人稱 WASD)
        // ============================================================
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameActive && !gameOver && player.isGrounded) {
                    player.velocityY = player.jumpPower;
                    player.isGrounded = false;
                }
            }
            if (key === 'r' && gameOver) {
                restartGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // 點擊重新開始
        document.getElementById('gameover').addEventListener('click', () => {
            if (gameOver) restartGame();
        });

        // ============================================================
        //  碰撞檢測 (平台與收集物)
        // ============================================================
        function checkPlatformCollision(posX, posZ) {
            const halfSize = 1.0;
            for (let plat of platformList) {
                const dx = Math.abs(posX - plat.position.x);
                const dz = Math.abs(posZ - plat.position.z);
                if (dx < halfSize && dz < halfSize) {
                    return true;
                }
            }
            return false;
        }

        function checkCollectibleCollision(posX, posZ) {
            const dist = 0.6;
            for (let i = collectibleList.length - 1; i >= 0; i--) {
                const col = collectibleList[i];
                const dx = posX - col.position.x;
                const dz = posZ - col.position.z;
                if (Math.sqrt(dx*dx + dz*dz) < dist) {
                    scene.remove(col);
                    collectibleList.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                    return true;
                }
            }
            return false;
        }

        // ============================================================
        //  遊戲重啟
        // ============================================================
        function restartGame() {
            // 清除舊平台和收集物
            platformList.forEach(p => scene.remove(p));
            collectibleList.forEach(c => scene.remove(c));
            platformList.length = 0;
            collectibleList.length = 0;
            platPositions.length = 0;

            // 重置玩家
            player.posX = 0;
            player.posZ = 2;
            player.velocityY = 0;
            player.isGrounded = false;
            player.body.position.set(0, player.height, 2);
            camera.position.set(0, player.height, 2);
            camera.lookAt(0, 0, -5);

            score = 0;
            document.getElementById('score').innerText = '0';
            gameOver = false;
            gameActive = true;
            document.getElementById('gameover').style.display = 'none';

            // 重新生成平台
            generatePlatformGrid(startZ);
            generatePlatformGrid(startZ - 20);
        }

        // ============================================================
        //  遊戲主循環
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive && !gameOver) {
                // ---- 移動 (WASD) ----
                let moveX = 0, moveZ = 0;
                if (keys.w) moveZ -= 1;
                if (keys.s) moveZ += 1;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;

                // 正規化
                const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
                if (len > 0) {
                    moveX /= len;
                    moveZ /= len;
                }

                const speed = player.moveSpeed;
                const newX = player.posX + moveX * speed;
                const newZ = player.posZ + moveZ * speed;

                // 碰撞檢測 (只有當腳下平台存在時才能移動)
                // 簡單版：檢查新位置是否在平台上
                if (checkPlatformCollision(newX, newZ)) {
                    player.posX = newX;
                    player.posZ = newZ;
                } else {
                    // 如果新位置沒有平台，嘗試只移動一個軸
                    if (checkPlatformCollision(newX, player.posZ)) {
                        player.posX = newX;
                    } else if (checkPlatformCollision(player.posX, newZ)) {
                        player.posZ = newZ;
                    }
                }

                // ---- 跳躍物理 ----
                player.velocityY += player.gravity;
                const newY = player.body.position.y + player.velocityY;

                // 檢查是否站在平台上
                const footX = player.posX;
                const footZ = player.posZ;
                const onPlatform = checkPlatformCollision(footX, footZ);

                if (newY <= player.height && onPlatform) {
                    player.body.position.y = player.height;
                    player.velocityY = 0;
                    player.isGrounded = true;
                } else {
                    player.body.position.y = newY;
                    player.isGrounded = false;
                }

                // 更新玩家身體位置
                player.body.position.x = player.posX;
                player.body.position.z = player.posZ;

                // ---- 收集物檢測 ----
                checkCollectibleCollision(player.posX, player.posZ);

                // ---- 掉落檢測 (掉出平台) ----
                if (player.body.position.y < -5) {
                    gameOver = true;
                    gameActive = false;
                    document.getElementById('finalScore').innerText = score;
                    document.getElementById('gameover').style.display = 'block';
                }

                // ---- 相機跟隨 (第一人稱) ----
                camera.position.x = player.posX;
                camera.position.y = player.body.position.y + 0.2;
                camera.position.z = player.posZ;
                // 相機看向前方 (沿Z負方向)
                camera.lookAt(player.posX, player.body.position.y, player.posZ - 10);

                // ---- 收集物旋轉動畫 ----
                collectibleList.forEach((col, idx) => {
                    col.rotation.y += 0.03;
                    col.rotation.x += 0.01;
                });

                // ---- 動態生成新平台 (隨著玩家移動) ----
                // 當玩家接近邊緣時生成新的平台區域
                const threshold = 8;
                const farZ = -20;
                // 檢查最遠的平台Z
                let minZ = 0;
                platformList.forEach(p => {
                    if (p.position.z < minZ) minZ = p.position.z;
                });
                if (player.posZ < -5 && minZ > player.posZ - 25) {
                    // 生成新的平台區域
                    const newOffset = minZ - 10;
                    generatePlatformGrid(newOffset);
                }

                // 移除太遠的平台 (節省效能)
                for (let i = platformList.length - 1; i >= 0; i--) {
                    const p = platformList[i];
                    if (p.position.z > player.posZ + 15) {
                        scene.remove(p);
                        platformList.splice(i, 1);
                    }
                }
                // 移除太遠的收集物
                for (let i = collectibleList.length - 1; i >= 0; i--) {
                    const c = collectibleList[i];
                    if (c.position.z > player.posZ + 15) {
                        scene.remove(c);
                        collectibleList.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // ============================================================
        //  視窗縮放
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        //  啟動
        // ============================================================
        animate();

        console.log('第一人稱平台跑酷已啟動！ WASD移動，空格跳躍，收集金色方塊。');
    </script>
</body>
</html>
