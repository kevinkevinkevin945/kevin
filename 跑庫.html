<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一人稱槍戰 · 手榴彈 & 凌空石</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 24px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 14px;
            align-items: center;
            z-index: 10;
            font-size: 14px;
            user-select: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        #ui .weapon {
            padding: 5px 14px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            font-size: 13px;
        }
        #ui .weapon.active { background: rgba(255,215,0,0.2); border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.15); }
        #ui .weapon:hover { background: rgba(255,255,255,0.1); }
        #ui .weapon kbd { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; margin-right: 4px; font-size: 11px; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.4);
            font-size: 28px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #crosshair::before { content: '+'; font-size: 30px; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            user-select: none;
        }
        #info span { margin-right: 6px; }
        #ammo {
            position: absolute;
            bottom: 100px;
            right: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            font-family: 'Courier New', monospace;
        }
        #grenade-indicator {
            position: absolute;
            bottom: 100px;
            left: 30px;
            color: #ff8844;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,136,68,0.3);
        }
        #health-bar {
            position: absolute;
            bottom: 100px;
            left: 130px;
            width: 150px;
            height: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        #health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8800, #44ff44); border-radius: 10px; transition: width 0.2s; }
        #health-label {
            position: absolute;
            bottom: 116px;
            left: 130px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
            font-weight: bold;
        }
        #cooldown-indicator {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.88);
            padding: 40px 60px;
            border-radius: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,100,100,0.3);
            z-index: 30;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #gameover h2 { font-size: 38px; color: #ff6b6b; margin-bottom: 6px; }
        #gameover .final-score { font-size: 24px; color: #ffd700; margin: 12px 0; }
        #gameover .restart-hint { font-size: 16px; color: #aaa; margin-top: 16px; }
        #pointer-lock-warning {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,200,100,0.8);
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,200,100,0.15);
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        #ability-hint {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            background: rgba(0,0,0,0.4);
            padding: 4px 16px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }
        @media (max-width: 700px) {
            #ui { font-size: 11px; padding: 6px 12px; gap: 6px; bottom: 15px; }
            #ui .weapon { padding: 3px 8px; font-size: 10px; }
            #info { font-size: 13px; padding: 4px 12px; }
            #ammo { font-size: 18px; padding: 4px 12px; bottom: 80px; right: 15px; }
            #grenade-indicator { font-size: 16px; padding: 4px 12px; bottom: 80px; left: 15px; }
            #health-bar { width: 100px; height: 10px; bottom: 80px; left: 100px; }
            #health-label { font-size: 10px; bottom: 94px; left: 100px; }
            #crosshair { font-size: 22px; }
            #crosshair::before { font-size: 24px; }
            #gameover { padding: 24px 20px; width: 80%; }
            #gameover h2 { font-size: 28px; }
            #ability-hint { font-size: 11px; bottom: 140px; }
            #cooldown-indicator { font-size: 12px; bottom: 120px; }
        }
    </style>
</head>
<body>

    <div id="info">🎯 擊殺: <span id="kills">0</span></div>
    <div id="crosshair"></div>
    <div id="health-label">❤️ 生命</div>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="grenade-indicator">💣 手榴彈: ∞</div>
    <div id="ammo">🔫 <span id="ammo-count">30</span> / <span id="ammo-max">30</span></div>
    <div id="ability-hint">[F] 手榴彈 · [Q] 凌空石 (傳送)</div>
    <div id="cooldown-indicator">⏳ 冷卻中...</div>
    <div id="pointer-lock-warning">🖱️ 點擊畫面鎖定滑鼠 · 左鍵射擊</div>
    <div id="ui">
        <div class="weapon active" data-weapon="pistol"><kbd>1</kbd> 手槍</div>
        <div class="weapon" data-weapon="rifle"><kbd>2</kbd> 步槍</div>
        <div class="weapon" data-weapon="shotgun"><kbd>3</kbd> 霰彈槍</div>
        <div class="weapon" data-weapon="sniper"><kbd>4</kbd> 狙擊槍</div>
        <div class="weapon" data-weapon="smg"><kbd>5</kbd> 衝鋒槍</div>
        <div class="weapon" data-weapon="rocket"><kbd>6</kbd> 火箭筒</div>
        <div class="weapon" data-weapon="minigun"><kbd>7</kbd> 火神炮</div>
    </div>
    <div id="gameover">
        <h2>💀 陣亡</h2>
        <div class="final-score">擊殺數: <span id="finalKills">0</span></div>
        <div class="restart-hint">點擊 或 按 <kbd>R</kbd> 重新開始</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        //  場景 / 相機 / 渲染器
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 40, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ============================================================
        //  燈光
        // ============================================================
        const ambient = new THREE.AmbientLight(0x40406b, 0.5);
        scene.add(ambient);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        sunLight.position.set(10, 25, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 60;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.2);
        fill.position.set(-8, 5, 10);
        scene.add(fill);

        // ============================================================
        //  地面
        // ============================================================
        const groundGeo = new THREE.PlaneGeometry(60, 60);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.9,
            metalness: 0.1,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(60, 30, 0x333366, 0x222244);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // ============================================================
        //  武器系統
        // ============================================================
        const weapons = {
            pistol: { name: '手槍', damage: 25, fireRate: 200, ammo: 12, maxAmmo: 12, spread: 0.02, bulletSpeed: 80, auto: false, color: 0xffdd44 },
            rifle: { name: '步槍', damage: 35, fireRate: 100, ammo: 30, maxAmmo: 30, spread: 0.015, bulletSpeed: 100, auto: true, color: 0x44ddff },
            shotgun: { name: '霰彈槍', damage: 12, fireRate: 400, ammo: 8, maxAmmo: 8, spread: 0.12, bulletSpeed: 70, auto: false, color: 0xff8844, pellets: 8 },
            sniper: { name: '狙擊槍', damage: 100, fireRate: 600, ammo: 5, maxAmmo: 5, spread: 0.003, bulletSpeed: 150, auto: false, color: 0x44ff88 },
            smg: { name: '衝鋒槍', damage: 18, fireRate: 60, ammo: 50, maxAmmo: 50, spread: 0.045, bulletSpeed: 75, auto: true, color: 0xff66aa },
            rocket: { name: '火箭筒', damage: 120, fireRate: 800, ammo: 3, maxAmmo: 3, spread: 0.005, bulletSpeed: 40, auto: false, color: 0xff4400, explosive: true },
            minigun: { name: '火神炮', damage: 15, fireRate: 30, ammo: 200, maxAmmo: 200, spread: 0.06, bulletSpeed: 90, auto: true, color: 0x88ff44 },
        };

        let currentWeapon = 'pistol';
        let ammo = {};
        let kills = 0;
        let health = 100;
        let maxHealth = 100;
        let isShooting = false;
        let lastFireTime = 0;
        let gameActive = true;
        let gameOver = false;

        // ============================================================
        //  能力系統：手榴彈 & 凌空石
        // ============================================================
        let grenadeCooldown = 0;
        const GRENADE_COOLDOWN = 2.0; // 秒
        let warpCooldown = 0;
        const WARP_COOLDOWN = 3.0;

        // 手榴彈：投擲後延遲爆炸
        function throwGrenade() {
            if (gameOver || !gameActive) return;
            const now = Date.now() / 1000;
            if (now - grenadeCooldown < GRENADE_COOLDOWN) {
                showCooldown(GRENADE_COOLDOWN - (now - grenadeCooldown));
                return;
            }
            grenadeCooldown = now;

            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(camera.quaternion);
            const origin = camera.position.clone();
            origin.y += 0.3;

            // 手榴彈模型
            const grenadeMat = new THREE.MeshStandardMaterial({
                color: 0x44aa44,
                emissive: 0x224422,
                emissiveIntensity: 0.3,
                roughness: 0.5,
                metalness: 0.3,
            });
            const grenade = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), grenadeMat);
            grenade.position.copy(origin);
            grenade.castShadow = true;
            scene.add(grenade);

            // 彈道
            const velocity = dir.clone().multiplyScalar(20);
            velocity.y += 5; // 拋物線

            const grenadeData = {
                mesh: grenade,
                velocity: velocity,
                life: 1.8, // 延遲爆炸
                isGrenade: true,
            };
            projectiles.push(grenadeData);

            // 視覺提示
            createMuzzleFlash(origin, dir, 0xff8800);
        }

        // 凌空石：丟到哪傳送到哪
        function throwWarpStone() {
            if (gameOver || !gameActive) return;
            const now = Date.now() / 1000;
            if (now - warpCooldown < WARP_COOLDOWN) {
                showCooldown(WARP_COOLDOWN - (now - warpCooldown));
                return;
            }
            warpCooldown = now;

            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(camera.quaternion);
            const origin = camera.position.clone();
            origin.y += 0.3;

            // 凌空石模型 (發光紫色)
            const stoneMat = new THREE.MeshStandardMaterial({
                color: 0xaa44ff,
                emissive: 0x6622aa,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.9,
            });
            const stone = new THREE.Mesh(new THREE.OctahedronGeometry(0.12), stoneMat);
            stone.position.copy(origin);
            stone.castShadow = true;
            scene.add(stone);

            // 拖尾光效
            const trailMat = new THREE.MeshBasicMaterial({
                color: 0xaa44ff,
                transparent: true,
                opacity: 0.3,
            });
            const trail = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), trailMat);
            trail.position.copy(origin);
            scene.add(trail);

            const velocity = dir.clone().multiplyScalar(35);
            const stoneData = {
                mesh: stone,
                trail: trail,
                velocity: velocity,
                life: 1.5,
                isWarp: true,
            };
            projectiles.push(stoneData);

            createMuzzleFlash(origin, dir, 0xaa44ff);
        }

        // 傳送玩家到指定位置
        function warpPlayer(position) {
            // 檢查位置是否安全 (不要傳送到地底)
            if (position.y < 0.5) position.y = 0.5;
            camera.position.copy(position);
            // 閃爍效果
            const flashMat = new THREE.MeshBasicMaterial({
                color: 0xaa44ff,
                transparent: true,
                opacity: 0.3,
            });
            const flash = new THREE.Mesh(new THREE.SphereGeometry(1.5, 12, 12), flashMat);
            flash.position.copy(position);
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 300);
        }

        function showCooldown(time) {
            const el = document.getElementById('cooldown-indicator');
            el.style.display = 'block';
            el.innerText = `⏳ 冷卻中 ${time.toFixed(1)}s`;
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => { el.style.display = 'none'; }, time * 1000);
        }

        // ============================================================
        //  投射物系統 (子彈、手榴彈、凌空石)
        // ============================================================
        const projectiles = [];

        function createBullet(origin, direction, weaponKey) {
            const weapon = weapons[weaponKey];
            const spread = weapon.spread;
            const dir = direction.clone();
            dir.x += (Math.random() - 0.5) * spread;
            dir.y += (Math.random() - 0.5) * spread;
            dir.z += (Math.random() - 0.5) * spread;
            dir.normalize();

            const color = weapon.color || 0xffdd44;
            const bulletMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.6,
            });
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), bulletMat);
            bullet.position.copy(origin);
            bullet.castShadow = true;
            scene.add(bullet);

            const bulletData = {
                mesh: bullet,
                velocity: dir.clone().multiplyScalar(weapon.bulletSpeed || 80),
                damage: weapon.damage || 25,
                life: 3.0,
                weapon: weaponKey,
                isExplosive: weapon.explosive || false,
                isEnemy: false,
            };
            projectiles.push(bulletData);
            return bulletData;
        }

        function createMuzzleFlash(origin, dir, color = 0xffff88) {
            const flashMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.8,
            });
            const flash = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), flashMat);
            flash.position.copy(origin);
            flash.position.add(dir.clone().multiplyScalar(-0.3));
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 50);
        }

        function shoot() {
            if (gameOver || !gameActive) return;
            const now = Date.now();
            const weapon = weapons[currentWeapon];
            if (now - lastFireTime < weapon.fireRate) return;
            if (ammo[currentWeapon] <= 0) return;

            lastFireTime = now;
            ammo[currentWeapon]--;
            updateAmmoUI();

            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(camera.quaternion);
            const origin = camera.position.clone();
            origin.y += 0.1;

            const pellets = weapon.pellets || 1;
            for (let i = 0; i < pellets; i++) {
                createBullet(origin, dir, currentWeapon);
            }
            createMuzzleFlash(origin, dir);
            pitch += 0.005 * (weapon.damage / 25);
        }

        // ============================================================
        //  敵人生成
        // ============================================================
        const enemies = [];

        function spawnEnemy() {
            if (gameOver || !gameActive) return;
            const radius = 20 + Math.random() * 15;
            const angle = Math.random() * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            const enemyMat = new THREE.MeshStandardMaterial({
                color: 0xff4444,
                emissive: new THREE.Color(0x661111),
                emissiveIntensity: 0.3,
                roughness: 0.5,
            });
            const enemy = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), enemyMat);
            enemy.position.set(x, 0.6, z);
            enemy.castShadow = true;
            enemy.receiveShadow = true;
            scene.add(enemy);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
            eye.position.set(0, 0.2, 0.35);
            enemy.add(eye);
            const eye2 = eye.clone();
            eye2.position.x = -0.2;
            enemy.add(eye2);

            const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.4), gunMat);
            gun.position.set(0, 0, 0.4);
            enemy.add(gun);

            const enemyData = {
                mesh: enemy,
                health: 30 + Math.random() * 20,
                maxHealth: 50,
                speed: 1.5 + Math.random() * 1.5,
                attackRange: 8,
                damage: 10,
                lastAttackTime: 0,
            };
            enemies.push(enemyData);
        }

        function killEnemy(index) {
            const enemy = enemies[index];
            if (!enemy) return;
            scene.remove(enemy.mesh);
            enemies.splice(index, 1);
            kills++;
            document.getElementById('kills').innerText = kills;
            if (Math.random() < 0.3) {
                const keys = Object.keys(weapons);
                const wKey = keys[Math.floor(Math.random() * keys.length)];
                ammo[wKey] = Math.min(ammo[wKey] + 5, weapons[wKey].maxAmmo);
                updateAmmoUI();
            }
        }

        function takeDamage(dmg) {
            health -= dmg;
            document.getElementById('health-fill').style.width = (health / maxHealth * 100) + '%';
            if (health <= 0) {
                health = 0;
                gameOver = true;
                gameActive = false;
                document.getElementById('finalKills').innerText = kills;
                document.getElementById('gameover').style.display = 'block';
                if (isPointerLocked) document.exitPointerLock();
            }
        }

        function createExplosion(position, radius = 3, damage = 60) {
            const expMat = new THREE.MeshBasicMaterial({
                color: 0xff4400,
                transparent: true,
                opacity: 0.6,
            });
            const exp = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), expMat);
            exp.position.copy(position);
            scene.add(exp);

            enemies.forEach((enemy, index) => {
                const dist = position.distanceTo(enemy.mesh.position);
                if (dist < radius) {
                    const dmg = damage * (1 - dist / radius);
                    enemy.health -= dmg;
                    if (enemy.health <= 0) killEnemy(index);
                }
            });

            let scale = 0.5;
            const expandInterval = setInterval(() => {
                scale += 0.3;
                exp.scale.set(scale, scale, scale);
                exp.material.opacity -= 0.03;
                if (exp.material.opacity <= 0) {
                    clearInterval(expandInterval);
                    scene.remove(exp);
                }
            }, 30);
        }

        // ============================================================
        //  UI 更新
        // ============================================================
        function updateAmmoUI() {
            const weapon = weapons[currentWeapon];
            document.getElementById('ammo-count').innerText = ammo[currentWeapon] || 0;
            document.getElementById('ammo-max').innerText = weapon.maxAmmo;
        }

        function updateWeaponUI() {
            document.querySelectorAll('.weapon').forEach(el => {
                el.classList.toggle('active', el.dataset.weapon === currentWeapon);
            });
            updateAmmoUI();

        // ============================================================
        //  滑鼠 & 鍵盤控制
        // ============================================================
        let isPointerLocked = false;
        let yaw = 0;
        let pitch = 0;
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('click', () => {
            if (!isPointerLocked && !gameOver) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
            document.getElementById('pointer-lock-warning').style.display = isPointerLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked || gameOver) return;
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            const num = parseInt(e.key);
            if (num >= 1 && num <= 7) {
                const keysList = Object.keys(weapons);
                if (keysList[num - 1]) {
                    currentWeapon = keysList[num - 1];
                    updateWeaponUI();
                }
            }
            if (e.code === 'Space') {
                e.preventDefault();
                const weapon = weapons[currentWeapon];
                ammo[currentWeapon] = weapon.maxAmmo;
                updateAmmoUI();
            }
            if (key === 'f') {
                e.preventDefault();
                throwGrenade();
            }
            if (key === 'q') {
                e.preventDefault();
                throwWarpStone();
            }
            if (key === 'r' && gameOver) {
                restartGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // 射擊
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isShooting = true;
                if (isPointerLocked) {
                    const weapon = weapons[currentWeapon];
                    if (!weapon.auto) shoot();
                }
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) isShooting = false;
        });

        // ============================================================
        //  武器 UI 點擊
        // ============================================================
        document.querySelectorAll('.weapon').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.weapon;
                if (weapons[key]) {
                    currentWeapon = key;
                    updateWeaponUI();
                }
            });
        });

        // ============================================================
        //  遊戲控制

        document.getElementById('gameover').addEventListener('click', () => {
            if (gameOver) restartGame();
        });

        function restartGame() {
            enemies.forEach(e => scene.remove(e.mesh));
            enemies.length = 0;
            projectiles.forEach(p => {
                scene.remove(p.mesh);
                if (p.trail) scene.remove(p.trail);
            });
            projectiles.length = 0;
            health = maxHealth;
            kills = 0;
            gameOver = false;
            gameActive = true;
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('kills').innerText = '0';
            document.getElementById('health-fill').style.width = '100%';
            Object.keys(weapons).forEach(key => { ammo[key] = weapons[key].maxAmmo; });
            currentWeapon = 'pistol';
            updateWeaponUI();
            yaw = 0;
            pitch = 0;
            camera.position.set(0, 1.5, 0);
            grenadeCooldown = 0;
            warpCooldown = 0;

        }
