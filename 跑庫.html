<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台跑酷 · 重製版</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            user-select: none;
        }
        #ui span { margin-right: 4px; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.3);
            font-size: 26px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.5);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.88);
            padding: 40px 60px;
            border-radius: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,100,100,0.3);
            z-index: 30;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #gameover h2 { font-size: 38px; color: #ff6b6b; margin-bottom: 6px; }
        #gameover .final-score { font-size: 24px; color: #ffd700; margin: 12px 0; }
        #gameover .restart-hint { font-size: 16px; color: #aaa; margin-top: 16px; }
        #gameover .restart-hint kbd { background: #2a2a4a; padding: 4px 14px; border-radius: 6px; color: #88ddff; border: 1px solid #4a6a9a; }
        #level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 40px 60px;
            border-radius: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100,255,100,0.3);
            z-index: 30;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #level-complete h2 { font-size: 38px; color: #4caf50; margin-bottom: 6px; }
        #level-complete .next-hint { font-size: 18px; color: #aaa; margin-top: 16px; }
        #level-complete .next-hint kbd { background: #2a2a4a; padding: 4px 14px; border-radius: 6px; color: #88ddff; border: 1px solid #4a6a9a; }
        #pointer-lock-warning {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,200,100,0.8);
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,200,100,0.15);
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        @media (max-width: 600px) {
            #ui { font-size: 13px; padding: 4px 10px; gap: 8px; }
            #controls-hint { font-size: 10px; padding: 4px 12px; white-space: normal; }
            #gameover { padding: 24px 20px; width: 80%; }
            #gameover h2 { font-size: 28px; }
            #level-complete { padding: 24px 20px; width: 80%; }
            #level-complete h2 { font-size: 28px; }
            #pointer-lock-warning { font-size: 11px; padding: 4px 12px; bottom: 70px; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <span>🏆 <span id="score">0</span></span>
        <span>📍 關卡 <span id="level">1</span></span>
        <span>🔹 <span id="collectibles">0</span> / <span id="totalCollectibles">0</span></span>
    </div>
    <div id="crosshair">+</div>
    <div id="controls-hint">W A S D 移動 · 空格跳躍 · 滑鼠拖曳轉視角</div>
    <div id="pointer-lock-warning">🖱️ 點擊畫面鎖定滑鼠</div>
    <div id="gameover">
        <h2>💥 掉落！</h2>
        <div class="final-score">得分: <span id="finalScore">0</span></div>
        <div class="restart-hint">點擊 或 按 <kbd>R</kbd> 重新開始</div>
    </div>
    <div id="level-complete">
        <h2>🎉 關卡完成！</h2>
        <div class="next-hint">點擊 或 按 <kbd>Enter</kbd> 下一關</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        //  場景 / 相機 / 渲染器
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 30, 60);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 80);
        camera.position.set(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ============================================================
        //  燈光
        // ============================================================
        const ambient = new THREE.AmbientLight(0x40406b, 0.6);
        scene.add(ambient);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(10, 25, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
        fill.position.set(-8, 5, 10);
        scene.add(fill);

        // ============================================================
        //  玩家
        // ============================================================
        const playerHeight = 0.5;
        const playerRadius = 0.25;
        const playerBody = new THREE.Mesh(
            new THREE.SphereGeometry(playerRadius, 8, 8),
            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
        );
        playerBody.position.set(0, playerHeight, 0);
        scene.add(playerBody);

        // 玩家視覺指示器（腳下光圈）
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x4fc3f7,
            emissive: new THREE.Color(0x0a4a7a),
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.4,
        });
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.4, 16), ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(0, 0.02, 0);
        scene.add(ring);

        const player = {
            body: playerBody,
            ring: ring,
            velocityY: 0,
            gravity: -0.035,
            jumpPower: 0.45,
            isGrounded: false,
            moveSpeed: 0.16,
            posX: 0,
            posZ: 0,
            height: playerHeight,
            checkpointX: 0,
            checkpointZ: 0,
            yaw: 0,
            pitch: 0,
        };

        // ============================================================
        //  滑鼠控制
        // ============================================================
        const pointerLockWarning = document.getElementById('pointer-lock-warning');
        let isPointerLocked = false;

        document.addEventListener('click', () => {
            if (!isPointerLocked && !gameOver && !levelComplete) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
            pointerLockWarning.style.display = isPointerLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked || gameOver || levelComplete || !gameActive) return;
            const sensitivity = 0.002;
            player.yaw -= e.movementX * sensitivity;
            player.pitch -= e.movementY * sensitivity;
            player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
        });

        // ============================================================
        //  關卡系統 (重新設計，更簡單直接)
        // ============================================================
        let currentLevel = 1;
        let score = 0;
        let collectiblesCollected = 0;
        let totalCollectibles = 0;
        let gameActive = true;
        let gameOver = false;
        let levelComplete = false;

        const platformList = [];
        const collectibleList = [];
        const checkpointList = [];

        // 材質
        const platMat = new THREE.MeshStandardMaterial({
            color: 0x2a2a5a,
            roughness: 0.7,
            metalness: 0.2,
            emissive: new THREE.Color(0x0a0a2a),
            emissiveIntensity: 0.2
        });
        const platMatGlow = new THREE.MeshStandardMaterial({
            color: 0x4a7a9a,
            roughness: 0.4,
            metalness: 0.3,
            emissive: new THREE.Color(0x1a4a7a),
            emissiveIntensity: 0.4
        });
        const collectMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            emissive: new THREE.Color(0x886600),
            emissiveIntensity: 0.6,
            roughness: 0.2,
            metalness: 0.3
        });
        const checkpointMat = new THREE.MeshStandardMaterial({
            color: 0x00ff88,
            emissive: new THREE.Color(0x00aa66),
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.8
        });

        function createPlatform(x, z, w, d, colorType = 'normal') {
            const mat = colorType === 'glow' ? platMatGlow : platMat;
            const geo = new THREE.BoxGeometry(w, 0.3, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            // 邊緣發光條
            const edgeMat = new THREE.MeshStandardMaterial({
                color: colorType === 'glow' ? 0x6a9acf : 0x3a4a6a,
                emissive: colorType === 'glow' ? new THREE.Color(0x2a5a8a) : new THREE.Color(0x1a2a4a),
                emissiveIntensity: 0.3
            });
            for (let side of [
                    [1, 0],
                    [-1, 0],
                    [0, 1],
                    [0, -1]
                ]) {
                const edge = new THREE.Mesh(
                    new THREE.BoxGeometry(0.06, 0.04, d - 0.2),
                    edgeMat
                );
                edge.position.set(x + side[0] * (w / 2 - 0.03), 0.15, z + side[1] * (d / 2 - 0.03));
                scene.add(edge);
            }
            return mesh;
        }

        function createCollectible(x, y, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), collectMat);
            mesh.position.set(x, y + 0.5, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function createCheckpoint(x, y, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 0.8), checkpointMat);
            mesh.position.set(x, y + 0.04, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
            // 光柱
            const pillarMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.12 });
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.5, 8), pillarMat);
            pillar.position.set(x, y + 1.3, z);
            scene.add(pillar);
            return mesh;
        }

        // ----- 生成關卡 (更簡潔的設計) -----
        function generateLevel(level) {
            // 清除
            platformList.forEach(p => scene.remove(p));
            collectibleList.forEach(c => scene.remove(c));
            checkpointList.forEach(c => scene.remove(c));
            platformList.length = 0;
            collectibleList.length = 0;
            checkpointList.length = 0;
            collectiblesCollected = 0;
            totalCollectibles = 0;
            levelComplete = false;
            document.getElementById('level-complete').style.display = 'none';

            const cols = 4 + level;
            const rows = 4 + level;
            const spacing = 3.2;
            const startX = -(cols - 1) * spacing / 2;
            const startZ = -(rows - 1) * spacing / 2 + 2;

            // 生成網格平台
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = startX + i * spacing;
                    const z = startZ + j * spacing;

                    // 邊緣跳過一些平台增加挑戰
                    const isEdge = (i === 0 || i === cols - 1 || j === 0 || j === rows - 1);
                    if (isEdge && Math.random() < 0.25) continue;

                    // 中心區域一定是平台
                    const isCenter = (i === Math.floor(cols / 2) && j === Math.floor(rows / 2));

                    // 隨機決定平台大小
                    const w = 1.6 + Math.random() * 0.6;
                    const d = 1.6 + Math.random() * 0.6;
                    const isGlow = isCenter || Math.random() < 0.15;

                    const plat = createPlatform(x, z, w, d, isGlow ? 'glow' : 'normal');
                    platformList.push(plat);

                    // 中心放記錄點
                    if (isCenter) {
                        const cp = createCheckpoint(x, 0.3, z);
                        checkpointList.push(cp);
                        player.checkpointX = x;
                        player.checkpointZ = z;
                    }

                    // 放收集物 (邊緣較少)
                    const collectChance = isEdge ? 0.15 : 0.35 + level * 0.02;
                    if (Math.random() < collectChance && !isCenter) {
                        const col = createCollectible(x, 0.3, z);
                        collectibleList.push(col);
                        totalCollectibles++;
                    }
                }
            }

            // 額外浮空平台 (增加垂直變化)
            for (let i = 0; i < level; i++) {
                const x = (Math.random() - 0.5) * (cols * spacing * 0.7);
                const z = (Math.random() - 0.5) * (rows * spacing * 0.7) + 2;
                let overlap = false;
                for (let p of platformList) {
                    if (Math.abs(p.position.x - x) < 2.0 && Math.abs(p.position.z - z) < 2.0) { overlap = true; break; }
                }
                if (!overlap) {
                    const plat = createPlatform(x, z, 1.6, 1.6, 'glow');
                    platformList.push(plat);
                    if (Math.random() < 0.5) {
                        const col = createCollectible(x, 0.3, z);
                        collectibleList.push(col);
                        totalCollectibles++;
                    }
                }
            }

            // 更新 UI
            document.getElementById('level').innerText = level;
            document.getElementById('totalCollectibles').innerText = totalCollectibles;
            document.getElementById('collectibles').innerText = '0';
            document.getElementById('score').innerText = score;

            // 重置玩家位置
            player.posX = 0;
            player.posZ = 2;
            player.body.position.set(0, player.height, 2);
            player.velocityY = 0;
            player.isGrounded = false;
            player.yaw = 0;
            player.pitch = 0;
            player.checkpointX = 0;
            player.checkpointZ = 2;
        }

        // ============================================================
        //  控制
        // ============================================================
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameActive && !gameOver && !levelComplete && player.isGrounded) {
                    player.velocityY = player.jumpPower;
                    player.isGrounded = false;
                }
            }
            if (key === 'r' && gameOver) {
                restartGame();
            }
            if (e.key === 'Enter' && levelComplete) {
                nextLevel();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // ============================================================
        //  碰撞檢測 (優化版)
        // ============================================================
        function getPlatformAt(posX, posZ) {
            for (let plat of platformList) {
                const halfW = plat.geometry.parameters.width / 2;
                const halfD = plat.geometry.parameters.depth / 2;
                const dx = Math.abs(posX - plat.position.x);
                const dz = Math.abs(posZ - plat.position.z);
                if (dx < halfW - 0.05 && dz < halfD - 0.05) {
                    return plat;
                }
            }
            return null;
        }

        function isOnPlatform(posX, posZ) {
            return getPlatformAt(posX, posZ) !== null;
        }

        function checkCollectibleCollision(posX, posZ) {
            const dist = 0.5;
            for (let i = collectibleList.length - 1; i >= 0; i--) {
                const col = collectibleList[i];
                const dx = posX - col.position.x;
                const dz = posZ - col.position.z;
                if (Math.sqrt(dx * dx + dz * dz) < dist) {
                    scene.remove(col);
                    collectibleList.splice(i, 1);
                    collectiblesCollected++;
                    score += 10;
                    document.getElementById('collectibles').innerText = collectiblesCollected;
                    document.getElementById('score').innerText = score;
                    if (collectiblesCollected >= totalCollectibles && totalCollectibles > 0) {
                        levelComplete = true;
                        document.getElementById('level-complete').style.display = 'block';
                    }
                    return true;
                }
            }
            return false;
        }

        function checkCheckpointCollision(posX, posZ) {
            const dist = 0.8;
            for (let cp of checkpointList) {
                const dx = posX - cp.position.x;
                const dz = posZ - cp.position.z;
                if (Math.sqrt(dx * dx + dz * dz) < dist) {
                    player.checkpointX = cp.position.x;
                    player.checkpointZ = cp.position.z;
                    cp.material.emissiveIntensity = 1.5;
                    setTimeout(() => { cp.material.emissiveIntensity = 0.5; }, 300);
                    return true;
                }
            }
            return false;
        }

        // ============================================================
        //  遊戲控制
        // ============================================================
        function restartGame() {
            gameOver = false;
            gameActive = true;
            score = 0;
            currentLevel = 1;
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('level-complete').style.display = 'none';
            generateLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('level-complete').style.display = 'none';
            levelComplete = false;
            generateLevel(currentLevel);
        }

        document.getElementById('gameover').addEventListener('click', () => {
            if (gameOver) restartGame();
        });
        document.getElementById('level-complete').addEventListener('click', () => {
            if (levelComplete) nextLevel();
        });

        // ============================================================
        //  遊戲主循環
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive && !gameOver && !levelComplete) {
                // ---- 移動 ----
                let moveX = 0,
                    moveZ = 0;
                if (keys.w) moveZ -= 1;
                if (keys.s) moveZ += 1;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;

                const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                if (len > 0) { moveX /= len;
                    moveZ /= len; }

                const sin = Math.sin(player.yaw);
                const cos = Math.cos(player.yaw);
                const worldMoveX = moveX * cos - moveZ * sin;
                const worldMoveZ = moveX * sin + moveZ * cos;

                const speed = player.moveSpeed;
                const newX = player.posX + worldMoveX * speed;
                const newZ = player.posZ + worldMoveZ * speed;

                // 移動檢測
                if (isOnPlatform(newX, newZ)) {
                    player.posX = newX;
                    player.posZ = newZ;
                } else {
                    if (isOnPlatform(newX, player.posZ)) player.posX = newX;
                    else if (isOnPlatform(player.posX, newZ)) player.posZ = newZ;
                }

                // ---- 跳躍 ----
                player.velocityY += player.gravity;
                const newY = player.body.position.y + player.velocityY;

                if (newY <= player.height && isOnPlatform(player.posX, player.posZ)) {
                    player.body.position.y = player.height;
                    player.velocityY = 0;
                    player.isGrounded = true;
                } else {
                    player.body.position.y = newY;
                    player.isGrounded = false;
                }

                player.body.position.x = player.posX;
                player.body.position.z = player.posZ;
                player.ring.position.x = player.posX;
                player.ring.position.z = player.posZ;

                // ---- 收集物檢測 ----
                checkCollectibleCollision(player.posX, player.posZ);
                checkCheckpointCollision(player.posX, player.posZ);

                // ---- 掉落 ----
                if (player.body.position.y < -8) {
                    player.posX = player.checkpointX;
                    player.posZ = player.checkpointZ;
                    player.body.position.set(player.checkpointX, player.height, player.checkpointZ);
                    player.velocityY = 0;
                    player.isGrounded = false;
                    score = Math.max(0, score - 5);
                    document.getElementById('score').innerText = score;
                }

                // ---- 相機 ----
                const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
                camera.position.set(player.posX, player.body.position.y + 0.2, player.posZ);

                // ---- 收集物動畫 ----
                collectibleList.forEach(col => {
                    col.rotation.y += 0.04;
                    col.rotation.x += 0.015;
                });
            }

            renderer.render(scene, camera);
        }

        // ============================================================
        //  視窗縮放
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        //  啟動
        // ============================================================
        generateLevel(1);
        animate();
        pointerLockWarning.style.display = 'block';
        console.log('平台跑酷重製版已啟動！點擊畫面鎖定滑鼠。');
    </script>
</body>
</html>
