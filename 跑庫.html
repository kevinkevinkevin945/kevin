<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Parkour</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    background:
        radial-gradient(circle at center, rgba(30,60,100,.55), rgba(0,0,0,.95));
    text-align: center;
}

#menu h1 {
    font-size: 60px;
    margin: 0 0 10px;
    letter-spacing: 5px;
}

#menu p {
    font-size: 18px;
    opacity: .85;
}

#startBtn {
    margin-top: 25px;
    padding: 15px 45px;
    border: 0;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
    background: white;
    color: #111;
}

#startBtn:hover {
    transform: scale(1.05);
}

#hud {
    position: fixed;
    left: 20px;
    top: 20px;
    z-index: 5;
    color: white;
    font-size: 18px;
    line-height: 1.7;
    text-shadow: 2px 2px 4px #000;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    z-index: 4;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
    box-shadow: 0 0 3px #000;
}

#crosshair::before {
    width: 12px;
    height: 2px;
    top: 5px;
    left: 0;
}

#crosshair::after {
    width: 2px;
    height: 12px;
    left: 5px;
    top: 0;
}

#message {
    position: fixed;
    z-index: 6;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 40px;
    font-weight: bold;
    text-shadow: 3px 3px 6px #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
}

#help {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 5;
    color: white;
    opacity: .75;
    font-size: 14px;
    text-align: right;
    text-shadow: 2px 2px 3px #000;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="menu">
    <h1>3D PARKOUR</h1>
    <p>第一人稱 · 平台跑酷 · Checkpoint · 多關卡</p>
    <p>WASD 移動　SPACE 跳躍　滑鼠控制視角</p>
    <button id="startBtn">開始遊戲</button>
</div>

<div id="hud">
    <div>關卡：<span id="levelText">1</span> / 3</div>
    <div>時間：<span id="timeText">0.00</span>s</div>
    <div>Checkpoint：<span id="checkpointText">起點</span></div>
</div>

<div id="crosshair"></div>
<div id="message"></div>

<div id="help">
    WASD：移動<br>
    SPACE：跳躍<br>
    R：回到 Checkpoint<br>
    ESC：解除滑鼠鎖定
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js";


/* =========================================================
   基本設定
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    40,
    180
);


const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


/* =========================================================
   光源
========================================================= */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x446677,
    1.5
);

scene.add(ambient);


const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(30, 50, 20);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


/* =========================================================
   第一人稱控制
========================================================= */

const controls = new PointerLockControls(
    camera,
    document.body
);

scene.add(controls.getObject());


/* =========================================================
   遊戲變數
========================================================= */

const keys = {};

let velocity = new THREE.Vector3();

let canJump = false;

let playerHeight = 1.7;

let gravity = 24;

let moveSpeed = 9;

let jumpPower = 9;

let currentLevel = 0;

let startTime = 0;

let levelTime = 0;

let playing = false;

let checkpoint = new THREE.Vector3();

let checkpointName = "起點";

let platforms = [];

let checkpoints = [];

let goal = null;

let hazards = [];

let levelObjects = [];


/* =========================================================
   UI
========================================================= */

const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");

const levelText = document.getElementById("levelText");
const timeText = document.getElementById("timeText");
const checkpointText = document.getElementById("checkpointText");

const message = document.getElementById("message");


/* =========================================================
   WASD
========================================================= */

document.addEventListener("keydown", e => {

    keys[e.code] = true;

    if (e.code === "Space" && canJump && playing) {

        velocity.y = jumpPower;

        canJump = false;
    }

    if (e.code === "KeyR" && playing) {

        respawn();
    }
});


document.addEventListener("keyup", e => {

    keys[e.code] = false;

});


/* =========================================================
   開始遊戲
========================================================= */

startBtn.addEventListener("click", () => {

    menu.style.display = "none";

    controls.lock();

    startGame();

});


controls.addEventListener("lock", () => {

    if (!playing) {

        playing = true;

        startTime = performance.now();
    }

});


controls.addEventListener("unlock", () => {

});


/* =========================================================
   平台建立
========================================================= */

function createPlatform(
    x,
    y,
    z,
    width,
    height,
    depth,
    type = "normal"
) {

    let color = 0x4b6584;

    if (type === "start")
        color = 0x2ecc71;

    if (type === "checkpoint")
        color = 0xf1c40f;

    if (type === "goal")
        color = 0xe74c3c;

    if (type === "moving")
        color = 0x9b59b6;

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color,
            roughness: .75
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    const obj = {
        mesh,
        width,
        height,
        depth,
        type,
        startX: x,
        startY: y,
        startZ: z,
        moving: type === "moving"
    };

    platforms.push(obj);
    levelObjects.push(mesh);

    return obj;
}


/* =========================================================
   Checkpoint
========================================================= */

function createCheckpoint(
    x,
    y,
    z,
    name
) {

    const group = new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );


    const poleGeometry =
        new THREE.CylinderGeometry(
            .08,
            .08,
            3,
            12
        );

    const poleMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });

    const pole =
        new THREE.Mesh(
            poleGeometry,
            poleMaterial
        );

    pole.position.y = 1.5;

    group.add(pole);


    const flagGeometry =
        new THREE.PlaneGeometry(
            1.3,
            .8
        );

    const flagMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffd32a,
            side: THREE.DoubleSide
        });

    const flag =
        new THREE.Mesh(
            flagGeometry,
            flagMaterial
        );

    flag.position.set(
        .65,
        2.5,
        0
    );

    group.add(flag);

    scene.add(group);

    checkpoints.push({
        x,
        y,
        z,
        name,
        group
    });

    levelObjects.push(group);
}


/* =========================================================
   終點
========================================================= */

function createGoal(x, y, z) {

    const geometry =
        new THREE.TorusGeometry(
            1.4,
            .18,
            12,
            40
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xff3333,
            emissive: 0x550000
        });

    goal =
        new THREE.Mesh(
            geometry,
            material
        );

    goal.position.set(
        x,
        y + 2,
        z
    );

    goal.rotation.x =
        Math.PI / 2;

    scene.add(goal);

    levelObjects.push(goal);
}


/* =========================================================
   危險區
========================================================= */

function createHazard(
    x,
    y,
    z,
    width,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            .2,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xff1744,
            emissive: 0x330000
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);

    hazards.push(mesh);

    levelObjects.push(mesh);
}


/* =========================================================
   地圖資料
========================================================= */

const levels = [

    /* =========================
       LEVEL 1
    ========================= */

    {
        start: [0, 3, 0],

        platforms: [

            [0, 0, 0, 10, 1, 10, "start"],

            [0, 1, -8, 5, 1, 5, "normal"],

            [4, 3, -15, 5, 1, 5, "normal"],

            [-2, 5, -22, 5, 1, 5, "normal"],

            [5, 7, -29, 5, 1, 5, "checkpoint"],

            [0, 9, -38, 5, 1, 5, "normal"],

            [-5, 11, -46, 5, 1, 5, "goal"]

        ],

        checkpoints: [
            [5, 8, -29, "Checkpoint 1"]
        ],

        goal: [-5, 11, -46]
    },


    /* =========================
       LEVEL 2
    ========================= */

    {
        start: [0, 4, 0],

        platforms: [

            [0, 0, 0, 8, 1, 8, "start"],

            [-5, 2, -8, 4, 1, 4, "normal"],

            [4, 4, -14, 4, 1, 4, "normal"],

            [-4, 6, -20, 4, 1, 4, "checkpoint"],

            [5, 8, -27, 4, 1, 4, "normal"],

            [-5, 10, -34, 4, 1, 4, "normal"],

            [4, 12, -41, 4, 1, 4, "checkpoint"],

            [0, 14, -49, 5, 1, 5, "goal"]

        ],

        checkpoints: [

            [-4, 7, -20, "Checkpoint 1"],

            [4, 13, -41, "Checkpoint 2"]

        ],

        goal: [0, 14, -49]
    },


    /* =========================
       LEVEL 3
    ========================= */

    {
        start: [0, 5, 0],

        platforms: [

            [0, 0, 0, 8, 1, 8, "start"],

            [0, 2, -8, 3, 1, 3, "normal"],

            [6, 4, -14, 3, 1, 3, "normal"],

            [-6, 6, -20, 3, 1, 3, "checkpoint"],

            [5, 8, -27, 3, 1, 3, "moving"],

            [-5, 10, -34, 3, 1, 3, "normal"],

            [6, 12, -41, 3, 1, 3, "checkpoint"],

            [-6, 14, -48, 3, 1, 3, "moving"],

            [0, 17, -57, 5, 1, 5, "goal"]

        ],

        checkpoints: [

            [-6, 7, -20, "Checkpoint 1"],

            [6, 13, -41, "Checkpoint 2"]

        ],

        goal: [0, 17, -57]
    }

];


/* =========================================================
   清除關卡
========================================================= */

function clearLevel() {

    for (const obj of levelObjects) {

        scene.remove(obj);
    }

    platforms = [];
    checkpoints = [];
    hazards = [];
    levelObjects = [];
    goal = null;
}


/* =========================================================
   建立關卡
========================================================= */

function loadLevel(index) {

    clearLevel();

    const data = levels[index];

    currentLevel = index;

    levelText.textContent =
        index + 1;


    /* 平台 */

    for (const p of data.platforms) {

        createPlatform(...p);
    }


    /* Checkpoint */

    for (const cp of data.checkpoints) {

        createCheckpoint(...cp);
    }


    /* 終點 */

    createGoal(...data.goal);


    /* 出發位置 */

    checkpoint.set(
        data.start[0],
        data.start[1],
        data.start[2]
    );

    checkpointName = "起點";

    checkpointText.textContent =
        checkpointName;


    controls.getObject().position.set(
        data.start[0],
        data.start[1],
        data.start[2]
    );


    velocity.set(0, 0, 0);

    startTime = performance.now();
}


/* =========================================================
   開始遊戲
========================================================= */

function startGame() {

    loadLevel(0);

}


/* =========================================================
   Respawn
========================================================= */

function respawn() {

    controls.getObject().position.copy(
        checkpoint
    );

    velocity.set(
        0,
        0,
        0
    );
}


/* =========================================================
   碰撞檢查
========================================================= */

function checkPlatformCollision() {

    const player =
        controls.getObject();

    const px =
        player.position.x;

    const py =
        player.position.y;

    const pz =
        player.position.z;

    const radius = .35;

    let standing = false;


    for (const p of platforms) {

        const m = p.mesh;

        const top =
            m.position.y +
            p.height / 2;

        const left =
            m.position.x -
            p.width / 2;

        const right =
            m.position.x +
            p.width / 2;

        const front =
            m.position.z -
            p.depth / 2;

        const back =
            m.position.z +
            p.depth / 2;


        const insideX =
            px > left - radius &&
            px < right + radius;

        const insideZ =
            pz > front - radius &&
            pz < back + radius;


        if (
            insideX &&
            insideZ &&
            py >= top &&
            py <= top + 1.2 &&
            velocity.y <= 0
        ) {

            player.position.y =
                top + playerHeight;

            velocity.y = 0;

            standing = true;
        }
    }

    canJump = standing;
}


/* =========================================================
   Checkpoint 碰撞
========================================================= */

function checkCheckpoints() {

    const player =
        controls.getObject();

    for (const cp of checkpoints) {

        const distance =
            player.position.distanceTo(
                new THREE.Vector3(
                    cp.x,
                    cp.y,
                    cp.z
                )
            );

        if (distance < 2.5) {

            checkpoint.set(
                cp.x,
                cp.y,
                cp.z
            );

            checkpointName =
                cp.name;

            checkpointText.textContent =
                checkpointName;
        }
    }
}


/* =========================================================
   終點
========================================================= */

function checkGoal() {

    if (!goal) return;

    const player =
        controls.getObject();

    const distance =
        player.position.distanceTo(
            goal.position
        );

    if (distance < 2.5) {

        nextLevel();
    }
}


/* =========================================================
   下一關
========================================================= */

function nextLevel() {

    if (currentLevel >= levels.length - 1) {

        playing = false;

        showMessage(
            "🏆 全部關卡完成！"
        );

        setTimeout(() => {

            loadLevel(0);

            playing = true;

        }, 2500);

        return;
    }


    playing = false;

    showMessage(
        `✔ 第 ${currentLevel + 1} 關完成！`
    );


    setTimeout(() => {

        loadLevel(
            currentLevel + 1
        );

        playing = true;

    }, 1500);
}


/* =========================================================
   顯示訊息
========================================================= */

function showMessage(text) {

    message.textContent = text;

    message.style.opacity = 1;

    setTimeout(() => {

        message.style.opacity = 0;

    }, 1200);
}


/* =========================================================
   移動
========================================================= */

function updateMovement(delta) {

    if (!playing) return;


    const player =
        controls.getObject();


    let forward = 0;
    let right = 0;


    if (keys["KeyW"])
        forward += 1;

    if (keys["KeyS"])
        forward -= 1;

    if (keys["KeyD"])
        right += 1;

    if (keys["KeyA"])
        right -= 1;


    const direction =
        new THREE.Vector3(
            right,
            0,
            -forward
        );


    if (direction.lengthSq() > 0) {

        direction.normalize();

        const speed =
            moveSpeed * delta;

        controls.moveRight(
            direction.x * speed
        );

        controls.moveForward(
            direction.z * speed
        );
    }


    /* 重力 */

    velocity.y -=
        gravity * delta;

    player.position.y +=
        velocity.y * delta;


    checkPlatformCollision();


    /* 掉出地圖 */

    if (
        player.position.y < -30
    ) {

        respawn();

        showMessage(
            "↩ 回到 Checkpoint"
        );
    }


    checkCheckpoints();

    checkGoal();
}


/* =========================================================
   移動平台
========================================================= */

function updateMovingPlatforms(time) {

    for (const p of platforms) {

        if (!p.moving) continue;

        p.mesh.position.x =
            p.startX +
            Math.sin(time * .0015) * 4;

    }
}


/* =========================================================
   UI 更新
========================================================= */

function updateUI() {

    if (!playing) return;

    levelTime =
        (performance.now() - startTime) /
        1000;

    timeText.textContent =
        levelTime.toFixed(2);
}


/* =========================================================
   動畫
========================================================= */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    const time =
        performance.now();


    updateMovement(delta);

    updateMovingPlatforms(time);

    updateUI();


    if (goal) {

        goal.rotation.z +=
            delta * 2;

        goal.rotation.y +=
            delta;
    }


    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   視窗大小
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
