<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Parkour</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    background:
        radial-gradient(circle at center,
        rgba(30,60,100,.55),
        rgba(0,0,0,.96));
    text-align: center;
}

#menu h1 {
    font-size: 60px;
    margin: 0 0 15px;
    letter-spacing: 5px;
}

#menu p {
    font-size: 18px;
    opacity: .9;
}

#startBtn {
    margin-top: 25px;
    padding: 15px 45px;
    border: 0;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
    background: white;
    color: #111;
}

#startBtn:hover {
    transform: scale(1.05);
}

#hud {
    position: fixed;
    left: 20px;
    top: 20px;
    z-index: 20;
    color: white;
    font-size: 18px;
    line-height: 1.7;
    text-shadow: 2px 2px 4px #000;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
    box-shadow: 0 0 3px #000;
}

#crosshair::before {
    width: 12px;
    height: 2px;
    top: 5px;
}

#crosshair::after {
    width: 2px;
    height: 12px;
    left: 5px;
}

#message {
    position: fixed;
    z-index: 30;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 40px;
    font-weight: bold;
    text-shadow: 3px 3px 6px #000;
    pointer-events: none;
    opacity: 0;
}

#pause {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    background: rgba(0,0,0,.45);
    font-size: 30px;
    text-align: center;
}

#help {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    color: white;
    opacity: .8;
    font-size: 14px;
    text-align: right;
    text-shadow: 2px 2px 3px #000;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="menu">

    <h1>3D PARKOUR</h1>

    <p>第一人稱 · 平台跑酷 · Checkpoint · 3 關卡</p>

    <p>
        WASD 移動　
        SPACE 跳躍　
        滑鼠控制視角
    </p>

    <button id="startBtn">
        開始遊戲
    </button>

</div>

<div id="hud">

    <div>
        關卡：
        <span id="levelText">1</span> / 3
    </div>

    <div>
        時間：
        <span id="timeText">0.00</span>s
    </div>

    <div>
        Checkpoint：
        <span id="checkpointText">起點</span>
    </div>

</div>

<div id="crosshair"></div>

<div id="message"></div>

<div id="pause">
    <div>
        遊戲暫停
        <br>
        <small>點一下畫面繼續</small>
    </div>
</div>

<div id="help">

    WASD：移動<br>
    SPACE：跳躍<br>
    R：回到 Checkpoint<br>
    ESC：暫停

</div>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js";


/* =========================
   場景
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        40,
        180
    );


/* =========================
   相機
========================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        500
    );


/* =========================
   Renderer
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =========================
   光源
========================= */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x446677,
        1.5
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    30,
    50,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   第一人稱
========================= */

const controls =
    new PointerLockControls(
        camera,
        document.body
    );

scene.add(
    controls.object
);


/* =========================
   遊戲設定
========================= */

const PLAYER_HEIGHT = 1.7;

const GRAVITY = 24;

const MOVE_SPEED = 9;

const JUMP_POWER = 9;

let velocityY = 0;

let canJump = false;

let playing = false;

let currentLevel = 0;

let startTime = 0;

let checkpoint =
    new THREE.Vector3();

let checkpointName =
    "起點";

let platforms = [];

let checkpoints = [];

let levelObjects = [];

let goal = null;


/* =========================
   UI
========================= */

const menu =
    document.getElementById(
        "menu"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const pause =
    document.getElementById(
        "pause"
    );

const message =
    document.getElementById(
        "message"
    );

const levelText =
    document.getElementById(
        "levelText"
    );

const timeText =
    document.getElementById(
        "timeText"
    );

const checkpointText =
    document.getElementById(
        "checkpointText"
    );


/* =========================
   按鍵
========================= */

const keys = {};

document.addEventListener(
    "keydown",
    function(e) {

        keys[e.code] = true;

        if (
            e.code === "Space" &&
            canJump &&
            playing &&
            controls.isLocked
        ) {

            velocityY =
                JUMP_POWER;

            canJump = false;

            e.preventDefault();
        }


        if (
            e.code === "KeyR" &&
            playing
        ) {

            respawn();

            showMessage(
                "↩ 回到 Checkpoint"
            );
        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[e.code] = false;

    }
);


/* =========================
   關卡
========================= */

const levels = [

    {

        start: [
            0,
            3,
            0
        ],

        platforms: [

            [0,0,0,10,1,10,"start"],

            [0,1,-8,5,1,5,"normal"],

            [4,3,-15,5,1,5,"normal"],

            [-2,5,-22,5,1,5,"normal"],

            [5,7,-29,5,1,5,"checkpoint"],

            [0,9,-38,5,1,5,"normal"],

            [-5,11,-46,5,1,5,"goal"]

        ],

        checkpoints: [

            [
                5,
                8,
                -29,
                "Checkpoint 1"
            ]

        ],

        goal: [
            -5,
            11,
            -46
        ]

    },


    {

        start: [
            0,
            4,
            0
        ],

        platforms: [

            [0,0,0,8,1,8,"start"],

            [-5,2,-8,4,1,4,"normal"],

            [4,4,-14,4,1,4,"normal"],

            [-4,6,-20,4,1,4,"checkpoint"],

            [5,8,-27,4,1,4,"normal"],

            [-5,10,-34,4,1,4,"normal"],

            [4,12,-41,4,1,4,"checkpoint"],

            [0,14,-49,5,1,5,"goal"]

        ],

        checkpoints: [

            [
                -4,
                7,
                -20,
                "Checkpoint 1"
            ],

            [
                4,
                13,
                -41,
                "Checkpoint 2"
            ]

        ],

        goal: [
            0,
            14,
            -49
        ]

    },


    {

        start: [
            0,
            5,
            0
        ],

        platforms: [

            [0,0,0,8,1,8,"start"],

            [0,2,-8,3,1,3,"normal"],

            [6,4,-14,3,1,3,"normal"],

            [-6,6,-20,3,1,3,"checkpoint"],

            [5,8,-27,3,1,3,"moving"],

            [-5,10,-34,3,1,3,"normal"],

            [6,12,-41,3,1,3,"checkpoint"],

            [-6,14,-48,3,1,3,"moving"],

            [0,17,-57,5,1,5,"goal"]

        ],

        checkpoints: [

            [
                -6,
                7,
                -20,
                "Checkpoint 1"
            ],

            [
                6,
                13,
                -41,
                "Checkpoint 2"
            ]

        ],

        goal: [
            0,
            17,
            -57
        ]

    }

];


/* =========================
   建立平台
========================= */

function createPlatform(
    x,
    y,
    z,
    width,
    height,
    depth,
    type
) {

    let color =
        0x4b6584;

    if (
        type === "start"
    ) {

        color =
            0x2ecc71;
    }

    if (
        type === "checkpoint"
    ) {

        color =
            0xf1c40f;
    }

    if (
        type === "goal"
    ) {

        color =
            0xe74c3c;
    }

    if (
        type === "moving"
    ) {

        color =
            0x9b59b6;
    }


    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color: color
            })

        );


    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);


    const platform = {

        mesh: mesh,

        width: width,

        height: height,

        depth: depth,

        type: type,

        startX: x,

        moving:
            type === "moving"

    };


    platforms.push(
        platform
    );

    levelObjects.push(
        mesh
    );

}


/* =========================
   Checkpoint
========================= */

function createCheckpoint(
    x,
    y,
    z,
    name
) {

    const group =
        new THREE.Group();


    group.position.set(
        x,
        y,
        z
    );


    const pole =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .08,
                .08,
                3,
                12
            ),

            new THREE.MeshStandardMaterial({
                color: 0xffffff
            })

        );


    pole.position.y = 1.5;

    group.add(pole);


    const flag =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1.3,
                .8
            ),

            new THREE.MeshStandardMaterial({

                color: 0xffd32a,

                side:
                    THREE.DoubleSide

            })

        );


    flag.position.set(
        .65,
        2.5,
        0
    );


    group.add(flag);

    scene.add(group);


    checkpoints.push({

        x: x,

        y: y,

        z: z,

        name: name

    });


    levelObjects.push(
        group
    );

}


/* =========================
   終點
========================= */

function createGoal(
    x,
    y,
    z
) {

    goal =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                1.4,
                .18,
                12,
                40
            ),

            new THREE.MeshStandardMaterial({

                color: 0xff3333,

                emissive:
                    0x550000

            })

        );


    goal.position.set(
        x,
        y + 2,
        z
    );


    scene.add(goal);

    levelObjects.push(
        goal
    );

}


/* =========================
   清除關卡
========================= */

function clearLevel() {

    for (
        const obj of levelObjects
    ) {

        scene.remove(obj);

    }

    platforms = [];

    checkpoints = [];

    levelObjects = [];

    goal = null;

}


/* =========================
   載入關卡
========================= */

function loadLevel(
    index
) {

    clearLevel();


    const data =
        levels[index];


    currentLevel =
        index;


    levelText.textContent =
        index + 1;


    for (
        const p of data.platforms
    ) {

        createPlatform(
            ...p
        );

    }


    for (
        const cp of data.checkpoints
    ) {

        createCheckpoint(
            ...cp
        );

    }


    createGoal(
        ...data.goal
    );


    checkpoint.set(
        ...data.start
    );


    checkpointName =
        "起點";


    checkpointText.textContent =
        checkpointName;


    controls.object.position.copy(
        checkpoint
    );


    velocityY = 0;

    canJump = false;

    startTime =
        performance.now();

}


/* =========================
   Respawn
========================= */

function respawn() {

    controls.object.position.copy(
        checkpoint
    );

    velocityY = 0;

    canJump = false;

}


/* =========================
   訊息
========================= */

function showMessage(
    text
) {

    message.textContent =
        text;

    message.style.opacity =
        1;


    setTimeout(
        function() {

            message.style.opacity =
                0;

        },
        1200
    );

}


/* =========================
   平台碰撞
========================= */

function checkCollision() {

    const player =
        controls.object;


    const px =
        player.position.x;

    const py =
        player.position.y;

    const pz =
        player.position.z;


    const radius =
        .35;


    let standing =
        false;


    for (
        const p of platforms
    ) {

        const top =
            p.mesh.position.y +
            p.height / 2;


        const insideX =

            px >
            p.mesh.position.x -
            p.width / 2 -
            radius

            &&

            px <
            p.mesh.position.x +
            p.width / 2 +
            radius;


        const insideZ =

            pz >
            p.mesh.position.z -
            p.depth / 2 -
            radius

            &&

            pz <
            p.mesh.position.z +
            p.depth / 2 +
            radius;


        if (

            insideX &&

            insideZ &&

            py >= top &&

            py <= top + 1.2 &&

            velocityY <= 0

        ) {

            player.position.y =
                top + PLAYER_HEIGHT;

            velocityY = 0;

            standing = true;

        }

    }


    canJump =
        standing;

}


/* =========================
   Checkpoint
========================= */

function checkCheckpoints() {

    const player =
        controls.object;


    for (
        const cp of checkpoints
    ) {

        const distance =
            player.position.distanceTo(

                new THREE.Vector3(
                    cp.x,
                    cp.y,
                    cp.z
                )

            );


        if (
            distance < 2.5
        ) {

            checkpoint.set(
                cp.x,
                cp.y,
                cp.z
            );


            checkpointName =
                cp.name;


            checkpointText.textContent =
                checkpointName;

        }

    }

}


/* =========================
   終點判斷
========================= */

function checkGoal() {

    if (!goal) return;


    const distance =
        controls.object.position.distanceTo(
            goal.position
        );


    if (
        distance < 2.5
    ) {

        nextLevel();

    }

}


/* =========================
   下一關
========================= */

function nextLevel() {

    if (
        currentLevel >=
        levels.length - 1
    ) {

        playing = false;

        controls.unlock();

        showMessage(
            "🏆 全部關卡完成！"
        );


        setTimeout(
            function() {

                loadLevel(0);

                menu.style.display =
                    "flex";

                startBtn.textContent =
                    "重新開始";

            },
            1800
        );


        return;

    }


    playing = false;

    controls.unlock();


    showMessage(
        "✔ 第 " +
        (currentLevel + 1) +
        " 關完成！"
    );


    setTimeout(
        function() {

            loadLevel(
                currentLevel + 1
            );

            playing = true;

            controls.lock();

        },
        1200
    );

}


/* =========================
   玩家移動
========================= */

function updateMovement(
    delta
) {

    if (
        !playing ||
        !controls.isLocked
    ) {

        return;

    }


    let x = 0;

    let z = 0;


    if (
        keys["KeyA"]
    ) {

        x -= 1;

    }


    if (
        keys["KeyD"]
    ) {

        x += 1;

    }


    if (
        keys["KeyW"]
    ) {

        z += 1;

    }


    if (
        keys["KeyS"]
    ) {

        z -= 1;

    }


    if (
        x !== 0 ||
        z !== 0
    ) {

        const length =
            Math.hypot(
                x,
                z
            );


        x /= length;

        z /= length;


        controls.moveRight(
            x *
            MOVE_SPEED *
            delta
        );


        controls.moveForward(
            z *
            MOVE_SPEED *
            delta
        );

    }


    /* 重力 */

    velocityY -=
        GRAVITY *
        delta;


    controls.object.position.y +=
        velocityY *
        delta;


    checkCollision();

    checkCheckpoints();

    checkGoal();


    /* 掉下去 */

    if (
        controls.object.position.y <
        -30
    ) {

        respawn();

        showMessage(
            "↩ 回到 Checkpoint"
        );

    }

}


/* =========================
   移動平台
========================= */

function updateMovingPlatforms(
    time
) {

    for (
        const p of platforms
    ) {

        if (
            !p.moving
        ) {

            continue;

        }


        p.mesh.position.x =

            p.startX +

            Math.sin(
                time * .0015
            ) * 4;

    }

}


/* =========================
   開始按鈕
========================= */

startBtn.addEventListener(
    "click",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        menu.style.display =
            "none";


        pause.style.display =
            "none";


        if (!playing) {

            loadLevel(0);

            playing = true;

        }


        controls.lock();

    }
);


/* =========================
   滑鼠鎖定
========================= */

controls.addEventListener(
    "lock",
    function() {

        pause.style.display =
            "none";

    }
);


controls.addEventListener(
    "unlock",
    function() {

        if (playing) {

            pause.style.display =
                "flex";

        }

    }
);


/* 點畫面繼續 */

document.addEventListener(
    "click",
    function() {

        if (
            playing &&
            !controls.isLocked
        ) {

            controls.lock();

        }

    }
);


/* =========================
   動畫
========================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updateMovement(
        delta
    );


    updateMovingPlatforms(
        performance.now()
    );


    if (
        playing
    ) {

        const time =
            (
                performance.now() -
                startTime
            ) / 1000;


        timeText.textContent =
            time.toFixed(2);

    }


    if (
        goal
    ) {

        goal.rotation.z +=
            delta * 2;

        goal.rotation.y +=
            delta;

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   視窗大小
========================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================
   啟動
========================= */

loadLevel(0);

animate();

</script>

</body>
</html>
