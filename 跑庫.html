<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Parkour · WASD 移动</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            user-select: none;
        }
        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffd700;
            background: rgba(0,0,0,0.6);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,215,0,0.3);
            z-index: 10;
            user-select: none;
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        #restart-btn {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(255, 215, 0, 0.9);
            color: #1a1a2e;
            border: none;
            padding: 14px 44px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.2s;
            letter-spacing: 1px;
        }
        #restart-btn:hover {
            background: #ffed4a;
            transform: translateX(-50%) scale(1.05);
        }
        @media (max-width: 600px) {
            #info { font-size: 0.8rem; padding: 6px 14px; }
            #score { font-size: 1.2rem; padding: 6px 16px; }
            #controls-hint { font-size: 0.7rem; padding: 6px 14px; white-space: normal; }
        }
    </style>
</head>
<body>
    <div id="info">🏃 Parkour · WASD 移动</div>
    <div id="score">🏆 <span id="scoreValue">0</span></div>
    <div id="controls-hint">W A S D 移动 · 空格跳跃 · Shift滑铲</div>
    <button id="restart-btn">🔄 重新开始</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 25, 60);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 光照 ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(6, 18, 12);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 22;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 40;
        scene.add(dirLight);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.4);
        fill.position.set(-5, 2, 8);
        scene.add(fill);

        // 背景星光
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1000;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starsPos[i] = (Math.random() - 0.5) * 200;
            starsPos[i+1] = (Math.random() - 0.5) * 80 + 15;
            starsPos[i+2] = (Math.random() - 0.5) * 200 - 50;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // --- 地面 (无限跑道) ---
        const groundWidth = 10;
        const groundLength = 100;
        const groundGeo = new THREE.BoxGeometry(groundWidth, 0.5, groundLength);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a4a, 
            roughness: 0.7,
            metalness: 0.1,
            emissive: new THREE.Color(0x111122)
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.set(0, -0.25, -20);
        ground.receiveShadow = true;
        ground.castShadow = true;
        scene.add(ground);

        // 跑道边缘光带
        const edgeMat = new THREE.MeshStandardMaterial({ color: 0x4a6fa5, emissive: new THREE.Color(0x1a3a6a), emissiveIntensity: 0.4 });
        for (let i = -3; i <= 3; i+=6) {
            const edge = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, groundLength), edgeMat);
            edge.position.set(i * 2.1, 0.2, -20);
            scene.add(edge);
        }

        // 中间虚线
        const dashMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: new THREE.Color(0x224488), emissiveIntensity: 0.3 });
        for (let z = -5; z > -groundLength; z -= 3.5) {
            const dash = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 1.5), dashMat);
            dash.position.set(0, 0.2, z);
            scene.add(dash);
        }

        // 两侧护栏 (装饰+碰撞边界)
        const fenceMat = new THREE.MeshStandardMaterial({ color: 0x5a7a9a, emissive: new THREE.Color(0x1a2a4a), emissiveIntensity: 0.2 });
        for (let side = -1; side <= 1; side+=2) {
            const fence = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, groundLength), fenceMat);
            fence.position.set(side * 5.5, 0.4, -20);
            fence.castShadow = true;
            fence.receiveShadow = true;
            scene.add(fence);
        }

        // --- 玩家 (更精致的小人) ---
        const playerGroup = new THREE.Group();
        
        // 身体
        const bodyGeo = new THREE.BoxGeometry(0.9, 1.0, 0.6);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, emissive: new THREE.Color(0x0a2a4a), emissiveIntensity: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        body.receiveShadow = true;
        playerGroup.add(body);
        
        // 头
        const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, emissive: new THREE.Color(0x553322), emissiveIntensity: 0.1 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.2;
        head.castShadow = true;
        head.receiveShadow = true;
        playerGroup.add(head);
        
        // 眼睛
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0x88ccff), emissiveIntensity: 0.8 });
        const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.2, 1.3, 0.4);
        playerGroup.add(eyeL);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.2, 1.3, 0.4);
        playerGroup.add(eyeR);
        
        // 腿
        const legMat = new THREE.MeshStandardMaterial({ color: 0x2a4a6a });
        const legGeo = new THREE.BoxGeometry(0.25, 0.5, 0.25);
        const legL = new THREE.Mesh(legGeo, legMat);
        legL.position.set(-0.3, 0, 0.1);
        legL.castShadow = true;
        playerGroup.add(legL);
        const legR = new THREE.Mesh(legGeo, legMat);
        legR.position.set(0.3, 0, 0.1);
        legR.castShadow = true;
        playerGroup.add(legR);

        playerGroup.position.set(0, 0.5, 0);
        scene.add(playerGroup);

        // 玩家状态
        const player = {
            group: playerGroup,
            velocity: new THREE.Vector3(0, 0, 0),
            gravity: -22,
            jumpPower: 9,
            isOnGround: false,
            isSliding: false,
            moveSpeed: 5.0,
            maxX: 4.5,
            minX: -4.5,
        };

        // --- 障碍物系统 ---
        let obstacles = [];
        let score = 0;
        let gameOver = false;
        let gameSpeed = 7.5;
        let spawnTimer = 0;
        const spawnInterval = 1.6;
        let distanceTraveled = 0;

        function createObstacle(type, zPos) {
            const group = new THREE.Group();
            let mat1 = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: new THREE.Color(0x661111), emissiveIntensity: 0.3 });
            let mat2 = new THREE.MeshStandardMaterial({ color: 0xffa94d, emissive: new THREE.Color(0x553322), emissiveIntensity: 0.2 });
            
            if (type === 'crate') {
                const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), mat1);
                box.position.y = 0.6;
                box.castShadow = true;
                box.receiveShadow = true;
                group.add(box);
                const edge = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 1.3), mat2);
                edge.position.y = 0.1;
                group.add(edge);
                group.userData = { type: 'jump', height: 1.2 };
            } else if (type === 'barrier') {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 0.8), mat1);
                wall.position.y = 0.35;
                wall.castShadow = true;
                wall.receiveShadow = true;
                group.add(wall);
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 0.1), mat2);
                stripe.position.set(0, 0.6, 0.4);
                group.add(stripe);
                group.userData = { type: 'slide', height: 0.7 };
            } else if (type === 'double') {
                const high = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.8), mat1);
                high.position.set(-1.0, 0.6, 0);
                high.castShadow = true;
                group.add(high);
                const low = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.8), mat2);
                low.position.set(1.0, 0.35, 0);
                low.castShadow = true;
                group.add(low);
                group.userData = { type: 'double' };
            }
            group.position.z = zPos;
            return group;
        }

        function spawnObstacle() {
            if (gameOver) return;
            const types = ['crate', 'barrier', 'double'];
            const type = types[Math.floor(Math.random() * types.length)];
            const zPos = -8 - Math.random() * 12;
            const obs = createObstacle(type, zPos);
            // 随机横向偏移
            obs.position.x = (Math.random() - 0.5) * 3;
            scene.add(obs);
            obstacles.push(obs);
        }

        // --- 重置 ---
        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            document.getElementById('scoreValue').textContent = '0';
            gameOver = false;
            document.getElementById('restart-btn').style.display = 'none';
            
            player.group.position.set(0, 0.5, 0);
            player.velocity.set(0, 0, 0);
            player.isOnGround = false;
            player.isSliding = false;
            player.group.scale.y = 1;
            player.group.position.y = 0.5;
            
            camera.position.set(0, 8, 14);
            camera.lookAt(0, 0, -5);
            
            distanceTraveled = 0;
            spawnTimer = 0;
            gameSpeed = 7.5;
        }

        // --- 动作函数 ---
        function jump() {
            if (gameOver) return;
            if (player.isOnGround) {
                player.velocity.y = player.jumpPower;
                player.isOnGround = false;
                player.group.scale.y = 0.85;
                setTimeout(() => { player.group.scale.y = 1.0; }, 150);
            }
        }

        function slide() {
            if (gameOver) return;
            if (player.isOnGround && !player.isSliding) {
                player.isSliding = true;
                player.group.scale.y = 0.6;
                player.group.position.y = 0.1;
                setTimeout(() => {
                    if (player.isSliding) {
                        player.isSliding = false;
                        player.group.scale.y = 1.0;
                        player.group.position.y = 0.5;
                    }
                }, 500);
            }
        }

        // --- 键盘控制 (WASD + 空格 + Shift) ---
        const keys = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
            if (e.key === 'Shift') {
                e.preventDefault();
                slide();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // 按钮 (移动端备用，但也可用)
        document.getElementById('restart-btn').addEventListener('click', resetGame);

        // 窗口自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 游戏循环 ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            if (!gameOver) {
                // --- WASD 移动 (横向) ---
                let moveX = 0;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;
                // 前后移动 (W/S) 影响速度，但不改变z轴位置，而是影响相机跟随和障碍物速度感
                // 这里我们让W/S轻微影响速度，但主要用来增加交互感: W加速, S减速
                if (keys.w) {
                    gameSpeed = Math.min(12, gameSpeed + delta * 2);
                }
                if (keys.s) {
                    gameSpeed = Math.max(4, gameSpeed - delta * 2);
                }

                // 横向移动
                player.group.position.x += moveX * player.moveSpeed * delta;
                // 边界限制
                if (player.group.position.x > player.maxX) player.group.position.x = player.maxX;
                if (player.group.position.x < player.minX) player.group.position.x = player.minX;

                // --- 物理 (跳跃/重力) ---
                player.velocity.y += player.gravity * delta;
                player.group.position.y += player.velocity.y * delta;

                if (player.group.position.y <= 0.5) {
                    player.group.position.y = 0.5;
                    player.velocity.y = 0;
                    player.isOnGround = true;
                } else {
                    player.isOnGround = false;
                }

                if (player.isSliding) {
                    player.group.position.y = 0.1;
                } else {
                    if (player.group.position.y < 0.5) player.group.position.y = 0.5;
                }

                // --- 障碍物移动 ---
                const speed = gameSpeed * delta;
                obstacles.forEach(obs => {
                    obs.position.z += speed;
                });

                // 移除超出
                obstacles = obstacles.filter(obs => {
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        return false;
                    }
                    return true;
                });

                // --- 碰撞检测 ---
                const playerBox = new THREE.Box3().setFromObject(player.group);
                const pCenter = playerBox.getCenter(new THREE.Vector3());
                const pSize = playerBox.getSize(new THREE.Vector3());
                playerBox.min.set(pCenter.x - 0.4, pCenter.y - 0.4, pCenter.z - 0.3);
                playerBox.max.set(pCenter.x + 0.4, pCenter.y + 0.6, pCenter.z + 0.3);

                for (let obs of obstacles) {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (playerBox.intersectsBox(obsBox)) {
                        gameOver = true;
                        document.getElementById('restart-btn').style.display = 'block';
                        break;
                    }
                }

                // 分数
                if (!gameOver) {
                    score += delta * 6;
                    document.getElementById('scoreValue').textContent = Math.floor(score);
                }

                // 生成障碍物
                spawnTimer += delta;
                if (spawnTimer >= spawnInterval) {
                    spawnTimer = 0;
                    spawnObstacle();
                }

                // --- 相机跟随 (第三人称，随玩家横向移动) ---
                const targetCamPos = new THREE.Vector3(
                    player.group.position.x * 0.5,
                    7 + Math.sin(Date.now() * 0.001) * 0.3,
                    14 + player.group.position.z * 0.15
                );
                camera.position.lerp(targetCamPos, 0.06);
                camera.lookAt(player.group.position.x * 0.3, 0.5, player.group.position.z - 3);

                // 星星旋转
                stars.rotation.y += 0.0002;
            } else {
                // Game Over 轻微晃动
                camera.position.x += Math.sin(Date.now() * 0.003) * 0.005;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // 初始障碍物
        setTimeout(() => { spawnObstacle(); }, 400);
        setTimeout(() => { spawnObstacle(); }, 1200);
        setTimeout(() => { spawnObstacle(); }, 2100);

        console.log('3D Parkour WASD 移动版已启动！ W加速 S减速 A/D左右移动 空格跳跃 Shift滑铲');
    </script>
</body>
</html>
