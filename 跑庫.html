<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>3D Parkour 跑酷遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial}
#gameCanvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:12px;left:12px;color:#fff;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;z-index:10}
#tip{position:fixed;bottom:20px;width:100%;text-align:center;color:#fff;font-size:18px;z-index:10}
</style>
</head>
<body>
<div id="ui">
<div>關卡：<span id="levelText">1</span></div>
<div>狀態：<span id="status">點擊畫面開始遊戲</span></div>
</div>
<div id="tip">WASD移動｜空白鍵跳躍｜滑鼠轉視角｜藍色=檢查點｜綠色=終點</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

let scene,camera,renderer,controls;
let playerVelocity=new THREE.Vector3();
let isOnGround=false;
let levelIndex=1;
let lastCheckPoint=new THREE.Vector3(0,2,0);
let platforms=[];
let checkPoints=[];
let goal=null;

// 重力、移動參數
const GRAVITY=-22;
const JUMP_FORCE=8;
const SPEED=7;

// 按鍵狀態
const keys={w:false,a:false,s:false,d:false,space:false};

// 初始化場景
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87ceeb);
  scene.fog=new THREE.Fog(0x87ceeb,30,120);

  camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
  camera.position.set(0,2,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true;
  document.body.appendChild(renderer.domElement);

  // 光源
  const dirLight=new THREE.DirectionalLight(0xffffff,1.2);
  dirLight.position.set(20,40,20);
  dirLight.castShadow=true;
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0xffffff,0.4));

  // 滑鼠鎖定控制
  controls=new PointerLockControls(camera,document.body);
  document.body.addEventListener('click',()=>{
    controls.lock();
  });
  controls.addEventListener('lock',()=>{
    document.getElementById("status").innerText="遊戲中";
  });
  controls.addEventListener('unlock',()=>{
    document.getElementById("status").innerText="已暫停，點擊畫面繼續";
  });

  // 鍵盤監聽
  document.addEventListener('keydown',e=>{
    switch(e.code){
      case'KeyW':keys.w=true;break;
      case'KeyA':keys.a=true;break;
      case'KeyS':keys.s=true;break;
      case'KeyD':keys.d=true;break;
      case'Space':keys.space=true;e.preventDefault();break;
    }
  });
  document.addEventListener('keyup',e=>{
    switch(e.code){
      case'KeyW':keys.w=false;break;
      case'KeyA':keys.a=false;break;
      case'KeyS':keys.s=false;break;
      case'KeyD':keys.d=false;break;
      case'Space':keys.space=false;break;
    }
  });

  buildLevel(1);
  window.addEventListener('resize',onWindowResize);
  animate();
}

// 建立關卡
function buildLevel(lv){
  // 清除舊物件
  platforms.forEach(p=>scene.remove(p));
  checkPoints.forEach(p=>scene.remove(p));
  if(goal)scene.remove(goal);
  platforms=[];
  checkPoints=[];

  document.getElementById("levelText").innerText=lv;

  const geoPlat=new THREE.BoxGeometry(6,1,6);
  const matNormal=new THREE.MeshLambertMaterial({color:0x888888});
  const matCheck=new THREE.MeshLambertMaterial({color:0x3388ff});
  const matGoal=new THREE.MeshLambertMaterial({color:0x33dd55});

  // 起點平台
  const start=new THREE.Mesh(geoPlat,matNormal);
  start.position.set(0,0,0);
  start.receiveShadow=true;
  start.castShadow=true;
  scene.add(start);
  platforms.push(start);

  // 依照關卡生成平台
  let px=0,py=0,pz=0;
  const count=8+lv*4;
  for(let i=0;i<count;i++){
    px+=(Math.random()-0.5)*5;
    py+=0.4+Math.random()*1.2;
    pz-=7+Math.random()*3;
    const plat=new THREE.Mesh(geoPlat,matNormal);
    plat.position.set(px,py,pz);
    plat.castShadow=true;
    plat.receiveShadow=true;
    scene.add(plat);
    platforms.push(plat);

    // 每3個平台放檢查點
    if((i+1)%3===0){
      const cp=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),matCheck);
      cp.position.set(px,py+2,pz);
      scene.add(cp);
      checkPoints.push({mesh:cp,pos:new THREE.Vector3(px,py+2,pz)});
    }
  }

  // 終點
  goal=new THREE.Mesh(geoPlat,matGoal);
  goal.position.set(px,py,pz-8);
  goal.castShadow=true;
  goal.receiveShadow=true;
  scene.add(goal);
  platforms.push(goal);

  // 玩家回到起點檢查點
  lastCheckPoint.set(0,2,0);
  respawnPlayer();
}

function respawnPlayer(){
  camera.position.copy(lastCheckPoint);
  playerVelocity.set(0,0,0);
}

function onWindowResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

// 碰撞偵測：判斷是否站在平台上
function checkGround(){
  isOnGround=false;
  const camPos=camera.position.clone();
  for(let plat of platforms){
    const bbox=new THREE.Box3().setFromObject(plat);
    const feetPos=camPos.clone();
    feetPos.y-=1.7;
    if(bbox.containsPoint(feetPos)){
      isOnGround=true;
      camPos.y=plat.position.y+1.7;
      camera.position.y=camPos.y;
      return true;
    }
  }
  return false;
}

// 檢查是否碰到檢查點
function hitCheckPoint(){
  const cpRange=2.2;
  for(let cp of checkPoints){
    if(camera.position.distanceTo(cp.pos)<cpRange){
      lastCheckPoint.copy(cp.pos);
    }
  }
  // 碰到終點
  if(camera.position.distanceTo(goal.position)<4){
    levelIndex+=1;
    buildLevel(levelIndex);
  }
}

function animate(){
  requestAnimationFrame(animate);
  const delta=0.016;

  if(controls.isLocked){
    // 移動方向
    playerVelocity.y+=GRAVITY*delta;

    const dir=new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.y=0;
    dir.normalize();

    const right=new THREE.Vector3();
    right.crossVectors(dir,camera.up).normalize();

    let move=new THREE.Vector3();
    if(keys.w)move.add(dir);
    if(keys.s)move.sub(dir);
    if(keys.a)move.sub(right);
    if(keys.d)move.add(right);

    if(move.length()>0)move.normalize().multiplyScalar(SPEED);

    // 跳躍
    if(keys.space&&isOnGround){
      playerVelocity.y=JUMP_FORCE;
    }

    // 移動相機
    camera.position.x+=move.x*delta*60;
    camera.position.z+=move.z*delta*60;
    camera.position.y+=playerVelocity.y*delta;

    checkGround();
    hitCheckPoint();

    // 跌落重生
    if(camera.position.y<-15){
      respawnPlayer();
    }
  }

  renderer.render(scene,camera);
}

init();
</script>
</body>
</html>
