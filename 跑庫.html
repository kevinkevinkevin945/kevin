<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 跑酷塔：凌空石傳送版 </title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background-color: #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin-top: -5px; margin-left: -5px; border-radius: 50%; background-color: rgba(0, 255, 200, 0.9); border: 2px solid rgba(0, 0, 0, 0.6); pointer-events: none; z-index: 10; }
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 6px #000; pointer-events: none; z-index: 10; }
        #weapon-status { position: absolute; bottom: 20px; right: 20px; color: #ffcc00; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 6px #000; pointer-events: none; z-index: 10; text-align: right; }
        #checkpoint-notify { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(45deg, #00ffcc, #00ff66); color: #000; padding: 14px 28px; border-radius: 30px; font-size: 24px; font-weight: 900; display: none; z-index: 15; pointer-events: none; box-shadow: 0 0 20px #00ffcc; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 5, 20, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 20; cursor: pointer; }
        #instructions h1 { font-size: 46px; margin-bottom: 10px; background: linear-gradient(to right, #00ffcc, #0099ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        #instructions p { font-size: 16px; margin: 5px 0; color: #ddd; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hud">
        得分: <span id="score">0</span> | 
        塔層: <span id="level-display" style="color: #ffaa00;">1</span> | 
        三連跳: <span id="jumps-left" style="color: #00ffff;">3</span> / 3 |
        <span style="color: #00ffcc;">💎 凌空石: <span id="stone-status">就緒 (按 E)</span></span>
    </div>

    <div id="checkpoint-notify">⚡ 踩到紀錄點！凌空石與能量全滿！</div>

    <div id="weapon-status">
        <div id="ammo-display" style="color: #00ff66; font-size: 26px;">脈衝步槍: 200 / 200</div>
        <div id="weapon-name" style="font-size: 16px; color: #aaa;">按 E 鍵使用【凌空石】瞬移</div>
    </div>

    <div id="instructions">
        <h1>🔮 跑酷塔：凌空石瞬移版</h1>
        <p>點擊螢幕開始體驗靈動瞬移！</p>
        <p>【💎 凌空石機制 (按 E)】</p>
        <p>1. 按 <b>[E]</b> 鍵向前拋出「凌空石」，石塊會在半空中展開綠色反重力平台。</p>
        <p>2. 石塊懸浮時，<b>再按一次 [E] 鍵</b>，瞬間傳送到石塊位置，並<b>重置跳躍次數</b>！</p>
        <p>【🚩 記錄點】踩到金黃色紀錄點，所有子彈與凌空石<b>瞬間補滿</b>！</p>
        <p>【操作】W/A/S/D 移動 | Space 跳躍 | <b>E 發射/瞬移凌空石</b> | 1-3 換武器</p>
    </div>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        let playerVelocity = new THREE.Vector3();
        const GRAVITY = 32;

        const MAX_JUMPS = 3;
        let jumpsLeft = MAX_JUMPS;

        const MAX_AMMO = { 'blackhole': 10, 'freeze': 15, 'pulse': 200 };
        const ammo = { 'blackhole': 10, 'freeze': 15, 'pulse': 200 };

        let isMouseDown = false;
        let lastShotTime = 0;
        let prevTime = performance.now();

        const STAND_HEIGHT = 1.6;

        let currentLevel = 1;
        let rewardCrystal = null;

        let respawnPosition = new THREE.Vector3(0, 5, 12);

        const obstacles = [];
        const checkpoints = [];
        const drones = [];
        const projectiles = [];

        // --- 凌空石 (Sky-Soaring Stone) 系統 ---
        let skyStoneMesh = null;
        let skyStonePlatform = null;
        let skyStoneState = 'READY'; // READY, FLYING, ANCHORED, COOLDOWN
        let skyStoneVelocity = new THREE.Vector3();
        let skyStoneCooldownTimer = 0;

        let activeCheckpointIndex = -1;
        let notifyTimer = 0;
        let score = 0;
        let isGameOver = false;

        const weaponList = ['blackhole', 'freeze', 'pulse'];
        const weaponNames = {
            'blackhole': '1. 黑洞火箭',
            'freeze': '2. 冰凍榴彈砲',
            'pulse': '3. 脈衝電磁槍'
        };

        let currentWeaponIndex = 2;
        let weaponMeshes = {};
        let weaponGroup;

        const hudScore = document.getElementById('score');
        const hudLevel = document.getElementById('level-display');
        const hudJumps = document.getElementById('jumps-left');
        const stoneStatus = document.getElementById('stone-status');
        const ammoDisplay = document.getElementById('ammo-display');
        const weaponNameDisplay = document.getElementById('weapon-name');
        const checkpointNotify = document.getElementById('checkpoint-notify');
        const instructions = document.getElementById('instructions');

        const towerColors = [0xff0055, 0xff7700, 0x00ff66, 0x00ccff, 0xaa00ff];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05020a);
            scene.fog = new THREE.FogExp2(0x05020a, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.7);
            dirLight.position.set(0, 100, 0);
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);
            
            const lavaGeo = new THREE.PlaneGeometry(1000, 1000);
            const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff0033, side: THREE.DoubleSide });
            const lavaSea = new THREE.Mesh(lavaGeo, lavaMat);
            lavaSea.rotation.x = Math.PI / 2;
            lavaSea.position.set(0, -5, 0);
            scene.add(lavaSea);

            createSkyStoneObjects();
            buildTower(currentLevel);

            instructions.addEventListener('click', () => {
                if (!isGameOver) controls.lock();
                else restartGame();
            });

            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => { if (!isGameOver) instructions.style.display = 'flex'; });

            scene.add(controls.getObject());
            createWeapons();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('wheel', onMouseWheel);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 創建凌空石視覺模型
        function createSkyStoneObjects() {
            // 凌空石本體 (八面體閃耀晶石)
            const stoneGeo = new THREE.OctahedronGeometry(0.4, 0);
            const stoneMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
            skyStoneMesh = new THREE.Mesh(stoneGeo, stoneMat);
            skyStoneMesh.visible = false;
            scene.add(skyStoneMesh);

            // 凌空石產生的反重力浮空平台
            const platGeo = new THREE.CylinderGeometry(2.0, 2.0, 0.4, 16);
            const platMat = new THREE.MeshLambertMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.7 });
            skyStonePlatform = new THREE.Mesh(platGeo, platMat);
            skyStonePlatform.visible = false;
            skyStonePlatform.userData = { isPermanent: true, isCheckpoint: false };
            scene.add(skyStonePlatform);
        }

        function refillAllAmmo() {
            ammo['blackhole'] = MAX_AMMO['blackhole'];
            ammo['freeze'] = MAX_AMMO['freeze'];
            ammo['pulse'] = MAX_AMMO['pulse'];
            
            // 重置凌空石狀態
            skyStoneState = 'READY';
            skyStoneMesh.visible = false;
            skyStonePlatform.visible = false;
            updateHUD();
        }

        function updateHUD() {
            hudJumps.textContent = jumpsLeft;
            hudJumps.style.color = jumpsLeft === 0 ? "#ff3333" : "#00ffff";

            if (skyStoneState === 'READY') stoneStatus.textContent = "就緒 (按 E)";
            else if (skyStoneState === 'FLYING') stoneStatus.textContent = "飛行中...";
            else if (skyStoneState === 'ANCHORED') stoneStatus.textContent = "錨定中 (再按 E 瞬移)";
            else if (skyStoneState === 'COOLDOWN') stoneStatus.textContent = `冷卻中 (${skyStoneCooldownTimer.toFixed(1)}s)`;

            const curKey = weaponList[currentWeaponIndex];
            ammoDisplay.textContent = `子彈: ${ammo[curKey]} / ${MAX_AMMO[curKey]}`;
            weaponNameDisplay.textContent = "當前武器: " + weaponNames[curKey] + " | 按 E 鍵發射凌空石";
        }

        // 觸發凌空石傳送與錨定
        function handleSkyStoneAbility() {
            if (skyStoneState === 'READY') {
                // 發射凌空石
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                skyStoneMesh.position.copy(camera.position).add(dir.clone().multiplyScalar(1.0));
                skyStoneVelocity.copy(dir).multiplyScalar(35.0);
                
                skyStoneMesh.visible = true;
                skyStonePlatform.visible = false;
                skyStoneState = 'FLYING';
                updateHUD();

            } else if (skyStoneState === 'FLYING' || skyStoneState === 'ANCHORED') {
                // 瞬間傳送到凌空石位置！
                const targetPos = skyStoneMesh.position.clone();
                targetPos.y += 1.2; // 傳送到石塊上方

                controls.getObject().position.copy(targetPos);
                playerVelocity.set(0, 0, 0); // 瞬間消除落速
                jumpsLeft = MAX_JUMPS; // 補滿跳躍次數！

                // 進入冷卻
                skyStoneMesh.visible = false;
                skyStonePlatform.visible = false;
                skyStoneState = 'COOLDOWN';
                skyStoneCooldownTimer = 3.0; // 3 秒冷卻
                updateHUD();
            }
        }

        function buildTower(level) {
            obstacles.forEach(obs => scene.remove(obs));
            checkpoints.length = 0; drones.forEach(d => scene.remove(d.mesh));
            obstacles.length = 0; drones.length = 0;
            if (rewardCrystal) scene.remove(rewardCrystal);

            hudLevel.textContent = level;

            // 起點平台
            const startPlat = new THREE.Mesh(new THREE.BoxGeometry(8, 1.5, 8), new THREE.MeshLambertMaterial({ color: 0xffd700 }));
            startPlat.position.set(0, 2, 12);
            startPlat.userData = { isPermanent: true, isCheckpoint: true, id: 0 };
            scene.add(startPlat); obstacles.push(startPlat); checkpoints.push(startPlat);

            respawnPosition.set(0, 5, 12); activeCheckpointIndex = 0;

            const totalSteps = 45 + level * 10;
            const radius = 14.0;
            let currentAngle = 0; let currentY = 3.5;

            for (let i = 0; i < totalSteps; i++) {
                currentAngle += 0.35; currentY += 1.8;
                const posX = Math.sin(currentAngle) * radius; const posZ = Math.cos(currentAngle) * radius;
                const isCP = (i > 0 && i % 12 === 0);

                const cubeSize = isCP ? 5.0 : Math.max(2.2, 4.0 - level * 0.15);
                const stepGeo = new THREE.BoxGeometry(cubeSize, 1.2, cubeSize);
                const stepMat = new THREE.MeshLambertMaterial({ color: isCP ? 0xffd700 : towerColors[i % towerColors.length] });
                const step = new THREE.Mesh(stepGeo, stepMat);

                step.position.set(posX, currentY, posZ);
                step.userData = { isPermanent: isCP, isCheckpoint: isCP, id: isCP ? checkpoints.length : -1 };

                scene.add(step); obstacles.push(step);
                if (isCP) checkpoints.push(step);
            }

            // 終點平台
            currentY += 4.0;
            const topPlat = new THREE.Mesh(new THREE.BoxGeometry(10, 2, 10), new THREE.MeshLambertMaterial({ color: 0xffff00 }));
            topPlat.position.set(0, currentY, 0);
            topPlat.userData = { isPermanent: true, isCheckpoint: true, id: checkpoints.length };
            scene.add(topPlat); obstacles.push(topPlat); checkpoints.push(topPlat);

            spawnGoalCrystal(new THREE.Vector3(0, currentY + 3.0, 0));
            controls.getObject().position.copy(respawnPosition); camera.rotation.set(0, 0, 0);
            jumpsLeft = MAX_JUMPS; refillAllAmmo();
        }

        function spawnGoalCrystal(position) {
            if (rewardCrystal) scene.remove(rewardCrystal);
            rewardCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(2.0, 0), new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true }));
            rewardCrystal.position.copy(position); scene.add(rewardCrystal);
        }

        function createWeapons() {
            weaponGroup = new THREE.Group();
            const pl = new THREE.Group(); pl.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.7), new THREE.MeshBasicMaterial({ color: 0x00ff66 }))); pl.position.set(0.3, -0.22, -0.45); weaponMeshes['pulse'] = pl;
            weaponGroup.add(pl);
            camera.add(weaponGroup);
        }

        function onKeyDown(e) {
            if (!controls.isLocked || isGameOver) return;
            switch (e.code) {
                case 'KeyW': moveForward = true; break; case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break; case 'KeyD': moveRight = true; break;
                case 'KeyE': handleSkyStoneAbility(); break; // 觸發凌空石
                case 'Space': 
                    if (jumpsLeft > 0) { playerVelocity.y = 14.5; jumpsLeft--; updateHUD(); } break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break; case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break; case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseDown(e) { if (controls.isLocked && !isGameOver && e.button === 0) tryShoot(); }
        function onMouseUp(e) {}
        function onMouseWheel(e) {}

        function tryShoot() {
            const curWeapon = weaponList[currentWeaponIndex];
            if (ammo[curWeapon] <= 0) return;
            ammo[curWeapon]--; updateHUD();
            
            const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(0.6));
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), new THREE.MeshBasicMaterial({ color: 0x00ff66 }));
            bullet.position.copy(spawnPos);
            projectiles.push({ mesh: bullet, velocity: dir.clone().multiplyScalar(70.0), life: 2.0 });
            scene.add(bullet);
        }

        function respawnAtCheckpoint() {
            controls.getObject().position.copy(respawnPosition); playerVelocity.set(0, 0, 0);
            jumpsLeft = MAX_JUMPS; refillAllAmmo();
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        function restartGame() {
            currentLevel = 1; score = 0; isGameOver = false; hudScore.textContent = score;
            buildTower(currentLevel); controls.lock();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = (time - prevTime) / 1000;
            
            if (controls.isLocked && !isGameOver) {
                if (rewardCrystal) rewardCrystal.rotation.y += 2.0 * delta;

                // --- 凌空石動態邏輯 ---
                if (skyStoneState === 'FLYING') {
                    skyStoneMesh.position.addScaledVector(skyStoneVelocity, delta);
                    skyStoneMesh.rotation.x += 5.0 * delta;
                    skyStoneMesh.rotation.y += 5.0 * delta;

                    // 飛行一段距離後停住，展開反重力平台
                    if (camera.position.distanceTo(skyStoneMesh.position) > 18.0) {
                        skyStoneState = 'ANCHORED';
                        skyStonePlatform.position.copy(skyStoneMesh.position);
                        skyStonePlatform.position.y -= 0.3;
                        skyStonePlatform.visible = true;
                        updateHUD();
                    }
                } else if (skyStoneState === 'ANCHORED') {
                    skyStoneMesh.rotation.y += 3.0 * delta;
                } else if (skyStoneState === 'COOLDOWN') {
                    skyStoneCooldownTimer -= delta;
                    updateHUD();
                    if (skyStoneCooldownTimer <= 0) {
                        skyStoneState = 'READY';
                        updateHUD();
                    }
                }

                const playerObj = controls.getObject();

                let moveVector = new THREE.Vector3();
                let moveSpeed = 26.0 * delta;
                const frontDir = new THREE.Vector3(); camera.getWorldDirection(frontDir); frontDir.y = 0; frontDir.normalize();
                const sideDir = new THREE.Vector3().crossVectors(camera.up, frontDir).normalize();
                if (moveForward) moveVector.addScaledVector(frontDir, moveSpeed); if (moveBackward) moveVector.addScaledVector(frontDir, -moveSpeed);
                if (moveLeft) moveVector.addScaledVector(sideDir, moveSpeed); if (moveRight) moveVector.addScaledVector(sideDir, -moveSpeed);

                playerVelocity.y -= GRAVITY * delta; playerVelocity.x *= 0.94; playerVelocity.z *= 0.94;
                playerObj.position.add(moveVector); playerObj.position.addScaledVector(playerVelocity, delta);

                // 碰撞檢測 (包含凌空石平台)
                const playerFeetY = playerObj.position.y - STAND_HEIGHT;
                const allPlatforms = [...obstacles];
                if (skyStonePlatform.visible) allPlatforms.push(skyStonePlatform);

                for (let obs of allPlatforms) {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (playerObj.position.x >= obsBox.min.x - 0.4 && playerObj.position.x <= obsBox.max.x + 0.4 && playerObj.position.z >= obsBox.min.z - 0.4 && playerObj.position.z <= obsBox.max.z + 0.4) {
                        const platTop = obsBox.max.y;
                        if (playerFeetY <= platTop && playerFeetY >= platTop - 1.4 && playerVelocity.y <= 0) {
                            playerObj.position.y = platTop + STAND_HEIGHT; playerVelocity.y = 0;
                            jumpsLeft = MAX_JUMPS; updateHUD();

                            if (obs.userData.isCheckpoint) {
                                if (activeCheckpointIndex !== obs.userData.id) {
                                    activeCheckpointIndex = obs.userData.id;
                                    respawnPosition.set(obs.position.x, obs.position.y + 3.0, obs.position.z);
                                    refillAllAmmo();
                                    checkpointNotify.style.display = 'block'; notifyTimer = 2.0;
                                }
                            }
                            break;
                        }
                    }
                }

                if (playerObj.position.y <= -3.0) respawnAtCheckpoint();

                if (rewardCrystal && playerObj.position.distanceTo(rewardCrystal.position) < 3.0) { 
                    score += 500; hudScore.textContent = score; currentLevel++; buildTower(currentLevel); 
                }

                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.mesh.position.addScaledVector(p.velocity, delta); p.life -= delta;
                    if (p.life <= 0) { scene.remove(p.mesh); projectiles.splice(i, 1); }
                }
            }
            prevTime = time; renderer.render(scene, camera);
        }
        window.onload = init;
    </script>
</body>
</html>
