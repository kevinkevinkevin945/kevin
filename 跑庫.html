<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一人稱槍戰 · 武器庫</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px 28px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 10;
            font-size: 16px;
            user-select: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        #ui .weapon {
            padding: 6px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        #ui .weapon.active {
            background: rgba(255,215,0,0.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.15);
        }
        #ui .weapon:hover { background: rgba(255,255,255,0.1); }
        #ui .weapon kbd { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; margin-right: 6px; font-size: 12px; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            font-size: 30px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #crosshair::before { content: '+'; font-size: 32px; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            user-select: none;
        }
        #info span { margin-right: 8px; }
        #ammo {
            position: absolute;
            bottom: 100px;
            right: 30px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            font-family: 'Courier New', monospace;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.88);
            padding: 40px 60px;
            border-radius: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,100,100,0.3);
            z-index: 30;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #gameover h2 { font-size: 38px; color: #ff6b6b; margin-bottom: 6px; }
        #gameover .final-score { font-size: 24px; color: #ffd700; margin: 12px 0; }
        #gameover .restart-hint { font-size: 16px; color: #aaa; margin-top: 16px; }
        #pointer-lock-warning {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,200,100,0.8);
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,200,100,0.15);
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        #health-bar {
            position: absolute;
            bottom: 100px;
            left: 30px;
            width: 200px;
            height: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8800, #44ff44);
            border-radius: 10px;
            transition: width 0.2s;
        }
        #health-label {
            position: absolute;
            bottom: 116px;
            left: 30px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            #ui { font-size: 12px; padding: 8px 16px; gap: 8px; bottom: 15px; }
            #ui .weapon { padding: 4px 10px; font-size: 11px; }
            #info { font-size: 14px; padding: 4px 12px; }
            #ammo { font-size: 20px; padding: 4px 14px; bottom: 80px; right: 15px; }
            #health-bar { width: 120px; height: 10px; bottom: 80px; left: 15px; }
            #health-label { font-size: 10px; bottom: 94px; left: 15px; }
            #crosshair { font-size: 22px; }
            #crosshair::before { font-size: 24px; }
            #gameover { padding: 24px 20px; width: 80%; }
            #gameover h2 { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div id="info">🎯 擊殺: <span id="kills">0</span></div>
    <div id="crosshair"></div>
    <div id="health-label">❤️ 生命</div>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="ammo">🔫 <span id="ammo-count">30</span> / <span id="ammo-max">30</span></div>
    <div id="pointer-lock-warning">🖱️ 點擊畫面鎖定滑鼠 · 左鍵射擊</div>
    <div id="ui">
        <div class="weapon active" data-weapon="pistol"><kbd>1</kbd> 手槍</div>
        <div class="weapon" data-weapon="rifle"><kbd>2</kbd> 步槍</div>
        <div class="weapon" data-weapon="shotgun"><kbd>3</kbd> 霰彈槍</div>
        <div class="weapon" data-weapon="sniper"><kbd>4</kbd> 狙擊槍</div>
        <div class="weapon" data-weapon="smg"><kbd>5</kbd> 衝鋒槍</div>
        <div class="weapon" data-weapon="rocket"><kbd>6</kbd> 火箭筒</div>
        <div class="weapon" data-weapon="minigun"><kbd>7</kbd> 火神炮</div>
    </div>
    <div id="gameover">
        <h2>💀 陣亡</h2>
        <div class="final-score">擊殺數: <span id="finalKills">0</span></div>
        <div class="restart-hint">點擊 或 按 <kbd>R</kbd> 重新開始</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        //  場景 / 相機 / 渲染器
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 40, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ============================================================
        //  燈光
        // ============================================================
        const ambient = new THREE.AmbientLight(0x40406b, 0.5);
        scene.add(ambient);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        sunLight.position.set(10, 25, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 60;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.2);
        fill.position.set(-8, 5, 10);
        scene.add(fill);

        // ============================================================
        //  地面
        // ============================================================
        const groundGeo = new THREE.PlaneGeometry(60, 60);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.9,
            metalness: 0.1,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // 地面網格
        const gridHelper = new THREE.GridHelper(60, 30, 0x333366, 0x222244);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // ============================================================
        //  武器系統
        // ============================================================
        const weapons = {
            pistol: { name: '手槍', damage: 25, fireRate: 200, ammo: 12, maxAmmo: 12, spread: 0.02, bulletSpeed: 80, auto: false, color: 0xffdd44 },
            rifle: { name: '步槍', damage: 35, fireRate: 100, ammo: 30, maxAmmo: 30, spread: 0.015, bulletSpeed: 100, auto: true, color: 0x44ddff },
            shotgun: { name: '霰彈槍', damage: 12, fireRate: 400, ammo: 8, maxAmmo: 8, spread: 0.12, bulletSpeed: 70, auto: false, color: 0xff8844, pellets: 8 },
            sniper: { name: '狙擊槍', damage: 100, fireRate: 600, ammo: 5, maxAmmo: 5, spread: 0.003, bulletSpeed: 150, auto: false, color: 0x44ff88 },
            smg: { name: '衝鋒槍', damage: 18, fireRate: 60, ammo: 50, maxAmmo: 50, spread: 0.045, bulletSpeed: 75, auto: true, color: 0xff66aa },
            rocket: { name: '火箭筒', damage: 120, fireRate: 800, ammo: 3, maxAmmo: 3, spread: 0.005, bulletSpeed: 40, auto: false, color: 0xff4400, explosive: true },
            minigun: { name: '火神炮', damage: 15, fireRate: 30, ammo: 200, maxAmmo: 200, spread: 0.06, bulletSpeed: 90, auto: true, color: 0x88ff44 },
        };

        let currentWeapon = 'pistol';
        let ammo = { ...weapons.pistol };
        let kills = 0;
        let health = 100;
        let maxHealth = 100;
        let isShooting = false;
        let lastFireTime = 0;
        let gameActive = true;
        let gameOver = false;

        // ============================================================
        //  滑鼠控制
        // ============================================================
        const pointerLockWarning = document.getElementById('pointer-lock-warning');
        let isPointerLocked = false;
        let yaw = 0;
        let pitch = 0;

        document.addEventListener('click', () => {
            if (!isPointerLocked && !gameOver) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
            pointerLockWarning.style.display = isPointerLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked || gameOver) return;
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        });

        // ============================================================
        //  射擊系統
        // ============================================================
        const bullets = [];
        const enemies = [];
        const explosions = [];

        function createBullet(origin, direction, weaponKey) {
            const weapon = weapons[weaponKey];
            const spread = weapon.spread;
            const dir = direction.clone();
            dir.x += (Math.random() - 0.5) * spread;
            dir.y += (Math.random() - 0.5) * spread;
            dir.z += (Math.random() - 0.5) * spread;
            dir.normalize();

            const color = weapon.color || 0xffdd44;
            const bulletMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.8,
            });
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), bulletMat);
            bullet.position.copy(origin);
            bullet.castShadow = true;
            scene.add(bullet);

            // 彈道光線 (曳光)
            const trailMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3,
            });
            const trail = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 4), trailMat);
            trail.rotation.x = Math.PI / 2;
            trail.position.copy(origin);
            scene.add(trail);

            const bulletData = {
                mesh: bullet,
                trail: trail,
                velocity: dir.clone().multiplyScalar(weapon.bulletSpeed || 80),
                damage: weapon.damage || 25,
                life: 3.0,
                weapon: weaponKey,
                isExplosive: weapon.explosive || false,
            };
            bullets.push(bulletData);
            return bulletData;
        }

        function shoot() {
            if (gameOver || !gameActive) return;
            const now = Date.now();
            const weapon = weapons[currentWeapon];
            if (now - lastFireTime < weapon.fireRate) return;
            if (ammo[currentWeapon] <= 0) {
                // 自動換彈 (簡單處理)
                return;
            }

            lastFireTime = now;
            ammo[currentWeapon]--;
            updateAmmoUI();

            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(camera.quaternion);

            const origin = camera.position.clone();
            origin.y += 0.1;

            const pellets = weapon.pellets || 1;
            for (let i = 0; i < pellets; i++) {
                createBullet(origin, dir, currentWeapon);
            }

            // 槍口閃光效果
            createMuzzleFlash(origin, dir);

            // 後座力 (視覺)
            pitch += 0.005 * (weapon.damage / 25);
        }

        function createMuzzleFlash(origin, dir) {
            const flashMat = new THREE.MeshBasicMaterial({
                color: 0xffff88,
                transparent: true,
                opacity: 0.8,
            });
            const flash = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), flashMat);
            flash.position.copy(origin);
            flash.position.add(dir.clone().multiplyScalar(-0.3));
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 50);
        }

        // ============================================================
        //  敵人生成
        // ============================================================
        function spawnEnemy() {
            if (gameOver || !gameActive) return;
            const radius = 20 + Math.random() * 15;
            const angle = Math.random() * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            const enemyMat = new THREE.MeshStandardMaterial({
                color: 0xff4444,
                emissive: new THREE.Color(0x661111),
                emissiveIntensity: 0.3,
                roughness: 0.5,
            });
            const enemy = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), enemyMat);
            enemy.position.set(x, 0.6, z);
            enemy.castShadow = true;
            enemy.receiveShadow = true;
            scene.add(enemy);

            // 敵人眼睛
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
            eye.position.set(0, 0.2, 0.35);
            enemy.add(eye);
            const eye2 = eye.clone();
            eye2.position.x = -0.2;
            enemy.add(eye2);

            // 敵人的槍
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.4), gunMat);
            gun.position.set(0, 0, 0.4);
            enemy.add(gun);

            const enemyData = {
                mesh: enemy,
                health: 30 + Math.random() * 20,
                maxHealth: 50,
                speed: 1.5 + Math.random() * 1.5,
                attackRange: 8,
                attackCooldown: 0,
                damage: 10,
                state: 'chase', // chase, attack
                lastAttackTime: 0,
            };
            enemies.push(enemyData);
        }

        // ============================================================
        //  爆炸效果
        // ============================================================
        function createExplosion(position, radius = 3, damage = 60) {
            // 爆炸球體
            const expMat = new THREE.MeshBasicMaterial({
                color: 0xff4400,
                transparent: true,
                opacity: 0.6,
            });
            const exp = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), expMat);
            exp.position.copy(position);
            scene.add(exp);

            // 爆炸範圍內敵人受到傷害
            enemies.forEach((enemy, index) => {
                const dist = position.distanceTo(enemy.mesh.position);
                if (dist < radius) {
                    const dmg = damage * (1 - dist / radius);
                    enemy.health -= dmg;
                    if (enemy.health <= 0) {
                        killEnemy(index);
                    }
                }
            });

            // 動畫
            let scale = 0.5;
            const expandInterval = setInterval(() => {
                scale += 0.3;
                exp.scale.set(scale, scale, scale);
                exp.material.opacity -= 0.03;
                if (exp.material.opacity <= 0) {
                    clearInterval(expandInterval);
                    scene.remove(exp);
                }
            }, 30);
        }

        // ============================================================
        //  擊殺與傷害
        // ============================================================
        function killEnemy(index) {
            const enemy = enemies[index];
            if (!enemy) return;
            scene.remove(enemy.mesh);
            enemies.splice(index, 1);
            kills++;
            document.getElementById('kills').innerText = kills;
            // 隨機掉落彈藥
            if (Math.random() < 0.3) {
                const keys = Object.keys(weapons);
                const wKey = keys[Math.floor(Math.random() * keys.length)];
                ammo[wKey] = Math.min(ammo[wKey] + 5, weapons[wKey].maxAmmo);
                updateAmmoUI();
            }
        }

        function takeDamage(dmg) {
            health -= dmg;
            document.getElementById('health-fill').style.width = (health / maxHealth * 100) + '%';
            if (health <= 0) {
                health = 0;
                gameOver = true;
                gameActive = false;
                document.getElementById('finalKills').innerText = kills;
                document.getElementById('gameover').style.display = 'block';
                if (isPointerLocked) document.exitPointerLock();
            }
        }

        // ============================================================
        //  UI 更新
        // ============================================================
        function updateAmmoUI() {
            const weapon = weapons[currentWeapon];
            document.getElementById('ammo-count').innerText = ammo[currentWeapon] || 0;
            document.getElementById('ammo-max').innerText = weapon.maxAmmo;
        }

        function updateWeaponUI() {
            document.querySelectorAll('.weapon').forEach(el => {
                el.classList.toggle('active', el.dataset.weapon === currentWeapon);
            });
            updateAmmoUI();
        }

        // ============================================================
        //  武器切換
        // ============================================================
        document.querySelectorAll('.weapon').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.weapon;
                if (weapons[key]) {
                    currentWeapon = key;
                    updateWeaponUI();
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 7) {
                const keys = Object.keys(weapons);
                if (keys[num - 1]) {
                    currentWeapon = keys[num - 1];
                    updateWeaponUI();
                }
            }
            if (e.code === 'Space') {
                e.preventDefault();
                // 換彈 (簡易：補滿)
                const weapon = weapons[currentWeapon];
                ammo[currentWeapon] = weapon.maxAmmo;
                updateAmmoUI();
            }
            if (e.key === 'r' && gameOver) {
                restartGame();
            }
        });

        // 射擊
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isShooting = true;
                if (isPointerLocked) {
                    const weapon = weapons[currentWeapon];
                    if (!weapon.auto) {
                        shoot();
                    }
                }
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) isShooting = false;
        });

        // 自動射擊
        let autoShootInterval = null;

        function startAutoShoot() {
            if (autoShootInterval) return;
            autoShootInterval = setInterval(() => {
                if (isShooting && isPointerLocked && !gameOver) {
                    const weapon = weapons[currentWeapon];
                    if (weapon.auto) {
                        shoot();
                    }
                }
            }, 30);
        }
        startAutoShoot();

        // ============================================================
        //  遊戲控制
        // ============================================================
        document.getElementById('gameover').addEventListener('click', () => {
            if (gameOver) restartGame();
        });

        function restartGame() {
            // 清除所有敵人
            enemies.forEach(e => scene.remove(e.mesh));
            enemies.length = 0;
            // 清除所有子彈
            bullets.forEach(b => { scene.remove(b.mesh); if (b.trail) scene.remove(b.trail); });
            bullets.length = 0;
            // 重置狀態
            health = maxHealth;
            kills = 0;
            gameOver = false;
            gameActive = true;
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('kills').innerText = '0';
            document.getElementById('health-fill').style.width = '100%';
            // 重置彈藥
            Object.keys(weapons).forEach(key => {
                ammo[key] = weapons[key].maxAmmo;
            });
            currentWeapon = 'pistol';
            updateWeaponUI();
            // 重置相機
            yaw = 0;
            pitch = 0;
            camera.position.set(0, 1.5, 0);
            // 生成初始敵人
            for (let i = 0; i < 5; i++) setTimeout(spawnEnemy, i * 300);
        }

        // ============================================================
        //  遊戲主循環
        // ============================================================
        let enemySpawnTimer = 0;
        let lastTime = Date.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();
            const delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (gameActive && !gameOver) {
                // ---- 相機更新 ----
                const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);

                // ---- 更新子彈 ----
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.mesh.position.add(b.velocity.clone().multiplyScalar(delta));
                    if (b.trail) {
                        b.trail.position.copy(b.mesh.position);
                        b.trail.position.y += 0.1;
                    }
                    b.life -= delta;

                    // 子彈與敵人碰撞
                    let bulletUsed = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        const dist = b.mesh.position.distanceTo(enemy.mesh.position);
                        if (dist < 0.8) {
                            enemy.health -= b.damage;
                            if (b.isExplosive) {
                                createExplosion(b.mesh.position, 4, 80);
                            }
                            if (enemy.health <= 0) {
                                killEnemy(j);
                            }
                            bulletUsed = true;
                            break;
                        }
                    }

                    // 子彈與地面碰撞 (消失)
                    if (b.mesh.position.y < 0) bulletUsed = true;

                    if (bulletUsed || b.life <= 0 || b.mesh.position.length() > 60) {
                        scene.remove(b.mesh);
                        if (b.trail) scene.remove(b.trail);
                        bullets.splice(i, 1);
                    }
                }

                // ---- 更新敵人 ----
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    const toPlayer = camera.position.clone().sub(enemy.mesh.position);
                    const dist = toPlayer.length();

                    // 敵人AI
                    if (dist < enemy.attackRange) {
                        // 攻擊
                        if (now - enemy.lastAttackTime > 1000) {
                            enemy.lastAttackTime = now;
                            // 發射子彈 (敵人的)
                            const dir = toPlayer.clone().normalize();
                            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
                            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 4), bulletMat);
                            bullet.position.copy(enemy.mesh.position);
                            bullet.position.y += 0.8;
                            scene.add(bullet);
                            const bData = {
                                mesh: bullet,
                                velocity: dir.clone().multiplyScalar(15),
                                life: 2,
                                isEnemy: true,
                            };
                            bullets.push(bData);
                        }
                    } else {
                        // 追趕玩家
                        const moveDir = toPlayer.clone().normalize();
                        moveDir.y = 0;
                        enemy.mesh.position.add(moveDir.clone().multiplyScalar(enemy.speed * delta));
                        // 面向玩家
                        enemy.mesh.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
                    }

                    // 敵人碰撞玩家
                    if (dist < 0.8) {
                        takeDamage(5);
                        // 擊退敵人
                        enemy.mesh.position.add(toPlayer.clone().normalize().multiplyScalar(-2));
                    }
                }

                // ---- 生成敵人 ----
                enemySpawnTimer += delta;
                if (enemySpawnTimer > 2 && enemies.length < 12 + Math.floor(kills / 3)) {
                    enemySpawnTimer = 0;
                    spawnEnemy();
                }

                // ---- 敵人子彈碰撞玩家 ----
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    if (b.isEnemy) {
                        const dist = b.mesh.position.distanceTo(camera.position);
                        if (dist < 0.5) {
                            takeDamage(8);
                            scene.remove(b.mesh);
                            bullets.splice(i, 1);
                            continue;
                        }
                        if (b.mesh.position.y < 0 || b.life <= 0) {
                            scene.remove(b.mesh);
                            bullets.splice(i, 1);
                        }
                    }
                }

                // ---- 自動射擊 (連續) ----
                if (isShooting && isPointerLocked && !gameOver) {
                    const weapon = weapons[currentWeapon];
                    if (weapon.auto) {
                        shoot();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // ============================================================
        //  視窗縮放
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        //  啟動
        // ============================================================
        // 初始化彈藥
        Object.keys(weapons).forEach(key => {
            ammo[key] = weapons[key].maxAmmo;
        });
        updateWeaponUI();
        document.getElementById('health-fill').style.width = '100%';
        pointerLockWarning.style.display = 'block';

        // 生成初始敵人
        for (let i = 0; i < 4; i++) setTimeout(spawnEnemy, i * 400);

        animate();
        console.log('第一人稱槍戰已啟動！1-7 切換武器，左鍵射擊，空格換彈。');
    </script>
</body>
</html>
