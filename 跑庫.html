<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Parkour - 移動平台與無限關卡</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">距離: <span id="progress">0</span> 米</div>
    <div id="instructions">
        <b>[W][A][S][D]</b> 平穩移動 ｜ <b>[空白鍵]</b> 跳躍 ｜ 注意移動平台！
    </div>

    <script>
        // --- 1. 初始化場景與相機 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e2f);
        scene.fog = new THREE.Fog(0x1e1e2f, 20, 90);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 光照 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(15, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- 3. 建立 3D 角色 ---
        function createCharacter() {
            const group = new THREE.Group();

            // 身體
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 1.2, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x4cc9f0 })
            );
            body.position.y = 1.2;
            body.castShadow = true;
            group.add(body);

            // 頭部
            const head = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.6, 0.6),
                new THREE.MeshStandardMaterial({ color: 0xffddd2 })
            );
            head.position.y = 2.1;
            head.castShadow = true;
            group.add(head);

            return group;
        }

        const player = createCharacter();
        scene.add(player);

        // --- 4. 平台與動態無限生成屬性 ---
        const platforms = [];
        let nextZ = 0; // 下一個生成的 Z 軸位置
        const platformSpacing = 10; // 平台間隔

        // 建立單個平台
        function spawnPlatform(zPos) {
            const isStart = zPos === 0;
            const isMoving = !isStart && Math.random() > 0.4; // 60% 機率是移動平台
            const width = isStart ? 8 : (4 + Math.random() * 2);
            const depth = isStart ? 10 : (5 + Math.random() * 3);

            const geo = new THREE.BoxGeometry(width, 1, depth);
            const mat = new THREE.MeshStandardMaterial({ 
                color: isStart ? 0x4361ee : (isMoving ? 0xf72585 : 0x3a0ca3) 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, -0.5, zPos);
            mesh.receiveShadow = true;
            scene.add(mesh);

            // 平台物件資料
            const platformObj = {
                mesh: mesh,
                width: width,
                depth: depth,
                isMoving: isMoving,
                moveRange: 3.5 + Math.random() * 2,
                moveSpeed: 0.02 + Math.random() * 0.015, // 控制移動平台速度（較慢且平穩）
                moveOffset: Math.random() * Math.PI * 2,
                deltaX: 0 // 本影格的位移量
            };

            platforms.push(platformObj);
        }

        // 初始化前幾個平台
        for (let i = 0; i < 15; i++) {
            spawnPlatform(nextZ);
            nextZ -= platformSpacing;
        }

        // --- 5. 控制邏輯 ---
        const keys = { w: false, a: false, s: false, d: false, space: false };

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 'a') keys.a = true;
            if (k === 's') keys.s = true;
            if (k === 'd') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 'a') keys.a = false;
            if (k === 's') keys.s = false;
            if (k === 'd') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 玩家物理變數
        let velX = 0, velZ = 0, velY = 0;
        const speed = 0.12; // 調整為平穩的速度
        const gravity = -0.012;
        const jumpForce = 0.28;
        let isGrounded = false;
        let currentPlatform = null; // 當前踩著的平台

        // --- 6. 主遊戲循環 ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.03;

            // 1. 更新所有移動平台位置，並計算它們本幀的移動量 (deltaX)
            platforms.forEach(p => {
                if (p.isMoving) {
                    const oldX = p.mesh.position.x;
                    p.mesh.position.x = Math.sin(time * p.moveSpeed * 5 + p.moveOffset) * p.moveRange;
                    p.deltaX = p.mesh.position.x - oldX;
                } else {
                    p.deltaX = 0;
                }
            });

            // 2. 角色 WASD 移動計算
            velX = 0;
            velZ = 0;
            if (keys.w) velZ -= speed;
            if (keys.s) velZ += speed;
            if (keys.a) velX -= speed;
            if (keys.d) velX += speed;

            player.position.x += velX;
            player.position.z += velZ;

            // 如果玩家站在移動平台上，跟著平台一起移動！
            if (isGrounded && currentPlatform) {
                player.position.x += currentPlatform.deltaX;
            }

            // 轉向控制
            if (velX !== 0 || velZ !== 0) {
                player.rotation.y = Math.atan2(velX, velZ);
            }

            // 3. 跳躍與重力處理
            if (keys.space && isGrounded) {
                velY = jumpForce;
                isGrounded = false;
                currentPlatform = null;
            }

            player.position.y += velY;
            velY += gravity;

            // 4. 地面/平台碰撞檢測
            isGrounded = false;
            currentPlatform = null;

            const playerX = player.position.x;
            const playerY = player.position.y;
            const playerZ = player.position.z;

            for (let p of platforms) {
                const pPos = p.mesh.position;
                
                // 檢查是否落在平台範圍內
                const inX = Math.abs(playerX - pPos.x) <= p.width / 2 + 0.3;
                const inZ = Math.abs(playerZ - pPos.z) <= p.depth / 2 + 0.3;
                const onY = playerY <= pPos.y + 1.0 && playerY >= pPos.y + 0.3;

                if (inX && inZ && onY && velY <= 0) {
                    player.position.y = pPos.y + 1.0;
                    velY = 0;
                    isGrounded = true;
                    currentPlatform = p;
                    break;
                }
            }

            // 5. 跌落判定（掉下去就死）
            if (player.position.y < -5) {
                alert(`遊戲結束！你一共前進了 ${Math.max(0, Math.floor(-player.position.z))} 米`);
                resetGame();
            }

            // 6. 無限地圖動態生成與舊平台回收
            if (player.position.z < nextZ + 100) {
                spawnPlatform(nextZ);
                nextZ -= platformSpacing;
            }

            // 清除身後太遠的平台，節省資源
            for (let i = platforms.length - 1; i >= 0; i--) {
                if (platforms[i].mesh.position.z > player.position.z + 20) {
                    scene.remove(platforms[i].mesh);
                    platforms[i].mesh.geometry.dispose();
                    platforms[i].mesh.material.dispose();
                    platforms.splice(i, 1);
                }
            }

            // 7. 更新介面與攝影機跟隨
            document.getElementById('progress').innerText = Math.max(0, Math.floor(-player.position.z));

            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 4;
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 2);

            renderer.render(scene, camera);
        }

        // 重置遊戲
        function resetGame() {
            // 清理所有舊平台
            platforms.forEach(p => scene.remove(p.mesh));
            platforms.length = 0;

            // 重設玩家
            player.position.set(0, 1, 0);
            velX = 0;
            velY = 0;
            velZ = 0;
            isGrounded = true;
            currentPlatform = null;

            // 重新生成初始地圖
            nextZ = 0;
            for (let i = 0; i < 15; i++) {
                spawnPlatform(nextZ);
                nextZ -= platformSpacing;
            }
        }

        // 視窗調整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
