<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧安全加解密系統 </title>
    <style>
        body {
            font-family: 'Segoe UI', Microsoft JhengHei, Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: #fff;
        }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        textarea { height: 100px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-encode { background-color: #3498db; }
        .btn-encode:hover { background-color: #2980b9; }
        .btn-decode { background-color: #2ecc71; }
        .btn-decode:hover { background-color: #27ae60; }
        .btn-copy { background-color: #e67e22; }
        .btn-copy:hover { background-color: #d35400; }
        .btn-verify { background-color: #9b59b6; margin-top: 10px; width: 100%; }
        .btn-verify:hover { background-color: #8e44ad; }
        
        .admin-box {
            background-color: #fce4ec;
            border: 1px solid #f8bbd0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .btn-admin-save { background-color: #e74c3c; margin-top: 8px; width: 100%; }
        .btn-admin-save:hover { background-color: #c0392b; }
        .btn-change-pw { background-color: #34495e; margin-top: 5px; width: 100%; }
        .btn-change-pw:hover { background-color: #2c3e50; }
        
        .hidden { display: none !important; }
        .permission-box {
            background-color: #eef7fc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #bce8f1;
            margin-bottom: 15px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // 設定專屬 Firebase 資訊
        const firebaseConfig = {
            databaseURL: "https://kevin-73684-default-rtdb.firebaseio.com",
            projectId: "kevin-73684"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 預設成員密碼對照表 (成員 1 ~ 8)
        const DEFAULT_PASSWORDS = {
            "1": "userpass1", 
            "2": "userpass2",  
            "3": "userpass3",
            "4": "userpass4",
            "5": "userpass5",
            "6": "userpass6",
            "7": "userpass7",
            "8": "userpass8"
        };

        // 從 Firebase 雲端讀取最新密碼
        window.getCloudPasswords = async function() {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, "SYSTEM_MEMBER_KEYS"));
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    await set(ref(db, "SYSTEM_MEMBER_KEYS"), DEFAULT_PASSWORDS);
                    return DEFAULT_PASSWORDS;
                }
            } catch (error) {
                console.error("雲端讀取失敗:", error);
                alert("⚠️ 連接 Firebase 失敗，請確認資料庫 Rules 權限已開放！");
                return DEFAULT_PASSWORDS;
            }
        };

        // 將最新密碼寫入 Firebase 雲端
        window.updateCloudPasswords = async function(newPasswords) {
            try {
                await set(ref(db, "SYSTEM_MEMBER_KEYS"), newPasswords);
                return true;
            } catch (error) {
                console.error("雲端更新失敗:", error);
                alert("❌ 雲端密碼寫入失敗！");
                return false;
            }
        };
    </script>
</head>
<body>

    <h2>🔐 加解密系統 </h2>

    <div id="authBlock" class="form-group">
        <label for="userKey">🔑 請輸入存取安全金鑰密碼：</label>
        <input type="password" id="userKey" placeholder="請輸入您的金鑰密碼...">
        <button class="btn-verify" onclick="verifyPassword()">🔓 登入系統</button>
    </div>

    <div id="mainBlock" class="hidden">
        
        <div id="adminControlBox" class="admin-box hidden">
            <label>👑 <b>管理員控制台：修改任意成員密碼</b></label>
            <div style="display: flex; gap: 10px; margin-top: 8px;">
                <select id="adminTargetSelect" style="flex: 1;" onchange="loadSelectedMemberPass()">
                    </select>
                <input type="text" id="adminNewPassInput" style="flex: 2;" placeholder="該成員的新密碼...">
            </div>
            <button class="btn-admin-save" onclick="adminChangeMemberPassword()">💾 儲存變更至雲端</button>
        </div>
          
        <div class="form-group">
            <label for="inputText">📝 輸入文字（支援中文/英文/數字）：</label>
            <textarea id="inputText" placeholder="加密：輸入中文或英文內容&#10;解密：貼上包含 0-9 數字的密文..."></textarea>
        </div>

        <div class="permission-box">
            <label for="accessScope">🎯 選擇誰可以解密這段密文：</label>
            <select id="accessScope" onchange="toggleTargetSelect()">
                <option value="self">🔒 僅我自己可解密</option>
                <option value="public">🌐 開放所有人（大家都可以解密）</option>
                <option value="specific">👤 指定特定成員解密...</option>
            </select>

            <div id="targetMemberGroup" class="hidden" style="margin-top: 10px;">
                <label for="targetMemberSelect">👥 請選擇指定接收者：</label>
                <select id="targetMemberSelect">
                    </select>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-encode" onclick="encodeProcess()">加密</button>
            <button class="btn-decode" onclick="decodeProcess()">解密</button>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label for="outputText">✨ 輸出結果：</label>
            <textarea id="outputText" readonly placeholder="結果會顯示在這裡..."></textarea>
        </div>

        <button class="btn-copy" onclick="copyResult()">📋 一鍵複製結果</button>
        
        <br><br>
        <div class="form-group" style="border-top: 1px dashed #ccc; padding-top: 15px;">
            <label>🛠️ 帳號安全：修改【您自己】目前的專屬金鑰密碼</label>
            <input type="password" id="newPasswordInput" placeholder="輸入想要變更的新密碼...">
            <button class="btn-change-pw" onclick="changeMyPassword()">💾 確認修改並同步至雲端</button>
        </div>
    </div>

<script>
const SUPER_ADMIN_KEY = "kevinisbabybear@Kevin945";

let currentRole = "user"; 
let loggedInPrefix = "";
let savedRawKey = "";    
let currentCloudPasswords = {};

// 🔤 中文字元 UTF-8 Base64 轉換器
function utf8ToBase64(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
    }));
}

function base64ToUtf8(str) {
    return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
        return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
}

async function verifyPassword() {
    const inputKey = document.getElementById('userKey').value.trim();
    if (!inputKey) {
        alert("⚠️ 請先輸入金鑰密碼！");
        return;
    }

    currentCloudPasswords = await window.getCloudPasswords();
    savedRawKey = inputKey;

    if (inputKey === SUPER_ADMIN_KEY) {
        currentRole = "admin";
        loggedInPrefix = "0";
        document.getElementById('authBlock').classList.add('hidden'); 
        document.getElementById('mainBlock').classList.remove('hidden'); 
        document.getElementById('adminControlBox').classList.remove('hidden'); 
        
        populateAdminDropdown();
        populateMemberDropdown();
        alert("👑 最高管理員登入成功！您可以檢視並修改所有成員密碼。");
    } else {
        const matchedPrefix = Object.keys(currentCloudPasswords).find(prefix => currentCloudPasswords[prefix] === inputKey);
        if (matchedPrefix) {
            currentRole = "user";
            loggedInPrefix = matchedPrefix;
            document.getElementById('authBlock').classList.add('hidden'); 
            document.getElementById('mainBlock').classList.remove('hidden'); 
            populateMemberDropdown();
            alert(`🔓 登入成功！您的身分為：[成員 ${loggedInPrefix}]`);
        } else {
            alert("❌ 密碼驗證失敗！請確認輸入是否正確。");
        }
    }
}

function populateMemberDropdown() {
    const select = document.getElementById('targetMemberSelect');
    select.innerHTML = "";
    
    for (const [prefix] of Object.entries(currentCloudPasswords)) {
        if (prefix !== loggedInPrefix) {
            const opt = document.createElement('option');
            opt.value = prefix;
            opt.textContent = `👤 成員 ${prefix}`;
            select.appendChild(opt);
        }
    }
}

function populateAdminDropdown() {
    const select = document.getElementById('adminTargetSelect');
    select.innerHTML = "";
    
    for (const [prefix] of Object.entries(currentCloudPasswords)) {
        const opt = document.createElement('option');
        opt.value = prefix;
        opt.textContent = `成員 ${prefix}`;
        select.appendChild(opt);
    }
    loadSelectedMemberPass();
}

function loadSelectedMemberPass() {
    const selectVal = document.getElementById('adminTargetSelect').value;
    if (selectVal && currentCloudPasswords[selectVal]) {
        document.getElementById('adminNewPassInput').value = currentCloudPasswords[selectVal];
    }
}

// 👑 管理員修改任意成員密碼
async function adminChangeMemberPassword() {
    if (currentRole !== "admin") return;
    const targetMember = document.getElementById('adminTargetSelect').value;
    const newPass = document.getElementById('adminNewPassInput').value.trim();

    if (!newPass) {
        alert("⚠️ 密碼不可為空白！");
        return;
    }

    currentCloudPasswords[targetMember] = newPass;
    const success = await window.updateCloudPasswords(currentCloudPasswords);
    if (success) {
        alert(`🎉 已成功將 [成員 ${targetMember}] 的密碼更新為「${newPass}」並同步至雲端！`);
    }
}

// 👤 一般成員修改自己密碼
async function changeMyPassword() {
    const newPass = document.getElementById('newPasswordInput').value.trim();
    if (!newPass) {
        alert("⚠️ 請輸入新密碼！");
        return;
    }

    if (currentRole === "admin") {
        alert("⚠️ 最高管理員金鑰無法透過此處修改。");
        return;
    }

    if (loggedInPrefix && currentCloudPasswords[loggedInPrefix] !== undefined) {
        currentCloudPasswords[loggedInPrefix] = newPass;
        const success = await window.updateCloudPasswords(currentCloudPasswords);
        if (success) {
            savedRawKey = newPass; 
            document.getElementById('newPasswordInput').value = "";
            alert("🎉 您的新密碼已成功更新並寫入雲端！");
        }
    }
}

function toggleTargetSelect() {
    const scope = document.getElementById('accessScope').value;
    const targetGroup = document.getElementById('targetMemberGroup');
    if (scope === 'specific') {
        targetGroup.classList.remove('hidden');
    } else {
        targetGroup.classList.add('hidden');
    }
}

function generateRandomDigits(length) {
    let result = '';
    for (let i = 0; i < length; i++) {
        result += Math.floor(Math.random() * 10).toString();
    }
    return result;
}

function cyrb128(str) {
    let h1 = 1779033703, h2 = 3024734765, h3 = 3362453663, h4 = 502494325;
    for (let i = 0, k; i < str.length; i++) {
        k = str.charCodeAt(i);
        h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
        h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
        h3 = h4 ^ Math.imul(h3 ^ k, 2869860233);
        h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    return [(h1^h2)>>>0, h2>>>0, h3>>>0, h4>>>0];
}

function getAuthCode(key, salt) {
    let seed = cyrb128(key + salt);
    return (seed[0] % 10000).toString().padStart(4, '0');
}

// 🔒 加密處理
async function encodeProcess() {
    const input = document.getElementById('inputText').value.trim();
    if (!input) {
        alert("⚠️ 請先輸入要加密的中文或英文內容！");
        return;
    }

    currentCloudPasswords = await window.getCloudPasswords();

    const scope = document.getElementById('accessScope').value;
    let randomPrefix = generateRandomDigits(10);
    let targetKey = "";

    if (scope === "self") {
        targetKey = savedRawKey;
    } else if (scope === "public") {
        targetKey = "PUBLIC_BROADCAST_KEY_2026";
    } else if (scope === "specific") {
        const targetPrefix = document.getElementById('targetMemberSelect').value;
        targetKey = currentCloudPasswords[targetPrefix];
        if (!targetKey) {
            alert("⚠️ 找不到該目標成員的金鑰！");
            return;
        }
    }

    let authCode = getAuthCode(targetKey, randomPrefix);
    let base64Text = utf8ToBase64(input);
    
    let keySeed = cyrb128(targetKey)[0];
    let cipherDigits = "";

    for (let i = 0; i < base64Text.length; i++) {
        let charCode = base64Text.charCodeAt(i);
        let obfuscated = (charCode ^ (keySeed % 256)) % 256;
        cipherDigits += obfuscated.toString().padStart(3, '0');
    }
    
    document.getElementById('outputText').value = randomPrefix + authCode + cipherDigits;
}

// 🔓 解密處理 (包含管理員可解開公開與特定密文)
function decodeProcess() {
    const input = document.getElementById('inputText').value.trim();
    if (!input) {
        alert("⚠️ 請先貼上要解密的數字密文！");
        return;
    }

    let cleanInput = input.replace(/[^0-9]/g, ""); 
    
    if (cleanInput.length <= 14 || (cleanInput.length - 14) % 3 !== 0) {
        alert("❌ 密文格式錯誤或長度不正確！");
        document.getElementById('outputText').value = "？？？ (無效密文)";
        return;
    }
    
    let randomPrefix = cleanInput.substring(0, 10);
    let authCodeInCipher = cleanInput.substring(10, 14);
    
    let publicAuthCode = getAuthCode("PUBLIC_BROADCAST_KEY_2026", randomPrefix);
    let isPublic = (publicAuthCode === authCodeInCipher);
    
    let myAuthCode = getAuthCode(savedRawKey, randomPrefix);
    let isForMe = (myAuthCode === authCodeInCipher);
    
    let activeKey = "";

    // 順序修正：優先判斷公開密文，確保管理員也能成功還原
    if (isPublic) {
        activeKey = "PUBLIC_BROADCAST_KEY_2026";
    } else if (isForMe || currentRole === "admin") {
        activeKey = savedRawKey;
    } else {
        alert("❌ 解密失敗：此密文不是指定給您的，您沒有解密權限！");
        document.getElementById('outputText').value = "❌ 無解密權限";
        return;
    }
    
    let keySeed = cyrb128(activeKey)[0];
    let base64Text = "";

    try {
        for (let i = 14; i < cleanInput.length; i += 3) {
            let numCode = parseInt(cleanInput.substring(i, i + 3), 10);
            let charCode = numCode ^ (keySeed % 256);
            base64Text += String.fromCharCode(charCode);
        }
        
        let originalText = base64ToUtf8(base64Text);
        document.getElementById('outputText').value = originalText;
    } catch (e) {
        alert("❌ 解密失敗：密文已被篡改或無法還原！");
        document.getElementById('outputText').value = "❌ 解密失敗";
    }
}

function copyResult() {
    const outputText = document.getElementById('outputText');
    if (!outputText.value) { 
        alert("⚠️ 目前沒有任何結果可以複製！"); 
        return; 
    }
    outputText.select();
    navigator.clipboard.writeText(outputText.value).then(() => alert("📋 已成功複製到剪貼簿！"));
}
</script>
</body>
</html>
