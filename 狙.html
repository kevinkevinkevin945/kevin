<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 怪物獵殺訓練</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #headshot-feed {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff3333;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 0 10px #ff0000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 15;
        }
        /* 2D 準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(0, 255, 204, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 8px #00ffcc;
        }
        /* 狙擊鏡遮罩 */
        #scope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 6;
            background: radial-gradient(circle at center, transparent 28%, black 32%, black 100%);
        }
        #scope-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 50%; width: 2px; height: 100%;
            background: rgba(0,255,204,0.5);
        }
        #scope-overlay::after {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: rgba(0,255,204,0.5);
        }
        /* 主選單 */
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        h1 {
            margin-bottom: 10px;
            color: #00ffcc;
            font-size: 42px;
            letter-spacing: 3px;
        }
        p {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #111;
            background-color: #00ffcc;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .btn:hover {
            background-color: #00cca3;
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div>得分: <span id="score">0</span></div>
        <div>擊殺怪物數: <span id="kills">0</span></div>
    </div>
    
    <div id="headshot-feed">💥 爆頭一擊必殺！ (HEADSHOT)</div>
    <div id="crosshair"></div>
    <div id="scope-overlay"></div>

    <div id="menu-overlay">
        <h1 id="title-text">3D 怪物獵殺訓練</h1>
        <p id="sub-text">
            【遊戲特色】不限時間，盡情射擊！<br><br>
            <b>[W][A][S][D]</b>：控制人物移動<br>
            <b>[移動滑鼠]</b>：轉動視角<br>
            <b>[按住滑鼠右鍵]</b>：開鏡瞄準<br>
            <b>[點擊滑鼠左鍵]</b>：開火射擊<br><br>
            🎯 <b>打身體 2 槍 death</b> | 🎯 <b>爆頭 1 槍一擊必殺！</b>
        </p>
        <button class="btn" id="start-btn" onclick="startGame()">進入戰場</button>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let monsters = [];
    let score = 0;
    let kills = 0;
    let isPlaying = false;
    let raycaster, mouse;
    let isScoped = false;
    let gunGroup;

    // 移動相關變數
    const keys = { w: false, a: false, s: false, d: false };
    const moveSpeed = 0.15;

    const normalFOV = 60;
    const scopedFOV = 15;

    const scoreEl = document.getElementById('score');
    const killsEl = document.getElementById('kills');
    const headshotFeed = document.getElementById('headshot-feed');
    const menuOverlay = document.getElementById('menu-overlay');
    const scopeOverlay = document.getElementById('scope-overlay');
    const crosshair = document.getElementById('crosshair');

    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e17);
        scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

        camera = new THREE.PerspectiveCamera(normalFOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 0); // 玩家眼部高度

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 地面 (格紋地面)
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f2430, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 網格線增加視覺深度
        const grid = new THREE.GridHelper(200, 50, 0x00ffcc, 0x334455);
        grid.position.y = 0.01;
        scene.add(grid);

        // 建立槍械模型並綁定在攝影機下方
        gunGroup = createGunModel();
        camera.add(gunGroup);
        scene.add(camera);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2(0, 0);

        // 監聽事件
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('keydown', e => handleKey(e, true));
        window.addEventListener('keyup', e => handleKey(e, false));
        window.addEventListener('contextmenu', e => e.preventDefault());

        animate();
    }

    // 建立精致的 3D 步槍模型
    function createGunModel() {
        const gun = new THREE.Group();

        // 槍身材料
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const scopeMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x003322 });

        // 槍管 (Barrel)
        const barrelGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.8, 16);
        const barrel = new THREE.Mesh(barrelGeo, metalMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0, -0.4);
        gun.add(barrel);

        // 槍主體 (Receiver)
        const bodyGeo = new THREE.BoxGeometry(0.06, 0.09, 0.35);
        const body = new THREE.Mesh(bodyGeo, darkMetalMat);
        body.position.set(0, -0.02, -0.1);
        gun.add(body);

        // 彈匣 (Magazine)
        const magGeo = new THREE.BoxGeometry(0.04, 0.18, 0.07);
        const mag = new THREE.Mesh(magGeo, metalMat);
        mag.position.set(0, -0.12, -0.12);
        mag.rotation.x = -0.2;
        gun.add(mag);

        // 瞄準鏡 (Scope)
        const scopeGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.25, 16);
        const scope = new THREE.Mesh(scopeGeo, darkMetalMat);
        scope.rotation.x = Math.PI / 2;
        scope.position.set(0, 0.06, -0.1);
        gun.add(scope);

        // 瞄準鏡鏡片
        const lensGeo = new THREE.CircleGeometry(0.023, 16);
        const lens = new THREE.Mesh(lensGeo, scopeMat);
        lens.position.set(0, 0.06, -0.225);
        gun.add(lens);

        // 槍托 (Stock)
        const stockGeo = new THREE.BoxGeometry(0.05, 0.08, 0.25);
        const stock = new THREE.Mesh(stockGeo, metalMat);
        stock.position.set(0, -0.01, 0.18);
        gun.add(stock);

        // 擺放槍的位置（畫面右下角）
        gun.position.set(0.25, -0.22, -0.45);

        return gun;
    }

    // 建立在地上走動的 3D 怪物模型
    function createMonster() {
        const monster = new THREE.Group();

        // 怪物材質
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xa82828, roughness: 0.6 });
        const headMat = new THREE.MeshStandardMaterial({ color: 0x330000, roughness: 0.3 });
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc });

        // 1. 身體 (Body)
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.4, 12);
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = 0.7;
        bodyMesh.castShadow = true;
        bodyMesh.name = "body"; // 用於部位判定
        monster.add(bodyMesh);

        // 2. 頭部 (Head) - 一擊必殺目標
        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.position.y = 1.65;
        headMesh.castShadow = true;
        headMesh.name = "head"; // 用於部位判定
        monster.add(headMesh);

        // 發光的發紅眼睛
        const eyeGeo = new THREE.BoxGeometry(0.12, 0.06, 0.06);
        const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
        eye1.position.set(0.12, 1.7, -0.3);
        const eye2 = eye1.clone();
        eye2.position.x = -0.12;
        monster.add(eye1);
        monster.add(eye2);

        // 四肢/腳 (腿部裝飾)
        const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
        const leg1 = new THREE.Mesh(legGeo, bodyMat);
        leg1.position.set(0.25, 0.25, 0);
        const leg2 = leg1.clone();
        leg2.position.x = -0.25;
        monster.add(leg1);
        monster.add(leg2);

        // 怪物血量與巡邏屬性
        monster.userData = {
            hp: 2, // 2 血量
            speed: Math.random() * 0.04 + 0.02,
            targetX: (Math.random() - 0.5) * 60,
            targetZ: - (Math.random() * 40 + 10)
        };

        resetMonsterPosition(monster);

        scene.add(monster);
        monsters.push(monster);
    }

    function resetMonsterPosition(monster) {
        monster.userData.hp = 2; // 重置血量
        monster.position.x = (Math.random() - 0.5) * 70;
        monster.position.z = - (Math.random() * 50 + 15);
        monster.position.y = 0;
        
        // 重新繪製顏色（確保從上一輪擊中中復原）
        monster.children.forEach(child => {
            if (child.name === "body") child.material.color.setHex(0xa82828);
        });
    }

    // 滑鼠游標與鏡頭控制
    let yaw = 0, pitch = 0;
    function onMouseMove(event) {
        if (!isPlaying) return;

        const sensitivity = isScoped ? 0.0006 : 0.002;

        yaw -= event.movementX * sensitivity;
        pitch -= event.movementY * sensitivity;

        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    }

    // WASD 移動按鍵
    function handleKey(event, isDown) {
        const key = event.key.toLowerCase();
        if (keys.hasOwnProperty(key)) {
            keys[key] = isDown;
        }
    }

    function updatePlayerMovement() {
        if (!isPlaying) return;

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        if (keys.w) camera.position.addScaledVector(forward, moveSpeed);
        if (keys.s) camera.position.addScaledVector(forward, -moveSpeed);
        if (keys.a) camera.position.addScaledVector(side, -moveSpeed);
        if (keys.d) camera.position.addScaledVector(side, moveSpeed);

        // 確保玩家腳在地上
        camera.position.y = 1.8;
    }

    // 開鏡與開火
    function onMouseDown(event) {
        if (!isPlaying) return;

        // 右鍵：狙擊鏡
        if (event.button === 2) {
            isScoped = true;
            camera.fov = scopedFOV;
            camera.updateProjectionMatrix();
            scopeOverlay.style.display = 'block';
            crosshair.style.display = 'none';
            gunGroup.visible = false; // 開鏡時隱藏槍身
        }

        // 左鍵：射擊
        if (event.button === 0) {
            shoot();
        }
    }

    function onMouseUp(event) {
        if (event.button === 2) {
            isScoped = false;
            camera.fov = normalFOV;
            camera.updateProjectionMatrix();
            scopeOverlay.style.display = 'none';
            crosshair.style.display = 'block';
            gunGroup.visible = true;
        }
    }

    // 核心射擊判定 (區分爆頭與身體擊中)
    function shoot() {
        // 後座力槍身動畫
        if (!isScoped) {
            gunGroup.position.z += 0.05;
            setTimeout(() => gunGroup.position.z -= 0.05, 50);
        }

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        for (let i = 0; i < intersects.length; i++) {
            let hitMesh = intersects[i].object;
            let monsterGroup = hitMesh.parent;

            if (monsters.includes(monsterGroup)) {
                // 1. 擊中頭部：爆頭一擊必殺
                if (hitMesh.name === "head") {
                    showHeadshotUI();
                    score += 200;
                    kills += 1;
                    resetMonsterPosition(monsterGroup);
                } 
                // 2. 擊中身體：兩槍一個死
                else if (hitMesh.name === "body") {
                    monsterGroup.userData.hp -= 1;
                    
                    if (monsterGroup.userData.hp <= 0) {
                        score += 100;
                        kills += 1;
                        resetMonsterPosition(monsterGroup);
                    } else {
                        // 挨第一槍，怪物顏色變深示警
                        hitMesh.material.color.setHex(0x551111);
                    }
                }
                
                scoreEl.textContent = score;
                killsEl.textContent = kills;
                break;
            }
        }
    }

    function showHeadshotUI() {
        headshotFeed.style.opacity = '1';
        setTimeout(() => {
            headshotFeed.style.opacity = '0';
        }, 1000);
    }

    function animate() {
        requestAnimationFrame(animate);

        if (isPlaying) {
            updatePlayerMovement();

            // 怪物巡邏與邊界 AI
            monsters.forEach(monster => {
                const dx = monster.userData.targetX - monster.position.x;
                const dz = monster.userData.targetZ - monster.position.z;
                const dist = Math.hypot(dx, dz);

                if (dist < 1) {
                    // 抵達目的地後隨機設定下一個巡邏點
                    monster.userData.targetX = (Math.random() - 0.5) * 80;
                    monster.userData.targetZ = - (Math.random() * 50 + 10);
                } else {
                    monster.position.x += (dx / dist) * monster.userData.speed;
                    monster.position.z += (dz / dist) * monster.userData.speed;
                    monster.lookAt(monster.userData.targetX, monster.position.y, monster.userData.targetZ);
                }
            });
        }

        renderer.render(scene, camera);
    }

    function startGame() {
        score = 0;
        kills = 0;
        scoreEl.textContent = score;
        killsEl.textContent = kills;
        isPlaying = true;

        document.body.requestPointerLock();

        // 產生 8 隻地上隨機走動的怪物
        monsters.forEach(m => scene.remove(m));
        monsters = [];
        for (let i = 0; i < 8; i++) {
            createMonster();
        }

        menuOverlay.style.display = 'none';
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init3D;
</script>

</body>
</html>
