<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 步槍戰鬥 - 雙視角切換版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #view-mode-tag {
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid #00ffcc;
        }
        #headshot-feed {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff3333;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 0 10px #ff0000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 15;
        }
        /* 準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(0, 255, 204, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 8px #00ffcc;
        }
        /* 狙擊鏡遮罩 */
        #scope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 6;
            background: radial-gradient(circle at center, transparent 28%, black 32%, black 100%);
        }
        #scope-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 50%; width: 2px; height: 100%;
            background: rgba(0,255,204,0.5);
        }
        #scope-overlay::after {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: rgba(0,255,204,0.5);
        }
        /* 主選單 */
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        h1 {
            margin-bottom: 10px;
            color: #00ffcc;
            font-size: 42px;
            letter-spacing: 3px;
        }
        p {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #111;
            background-color: #00ffcc;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .btn:hover {
            background-color: #00cca3;
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div>得分: <span id="score">0</span> | 擊殺數: <span id="kills">0</span></div>
        <div id="view-mode-tag">視角: 第一人稱 (FPP)</div>
    </div>
    
    <div id="headshot-feed">💥 HEADSHOT 爆頭必殺！</div>
    <div id="crosshair"></div>
    <div id="scope-overlay"></div>

    <div id="menu-overlay">
        <h1 id="title-text">3D 戰術步槍模擬</h1>
        <p id="sub-text">
            <b>[W][A][S][D]</b>：角色移動<br>
            <b>[按 V 鍵]</b>：切換 第一人稱(FPP) / 第三人稱(TPP)<br>
            <b>[滑鼠移動]</b>：轉動視角瞄準<br>
            <b>[按住滑鼠右鍵]</b>：開鏡瞄準<br>
            <b>[點擊滑鼠左鍵]</b>：步槍開火射擊<br><br>
            🎯 <b>打身體 2 槍 death</b> | 🎯 <b>爆頭 1 槍一擊必殺！</b>
        </p>
        <button class="btn" id="start-btn" onclick="startGame()">進入遊戲</button>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let monsters = [];
    let score = 0, kills = 0;
    let isPlaying = false;
    let raycaster, mouse;
    let isScoped = false;

    // 視角模式 ( true: 第三人稱 TPP, false: 第一人稱 FPP )
    let isThirdPerson = false;

    // 玩家模型與槍枝容器
    let playerGroup, rifleMesh;

    // 按鍵狀態
    const keys = { w: false, a: false, s: false, d: false };
    const moveSpeed = 0.15;

    const normalFOV = 60;
    const scopedFOV = 15;

    const scoreEl = document.getElementById('score');
    const killsEl = document.getElementById('kills');
    const headshotFeed = document.getElementById('headshot-feed');
    const menuOverlay = document.getElementById('menu-overlay');
    const scopeOverlay = document.getElementById('scope-overlay');
    const crosshair = document.getElementById('crosshair');
    const viewModeTag = document.getElementById('view-mode-tag');

    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050811);
        scene.fog = new THREE.FogExp2(0x050811, 0.012);

        camera = new THREE.PerspectiveCamera(normalFOV, window.innerWidth / window.innerHeight, 0.1, 1000);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // 1. 光源設計
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00e1ff, 0.8);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff0055, 0.5, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // 2. 升級版科技地板 (棋盤與網格發光地板)
        createCustomFloor();

        // 3. 建立角色實體 (包含 3D 步槍)
        createPlayerCharacter();

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2(0, 0);

        // 事件監聽
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('keydown', e => handleKeyDown(e));
        window.addEventListener('keyup', e => handleKey(e, false));
        window.addEventListener('contextmenu', e => e.preventDefault());

        animate();
    }

    // 建立科技網格風格地板
    function createCustomFloor() {
        // 生成深色棋盤材質 Canvas
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#111625';
        ctx.fillRect(0, 0, 512, 512);

        ctx.fillStyle = '#1a2235';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillRect(256, 256, 256, 256);

        // 繪製科技邊框線條
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, 512, 512);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(40, 40);

        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: texture, 
            roughness: 0.4, 
            metalness: 0.6 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 加上地面光環輔助線
        const grid = new THREE.GridHelper(200, 40, 0x00ffcc, 0x112233);
        grid.position.y = 0.02;
        scene.add(grid);
    }

    // 建立角色模型與高階步槍
    function createPlayerCharacter() {
        playerGroup = new THREE.Group();

        // 身體 (第三人稱時可見)
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.25, 1.2, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.5 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        playerGroup.add(body);

        // 頭部
        const headGeo = new THREE.SphereGeometry(0.22, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0x334455 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.6;
        playerGroup.add(head);

        // 步槍 (Rifle Model)
        rifleMesh = createRifleModel();
        // 擺放在角色右手上
        rifleMesh.position.set(0.3, 1.25, -0.3);
        playerGroup.add(rifleMesh);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);
    }

    // 建立精緻戰術步槍模型
    function createRifleModel() {
        const rifle = new THREE.Group();

        const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.2 });
        const gunMetal = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.3 });
        const scopeLens = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x004433 });

        // 主槍身 (Receiver)
        const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.4), darkMetal);
        rifle.add(receiver);

        // 長槍管 (Long Barrel)
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 12), gunMetal);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.01, -0.42);
        rifle.add(barrel);

        // 槍口制退器 (Muzzle Brake)
        const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.06), darkMetal);
        muzzle.position.set(0, 0.01, -0.68);
        rifle.add(muzzle);

        // 護木 (Handguard)
        const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.065, 0.3), darkMetal);
        handguard.position.set(0, 0, -0.28);
        rifle.add(handguard);

        // 彈匣 (Magazine)
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.16, 0.08), gunMetal);
        mag.position.set(0, -0.1, -0.05);
        mag.rotation.x = -0.2;
        rifle.add(mag);

        // 槍託 (Stock)
        const stock = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.09, 0.25), darkMetal);
        stock.position.set(0, -0.01, 0.28);
        rifle.add(stock);

        // 戰術瞄準鏡 (Scope)
        const scopeBody = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.2, 16), darkMetal);
        scopeBody.rotation.x = Math.PI / 2;
        scopeBody.position.set(0, 0.06, -0.05);
        rifle.add(scopeBody);

        const lens = new THREE.Mesh(new THREE.CircleGeometry(0.02, 16), scopeLens);
        lens.position.set(0, 0.06, -0.151);
        rifle.add(lens);

        return rifle;
    }

    // 建立地上怪物
    function createMonster() {
        const monster = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb92b2b, roughness: 0.5 });
        const headMat = new THREE.MeshStandardMaterial({ color: 0x440000, roughness: 0.3 });
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc });

        // 身體 (Body)
        const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.4, 12), bodyMat);
        bodyMesh.position.y = 0.7;
        bodyMesh.castShadow = true;
        bodyMesh.name = "body";
        monster.add(bodyMesh);

        // 頭部 (Head)
        const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), headMat);
        headMesh.position.y = 1.65;
        headMesh.castShadow = true;
        headMesh.name = "head";
        monster.add(headMesh);

        // 眼睛
        const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.05), eyeMat);
        eye1.position.set(0.12, 1.7, -0.3);
        const eye2 = eye1.clone();
        eye2.position.x = -0.12;
        monster.add(eye1);
        monster.add(eye2);

        monster.userData = {
            hp: 2,
            speed: Math.random() * 0.04 + 0.02,
            targetX: (Math.random() - 0.5) * 60,
            targetZ: - (Math.random() * 40 + 10)
        };

        resetMonsterPosition(monster);

        scene.add(monster);
        monsters.push(monster);
    }

    function resetMonsterPosition(monster) {
        monster.userData.hp = 2;
        monster.position.x = (Math.random() - 0.5) * 70;
        monster.position.z = - (Math.random() * 50 + 15);
        monster.position.y = 0;
        
        monster.children.forEach(child => {
            if (child.name === "body") child.material.color.setHex(0xb92b2b);
        });
    }

    // 滑鼠旋轉視角
    let yaw = 0, pitch = 0;
    function onMouseMove(event) {
        if (!isPlaying) return;

        const sensitivity = isScoped ? 0.0006 : 0.002;

        yaw -= event.movementX * sensitivity;
        pitch -= event.movementY * sensitivity;

        // 限制仰俯角
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

        // 設定角色面向
        playerGroup.rotation.y = yaw;
    }

    // 按鍵處理
    function handleKeyDown(event) {
        const key = event.key.toLowerCase();
        handleKey(event, true);

        // 按 V 鍵切換 第一人稱 / 第三人稱 視角
        if (key === 'v' && isPlaying) {
            isThirdPerson = !isThirdPerson;
            
            // 如果開鏡中，關閉開鏡
            if (isScoped) {
                toggleScope(false);
            }

            viewModeTag.textContent = isThirdPerson ? "視角: 第三人稱 (TPP)" : "視角: 第一人稱 (FPP)";
        }
    }

    function handleKey(event, isDown) {
        const key = event.key.toLowerCase();
        if (keys.hasOwnProperty(key)) {
            keys[key] = isDown;
        }
    }

    // 更新角色位置與攝影機跟隨
    function updatePlayerAndCamera() {
        if (!isPlaying) return;

        // 計算角色移動方向
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        if (keys.w) playerGroup.position.addScaledVector(forward, moveSpeed);
        if (keys.s) playerGroup.position.addScaledVector(forward, -moveSpeed);
        if (keys.a) playerGroup.position.addScaledVector(side, -moveSpeed);
        if (keys.d) playerGroup.position.addScaledVector(side, moveSpeed);

        // 根據第一人稱/第三人稱調整攝影機
        if (isThirdPerson) {
            // 第三人稱過肩視角 (Over-the-shoulder View)
            const offset = new THREE.Vector3(0.6, 2.0, 3.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            camera.position.copy(playerGroup.position).add(offset);
            
            // 攝影機看向角色前方一點的位置
            const lookTarget = playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)).addScaledVector(forward, 5);
            lookTarget.y += Math.sin(pitch) * 5;
            camera.lookAt(lookTarget);

            // 第三人稱顯示角色主體
            playerGroup.children[0].visible = true; // 身體
            playerGroup.children[1].visible = true; // 頭部
        } else {
            // 第一人稱視角 (FPP)
            camera.position.copy(playerGroup.position);
            camera.position.y += 1.6; // 眼睛高度

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // 第一人稱隱藏自己身體，只留槍
            playerGroup.children[0].visible = false;
            playerGroup.children[1].visible = false;
        }
    }

    // 開鏡與開火
    function onMouseDown(event) {
        if (!isPlaying) return;

        // 右鍵：狙擊鏡
        if (event.button === 2) {
            toggleScope(true);
        }

        // 左鍵：開火
        if (event.button === 0) {
            shoot();
        }
    }

    function onMouseUp(event) {
        if (event.button === 2) {
            toggleScope(false);
        }
    }

    function toggleScope(enable) {
        isScoped = enable;
        if (isScoped) {
            camera.fov = scopedFOV;
            camera.updateProjectionMatrix();
            scopeOverlay.style.display = 'block';
            crosshair.style.display = 'none';
            rifleMesh.visible = false;
        } else {
            camera.fov = normalFOV;
            camera.updateProjectionMatrix();
            scopeOverlay.style.display = 'none';
            crosshair.style.display = 'block';
            rifleMesh.visible = true;
        }
    }

    // 射擊邏輯
    function shoot() {
        // 槍枝後座力動畫
        rifleMesh.position.z += 0.08;
        setTimeout(() => rifleMesh.position.z -= 0.08, 60);

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        for (let i = 0; i < intersects.length; i++) {
            let hitMesh = intersects[i].object;
            let monsterGroup = hitMesh.parent;

            if (monsters.includes(monsterGroup)) {
                // 1. 擊中頭部：爆頭一擊必殺
                if (hitMesh.name === "head") {
                    showHeadshotUI();
                    score += 200;
                    kills += 1;
                    resetMonsterPosition(monsterGroup);
                } 
                // 2. 擊中身體：兩槍一個死
                else if (hitMesh.name === "body") {
                    monsterGroup.userData.hp -= 1;
                    
                    if (monsterGroup.userData.hp <= 0) {
                        score += 100;
                        kills += 1;
                        resetMonsterPosition(monsterGroup);
                    } else {
                        hitMesh.material.color.setHex(0x551111);
                    }
                }
                
                scoreEl.textContent = score;
                killsEl.textContent = kills;
                break;
            }
        }
    }

    function showHeadshotUI() {
        headshotFeed.style.opacity = '1';
        setTimeout(() => {
            headshotFeed.style.opacity = '0';
        }, 1000);
    }

    function animate() {
        requestAnimationFrame(animate);

        if (isPlaying) {
            updatePlayerAndCamera();

            // 怪物 AI 巡邏
            monsters.forEach(monster => {
                const dx = monster.userData.targetX - monster.position.x;
                const dz = monster.userData.targetZ - monster.position.z;
                const dist = Math.hypot(dx, dz);

                if (dist < 1) {
                    monster.userData.targetX = (Math.random() - 0.5) * 80;
                    monster.userData.targetZ = - (Math.random() * 50 + 10);
                } else {
                    monster.position.x += (dx / dist) * monster.userData.speed;
                    monster.position.z += (dz / dist) * monster.userData.speed;
                    monster.lookAt(monster.userData.targetX, monster.position.y, monster.userData.targetZ);
                }
            });
        }

        renderer.render(scene, camera);
    }

    function startGame() {
        score = 0;
        kills = 0;
        scoreEl.textContent = score;
        killsEl.textContent = kills;
        isPlaying = true;

        document.body.requestPointerLock();

        monsters.forEach(m => scene.remove(m));
        monsters = [];
        for (let i = 0; i < 8; i++) {
            createMonster();
        }

        menuOverlay.style.display = 'none';
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init3D;
</script>

</body>
</html>
