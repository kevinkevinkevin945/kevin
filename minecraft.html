<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Minecraft · 完整沙盒</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            z-index: 10;
            user-select: none;
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 15px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        #controls-hint span {
            display: inline-block;
            margin: 0 8px;
            color: #aaffaa;
        }
        @media (max-width: 600px) {
            #controls-hint {
                font-size: 11px;
                padding: 6px 14px;
                white-space: normal;
                width: 80%;
                text-align: center;
                bottom: 15px;
            }
            #info {
                font-size: 11px;
                top: 12px;
                left: 12px;
                padding: 5px 14px;
            }
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 5;
            cursor: pointer;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 24px;
            border: 1px solid #888;
            z-index: 20;
            backdrop-filter: blur(6px);
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.4);
            font-size: 30px;
            pointer-events: none;
            z-index: 6;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="loading">⛏️ 載入世界...</div>
    <div id="info">🎮 3D Minecraft · 完整沙盒</div>
    <div id="crosshair">✚</div>
    <div id="controls-hint">
        <span>🖱️</span> 滑鼠拖曳視角 · <span>W A S D</span> 移動 · <span>空白</span> 跳躍 · <span>Shift</span> 奔跑
    </div>
    <div id="blocker" onclick="focusGame()"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 初始化場景、相機、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 90);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 12, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.bias = 0.0001;
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // --- 指針鎖定控制 ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        window.focusGame = () => controls.lock();
        
        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
        });
        controls.addEventListener('unlock', () => {
            blocker.style.display = 'block';
        });

        setTimeout(() => controls.lock(), 400);

        // --- 燈光 ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 120;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 60;
        sunLight.shadow.camera.bottom = -60;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.5);
        fillLight.position.set(-30, 20, -40);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.6);
        scene.add(hemiLight);

        // --- 紋理生成器 ---
        function createBlockTexture(baseColor, detailColor = null, border = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 32, 32);
            if (border) {
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(1, 1, 30, 30);
            }
            if (detailColor) {
                for (let i = 0; i < 30; i++) {
                    const x = Math.floor(Math.random() * 30) + 1;
                    const y = Math.floor(Math.random() * 30) + 1;
                    ctx.fillStyle = detailColor;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            for (let i = 0; i < 60; i++) {
                const x = Math.floor(Math.random() * 32);
                const y = Math.floor(Math.random() * 32);
                const bright = Math.random() * 30 + 20;
                ctx.fillStyle = `rgba(${bright}, ${bright}, ${bright}, 0.2)`;
                ctx.fillRect(x, y, 1, 1);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- 創建地面 (超大地圖) ---
        function createGround() {
            const group = new THREE.Group();
            
            // 草地紋理
            const grassCanvas = document.createElement('canvas');
            grassCanvas.width = 64;
            grassCanvas.height = 64;
            const gCtx = grassCanvas.getContext('2d');
            gCtx.fillStyle = '#7cb342';
            gCtx.fillRect(0, 0, 64, 64);
            for (let i = 0; i < 800; i++) {
                const x = Math.floor(Math.random() * 64);
                const y = Math.floor(Math.random() * 64);
                const bright = Math.random() * 50 + 40;
                gCtx.fillStyle = `rgb(${bright+70}, ${bright+120}, ${bright+30})`;
                gCtx.fillRect(x, y, 1, 1);
            }
            gCtx.strokeStyle = '#4caf50';
            gCtx.lineWidth = 2;
            for (let i = 0; i < 120; i++) {
                const x = Math.floor(Math.random() * 64);
                const y = Math.floor(Math.random() * 64);
                gCtx.beginPath();
                gCtx.moveTo(x, y);
                gCtx.lineTo(x+2, y-8);
                gCtx.stroke();
            }
            const grassTexture = new THREE.CanvasTexture(grassCanvas);
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(25, 25);

            const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.9, metalness: 0 });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            group.add(ground);

            // 裝飾：樹木、石頭、花、蘑菇、草叢
            for (let i = 0; i < 300; i++) {
                const x = (Math.random() - 0.5) * 90;
                const z = (Math.random() - 0.5) * 90;
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
                const type = Math.random();
                if (type < 0.30) createTree(group, x, 0, z);
                else if (type < 0.45) createRock(group, x, 0, z);
                else if (type < 0.60) createFlower(group, x, 0, z);
                else if (type < 0.70) createMushroom(group, x, 0, z);
                else if (type < 0.85) createGrass(group, x, 0, z);
            }

            // 雲朵
            for (let i = 0; i < 30; i++) {
                const x = (Math.random() - 0.5) * 160;
                const z = (Math.random() - 0.5) * 160;
                if (Math.abs(x) < 40 && Math.abs(z) < 40) continue;
                createCloud(group, x, 14 + Math.random() * 10, z);
            }

            return group;
        }

        // --- 樹 ---
        function createTree(group, x, y, z) {
            const g = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#8B5A2B', '#6B4226'), roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.0, 0.8), trunkMat);
            trunk.position.y = 1.0;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            g.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#2E7D32', '#1B5E20'), roughness: 0.7 });
            const leafPos = [[0,2.2,0,1.6,1.4,1.6], [-0.9,2.6,0.7,1.2,0.9,1.2], [0.9,2.6,-0.7,1.2,0.9,1.2], [0.7,2.6,0.9,1.2,0.9,1.2], [-0.7,2.6,-0.9,1.2,0.9,1.2], [0,3.2,0,1.2,0.8,1.2]];
            for (const p of leafPos) {
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(p[3], p[4], p[5]), leafMat);
                leaf.position.set(p[0], p[1], p[2]);
                leaf.castShadow = true;
                leaf.receiveShadow = true;
                g.add(leaf);
            }
            g.position.set(x, y, z);
            group.add(g);
        }

        // --- 石頭 ---
        function createRock(group, x, y, z) {
            const mat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#9E9E9E', '#757575'), roughness: 0.95 });
            const s = 0.4 + Math.random() * 0.6;
            const rock = new THREE.Mesh(new THREE.BoxGeometry(s, s*0.6, s*0.8), mat);
            rock.position.set(x, y + s*0.3, z);
            rock.rotation.y = Math.random() * Math.PI;
            rock.rotation.x = (Math.random()-0.5)*0.2;
            rock.castShadow = true;
            rock.receiveShadow = true;
            group.add(rock);
        }

        // --- 花 ---
        function createFlower(group, x, y, z) {
            const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6', '#FF9F43'];
            const col = colors[Math.floor(Math.random()*colors.length)];
            const mat = new THREE.MeshStandardMaterial({ map: createBlockTexture(col, '#ffffff'), roughness: 0.5 });
            const flower = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), mat);
            flower.position.set(x, y + 0.2, z);
            flower.castShadow = true;
            group.add(flower);
            const stemMat = new THREE.MeshStandardMaterial({ color: '#4CAF50' });
            const stem = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.05), stemMat);
            stem.position.set(x, y, z);
            group.add(stem);
        }

        // --- 蘑菇 ---
        function createMushroom(group, x, y, z) {
            const g = new THREE.Group();
            const stemMat = new THREE.MeshStandardMaterial({ color: 0xf5e6d3 });
            const stem = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.15), stemMat);
            stem.position.y = 0.125;
            stem.castShadow = true;
            g.add(stem);
            const capMat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#d32f2f', '#b71c1c') });
            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.4), capMat);
            cap.position.y = 0.3;
            cap.castShadow = true;
            g.add(cap);
            const dotMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for (let i=0; i<4; i++) {
                const dot = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.06), dotMat);
                dot.position.set((Math.random()-0.5)*0.25, 0.38, (Math.random()-0.5)*0.25);
                g.add(dot);
            }
            g.position.set(x, y, z);
            group.add(g);
        }

        // --- 草叢 ---
        function createGrass(group, x, y, z) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
            for (let i=0; i<5; i++) {
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15+Math.random()*0.15, 0.04), mat);
                blade.position.set((Math.random()-0.5)*0.3, 0.08, (Math.random()-0.5)*0.3);
                blade.rotation.y = Math.random() * Math.PI;
                blade.rotation.x = (Math.random()-0.5)*0.2;
                g.add(blade);
            }
            g.position.set(x, y, z);
            group.add(g);
        }

        // --- 雲 ---
        function createCloud(group, x, y, z) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, roughness: 0.1, emissive: new THREE.Color(0xeeeeee), emissiveIntensity: 0.1 });
            const pos = [[0,0,0,1.8,0.5,1.2], [-1.2,0.2,0.2,1.4,0.4,0.9], [1.2,0.1,-0.2,1.4,0.4,0.9], [-0.6,0.4,-0.7,1.0,0.3,0.7], [0.7,0.3,0.8,1.0,0.3,0.7]];
            for (const p of pos) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(p[3], p[4], p[5]), mat);
                box.position.set(p[0], p[1], p[2]);
                g.add(box);
            }
            g.position.set(x, y, z);
            group.add(g);
        }

        // --- 生成世界 ---
        const worldGroup = createGround();
        scene.add(worldGroup);

        // --- 礦石 (金、鑽石、鐵) ---
        function addOres() {
            const ores = [
                { color: '#FFD700', detail: '#DAA520', emissive: 0x553300, label: '金' },
                { color: '#00BCD4', detail: '#0097A7', emissive: 0x004466, label: '鑽石' },
                { color: '#B0BEC5', detail: '#78909C', emissive: 0x222222, label: '鐵' }
            ];
            for (let i=0; i<45; i++) {
                const ore = ores[Math.floor(Math.random()*ores.length)];
                const mat = new THREE.MeshStandardMaterial({
                    map: createBlockTexture(ore.color, ore.detail),
                    emissive: new THREE.Color(ore.emissive),
                    emissiveIntensity: 0.15
                });
                const box = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
                const x = (Math.random()-0.5)*70;
                const z = (Math.random()-0.5)*70;
                if (Math.abs(x)<8 && Math.abs(z)<8) continue;
                box.position.set(x, 0.1, z);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
            }
        }
        addOres();

        // --- 邊界光柱 ---
        function createBoundary() {
            const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200, transparent: true, opacity: 0.25 });
            const positions = [[-45,0,-45],[45,0,-45],[-45,0,45],[45,0,45],[-45,0,0],[45,0,0],[0,0,-45],[0,0,45]];
            for (const p of positions) {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), mat);
                pillar.position.set(p[0], 1.5, p[1]);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                scene.add(pillar);
                const topMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500 });
                const top = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), topMat);
                top.position.set(p[0], 3.2, p[1]);
                scene.add(top);
            }
        }
        createBoundary();

        // --- 動態雲朵陣列 ---
        const clouds = [];
        scene.children.forEach(child => {
            if (child.type === 'Group') {
                child.children.forEach(sub => {
                    if (sub.type === 'Group' && sub.children.length > 0 && sub.children[0].material && sub.children[0].material.color.getHex() === 0xffffff) {
                        clouds.push(sub);
                    }
                });
            }
        });

        // --- 鍵盤狀態 ---
        const keys = { w:false, a:false, s:false, d:false, shift:false, space:false };
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = true; e.preventDefault(); break;
                case 'Space': keys.space = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = false; e.preventDefault(); break;
                case 'Space': keys.space = false; e.preventDefault(); break;
            }
        });

        // --- 移動更新 ---
        function updateMovement() {
            if (!controls.isLocked) return;
            const speed = keys.shift ? 0.28 : 0.14;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            const mx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            const mz = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            if (mx !== 0 || mz !== 0) {
                const fwd = dir.clone().multiplyScalar(-mz);
                const side = right.clone().multiplyScalar(mx);
                const total = fwd.add(side).normalize().multiplyScalar(speed);
                camera.position.x += total.x;
                camera.position.z += total.z;
            }

            // 重力與跳躍
            if (keys.space && camera.position.y <= 1.6) {
                camera.position.y += 0.35;
            } else if (camera.position.y > 1.6) {
                camera.position.y -= 0.04;
            } else if (camera.position.y < 1.6) {
                camera.position.y = 1.6;
            }
        }

        setInterval(updateMovement, 16);

        // --- 動畫循環 ---
        let clock = new THREE.Clock();
        function animate() {
            const delta = clock.getDelta();
            const time = performance.now() * 0.0001;
            clouds.forEach((cloud, i) => {
                cloud.position.x += Math.sin(time + i) * 0.002;
                cloud.position.z += Math.cos(time * 0.7 + i) * 0.002;
            });
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // --- 窗口自適應 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('✅ Minecraft 3D 完整沙盒已啟動！');
    </script>
</body>
</html>
