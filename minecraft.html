<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Minecraft · 深層挖掘 & 背包</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { overflow:hidden; font-family:'Courier New', monospace; background:#1a1a1a; }
        #info { position:absolute; top:16px; left:16px; color:#fff; background:rgba(0,0,0,0.7); padding:6px 18px; border-radius:30px; font-size:13px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.15); pointer-events:none; z-index:10; user-select:none; }
        #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:rgba(255,255,255,0.5); font-size:28px; pointer-events:none; z-index:6; text-shadow:0 0 6px rgba(0,0,0,0.6); user-select:none; }
        #controls-hint { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.8); background:rgba(0,0,0,0.6); padding:8px 20px; border-radius:40px; font-size:13px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.1); pointer-events:none; z-index:10; white-space:nowrap; }
        #controls-hint span { color:#aaffaa; margin:0 6px; }
        @media (max-width:600px) { #controls-hint { font-size:10px; padding:5px 12px; white-space:normal; width:85%; text-align:center; bottom:12px; } #info { font-size:10px; top:10px; left:10px; padding:4px 12px; } }
        #blocker { position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.15); z-index:5; cursor:pointer; }
        #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; background:rgba(0,0,0,0.85); padding:24px 48px; border-radius:16px; font-size:26px; border:1px solid #666; z-index:20; backdrop-filter:blur(6px); pointer-events:none; }
        
        /* 背包 UI */
        #inventory-ui {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,30,0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            gap: 6px;
            z-index: 15;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .inv-slot {
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            cursor: pointer;
            position: relative;
            transition: 0.1s;
            image-rendering: pixelated;
        }
        .inv-slot:hover { border-color:#ffcc44; background:rgba(255,255,255,0.08); }
        .inv-slot.active { border-color:#ffaa00; background:rgba(255,170,0,0.25); box-shadow:0 0 16px rgba(255,170,0,0.2); }
        .inv-slot .count {
            position: absolute;
            bottom: 1px;
            right: 4px;
            font-size: 10px;
            color: #fff;
            text-shadow: 0 0 4px #000;
            background: rgba(0,0,0,0.6);
            padding: 0 4px;
            border-radius: 4px;
        }
        .inv-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; border-radius:4px; }
        #held-item {
            position: absolute;
            bottom: 148px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 12;
            backdrop-filter: blur(4px);
        }
        #held-item canvas { width: 40px; height: 40px; image-rendering: pixelated; }
        #held-label {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 2px 14px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 12;
            white-space: nowrap;
            border:1px solid rgba(255,255,255,0.1);
        }
        #inventory-label {
            position: absolute;
            bottom: 132px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 2px 14px;
            border-radius: 20px;
            z-index: 14;
            pointer-events: none;
            border:1px solid rgba(255,255,255,0.05);
        }
        #coord-info {
            position: absolute;
            bottom: 240px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 12;
            font-family: monospace;
            border:1px solid rgba(255,255,255,0.05);
        }
        @media (max-width:600px) {
            #inventory-ui { bottom: 70px; padding: 6px 10px; gap:4px; }
            .inv-slot { width: 40px; height: 40px; }
            .inv-slot canvas { width: 30px; height: 30px; }
            #held-item { bottom: 132px; width: 42px; height: 42px; }
            #held-item canvas { width: 34px; height: 34px; }
            #held-label { bottom: 178px; font-size: 10px; }
            #inventory-label { bottom: 118px; font-size: 9px; }
            #coord-info { display:none; }
        }
    </style>
</head>
<body>
    <div id="loading">⛏️ 生成世界 1024³ ...</div>
    <div id="info">⛏️ 深層挖掘 · 1024³ 世界</div>
    <div id="crosshair">✚</div>
    <div id="controls-hint"><span>🖱️</span> 左鍵挖掘 · 右鍵放置 · <span>WASD</span> 移動 · <span>空白</span> 跳 · <span>Shift</span> 跑</div>
    <div id="blocker" onclick="focusGame()"></div>

    <div id="inventory-label">🎒 背包</div>
    <div id="held-label">手持: 空</div>
    <div id="held-item"><canvas id="heldCanvas" width="40" height="40"></canvas></div>
    <div id="inventory-ui"></div>
    <div id="coord-info">📍 0, 0, 0</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 100);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 200);
        camera.position.set(16, 20, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // --- 指針鎖定 ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        window.focusGame = () => controls.lock();
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'block');
        setTimeout(() => controls.lock(), 600);

        // --- 燈光 ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.1);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xccddff, 0.4);
        fill.position.set(-30, 20, -40);
        scene.add(fill);
        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.5);
        scene.add(hemi);

        // --- 紋理生成器 (清晰格子) ---
        function createBlockTexture(baseColor, detailColor = null, border = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 32, 32);
            if (border) {
                ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                ctx.lineWidth = 1.8;
                ctx.strokeRect(0.5, 0.5, 31, 31);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(1.5, 1.5, 29, 29);
            }
            if (detailColor) {
                for (let i=0; i<40; i++) {
                    const x = Math.floor(Math.random()*28)+2;
                    const y = Math.floor(Math.random()*28)+2;
                    ctx.fillStyle = detailColor;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            // 格線強化
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 0.5;
            for (let i=0; i<=32; i+=8) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 32);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(32, i);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- 方塊類型 ---
        const BLOCK_TYPES = {
            GRASS: { name:'草地', color:'#7cb342', detail:'#558b2f' },
            DIRT: { name:'泥土', color:'#8d6e63', detail:'#6d4c41' },
            STONE: { name:'石頭', color:'#9e9e9e', detail:'#757575' },
            WOOD: { name:'木頭', color:'#8B5A2B', detail:'#6B4226' },
            LEAVES: { name:'樹葉', color:'#2E7D32', detail:'#1B5E20' },
            GOLD: { name:'金礦', color:'#FFD700', detail:'#DAA520' },
            DIAMOND: { name:'鑽石', color:'#00BCD4', detail:'#0097A7' },
            IRON: { name:'鐵礦', color:'#B0BEC5', detail:'#78909C' },
            SAND: { name:'沙地', color:'#f5e6b0', detail:'#d4c48a' },
            PLANKS: { name:'木板', color:'#deb887', detail:'#c4a47a' },
            BRICK: { name:'紅磚', color:'#b85a3a', detail:'#8d3a22' },
            COAL: { name:'煤礦', color:'#424242', detail:'#212121' },
            REDSTONE: { name:'紅石', color:'#c62828', detail:'#8e0000' },
        };

        // --- 背包系統 ---
        let inventory = [];
        let selectedSlot = 0;
        const MAX_STACK = 64;

        function addItem(blockType) {
            const existing = inventory.find(i => i.type === blockType && i.count < MAX_STACK);
            if (existing) { existing.count++; }
            else { inventory.push({ type: blockType, count: 1 }); }
            updateUI();
        }

        function removeItem(blockType) {
            const idx = inventory.findIndex(i => i.type === blockType);
            if (idx === -1) return false;
            const item = inventory[idx];
            if (item.count > 1) { item.count--; }
            else { inventory.splice(idx, 1); }
            updateUI();
            return true;
        }

        function getHeld() {
            if (inventory.length === 0 || selectedSlot >= inventory.length) return null;
            return inventory[selectedSlot];
        }

        // --- UI更新 ---
        function updateUI() {
            const container = document.getElementById('inventory-ui');
            container.innerHTML = '';
            inventory.forEach((item, idx) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot' + (idx === selectedSlot ? ' active' : '');
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const block = BLOCK_TYPES[item.type];
                if (block) {
                    ctx.fillStyle = block.color;
                    ctx.fillRect(0,0,32,32);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(0.5,0.5,31,31);
                    if (block.detail) {
                        for (let i=0; i<20; i++) {
                            const x = Math.floor(Math.random()*28)+2;
                            const y = Math.floor(Math.random()*28)+2;
                            ctx.fillStyle = block.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                }
                slot.appendChild(canvas);
                if (item.count > 1) {
                    const c = document.createElement('span');
                    c.className = 'count';
                    c.textContent = item.count;
                    slot.appendChild(c);
                }
                slot.addEventListener('click', () => { selectedSlot = idx; updateUI(); updateHeld(); });
                container.appendChild(slot);
            });
            if (inventory.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'color:rgba(255,255,255,0.3);padding:6px 14px;font-size:13px;';
                empty.textContent = '🈳 挖掘方塊收集';
                container.appendChild(empty);
            }
            updateHeld();
        }

        function updateHeld() {
            const heldCanvas = document.getElementById('heldCanvas');
            const ctx = heldCanvas.getContext('2d');
            ctx.clearRect(0,0,40,40);
            const item = getHeld();
            if (item) {
                const block = BLOCK_TYPES[item.type];
                if (block) {
                    ctx.fillStyle = block.color;
                    ctx.fillRect(2,2,36,36);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(2,2,36,36);
                    if (block.detail) {
                        for (let i=0; i<20; i++) {
                            const x = Math.floor(Math.random()*30)+5;
                            const y = Math.floor(Math.random()*30)+5;
                            ctx.fillStyle = block.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                    document.getElementById('held-label').textContent = '手持: ' + block.name + (item.count>1 ? ' x'+item.count : '');
                }
            } else {
                document.getElementById('held-label').textContent = '手持: 空手';
            }
        }

        // --- 世界生成 (1024^3 概念, 實際範圍 64x64x32 以效能考量) ---
        const worldObjects = [];
        const blockSize = 0.9; // 稍微留縫隙顯示格線

        function createBlockMesh(typeKey, pos) {
            const block = BLOCK_TYPES[typeKey];
            if (!block) return null;
            const mat = new THREE.MeshStandardMaterial({
                map: createBlockTexture(block.color, block.detail),
                roughness: 0.85,
                metalness: 0.05
            });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), mat);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { blockType: typeKey, isBlock: true };
            return mesh;
        }

        function generateWorld() {
            const group = new THREE.Group();
            const range = 32; // 半徑 32 => 64x64 地表
            const heightRange = 12; // 地下深度

            // 1. 地表層 (草地+泥土+石頭)
            for (let x = -range; x < range; x++) {
                for (let z = -range; z < range; z++) {
                    // 玩家出生點留空
                    if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
                    
                    // 簡單噪聲地形
                    const noise = Math.sin(x*0.25)*Math.cos(z*0.2)*1.5 + Math.sin(x*0.08+z*0.12)*0.8;
                    const topY = Math.floor(noise + 3);
                    if (topY < 0) continue;
                    
                    // 草地層
                    const grassPos = new THREE.Vector3(x, topY, z);
                    const grass = createBlockMesh('GRASS', grassPos);
                    if (grass) { group.add(grass); worldObjects.push(grass); }
                    
                    // 泥土層 (1-2層)
                    for (let d = 1; d <= 2; d++) {
                        const yPos = topY - d;
                        if (yPos < -2) continue;
                        const dirtPos = new THREE.Vector3(x, yPos, z);
                        const dirt = createBlockMesh('DIRT', dirtPos);
                        if (dirt) { group.add(dirt); worldObjects.push(dirt); }
                    }
                    
                    // 石頭層 (向下延伸到地下)
                    for (let d = 3; d < 6; d++) {
                        const yPos = topY - d;
                        if (yPos < -heightRange) continue;
                        const stonePos = new THREE.Vector3(x, yPos, z);
                        const stone = createBlockMesh('STONE', stonePos);
                        if (stone) { group.add(stone); worldObjects.push(stone); }
                    }
                }
            }

            // 2. 礦石 (埋在地下, 深度 2~10 層)
            const oreTypes = ['GOLD', 'DIAMOND', 'IRON', 'COAL', 'REDSTONE'];
            for (let i = 0; i < 300; i++) {
                const x = (Math.random() - 0.5) * 60;
                const z = (Math.random() - 0.5) * 60;
                if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
                // 計算地表高度
                const noise = Math.sin(x*0.25)*Math.cos(z*0.2)*1.5 + Math.sin(x*0.08+z*0.12)*0.8;
                const topY = Math.floor(noise + 3);
                if (topY < 1) continue;
                // 礦石深度: 2~10 層
                const depth = 2 + Math.floor(Math.random() * 8);
                const yPos = topY - depth;
                if (yPos < -heightRange) continue;
                const type = oreTypes[Math.floor(Math.random() * oreTypes.length)];
                const orePos = new THREE.Vector3(x, yPos, z);
                const ore = createBlockMesh(type, orePos);
                if (ore) { group.add(ore); worldObjects.push(ore); }
            }

            // 3. 樹木 (地表)
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() - 0.5) * 55;
                const z = (Math.random() - 0.5) * 55;
                if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
                const noise = Math.sin(x*0.25)*Math.cos(z*0.2)*1.5 + Math.sin(x*0.08+z*0.12)*0.8;
                const topY = Math.floor(noise + 3);
                if (topY < 1) continue;
                // 樹幹
                for (let j = 0; j < 3; j++) {
                    const trunkPos = new THREE.Vector3(x, topY + 1 + j, z);
                    const trunk = createBlockMesh('WOOD', trunkPos);
                    if (trunk) { group.add(trunk); worldObjects.push(trunk); }
                }
                // 樹葉
                const leafOffsets = [
                    [0,4,0], [1,3,0], [-1,3,0], [0,3,1], [0,3,-1],
                    [1,4,0], [-1,4,0], [0,4,1], [0,4,-1],
                    [1,3,1], [-1,3,-1], [1,3,-1], [-1,3,1]
                ];
                for (const off of leafOffsets) {
                    const leafPos = new THREE.Vector3(x + off[0], topY + 1 + off[1], z + off[2]);
                    const leaf = createBlockMesh('LEAVES', leafPos);
                    if (leaf) { group.add(leaf); worldObjects.push(leaf); }
                }
            }

            // 4. 邊界光柱 (可視範圍標記)
            const bMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200, transparent: true, opacity: 0.15 });
            const boundaryPos = [[-34,0,-34],[34,0,-34],[-34,0,34],[34,0,34]];
            for (const p of boundaryPos) {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 0.5), bMat);
                pillar.position.set(p[0], 2, p[1]);
                pillar.castShadow = true;
                group.add(pillar);
                const top = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6), new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500 }));
                top.position.set(p[0], 4.2, p[1]);
                group.add(top);
            }

            return group;
        }

        const worldGroup = generateWorld();
        scene.add(worldGroup);

        // --- 雲朵 ---
        const clouds = [];
        for (let i=0; i<20; i++) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.5, roughness:0.1 });
            const pos = [[0,0,0,1.8,0.4,1.2],[-1.2,0.2,0.2,1.4,0.3,0.9],[1.2,0.1,-0.2,1.4,0.3,0.9],[-0.6,0.3,-0.7,1.0,0.2,0.7],[0.7,0.2,0.8,1.0,0.2,0.7]];
            for (const p of pos) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), mat);
                box.position.set(p[0],p[1],p[2]);
                g.add(box);
            }
            g.position.set((Math.random()-0.5)*120, 16+Math.random()*8, (Math.random()-0.5)*120);
            scene.add(g);
            clouds.push(g);
        }

        // --- Raycaster 挖掘/放置 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersect() {
            if (!controls.isLocked) return null;
            mouse.set(0,0);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(worldObjects);
            if (hits.length > 0) return hits[0];
            return null;
        }

        function digBlock() {
            const hit = getIntersect();
            if (!hit) return;
            const obj = hit.object;
            if (!obj.userData.isBlock) return;
            const type = obj.userData.blockType;
            if (type) {
                addItem(type);
                scene.remove(obj);
                const idx = worldObjects.indexOf(obj);
                if (idx > -1) worldObjects.splice(idx, 1);
                updateUI();
            }
        }

        function placeBlock() {
            const hit = getIntersect();
            if (!hit) return;
            const obj = hit.object;
            const held = getHeld();
            if (!held) return;
            if (!obj.userData.isBlock) return;
            
            const normal = hit.face.normal.clone();
            normal.transformDirection(obj.matrixWorld);
            const pos = obj.position.clone().add(normal.multiplyScalar(0.95));
            // 檢查是否已有方塊
            const exists = worldObjects.some(o => o.position.distanceTo(pos) < 0.1 && o !== obj);
            if (exists) return;
            
            if (!removeItem(held.type)) return;
            const block = BLOCK_TYPES[held.type];
            const mat = new THREE.MeshStandardMaterial({
                map: createBlockTexture(block.color, block.detail),
                roughness: 0.85
            });
            const cube = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), mat);
            cube.position.copy(pos);
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { blockType: held.type, isBlock: true };
            scene.add(cube);
            worldObjects.push(cube);
            updateUI();
        }

        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            if (e.button === 0) digBlock();
            else if (e.button === 2) placeBlock();
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- 鍵盤 ---
        const keys = { w:false, a:false, s:false, d:false, shift:false, space:false };
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w=true; e.preventDefault(); break;
                case 'KeyA': keys.a=true; e.preventDefault(); break;
                case 'KeyS': keys.s=true; e.preventDefault(); break;
                case 'KeyD': keys.d=true; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift=true; e.preventDefault(); break;
                case 'Space': keys.space=true; e.preventDefault(); break;
                case 'KeyE':
                    if (inventory.length > 0) {
                        selectedSlot = (selectedSlot + 1) % inventory.length;
                        updateUI();
                    }
                    e.preventDefault();
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w=false; e.preventDefault(); break;
                case 'KeyA': keys.a=false; e.preventDefault(); break;
                case 'KeyS': keys.s=false; e.preventDefault(); break;
                case 'KeyD': keys.d=false; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift=false; e.preventDefault(); break;
                case 'Space': keys.space=false; e.preventDefault(); break;
            }
        });

        function updateMovement() {
            if (!controls.isLocked) return;
            const speed = keys.shift ? 0.3 : 0.15;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            const mx = (keys.d?1:0) - (keys.a?1:0);
            const mz = (keys.s?1:0) - (keys.w?1:0);
            if (mx !== 0 || mz !== 0) {
                const fwd = dir.clone().multiplyScalar(-mz);
                const side = right.clone().multiplyScalar(mx);
                const total = fwd.add(side).normalize().multiplyScalar(speed);
                camera.position.x += total.x;
                camera.position.z += total.z;
            }
            if (keys.space && camera.position.y <= 1.8) {
                camera.position.y += 0.35;
            } else if (camera.position.y > 1.8) {
                camera.position.y -= 0.04;
            } else if (camera.position.y < 1.8) {
                camera.position.y = 1.8;
            }
            // 更新座標顯示
            document.getElementById('coord-info').textContent = 
                `📍 ${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;
        }
        setInterval(updateMovement, 16);

        // --- 動畫 ---
        function animate() {
            const time = performance.now() * 0.0001;
            clouds.forEach((c, i) => {
                c.position.x += Math.sin(time + i) * 0.002;
                c.position.z += Math.cos(time*0.7 + i) * 0.002;
            });
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateUI();
        console.log('✅ 深層挖掘世界已啟動! 礦石埋藏在地下2~10層');
        console.log('🖱️ 左鍵挖掘 · 右鍵放置 · E切換手持');
    </script>
</body>
</html>
