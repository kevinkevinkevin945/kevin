<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Frontier 3D 完整版</title><style>
html,body{margin:0;overflow:hidden;background:#000;font-family:Arial,"Microsoft JhengHei",sans-serif}canvas{display:block}#menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#071018e8;color:#fff}.panel{width:min(700px,90vw);padding:28px;background:#101c25;border:1px solid #ffffff33;border-radius:16px}button{padding:13px 25px;border:0;border-radius:9px;background:#278ee0;color:white;font-size:17px;font-weight:bold;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none;color:white}.box{background:#071018c9;border:1px solid #ffffff25;border-radius:8px;padding:8px 11px}#stats{position:absolute;left:15px;top:15px;display:flex;gap:8px}#bar{width:170px;height:10px;background:#333;border-radius:8px;overflow:hidden;margin-top:4px}#bar i{display:block;height:100%;width:100%;background:#45df70}#ammo{position:absolute;right:18px;bottom:18px;font-size:25px;font-weight:bold}#weapon{position:absolute;right:18px;bottom:60px}#veh{position:absolute;right:18px;top:15px;display:none}#help{position:absolute;left:15px;bottom:15px;font-size:12px;line-height:1.6}#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:white}#cross:before{left:8px;width:2px;height:18px}#cross:after{top:8px;width:18px;height:2px}#msg{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-weight:bold}
</style></head><body>
<div id="menu"><div class="panel"><h1>🧟 ZOMBIE FRONTIER — 第三人稱 3D 完整版</h1><p>大型城市、湖泊、多種武器、殭屍群與陸海空載具。</p><p>WASD 移動 · Space 跳躍/飛行上升 · Shift 衝刺 · 滑鼠旋轉鏡頭 · 左鍵射擊 · 右鍵肩射瞄準 · 1~9 換槍 · R 換彈 · E 載具 · F 載具攻擊 · C 飛行下降</p><button id="start">開始 3D 遊戲</button></div></div>
<div id="hud"><div id="stats"><div class="box">生命<div id="bar"><i></i></div></div><div class="box">擊殺 <b id="kills">0</b></div><div class="box">殭屍 <b id="zc">0</b></div></div><div id="veh" class="box">載具 HP：<b id="vhp">0</b></div><div id="weapon" class="box">AR-15</div><div id="ammo" class="box"></div><div id="cross"></div><div id="msg"></div><div id="help" class="box">WASD · Space 跳躍 · Shift 衝刺 · 左鍵射擊 · 右鍵肩射瞄準 · E 載具 · F 攻擊</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8bb8c6);S.fog=new THREE.Fog(0x8bb8c6,90,500);
const C=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);S.add(new THREE.HemisphereLight(0xd8f3ff,0x334433,2));
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-100,150,60);sun.castShadow=true;S.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),mat(0x507950));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
const lake=new THREE.Mesh(new THREE.CircleGeometry(78,48),new THREE.MeshPhysicalMaterial({color:0x167da4,transparent:true,opacity:.8,roughness:.1}));lake.rotation.x=-Math.PI/2;lake.position.set(105,.1,60);S.add(lake);
box(170,1,8,0x685541,105,.5,60);
for(let x=-150;x<=150;x+=30)for(let z=-80;z<=120;z+=30){if(x>40&&z>0&&Math.random()<.55)continue;let h=10+Math.random()*55;box(18+Math.random()*10,h,18+Math.random()*10,[0x596773,0x71655c,0x52646a][Math.floor(Math.random()*3)],x,h/2,z)}
for(let i=0;i<100;i++){let x=(Math.random()-.5)*600,z=(Math.random()-.5)*600;if(Math.abs(x)<170&&Math.abs(z)<150)continue;let trunk=box(.7,5,.7,0x5a3b25,x,2.5,z);let leaf=new THREE.Mesh(new THREE.SphereGeometry(3.5,10,8),mat(0x32683c));leaf.position.set(x,7,z);S.add(leaf)}
const P=new THREE.Group(),body=box(1.15,1.8,.72,0x344f68,0,1.3,0);S.remove(body);P.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,14,10),mat(0xd6a87f));head.position.y=2.55;P.add(head);const gun=new THREE.Mesh(new THREE.BoxGeometry(.25,.22,1.5),mat(0x202428));gun.position.set(.62,1.55,-.65);P.add(gun);P.position.set(0,0,30);S.add(P);
const guns=[["Pistol",12,120,28,.28],["SMG",32,240,16,.08],["AR-15",30,180,32,.1],["AK-47",30,180,39,.12],["Shotgun",8,64,70,.65],["DMR",20,100,68,.4],["Sniper",5,40,145,1],["Burst Rifle",27,162,36,.24],["LMG",60,300,29,.09]];let wi=2;let mags=guns.map(g=>g[1]);
const Z=[];function zombie(x,z,big=false){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.8,.7),mat(big?0x70464e:0x4b654c));b.position.y=1.2;g.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.43,12,10),mat(0x91a87d));h.position.y=2.45;g.add(h);g.position.set(x,0,z);S.add(g);Z.push({g,hp:big?180:100,spd:big?2.1:1.45,atk:0})}for(let i=0;i<90;i++)zombie((Math.random()-.5)*340,(Math.random()-.5)*320,Math.random()<.2);
const V=[];function vehicle(type,x,z){let g=new THREE.Group(),col=type==="boat"?0x185b7b:type==="helicopter"?0x3c6044:type==="plane"?0xd4d6d8:type==="armored"?0x3c4950:0xb23737;let b=new THREE.Mesh(new THREE.BoxGeometry(type==="plane"?4:type==="boat"?4:3.5,type==="helicopter"?1.5:1.2,type==="plane"?8:type==="boat"?6:6),mat(col));b.position.y=type==="plane"?3:type==="helicopter"?4:1;g.add(b);if(type==="plane"){let wing=new THREE.Mesh(new THREE.BoxGeometry(12,.2,2),mat(col));wing.position.y=3;g.add(wing)}if(type==="helicopter"){let rotor=new THREE.Mesh(new THREE.BoxGeometry(9,.1,.2),mat(0x222222));rotor.position.y=6;g.add(rotor)}g.position.set(x,0,z);S.add(g);V.push({type,g,hp:type==="armored"?1500:type==="plane"?1300:type==="helicopter"?1100:900,spd:0,cool:0})}
vehicle("car",-12,45);vehicle("armored",35,-15);vehicle("boat",105,35);vehicle("boat",125,82);vehicle("helicopter",-75,10);vehicle("plane",20,-120);
const K={},M={down:false,aim:false};let yaw=0,pitch=-.2,vy=0,hp=100,kills=0,fire=0,reload=0,active=null,started=false;const clock=new THREE.Clock(),ray=new THREE.Raycaster();
function msg(t){document.getElementById("msg").textContent=t;setTimeout(()=>document.getElementById("msg").textContent="",1300)}
addEventListener("keydown",e=>{K[e.code]=true;if(e.code==="KeyR")reloadGun();if(e.code==="KeyE")toggleVehicle();if(e.code==="KeyF")vehicleFire();if(e.code.startsWith("Digit")){let n=+e.code.slice(5)-1;if(n>=0&&n<guns.length)wi=n}});
addEventListener("keyup",e=>K[e.code]=false);R.domElement.addEventListener("mousedown",e=>{if(e.button===0)M.down=true;if(e.button===2)M.aim=true;R.domElement.requestPointerLock()});addEventListener("mouseup",e=>{if(e.button===0)M.down=false;if(e.button===2)M.aim=false});addEventListener("contextmenu",e=>e.preventDefault());addEventListener("mousemove",e=>{if(document.pointerLockElement===R.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-.65,Math.min(.35,pitch-e.movementY*.002))}});
function reloadGun(){if(reload>0||mags[wi]>=guns[wi][1]||guns[wi][2]<=0)return;reload=1.1;msg("換彈中…")}
function shoot(){if(fire>0||reload>0)return;if(mags[wi]<=0){reloadGun();return}mags[wi]--;fire=guns[wi][4];ray.setFromCamera(new THREE.Vector2(0,0),C);let hits=ray.intersectObjects(Z.map(z=>z.g),true);if(hits.length){let o=hits[0].object;while(o.parent&&o.parent!==S)o=o.parent;let z=Z.find(q=>q.g===o);if(z){z.hp-=guns[wi][3];if(z.hp<=0){S.remove(z.g);Z.splice(Z.indexOf(z),1);kills++}}}}
function toggleVehicle(){if(active){P.position.copy(active.g.position);P.position.x+=4;active=null;msg("離開載具");return}let best,d=8;for(let v of V){let q=P.position.distanceTo(v.g.position);if(q<d){d=q;best=v}}if(best){active=best;msg("進入 "+best.type)}}
function vehicleFire(){if(!active||active.cool>0)return;active.cool=.65;for(let z of Z)if(z.g.position.distanceTo(active.g.position)<35)z.hp-=active.type==="plane"?180:110;msg("載具武器開火")}
function update(dt){fire-=dt;if(reload>0){reload-=dt;if(reload<=0){let need=Math.min(guns[wi][1]-mags[wi],guns[wi][2]);mags[wi]+=need;guns[wi][2]-=need}}if(M.down)shoot();
if(active){let v=active;if(K.KeyW)v.spd+=25*dt;if(K.KeyS)v.spd-=20*dt;v.spd*=Math.pow(.15,dt);if(K.KeyA)v.g.rotation.y+=1.5*dt;if(K.KeyD)v.g.rotation.y-=1.5*dt;if((v.type==="helicopter"||v.type==="plane")){if(K.Space)v.g.position.y+=20*dt;if(K.KeyC)v.g.position.y-=20*dt;v.g.position.y=Math.max(1,Math.min(80,v.g.position.y))}let dir=new THREE.Vector3(0,0,-1).applyQuaternion(v.g.quaternion);v.g.position.addScaledVector(dir,v.spd*dt);P.position.copy(v.g.position)}else{let x=0,z=0;if(K.KeyW)z-=1;if(K.KeyS)z+=1;if(K.KeyA)x-=1;if(K.KeyD)x+=1;if(x||z){let l=Math.hypot(x,z);x/=l;z/=l;let sp=(K.ShiftLeft?11:7)*dt;P.position.x+=(x*Math.cos(yaw)-z*Math.sin(yaw))*sp;P.position.z+=(x*Math.sin(yaw)+z*Math.cos(yaw))*sp;P.rotation.y=yaw}if(K.Space&&P.position.y<=.01)vy=8;vy-=22*dt;P.position.y=Math.max(0,P.position.y+vy*dt);if(P.position.y===0)vy=0}
for(let z of Z){let target=active?active.g.position:P.position,dir=target.clone().sub(z.g.position);dir.y=0;if(dir.length()<90){dir.normalize();z.g.position.addScaledVector(dir,z.spd*dt);z.g.lookAt(target.x,z.g.position.y,target.z)}if(z.g.position.distanceTo(target)<2.4){z.atk-=dt;if(z.atk<=0){z.atk=1;if(active)active.hp-=8;else hp-=7}}}
let target=active?active.g.position:P.position;let offset=new THREE.Vector3(M.aim?4:0,5.5,11).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);C.position.lerp(target.clone().add(offset),1-Math.pow(.001,dt));C.lookAt(target.x,target.y+1.5,target.z);
document.querySelector("#bar i").style.width=Math.max(0,hp)+"%";document.getElementById("kills").textContent=kills;document.getElementById("zc").textContent=Z.length;document.getElementById("weapon").textContent=guns[wi][0];document.getElementById("ammo").textContent=mags[wi]+" / "+guns[wi][2];document.getElementById("veh").style.display=active?"block":"none";if(active)document.getElementById("vhp").textContent=Math.max(0,Math.round(active.hp));if(hp<=0){started=false;document.getElementById("menu").style.display="grid"}}
function loop(){let dt=Math.min(clock.getDelta(),.04);if(started)update(dt);R.render(S,C);requestAnimationFrame(loop)}document.getElementById("start").onclick=()=>{started=true;document.getElementById("menu").style.display="none";R.domElement.requestPointerLock()};addEventListener("resize",()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});loop();
</script></body></html>
