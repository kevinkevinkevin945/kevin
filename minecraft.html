<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Minecraft · 枪械 & 生物 · 物品栏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #1a1a1a; }
        #info {
            position: absolute; top: 16px; left: 16px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 30px;
            font-size: 13px; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none; z-index: 10; user-select: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6); font-size: 28px;
            pointer-events: none; z-index: 6;
            text-shadow: 0 0 6px rgba(0,0,0,0.6);
            user-select: none;
        }
        #controls-hint {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.6);
            padding: 8px 20px; border-radius: 40px;
            font-size: 13px; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none; z-index: 10;
            white-space: nowrap;
        }
        #controls-hint span { color: #aaffaa; margin: 0 6px; }
        @media (max-width:600px) {
            #controls-hint { font-size: 10px; padding: 5px 12px; white-space: normal; width: 85%; text-align: center; bottom: 12px; }
            #info { font-size: 10px; top: 10px; left: 10px; padding: 4px 12px; }
        }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background: rgba(0,0,0,0.15); z-index: 5; cursor: pointer;
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; background: rgba(0,0,0,0.85);
            padding: 24px 48px; border-radius: 16px;
            font-size: 26px; border: 1px solid #666;
            z-index: 20; backdrop-filter: blur(6px);
            pointer-events: none;
        }

        /* 背包 UI (底部) */
        #inventory-ui {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,30,0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            gap: 6px;
            z-index: 15;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .inv-slot {
            width: 48px; height: 48px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #fff;
            cursor: pointer; position: relative;
            transition: 0.1s; image-rendering: pixelated;
        }
        .inv-slot:hover { border-color: #ffcc44; background: rgba(255,255,255,0.08); }
        .inv-slot.active {
            border-color: #ffaa00;
            background: rgba(255,170,0,0.25);
            box-shadow: 0 0 16px rgba(255,170,0,0.2);
        }
        .inv-slot .count {
            position: absolute; bottom: 1px; right: 4px;
            font-size: 10px; color: #fff;
            text-shadow: 0 0 4px #000;
            background: rgba(0,0,0,0.6);
            padding: 0 4px; border-radius: 4px;
        }
        .inv-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; border-radius: 4px; }

        #held-item {
            position: absolute; bottom: 148px; left: 50%;
            transform: translateX(-50%);
            width: 48px; height: 48px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 12;
            backdrop-filter: blur(4px);
        }
        #held-item canvas { width: 40px; height: 40px; image-rendering: pixelated; }
        #held-label {
            position: absolute; bottom: 200px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 2px 14px; border-radius: 20px;
            pointer-events: none; z-index: 12;
            white-space: nowrap; border: 1px solid rgba(255,255,255,0.1);
        }
        #inventory-label {
            position: absolute; bottom: 132px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 10px; letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 2px 14px; border-radius: 20px;
            z-index: 14; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #coord-info {
            position: absolute; bottom: 240px; right: 20px;
            color: rgba(255,255,255,0.5); font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px; border-radius: 8px;
            pointer-events: none; z-index: 12;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 物品栏 (选物栏) 全屏覆盖 */
        #item-selector {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
        }
        #item-selector.show { display: flex; }
        #item-selector h2 {
            color: #fff;
            margin-bottom: 20px;
            font-weight: normal;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        #item-grid {
            display: grid;
            grid-template-columns: repeat(8, 64px);
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 70vh;
            overflow-y: auto;
        }
        .item-cell {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            color: #fff;
            font-size: 10px;
            text-align: center;
            padding: 4px;
        }
        .item-cell:hover {
            background: rgba(255,255,255,0.15);
            border-color: #ffaa00;
            transform: scale(1.05);
        }
        .item-cell canvas {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }
        .item-cell .item-name {
            margin-top: 2px;
            font-size: 9px;
            opacity: 0.8;
        }
        .close-selector {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 4px 16px;
            border-radius: 30px;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .close-selector:hover {
            background: rgba(255,255,255,0.2);
        }
        @media (max-width:600px) {
            #item-grid { grid-template-columns: repeat(6, 54px); gap: 6px; padding: 12px; }
            .item-cell { width: 54px; height: 54px; }
            .item-cell canvas { width: 32px; height: 32px; }
            #item-selector h2 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="loading">⛏️ 生成世界 ...</div>
    <div id="info">🔫 枪械 · 生物 · 物品栏</div>
    <div id="crosshair">✚</div>
    <div id="controls-hint">
        <span>🖱️</span> 左键挖掘/射击 · 右键放置 · <span>WASD</span> 移动 · <span>Tab</span> 物品栏
    </div>
    <div id="blocker" onclick="focusGame()"></div>

    <div id="inventory-label">🎒 背包</div>
    <div id="held-label">手持: 空</div>
    <div id="held-item"><canvas id="heldCanvas" width="40" height="40"></canvas></div>
    <div id="inventory-ui"></div>
    <div id="coord-info">📍 0, 0, 0</div>

    <!-- 物品选择器 (选物栏) -->
    <div id="item-selector">
        <div class="close-selector" onclick="toggleSelector()">✕</div>
        <h2>📦 物品栏 (点击选择)</h2>
        <div id="item-grid"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 100);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(16, 20, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.getElementById('loading').style.display = 'none';

        // --- 指针锁定 ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        window.focusGame = () => controls.lock();
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'block');
        setTimeout(() => controls.lock(), 600);

        // --- 灯光 ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.1);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xccddff, 0.4);
        fill.position.set(-30, 20, -40);
        scene.add(fill);
        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.5);
        scene.add(hemi);

        // --- 纹理生成器 ---
        function createBlockTexture(baseColor, detailColor = null, border = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 32, 32);
            if (border) {
                ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                ctx.lineWidth = 1.8;
                ctx.strokeRect(0.5, 0.5, 31, 31);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(1.5, 1.5, 29, 29);
            }
            if (detailColor) {
                for (let i = 0; i < 40; i++) {
                    const x = Math.floor(Math.random() * 28) + 2;
                    const y = Math.floor(Math.random() * 28) + 2;
                    ctx.fillStyle = detailColor;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 32; i += 8) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 32);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(32, i);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- 物品类型定义 ---
        // 方块类型 (与之前相同)
        const BLOCK_TYPES = {
            GRASS: { name: '草地', color: '#7cb342', detail: '#558b2f', category: 'block' },
            DIRT: { name: '泥土', color: '#8d6e63', detail: '#6d4c41', category: 'block' },
            STONE: { name: '石頭', color: '#9e9e9e', detail: '#757575', category: 'block' },
            WOOD: { name: '木頭', color: '#8B5A2B', detail: '#6B4226', category: 'block' },
            LEAVES: { name: '樹葉', color: '#2E7D32', detail: '#1B5E20', category: 'block' },
            PLANKS: { name: '木板', color: '#deb887', detail: '#c4a47a', category: 'block' },
            BRICK: { name: '紅磚', color: '#b85a3a', detail: '#8d3a22', category: 'block' },
            SAND: { name: '沙地', color: '#f5e6b0', detail: '#d4c48a', category: 'block' },
        };

        // 枪械类型
        const GUN_TYPES = {
            PISTOL: { name: '手枪', damage: 20, fireRate: 200, range: 30, color: '#ffaa00', detail: '#cc8800' },
            RIFLE: { name: '步枪', damage: 35, fireRate: 400, range: 60, color: '#44aa44', detail: '#228822' },
            SHOTGUN: { name: '散弹枪', damage: 15, fireRate: 600, range: 15, color: '#cc8844', detail: '#996633', spread: 0.2 },
            SNIPER: { name: '狙击枪', damage: 80, fireRate: 1000, range: 100, color: '#6666cc', detail: '#444499' },
        };

        // 所有可用物品（用于物品栏）
        const ALL_ITEMS = [];

        // 添加方块
        for (const [key, data] of Object.entries(BLOCK_TYPES)) {
            ALL_ITEMS.push({ id: key, type: 'block', data: data });
        }

        // 添加枪械
        for (const [key, data] of Object.entries(GUN_TYPES)) {
            ALL_ITEMS.push({ id: key, type: 'gun', data: data });
        }

        // 添加一些工具（简单）
        const TOOL_TYPES = {
            PICKAXE: { name: '镐子', color: '#aaaaaa', detail: '#888888' },
            SHOVEL: { name: '铲子', color: '#bbaa77', detail: '#997755' },
        };
        for (const [key, data] of Object.entries(TOOL_TYPES)) {
            ALL_ITEMS.push({ id: key, type: 'tool', data: data });
        }

        // --- 背包系统 (存储已收集的物品) ---
        let inventory = []; // 每个元素 { type: 'block'|'gun'|'tool', id: 'GRASS', count: 1 }
        let selectedSlot = 0;
        const MAX_STACK = 64;

        // 添加物品到背包
        function addItemToInventory(type, id) {
            // 如果是枪或工具，不堆叠
            if (type === 'gun' || type === 'tool') {
                // 检查是否已有
                const existing = inventory.find(i => i.type === type && i.id === id);
                if (existing) {
                    existing.count++;
                } else {
                    inventory.push({ type, id, count: 1 });
                }
            } else {
                // 方块可堆叠
                const existing = inventory.find(i => i.type === type && i.id === id && i.count < MAX_STACK);
                if (existing) {
                    existing.count++;
                } else {
                    inventory.push({ type, id, count: 1 });
                }
            }
            updateUI();
            updateHeld();
        }

        // 移除物品 (返回是否成功)
        function removeItemFromInventory(type, id) {
            const idx = inventory.findIndex(i => i.type === type && i.id === id);
            if (idx === -1) return false;
            const item = inventory[idx];
            if (item.count > 1) {
                item.count--;
            } else {
                inventory.splice(idx, 1);
            }
            updateUI();
            updateHeld();
            return true;
        }

        // 获取当前手持物品
        function getHeldItem() {
            if (inventory.length === 0 || selectedSlot >= inventory.length) return null;
            return inventory[selectedSlot];
        }

        // --- UI更新 ---
        function updateUI() {
            const container = document.getElementById('inventory-ui');
            container.innerHTML = '';
            inventory.forEach((item, idx) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot' + (idx === selectedSlot ? ' active' : '');
                // 绘制图标
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                // 根据类型绘制
                const info = getItemInfo(item.type, item.id);
                if (info) {
                    ctx.fillStyle = info.color || '#888';
                    ctx.fillRect(0, 0, 32, 32);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(0.5, 0.5, 31, 31);
                    if (info.detail) {
                        for (let i = 0; i < 20; i++) {
                            const x = Math.floor(Math.random() * 28) + 2;
                            const y = Math.floor(Math.random() * 28) + 2;
                            ctx.fillStyle = info.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                }
                slot.appendChild(canvas);
                if (item.count > 1) {
                    const c = document.createElement('span');
                    c.className = 'count';
                    c.textContent = item.count;
                    slot.appendChild(c);
                }
                slot.addEventListener('click', () => {
                    selectedSlot = idx;
                    updateUI();
                    updateHeld();
                });
                container.appendChild(slot);
            });
            if (inventory.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'color:rgba(255,255,255,0.3);padding:6px 14px;font-size:13px;';
                empty.textContent = '🈳 挖掘或从物品栏获取';
                container.appendChild(empty);
            }
            updateHeld();
        }

        function getItemInfo(type, id) {
            if (type === 'block') {
                return BLOCK_TYPES[id];
            } else if (type === 'gun') {
                return GUN_TYPES[id];
            } else if (type === 'tool') {
                return { name: id, color: '#aaaaaa', detail: '#888888' };
            }
            return null;
        }

        function updateHeld() {
            const heldCanvas = document.getElementById('heldCanvas');
            const ctx = heldCanvas.getContext('2d');
            ctx.clearRect(0, 0, 40, 40);
            const item = getHeldItem();
            if (item) {
                const info = getItemInfo(item.type, item.id);
                if (info) {
                    ctx.fillStyle = info.color || '#888';
                    ctx.fillRect(2, 2, 36, 36);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(2, 2, 36, 36);
                    if (info.detail) {
                        for (let i = 0; i < 20; i++) {
                            const x = Math.floor(Math.random() * 30) + 5;
                            const y = Math.floor(Math.random() * 30) + 5;
                            ctx.fillStyle = info.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                    document.getElementById('held-label').textContent = '手持: ' + info.name + (item.count > 1 ? ' x' + item.count : '');
                }
            } else {
                document.getElementById('held-label').textContent = '手持: 空';
            }
        }

        // --- 物品栏选择器 (按Tab打开) ---
        let selectorOpen = false;
        function toggleSelector() {
            selectorOpen = !selectorOpen;
            const el = document.getElementById('item-selector');
            if (selectorOpen) {
                el.classList.add('show');
                renderItemGrid();
                // 解锁鼠标指针
                if (controls.isLocked) controls.unlock();
            } else {
                el.classList.remove('show');
                // 重新锁定
                controls.lock();
            }
        }

        // 渲染物品网格
        function renderItemGrid() {
            const grid = document.getElementById('item-grid');
            grid.innerHTML = '';
            ALL_ITEMS.forEach(item => {
                const cell = document.createElement('div');
                cell.className = 'item-cell';
                const canvas = document.createElement('canvas');
                canvas.width = 40; canvas.height = 40;
                const ctx = canvas.getContext('2d');
                const info = item.data;
                ctx.fillStyle = info.color || '#888';
                ctx.fillRect(0, 0, 40, 40);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0.5, 0.5, 39, 39);
                if (info.detail) {
                    for (let i = 0; i < 30; i++) {
                        const x = Math.floor(Math.random() * 36) + 2;
                        const y = Math.floor(Math.random() * 36) + 2;
                        ctx.fillStyle = info.detail;
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
                cell.appendChild(canvas);
                const nameSpan = document.createElement('span');
                nameSpan.className = 'item-name';
                nameSpan.textContent = info.name || item.id;
                cell.appendChild(nameSpan);
                cell.addEventListener('click', () => {
                    // 选择该物品，添加到背包（如果还没有）
                    // 如果是枪或工具，直接添加，否则检查是否已有
                    const existing = inventory.find(i => i.type === item.type && i.id === item.id);
                    if (existing) {
                        // 如果已有，则选中它
                        selectedSlot = inventory.indexOf(existing);
                    } else {
                        // 添加到背包
                        addItemToInventory(item.type, item.id);
                        // 选中新添加的
                        const newItem = inventory.find(i => i.type === item.type && i.id === item.id);
                        if (newItem) selectedSlot = inventory.indexOf(newItem);
                    }
                    updateUI();
                    updateHeld();
                    // 关闭选物栏
                    toggleSelector();
                });
                grid.appendChild(cell);
            });
        }

        // 监听Tab键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                toggleSelector();
            }
        });

        // 全局暴露给HTML onclick
        window.toggleSelector = toggleSelector;

        // --- 世界生成 (方块) ---
        const worldObjects = [];
        const blockSize = 0.9;

        function createBlockMesh(typeKey, pos) {
            const block = BLOCK_TYPES[typeKey];
            if (!block) return null;
            const mat = new THREE.MeshStandardMaterial({
                map: createBlockTexture(block.color, block.detail),
                roughness: 0.85,
                metalness: 0.05
            });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), mat);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { blockType: typeKey, isBlock: true };
            return mesh;
        }

        function generateWorld() {
            const group = new THREE.Group();
            const range = 32;
            const heightRange = 12;

            for (let x = -range; x < range; x++) {
                for (let z = -range; z < range; z++) {
                    if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
                    const noise = Math.sin(x * 0.25) * Math.cos(z * 0.2) * 1.5 + Math.sin(x * 0.08 + z * 0.12) * 0.8;
                    const topY = Math.floor(noise + 3);
                    if (topY < 0) continue;

                    const grassPos = new THREE.Vector3(x, topY, z);
                    const grass = createBlockMesh('GRASS', grassPos);
                    if (grass) { group.add(grass);
                        worldObjects.push(grass); }

                    for (let d = 1; d <= 2; d++) {
                        const yPos = topY - d;
                        if (yPos < -2) continue;
                        const dirtPos = new THREE.Vector3(x, yPos, z);
                        const dirt = createBlockMesh('DIRT', dirtPos);
                        if (dirt) { group.add(dirt);
                            worldObjects.push(dirt); }
                    }

                    for (let d = 3; d < 6; d++) {
                        const yPos = topY - d;
                        if (yPos < -heightRange) continue;
                        const stonePos = new THREE.Vector3(x, yPos, z);
                        const stone = createBlockMesh('STONE', stonePos);
                        if (stone) { group.add(stone);
                            worldObjects.push(stone); }
                    }
                }
            }

            // 树木
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() - 0.5) * 55;
                const z = (Math.random() - 0.5) * 55;
                if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
                const noise = Math.sin(x * 0.25) * Math.cos(z * 0.2) * 1.5 + Math.sin(x * 0.08 + z * 0.12) * 0.8;
                const topY = Math.floor(noise + 3);
                if (topY < 1) continue;
                for (let j = 0; j < 3; j++) {
                    const trunkPos = new THREE.Vector3(x, topY + 1 + j, z);
                    const trunk = createBlockMesh('WOOD', trunkPos);
                    if (trunk) { group.add(trunk);
                        worldObjects.push(trunk); }
                }
                const leafOffsets = [
                    [0, 4, 0], [1, 3, 0], [-1, 3, 0], [0, 3, 1], [0, 3, -1],
                    [1, 4, 0], [-1, 4, 0], [0, 4, 1], [0, 4, -1],
                    [1, 3, 1], [-1, 3, -1], [1, 3, -1], [-1, 3, 1]
                ];
                for (const off of leafOffsets) {
                    const leafPos = new THREE.Vector3(x + off[0], topY + 1 + off[1], z + off[2]);
                    const leaf = createBlockMesh('LEAVES', leafPos);
                    if (leaf) { group.add(leaf);
                        worldObjects.push(leaf); }
                }
            }

            // 边界光柱
            const bMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200, transparent: true, opacity: 0.15 });
            const boundaryPos = [
                [-34, 0, -34],
                [34, 0, -34],
                [-34, 0, 34],
                [34, 0, 34]
            ];
            for (const p of boundaryPos) {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 0.5), bMat);
                pillar.position.set(p[0], 2, p[1]);
                pillar.castShadow = true;
                group.add(pillar);
                const top = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6),
                    new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500 }));
                top.position.set(p[0], 4.2, p[1]);
                group.add(top);
            }

            return group;
        }

        const worldGroup = generateWorld();
        scene.add(worldGroup);

        // --- 生物系统 ---
        const entities = [];

        // 生物类型
        const MOB_TYPES = {
            COW: { name: '牛', color: 0x8B8B8B, health: 20, speed: 0.02, aggressive: false },
            PIG: { name: '猪', color: 0xFFB6C1, health: 15, speed: 0.025, aggressive: false },
            ZOMBIE: { name: '僵尸', color: 0x2E8B57, health: 30, speed: 0.04, aggressive: true, damage: 8 },
            SKELETON: { name: '骷髅', color: 0xDEB887, health: 25, speed: 0.035, aggressive: true, damage: 10 },
        };

        function createMob(type, pos) {
            const data = MOB_TYPES[type];
            if (!data) return null;
            const group = new THREE.Group();
            // 身体
            const bodyMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.6), bodyMat);
            body.position.y = 0.4;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            // 头
            const headMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
            head.position.y = 0.9;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);
            // 腿 (简单)
            const legMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
            for (let side of [-0.25, 0.25]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.3, 0.15), legMat);
                leg.position.set(side, 0.15, 0);
                leg.castShadow = true;
                group.add(leg);
            }

            group.position.copy(pos);
            group.userData = {
                type: type,
                health: data.health,
                maxHealth: data.health,
                speed: data.speed,
                aggressive: data.aggressive || false,
                damage: data.damage || 0,
                target: null,
                state: 'idle', // idle, wander, chase
                wanderTimer: 0,
            };
            scene.add(group);
            entities.push(group);
            return group;
        }

        // 生成一些生物
        function spawnMobs() {
            const types = ['COW', 'PIG', 'ZOMBIE', 'SKELETON'];
            for (let i = 0; i < 20; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                const x = (Math.random() - 0.5) * 50;
                const z = (Math.random() - 0.5) * 50;
                if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
                const y = getGroundHeight(x, z) + 0.5;
                if (y < 0.5) continue;
                const pos = new THREE.Vector3(x, y, z);
                createMob(type, pos);
            }
        }

        function getGroundHeight(x, z) {
            // 近似计算地表高度
            const noise = Math.sin(x * 0.25) * Math.cos(z * 0.2) * 1.5 + Math.sin(x * 0.08 + z * 0.12) * 0.8;
            return Math.floor(noise + 3);
        }

        spawnMobs();

        // 生物AI (每帧更新)
        function updateMobs() {
            const dt = 1 / 60;
            entities.forEach(mob => {
                const data = mob.userData;
                // 简单的漫游
                if (data.aggressive) {
                    // 检测玩家距离
                    const toPlayer = new THREE.Vector3().copy(camera.position).sub(mob.position);
                    const dist = toPlayer.length();
                    if (dist < 15) {
                        data.state = 'chase';
                        data.target = camera.position.clone();
                    } else {
                        data.state = 'idle';
                    }
                } else {
                    // 被动动物随机游走
                    data.wanderTimer -= dt;
                    if (data.wanderTimer <= 0) {
                        data.wanderTimer = 2 + Math.random() * 5;
                        // 随机方向
                        const angle = Math.random() * Math.PI * 2;
                        const speed = data.speed * 2;
                        data.velocity = new THREE.Vector3(Math.cos(angle) * speed, 0, Math.sin(angle) * speed);
                    }
                }

                if (data.state === 'chase' && data.target) {
                    const dir = new THREE.Vector3().copy(data.target).sub(mob.position);
                    dir.y = 0;
                    const len = dir.length();
                    if (len > 0.5) {
                        dir.normalize().multiplyScalar(data.speed * 1.5);
                        mob.position.x += dir.x;
                        mob.position.z += dir.z;
                        // 面向目标
                        mob.lookAt(data.target);
                    }
                    // 如果足够近，攻击玩家 (造成伤害)
                    if (len < 1.5 && data.damage > 0) {
                        // 简单伤害：减少玩家生命（未实现玩家生命值），这里仅做效果
                        // 我们用一个简单的反馈
                        if (Math.random() < 0.1) {
                            console.log('受到攻击！');
                        }
                    }
                } else {
                    // 漫游
                    if (data.velocity) {
                        mob.position.x += data.velocity.x * dt;
                        mob.position.z += data.velocity.z * dt;
                        // 边界检查
                        if (Math.abs(mob.position.x) > 30 || Math.abs(mob.position.z) > 30) {
                            data.velocity.x *= -1;
                            data.velocity.z *= -1;
                        }
                        // 面向运动方向
                        if (data.velocity.length() > 0.001) {
                            mob.lookAt(mob.position.clone().add(data.velocity));
                        }
                    }
                }

                // 保持在地面
                const groundY = getGroundHeight(mob.position.x, mob.position.z);
                mob.position.y = groundY + 0.5;
            });
        }

        // --- 枪械射击 ---
        function shootGun() {
            const held = getHeldItem();
            if (!held || held.type !== 'gun') return;
            const gunId = held.id;
            const gun = GUN_TYPES[gunId];
            if (!gun) return;

            // 发射射线检测
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            raycaster.far = gun.range || 30;

            // 检测生物
            const targets = entities.filter(e => e !== undefined);
            const intersects = raycaster.intersectObjects(targets, true);
            if (intersects.length > 0) {
                let hitMob = null;
                for (const hit of intersects) {
                    let obj = hit.object;
                    while (obj.parent && !entities.includes(obj)) {
                        obj = obj.parent;
                    }
                    if (entities.includes(obj)) {
                        hitMob = obj;
                        break;
                    }
                }
                if (hitMob) {
                    const mobData = hitMob.userData;
                    mobData.health -= gun.damage || 20;
                    console.log(`击中 ${MOB_TYPES[mobData.type].name}, 剩余生命 ${mobData.health}`);
                    // 简单受伤效果
                    if (mobData.health <= 0) {
                        // 死亡移除
                        scene.remove(hitMob);
                        const idx = entities.indexOf(hitMob);
                        if (idx > -1) entities.splice(idx, 1);
                        console.log('生物死亡');
                    }
                }
            }

            // 添加枪口闪光效果 (简单)
            // 可添加粒子
        }

        // --- 挖掘与放置 (与之前相同) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersect() {
            if (!controls.isLocked) return null;
            mouse.set(0, 0);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(worldObjects);
            if (hits.length > 0) return hits[0];
            return null;
        }

        function digBlock() {
            const held = getHeldItem();
            if (held && held.type === 'gun') {
                shootGun();
                return;
            }
            const hit = getIntersect();
            if (!hit) return;
            const obj = hit.object;
            if (!obj.userData.isBlock) return;
            const type = obj.userData.blockType;
            if (type) {
                addItemToInventory('block', type);
                scene.remove(obj);
                const idx = worldObjects.indexOf(obj);
                if (idx > -1) worldObjects.splice(idx, 1);
                updateUI();
            }
        }

        function placeBlock() {
            const held = getHeldItem();
            if (!held || held.type !== 'block') return;
            const hit = getIntersect();
            if (!hit) return;
            const obj = hit.object;
            if (!obj.userData.isBlock) return;

            const normal = hit.face.normal.clone();
            normal.transformDirection(obj.matrixWorld);
            const pos = obj.position.clone().add(normal.multiplyScalar(0.95));
            const exists = worldObjects.some(o => o.position.distanceTo(pos) < 0.1 && o !== obj);
            if (exists) return;

            if (!removeItemFromInventory('block', held.id)) return;
            const block = BLOCK_TYPES[held.id];
            const mat = new THREE.MeshStandardMaterial({
                map: createBlockTexture(block.color, block.detail),
                roughness: 0.85
            });
            const cube = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), mat);
            cube.position.copy(pos);
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { blockType: held.id, isBlock: true };
            scene.add(cube);
            worldObjects.push(cube);
            updateUI();
        }

        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            if (e.button === 0) digBlock();
            else if (e.button === 2) placeBlock();
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- 键盘移动 ---
        const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'w':
                case 'W':
                    keys.w = true;
                    e.preventDefault();
                    break;
                case 'a':
                case 'A':
                    keys.a = true;
                    e.preventDefault();
                    break;
                case 's':
                case 'S':
                    keys.s = true;
                    e.preventDefault();
                    break;
                case 'd':
                case 'D':
                    keys.d = true;
                    e.preventDefault();
                    break;
                case 'Shift':
                    keys.shift = true;
                    e.preventDefault();
                    break;
                case ' ':
                    keys.space = true;
                    e.preventDefault();
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.key) {
                case 'w':
                case 'W':
                    keys.w = false;
                    e.preventDefault();
                    break;
                case 'a':
                case 'A':
                    keys.a = false;
                    e.preventDefault();
                    break;
                case 's':
                case 'S':
                    keys.s = false;
                    e.preventDefault();
                    break;
                case 'd':
                case 'D':
                    keys.d = false;
                    e.preventDefault();
                    break;
                case 'Shift':
                    keys.shift = false;
                    e.preventDefault();
                    break;
                case ' ':
                    keys.space = false;
                    e.preventDefault();
                    break;
            }
        });

        function updateMovement() {
            if (!controls.isLocked) return;
            const speed = keys.shift ? 0.3 : 0.15;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

            const mx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            const mz = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            if (mx !== 0 || mz !== 0) {
                const fwd = dir.clone().multiplyScalar(-mz);
                const side = right.clone().multiplyScalar(mx);
                const total = fwd.add(side).normalize().multiplyScalar(speed);
                camera.position.x += total.x;
                camera.position.z += total.z;
            }
            if (keys.space && camera.position.y <= 1.8) {
                camera.position.y += 0.35;
            } else if (camera.position.y > 1.8) {
                camera.position.y -= 0.04;
            } else if (camera.position.y < 1.8) {
                camera.position.y = 1.8;
            }
            document.getElementById('coord-info').textContent =
                `📍 ${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;
        }
        setInterval(updateMovement, 16);

        // --- 云朵 ---
        const clouds = [];
        for (let i = 0; i < 20; i++) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, roughness: 0.1 });
            const pos = [
                [0, 0, 0, 1.8, 0.4, 1.2],
                [-1.2, 0.2, 0.2, 1.4, 0.3, 0.9],
                [1.2, 0.1, -0.2, 1.4, 0.3, 0.9],
                [-0.6, 0.3, -0.7, 1.0, 0.2, 0.7],
                [0.7, 0.2, 0.8, 1.0, 0.2, 0.7]
            ];
            for (const p of pos) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(p[3], p[4], p[5]), mat);
                box.position.set(p[0], p[1], p[2]);
                g.add(box);
            }
            g.position.set((Math.random() - 0.5) * 120, 16 + Math.random() * 8, (Math.random() - 0.5) * 120);
            scene.add(g);
            clouds.push(g);
        }

        // --- 动画循环 ---
        function animate() {
            const time = performance.now() * 0.0001;
            clouds.forEach((c, i) => {
                c.position.x += Math.sin(time + i) * 0.002;
                c.position.z += Math.cos(time * 0.7 + i) * 0.002;
            });

            updateMobs();

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始化
        updateUI();
        updateHeld();

        console.log('✅ 枪械·生物·物品栏 已启动！');
        console.log('🔫 手持枪时左键射击，Tab打开物品栏');
    </script>
</body>
</html>
