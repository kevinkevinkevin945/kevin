<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Minecraft · 背包 & 挖掘</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        #info { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 30px; font-size: 14px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); pointer-events: none; z-index: 10; user-select: none; }
        #controls-hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.6); padding: 10px 24px; border-radius: 40px; font-size: 15px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.15); pointer-events: none; z-index: 10; white-space: nowrap; letter-spacing: 1px; }
        #controls-hint span { display: inline-block; margin: 0 8px; color: #aaffaa; }
        @media (max-width: 600px) { #controls-hint { font-size: 11px; padding: 6px 14px; white-space: normal; width: 80%; text-align: center; bottom: 15px; } #info { font-size: 11px; top: 12px; left: 12px; padding: 5px 14px; } }
        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 5; cursor: pointer; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 12px; font-size: 24px; border: 1px solid #888; z-index: 20; backdrop-filter: blur(6px); pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.6); font-size: 30px; pointer-events: none; z-index: 6; text-shadow: 0 0 4px rgba(0,0,0,0.5); user-select: none; }
        
        /* 背包UI */
        #inventory-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            z-index: 15;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .inv-slot {
            width: 54px;
            height: 54px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            image-rendering: pixelated;
        }
        .inv-slot:hover {
            background: rgba(255,255,255,0.25);
            border-color: #ffaa00;
            transform: scale(1.05);
        }
        .inv-slot.active {
            border-color: #ffaa00;
            background: rgba(255,170,0,0.3);
            box-shadow: 0 0 16px rgba(255,170,0,0.3);
        }
        .inv-slot .item-count {
            position: absolute;
            bottom: 2px;
            right: 6px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }
        .inv-slot canvas {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }
        #held-item {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 12;
            backdrop-filter: blur(4px);
        }
        #held-item canvas {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }
        #held-label {
            position: absolute;
            bottom: 155px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 2px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 12;
            white-space: nowrap;
        }
        #action-hint {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,200,0.8);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 12;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="loading">⛏️ 載入世界...</div>
    <div id="info">🎮 3D Minecraft · 背包 & 挖掘</div>
    <div id="crosshair">✚</div>
    <div id="controls-hint"><span>🖱️</span> 點擊方塊挖掘 · <span>WASD</span> 移動 · <span>空白</span> 跳 · <span>Shift</span> 跑</div>
    <div id="blocker" onclick="focusGame()"></div>
    
    <!-- 手持物品顯示 -->
    <div id="held-label">手持</div>
    <div id="held-item"><canvas id="heldCanvas" width="40" height="40"></canvas></div>
    <div id="action-hint">🖱️ 左鍵挖掘 · 右鍵放置</div>

    <!-- 背包UI -->
    <div id="inventory-ui"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 初始化場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 90);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 12, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // --- 指針鎖定 ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        window.focusGame = () => controls.lock();
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'block');
        setTimeout(() => controls.lock(), 400);

        // --- 燈光 ---
        const ambient = new THREE.AmbientLight(0x404060, 0.7);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xccddff, 0.5);
        fill.position.set(-30, 20, -40);
        scene.add(fill);
        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.6);
        scene.add(hemi);

        // --- 紋理生成器 ---
        function createBlockTexture(baseColor, detailColor = null, border = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 32, 32);
            if (border) {
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(1, 1, 30, 30);
            }
            if (detailColor) {
                for (let i = 0; i < 30; i++) {
                    const x = Math.floor(Math.random() * 30) + 1;
                    const y = Math.floor(Math.random() * 30) + 1;
                    ctx.fillStyle = detailColor;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            for (let i = 0; i < 60; i++) {
                const x = Math.floor(Math.random() * 32);
                const y = Math.floor(Math.random() * 32);
                const bright = Math.random() * 30 + 20;
                ctx.fillStyle = `rgba(${bright}, ${bright}, ${bright}, 0.2)`;
                ctx.fillRect(x, y, 1, 1);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- 方塊資料定義 ---
        const BLOCK_TYPES = {
            GRASS: { name: '草地', color: '#7cb342', detail: '#558b2f' },
            DIRT: { name: '泥土', color: '#8d6e63', detail: '#6d4c41' },
            STONE: { name: '石頭', color: '#9e9e9e', detail: '#757575' },
            WOOD: { name: '木頭', color: '#8B5A2B', detail: '#6B4226' },
            LEAVES: { name: '樹葉', color: '#2E7D32', detail: '#1B5E20' },
            GOLD: { name: '金礦', color: '#FFD700', detail: '#DAA520' },
            DIAMOND: { name: '鑽石', color: '#00BCD4', detail: '#0097A7' },
            IRON: { name: '鐵礦', color: '#B0BEC5', detail: '#78909C' },
            SAND: { name: '沙地', color: '#f5e6b0', detail: '#d4c48a' },
            PLANKS: { name: '木板', color: '#deb887', detail: '#c4a47a' },
            BRICK: { name: '紅磚', color: '#b85a3a', detail: '#8d3a22' },
        };

        // --- 背包系統 ---
        let inventory = [];
        const MAX_STACK = 64;
        let selectedSlot = 0;

        // 工具函數: 添加物品到背包
        function addItemToInventory(blockType) {
            const existing = inventory.find(item => item.type === blockType && item.count < MAX_STACK);
            if (existing) {
                existing.count++;
            } else {
                inventory.push({ type: blockType, count: 1 });
            }
            updateInventoryUI();
            updateHeldItem();
        }

        // 移除物品 (用於放置)
        function removeItemFromInventory(blockType) {
            const idx = inventory.findIndex(item => item.type === blockType);
            if (idx === -1) return false;
            const item = inventory[idx];
            if (item.count > 1) {
                item.count--;
            } else {
                inventory.splice(idx, 1);
            }
            updateInventoryUI();
            updateHeldItem();
            return true;
        }

        // 獲取當前手持物品
        function getHeldItem() {
            if (inventory.length === 0 || selectedSlot >= inventory.length) return null;
            return inventory[selectedSlot];
        }

        // --- 更新背包UI ---
        function updateInventoryUI() {
            const container = document.getElementById('inventory-ui');
            container.innerHTML = '';
            inventory.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot' + (index === selectedSlot ? ' active' : '');
                // 繪製方塊紋理
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const block = BLOCK_TYPES[item.type];
                if (block) {
                    ctx.fillStyle = block.color;
                    ctx.fillRect(0, 0, 32, 32);
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(1, 1, 30, 30);
                    if (block.detail) {
                        for (let i=0; i<20; i++) {
                            const x = Math.floor(Math.random()*28)+2;
                            const y = Math.floor(Math.random()*28)+2;
                            ctx.fillStyle = block.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                }
                slot.appendChild(canvas);
                // 數量
                if (item.count > 1) {
                    const countLabel = document.createElement('span');
                    countLabel.className = 'item-count';
                    countLabel.textContent = item.count;
                    slot.appendChild(countLabel);
                }
                slot.title = block ? block.name : item.type;
                slot.addEventListener('click', () => {
                    selectedSlot = index;
                    updateInventoryUI();
                    updateHeldItem();
                });
                container.appendChild(slot);
            });
            // 空背包提示
            if (inventory.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'rgba(255,255,255,0.4)';
                empty.style.padding = '8px 16px';
                empty.style.fontSize = '14px';
                empty.textContent = '🈳 背包空空 · 挖掘方塊收集';
                container.appendChild(empty);
            }
            updateHeldItem();
        }

        // --- 更新手持顯示 ---
        function updateHeldItem() {
            const heldCanvas = document.getElementById('heldCanvas');
            const ctx = heldCanvas.getContext('2d');
            ctx.clearRect(0, 0, 40, 40);
            const item = getHeldItem();
            if (item) {
                const block = BLOCK_TYPES[item.type];
                if (block) {
                    ctx.fillStyle = block.color;
                    ctx.fillRect(2, 2, 36, 36);
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(2, 2, 36, 36);
                    if (block.detail) {
                        for (let i=0; i<20; i++) {
                            const x = Math.floor(Math.random()*30)+5;
                            const y = Math.floor(Math.random()*30)+5;
                            ctx.fillStyle = block.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                    document.getElementById('held-label').textContent = '手持: ' + block.name + (item.count>1 ? ' x'+item.count : '');
                }
            } else {
                document.getElementById('held-label').textContent = '手持: 空手';
            }
        }

        // --- 世界生成 ---
        const worldObjects = []; // 存儲所有可挖掘的方塊物件

        function createWorld() {
            const group = new THREE.Group();
            
            // 草地紋理
            const grassCanvas = document.createElement('canvas');
            grassCanvas.width = 64;
            grassCanvas.height = 64;
            const gCtx = grassCanvas.getContext('2d');
            gCtx.fillStyle = '#7cb342';
            gCtx.fillRect(0, 0, 64, 64);
            for (let i = 0; i < 800; i++) {
                const x = Math.floor(Math.random() * 64);
                const y = Math.floor(Math.random() * 64);
                const bright = Math.random() * 50 + 40;
                gCtx.fillStyle = `rgb(${bright+70}, ${bright+120}, ${bright+30})`;
                gCtx.fillRect(x, y, 1, 1);
            }
            const grassTexture = new THREE.CanvasTexture(grassCanvas);
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(25, 25);

            const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.9 });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            ground.userData = { isGround: true, blockType: 'GRASS' };
            group.add(ground);
            worldObjects.push(ground);

            // 隨機樹木 (方塊形式)
            for (let i = 0; i < 60; i++) {
                const x = (Math.random() - 0.5) * 80;
                const z = (Math.random() - 0.5) * 80;
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                createTreeBlocks(group, x, 0, z);
            }

            // 隨機石頭
            for (let i = 0; i < 40; i++) {
                const x = (Math.random() - 0.5) * 80;
                const z = (Math.random() - 0.5) * 80;
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                const mat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#9E9E9E', '#757575'), roughness: 0.95 });
                const s = 0.4 + Math.random() * 0.5;
                const rock = new THREE.Mesh(new THREE.BoxGeometry(s, s*0.6, s*0.8), mat);
                rock.position.set(x, s*0.3, z);
                rock.rotation.y = Math.random() * Math.PI;
                rock.castShadow = true;
                rock.receiveShadow = true;
                rock.userData = { blockType: 'STONE', isBlock: true };
                group.add(rock);
                worldObjects.push(rock);
            }

            // 礦石
            const oreTypes = ['GOLD', 'DIAMOND', 'IRON'];
            for (let i = 0; i < 50; i++) {
                const type = oreTypes[Math.floor(Math.random()*oreTypes.length)];
                const block = BLOCK_TYPES[type];
                const mat = new THREE.MeshStandardMaterial({
                    map: createBlockTexture(block.color, block.detail),
                    emissive: new THREE.Color(0x442200),
                    emissiveIntensity: 0.1
                });
                const ore = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
                const x = (Math.random()-0.5)*70;
                const z = (Math.random()-0.5)*70;
                if (Math.abs(x)<8 && Math.abs(z)<8) continue;
                ore.position.set(x, 0.1, z);
                ore.castShadow = true;
                ore.receiveShadow = true;
                ore.userData = { blockType: type, isBlock: true };
                group.add(ore);
                worldObjects.push(ore);
            }

            // 邊界光柱
            const bMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200, transparent: true, opacity: 0.2 });
            const pos = [[-45,0,-45],[45,0,-45],[-45,0,45],[45,0,45],[-45,0,0],[45,0,0],[0,0,-45],[0,0,45]];
            for (const p of pos) {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), bMat);
                pillar.position.set(p[0], 1.5, p[1]);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                group.add(pillar);
                const top = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6), new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500 }));
                top.position.set(p[0], 3.2, p[1]);
                group.add(top);
            }

            return group;
        }

        // 樹木方塊
        function createTreeBlocks(group, x, y, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#8B5A2B', '#6B4226'), roughness: 0.9 });
            const leafMat = new THREE.MeshStandardMaterial({ map: createBlockTexture('#2E7D32', '#1B5E20'), roughness: 0.7 });
            
            // 樹幹 (3塊)
            for (let i = 0; i < 3; i++) {
                const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), trunkMat);
                trunk.position.set(x, y + 0.4 + i*0.8, z);
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                trunk.userData = { blockType: 'WOOD', isBlock: true };
                group.add(trunk);
                worldObjects.push(trunk);
            }
            // 樹葉 (周圍)
            const leafOffsets = [[0,2.4,0], [-0.8,2.0,0.8], [0.8,2.0,-0.8], [0.8,2.0,0.8], [-0.8,2.0,-0.8], [0,2.8,0], [-0.8,2.8,0], [0.8,2.8,0], [0,2.8,-0.8], [0,2.8,0.8]];
            for (const off of leafOffsets) {
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), leafMat);
                leaf.position.set(x + off[0], y + off[1], z + off[2]);
                leaf.castShadow = true;
                leaf.receiveShadow = true;
                leaf.userData = { blockType: 'LEAVES', isBlock: true };
                group.add(leaf);
                worldObjects.push(leaf);
            }
        }

        // 生成世界
        const worldGroup = createWorld();
        scene.add(worldGroup);

        // --- 動態雲 ---
        const clouds = [];
        for (let i = 0; i < 25; i++) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.1, emissive: new THREE.Color(0xeeeeee), emissiveIntensity: 0.1 });
            const pos = [[0,0,0,1.8,0.4,1.2], [-1.2,0.2,0.2,1.4,0.3,0.9], [1.2,0.1,-0.2,1.4,0.3,0.9], [-0.6,0.3,-0.7,1.0,0.2,0.7], [0.7,0.2,0.8,1.0,0.2,0.7]];
            for (const p of pos) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(p[3], p[4], p[5]), mat);
                box.position.set(p[0], p[1], p[2]);
                g.add(box);
            }
            g.position.set((Math.random()-0.5)*150, 14+Math.random()*10, (Math.random()-0.5)*150);
            scene.add(g);
            clouds.push(g);
        }

        // --- 挖掘與放置邏輯 (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersection() {
            if (!controls.isLocked) return null;
            mouse.set(0, 0);
            raycaster.setFromCamera(mouse, camera);
            // 只檢測 worldObjects
            const intersects = raycaster.intersectObjects(worldObjects);
            if (intersects.length > 0) {
                return intersects[0];
            }
            return null;
        }

        // 挖掘
        function digBlock() {
            const hit = getIntersection();
            if (!hit) return;
            const obj = hit.object;
            if (obj.userData.isGround) return; // 不能挖草地地面
            if (obj.userData.isBlock) {
                const blockType = obj.userData.blockType;
                if (blockType) {
                    // 添加到背包
                    addItemToInventory(blockType);
                    // 從場景移除
                    scene.remove(obj);
                    const idx = worldObjects.indexOf(obj);
                    if (idx > -1) worldObjects.splice(idx, 1);
                    // 簡單粒子效果 (簡化)
                    updateInventoryUI();
                }
            }
        }

        // 放置
        function placeBlock() {
            const hit = getIntersection();
            if (!hit) return;
            const obj = hit.object;
            // 獲取當前手持物品
            const held = getHeldItem();
            if (!held) return;
            const blockType = held.type;
            // 確認不是地面
            if (obj.userData.isGround) return;
            
            // 計算放置位置 (在擊中面的外側)
            const normal = hit.face.normal.clone();
            // 將法線從局部轉到世界
            normal.transformDirection(obj.matrixWorld);
            const pos = obj.position.clone().add(normal.multiplyScalar(0.8));
            // 檢查該位置是否已有方塊
            const existing = worldObjects.some(o => o.position.distanceTo(pos) < 0.1 && o !== obj);
            if (existing) return;
            
            // 從背包移除
            if (!removeItemFromInventory(blockType)) return;
            
            // 創建方塊
            const block = BLOCK_TYPES[blockType];
            const mat = new THREE.MeshStandardMaterial({
                map: createBlockTexture(block.color, block.detail),
                roughness: 0.8
            });
            const cube = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat);
            cube.position.copy(pos);
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { blockType: blockType, isBlock: true };
            scene.add(cube);
            worldObjects.push(cube);
            updateInventoryUI();
        }

        // --- 滑鼠事件 ---
        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            if (e.button === 0) { // 左鍵挖掘
                digBlock();
            } else if (e.button === 2) { // 右鍵放置
                placeBlock();
            }
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- 鍵盤移動 ---
        const keys = { w:false, a:false, s:false, d:false, shift:false, space:false };
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = true; e.preventDefault(); break;
                case 'Space': keys.space = true; e.preventDefault(); break;
                case 'KeyE': // E鍵切換背包 (簡單切換選中)
                    if (inventory.length > 0) {
                        selectedSlot = (selectedSlot + 1) % inventory.length;
                        updateInventoryUI();
                        updateHeldItem();
                    }
                    e.preventDefault();
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = false; e.preventDefault(); break;
                case 'Space': keys.space = false; e.preventDefault(); break;
            }
        });

        function updateMovement() {
            if (!controls.isLocked) return;
            const speed = keys.shift ? 0.28 : 0.14;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            const mx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            const mz = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            if (mx !== 0 || mz !== 0) {
                const fwd = dir.clone().multiplyScalar(-mz);
                const side = right.clone().multiplyScalar(mx);
                const total = fwd.add(side).normalize().multiplyScalar(speed);
                camera.position.x += total.x;
                camera.position.z += total.z;
            }

            if (keys.space && camera.position.y <= 1.6) {
                camera.position.y += 0.35;
            } else if (camera.position.y > 1.6) {
                camera.position.y -= 0.04;
            } else if (camera.position.y < 1.6) {
                camera.position.y = 1.6;
            }
        }
        setInterval(updateMovement, 16);

        // --- 動畫循環 ---
        function animate() {
            const time = performance.now() * 0.0001;
            clouds.forEach((cloud, i) => {
                cloud.position.x += Math.sin(time + i) * 0.002;
                cloud.position.z += Math.cos(time * 0.7 + i) * 0.002;
            });
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始化UI
        updateInventoryUI();
        updateHeldItem();

        console.log('✅ Minecraft 3D 背包 & 挖掘系統已啟動！');
        console.log('🖱️ 左鍵挖掘 · 右鍵放置 · E鍵切換手持');
    </script>
</body>
</html>
