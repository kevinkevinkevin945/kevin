<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧟 3D PvE 僵尸枪战 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial Black', 'Segoe UI', sans-serif;
            cursor: crosshair;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            pointer-events: auto;
        }
        #start-screen h1 {
            font-size: 70px;
            color: #ff2200;
            text-shadow: 0 0 40px #ff0000, 0 0 80px #ff4400;
            animation: pulse 1.2s infinite;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }
        #start-screen p {
            color: #aaffaa;
            font-size: 18px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }
        #start-btn {
            font-size: 28px;
            padding: 22px 60px;
            background: linear-gradient(45deg, #ff0000, #cc3300, #ff6600);
            color: #fff;
            border: 3px solid #ffcc00;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 4px;
            transition: all 0.3s;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            animation: btnPulse 2s infinite;
        }
        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            }
            50% {
                box-shadow: 0 0 80px rgba(255, 0, 0, 1);
            }
        }
        #start-btn:hover {
            transform: scale(1.08);
        }

        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hud-item {
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 18px;
            border-radius: 25px;
            border: 2px solid #ff6600;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 8px #ff6600;
            backdrop-filter: blur(5px);
            letter-spacing: 1px;
        }
        .hud-money {
            border-color: #ffd700;
            color: #ffd700;
            text-shadow: 0 0 8px #ffd700;
        }
        .hud-health {
            border-color: #ff3333;
            color: #ff5555;
            text-shadow: 0 0 8px #ff0000;
        }

        #weapon-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            pointer-events: auto;
            z-index: 20;
        }
        .wpn-slot {
            width: 55px;
            height: 55px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #555;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .wpn-slot.active {
            border-color: #ff6600;
            background: rgba(255, 102, 0, 0.35);
            box-shadow: 0 0 25px #ff6600;
            transform: scale(1.12);
        }
        .wpn-slot:hover {
            border-color: #ffaa00;
            transform: scale(1.05);
        }
        .wpn-slot .key {
            position: absolute;
            bottom: -18px;
            font-size: 10px;
            color: #aaa;
            letter-spacing: 0;
        }

        #reload-bar {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 8px;
            background: #222;
            border-radius: 10px;
            display: none;
            z-index: 20;
            overflow: hidden;
            border: 1px solid #ff6600;
        }
        #reload-progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6600, #ffcc00);
            width: 0%;
            transition: width 0.05s linear;
        }

        #combo-display {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ff2200;
            text-shadow: 0 0 40px #ff0000, 0 0 80px #ff4400;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
            letter-spacing: 3px;
        }

        #damage-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 0, 0, 0.65) 100%);
            opacity: 0;
            transition: opacity 0.12s;
        }

        #kill-feed {
            position: absolute;
            top: 75px;
            right: 15px;
            pointer-events: none;
            z-index: 15;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 300px;
            overflow: hidden;
        }
        .kill-msg {
            color: #ffbb00;
            font-size: 14px;
            text-shadow: 0 0 8px #ff6600;
            animation: killSlide 0.25s ease-out, killFade 1.8s 1.5s forwards;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 15px;
            border-right: 3px solid #ff6600;
        }
        @keyframes killSlide {
            from {
                transform: translateX(120px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes killFade {
            to {
                opacity: 0;
            }
        }

        #wave-announce {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            font-weight: bold;
            color: #ffdd00;
            text-shadow: 0 0 50px #ff8800;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            letter-spacing: 5px;
        }

        #shop {
            position: absolute;
            bottom: 100px;
            left: 20px;
            pointer-events: auto;
            z-index: 18;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .shop-btn {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .shop-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }
        .shop-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen">
        <h1>🧟 僵尸末日</h1>
        <p>PvE 生存射击 | 波次进攻 | 载具驾驶 | 金钱购买</p>
        <button id="start-btn">🎮 开始游戏</button>
    </div>

    <div id="hud" style="display:none;">
        <div class="hud-item hud-health">❤️ <span id="hud-health">100</span></div>
        <div class="hud-item">🧟 <span id="hud-zombies">0</span></div>
        <div class="hud-item hud-money">💰 <span id="hud-money">0</span></div>
        <div class="hud-item">🔫 <span id="hud-ammo">30/30</span></div>
        <div class="hud-item">🌊 第<span id="hud-wave">1</span>波</div>
        <div class="hud-item">🔥 连杀 <span id="hud-combo">0</span></div>
    </div>

    <div id="weapon-bar" style="display:none;">
        <div class="wpn-slot" data-w="0">🔫<span class="key">1</span></div>
        <div class="wpn-slot" data-w="1">💥<span class="key">2</span></div>
        <div class="wpn-slot" data-w="2">🎯<span class="key">3</span></div>
        <div class="wpn-slot" data-w="3">⚡<span class="key">4</span></div>
        <div class="wpn-slot" data-w="4">🔥<span class="key">5</span></div>
    </div>

    <div id="reload-bar"><div id="reload-progress"></div></div>
    <div id="combo-display"></div>
    <div id="damage-vignette"></div>
    <div id="kill-feed"></div>
    <div id="wave-announce"></div>

    <div id="shop" style="display:none;">
        <button class="shop-btn" id="buy-health">❤️ 补血 $200</button>
        <button class="shop-btn" id="buy-armor">🛡️ 护甲 $500</button>
        <button class="shop-btn" id="buy-ammo">📦 弹药 $300</button>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // ==================== 游戏状态 ====================
            let gameStarted = false;
            let money = 0;
            let combo = 0;
            let comboTimer = 0;
            let wave = 1;
            let score = 0;
            let totalKills = 0;
            let headshots = 0;
            let armor = 0;

            // ==================== 玩家 ====================
            const player = {
                x: 300,
                y: 0,
                z: 300,
                speed: 22,
                health: 100,
                maxHealth: 100,
                vy: 0,
                onGround: true,
                vehicle: null,
                weaponIndex: 0,
                ammo: 30,
                maxAmmo: 30,
                reloading: false,
                reloadTime: 0,
                lastFireTime: 0,
                damageCooldown: 0,
                regenTimer: 0
            };

            // ==================== 武器 ====================
            const weapons = [
                { name: '步枪', icon: '🔫', damage: 32, fireRate: 0.09, ammoMax: 30, bulletSpeed: 750,
                    reloadTime: 1.3, spread: 0.02, color: '#ffff00', auto: true },
                { name: '霰弹枪', icon: '💥', damage: 55, fireRate: 0.75, ammoMax: 8, bulletSpeed: 550,
                    reloadTime: 1.9, spread: 0.1, pellets: 8, color: '#ff8800', auto: false },
                { name: '狙击枪', icon: '🎯', damage: 160, fireRate: 1.1, ammoMax: 5, bulletSpeed: 1100,
                    reloadTime: 2.4, spread: 0.001, color: '#00ffff', auto: false },
                { name: '冲锋枪', icon: '⚡', damage: 22, fireRate: 0.045, ammoMax: 40, bulletSpeed: 650,
                    reloadTime: 1.1, spread: 0.05, color: '#00ff00', auto: true },
                { name: '火焰枪', icon: '🔥', damage: 12, fireRate: 0.025, ammoMax: 50, bulletSpeed: 420,
                    reloadTime: 1.6, spread: 0.13, fire: true, color: '#ff4400', auto: true }
            ];

            // ==================== 载具 ====================
            const vehicles = [];
            class Vehicle {
                constructor(type, x, z, color, name, hp, speed, weaponDamage, y = 0) {
                    this.type = type;
                    this.x = x;
                    this.z = z;
                    this.y = y;
                    this.hp = hp;
                    this.maxHp = hp;
                    this.speed = speed;
                    this.color = color;
                    this.name = name;
                    this.active = true;
                    this.attackCooldown = 0;
                    this.weaponDamage = weaponDamage;
                }
            }
            vehicles.push(new Vehicle('boat', 300, 250, '#8B4513', '🚤 巡逻艇', 350, 28, 45));
            vehicles.push(new Vehicle('car', 500, 400, '#4169E1', '🚗 装甲车', 280, 33, 35));
            vehicles.push(new Vehicle('plane', 550, 200, '#778899', '✈️ 战斗机', 450, 48, 55, 45));
            vehicles.push(new Vehicle('tank', 200, 500, '#556B2F', '🎖️ 坦克', 550, 22, 65));

            // ==================== 僵尸 ====================
            let zombies = [];
            class Zombie {
                constructor(x, z, type) {
                    this.x = x;
                    this.z = z;
                    this.y = 0;
                    this.type = type || 'normal';
                    const types = {
                        normal: { hp: 60, speed: 5, damage: 15, radius: 16, color: '#2E8B57', money: 100 },
                        fast: { hp: 40, speed: 10, damage: 10, radius: 13, color: '#7FFF00', money: 150 },
                        tank: { hp: 220, speed: 3, damage: 30, radius: 28, color: '#8B0000', money: 350 },
                        exploder: { hp: 80, speed: 6, damage: 50, radius: 19, color: '#FF4500', money: 250 },
                        boss: { hp: 1200, speed: 4, damage: 50, radius: 45, color: '#FF00FF', money: 1500 }
                    };
                    const t = types[this.type] || types.normal;
                    this.hp = t.hp;
                    this.maxHp = t.hp;
                    this.speed = t.speed + Math.random() * 1.5;
                    this.damage = t.damage;
                    this.radius = t.radius;
                    this.color = t.color;
                    this.money = t.money;
                    this.attackCooldown = 0;
                    this.hitFlash = 0;
                }
            }

            function spawnWave() {
                zombies = [];
                const count = Math.min(12 + wave * 7, 60);
                for (let i = 0; i < count; i++) {
                    const x = 30 + Math.random() * 540;
                    const z = 30 + Math.random() * 540;
                    let type = 'normal';
                    const r = Math.random();
                    if (wave > 1 && r < 0.18) type = 'fast';
                    if (wave > 2 && r < 0.33) type = 'tank';
                    if (wave > 3 && r < 0.45) type = 'exploder';
                    zombies.push(new Zombie(x, z, type));
                }
                if (wave % 2 === 0) {
                    zombies.push(new Zombie(300, 300, 'boss'));
                }
                // 波次公告
                const waveAnnounce = document.getElementById('wave-announce');
                waveAnnounce.textContent = `🌊 第 ${wave} 波来袭！`;
                waveAnnounce.style.opacity = '1';
                setTimeout(() => waveAnnounce.style.opacity = '0', 2000);
            }

            // ==================== 子弹 ====================
            let bullets = [];
            class Bullet {
                constructor(x, y, z, dx, dy, dz, damage, speed, color, fire = false) {
                    this.x = x;
                    this.y = y;
                    this.z = z;
                    this.dx = dx;
                    this.dy = dy;
                    this.dz = dz;
                    this.damage = damage;
                    this.speed = speed;
                    this.life = 2.5;
                    this.color = color;
                    this.fire = fire;
                }
            }

            // ==================== 粒子特效 ====================
            let particles = [];
            class Particle {
                constructor(x, y, z, color, life = 0.5) {
                    this.x = x;
                    this.y = y;
                    this.z = z;
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.vx = (Math.random() - 0.5) * 30;
                    this.vy = Math.random() * 40 + 10;
                    this.vz = (Math.random() - 0.5) * 30;
                }
            }

            function spawnParticles(x, y, z, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, z, color));
                }
            }

            // ==================== 3D投影 ====================
            let yaw = 0,
                pitch = 0;
            let isPointerLocked = false;
            let mouseDown = false;
            const keys = {};

            function project3D(x, y, z) {
                const dx = x - player.x;
                const dy = y - (player.y + 14);
                const dz = z - player.z;
                const cosY = Math.cos(yaw),
                    sinY = Math.sin(yaw);
                const cosP = Math.cos(pitch),
                    sinP = Math.sin(pitch);
                const tz = dz * cosY - dx * sinY;
                const tx = dx * cosY + dz * sinY;
                const ty = dy * cosP - tz * sinP;
                const tz2 = dy * sinP + tz * cosP;
                if (tz2 < 1) return null;
                const scale = 550 / tz2;
                return { x: W / 2 + tx * scale, y: H / 2 - ty * scale, scale: scale, depth: tz2 };
            }

            // ==================== 绘制 ====================
            function drawWorld() {
                // 天空
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#0a0515');
                skyGrad.addColorStop(0.3, '#1a0a30');
                skyGrad.addColorStop(0.6, '#2a1a3a');
                skyGrad.addColorStop(0.8, '#4a3020');
                skyGrad.addColorStop(1, '#6a4a2a');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);

                // 地面
                const groundGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
                groundGrad.addColorStop(0, '#1a2a1a');
                groundGrad.addColorStop(1, '#0a150a');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, H * 0.55, W, H * 0.45);

                // 地面网格
                ctx.strokeStyle = 'rgba(255,120,0,0.08)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 600; i += 25) {
                    const p1 = project3D(i, 0, 0);
                    const p2 = project3D(i, 0, 600);
                    if (p1 && p2) { ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke(); }
                    const p3 = project3D(0, 0, i);
                    const p4 = project3D(600, 0, i);
                    if (p3 && p4) { ctx.beginPath();
                        ctx.moveTo(p3.x, p3.y);
                        ctx.lineTo(p4.x, p4.y);
                        ctx.stroke(); }
                }

                // 湖泊
                const lakeCenter = project3D(300, 0, 300);
                if (lakeCenter) {
                    ctx.fillStyle = 'rgba(20,80,120,0.75)';
                    ctx.beginPath();
                    ctx.ellipse(lakeCenter.x, lakeCenter.y, 90 * lakeCenter.scale, 55 * lakeCenter.scale, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(40,110,160,0.5)';
                    ctx.beginPath();
                    ctx.ellipse(lakeCenter.x - 8, lakeCenter.y - 6, 55 * lakeCenter.scale, 32 * lakeCenter.scale, 0, 0,
                        Math.PI * 2);
                    ctx.fill();
                }

                // 绘制载具
                vehicles.forEach(v => {
                    if (!v.active) return;
                    const p = project3D(v.x, v.y, v.z);
                    if (p) {
                        const s = p.scale;
                        ctx.fillStyle = v.color;
                        if (v.type === 'boat') {
                            ctx.fillRect(p.x - 38 * s, p.y - 18 * s, 76 * s, 36 * s);
                            ctx.fillStyle = '#a08060';
                            ctx.fillRect(p.x - 22 * s, p.y - 28 * s, 44 * s, 14 * s);
                        } else if (v.type === 'car') {
                            ctx.fillRect(p.x - 33 * s, p.y - 22 * s, 66 * s, 40 * s);
                            ctx.fillStyle = '#333';
                            ctx.fillRect(p.x - 18 * s, p.y - 32 * s, 36 * s, 16 * s);
                        } else if (v.type === 'plane') {
                            ctx.beginPath();
                            ctx.moveTo(p.x - 42 * s, p.y);
                            ctx.lineTo(p.x + 45 * s, p.y - 22 * s);
                            ctx.lineTo(p.x + 45 * s, p.y + 22 * s);
                            ctx.closePath();
                            ctx.fill();
                            ctx.fillStyle = '#ccc';
                            ctx.fillRect(p.x - 30 * s, p.y - 5 * s, 60 * s, 10 * s);
                        } else if (v.type === 'tank') {
                            ctx.fillRect(p.x - 32 * s, p.y - 22 * s, 64 * s, 40 * s);
                            ctx.fillStyle = '#4a4a3a';
                            ctx.fillRect(p.x - 12 * s, p.y - 35 * s, 24 * s, 16 * s);
                            ctx.fillStyle = '#222';
                            ctx.fillRect(p.x - 8 * s, p.y - 48 * s, 50 * s, 12 * s);
                        }
                        // 血条
                        if (v.hp < v.maxHp) {
                            ctx.fillStyle = '#ff3333';
                            ctx.fillRect(p.x - 35 * s, p.y - 55 * s, 70 * s, 7 * s);
                            ctx.fillStyle = '#33ff33';
                            ctx.fillRect(p.x - 35 * s, p.y - 55 * s, 70 * s * (v.hp / v.maxHp), 7 * s);
                        }
                        // 名字
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${Math.max(10, 12*s)}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.fillText(v.name, p.x, p.y - 62 * s);
                    }
                });

                // 绘制僵尸
                zombies.forEach(z => {
                    const p = project3D(z.x, z.y, z.z);
                    if (p) {
                        const s = p.scale;
                        const flash = z.hitFlash > 0;
                        const bodyColor = flash ? '#ffffff' : z.color;
                        // 身体
                        ctx.fillStyle = bodyColor;
                        ctx.fillRect(p.x - z.radius * s, p.y - 32 * s, z.radius * 2 * s, 42 * s);
                        // 头
                        ctx.fillStyle = flash ? '#ffffff' : (z.type === 'boss' ? '#ff00ff' : '#3a5a2a');
                        ctx.fillRect(p.x - 11 * s, p.y - 42 * s, 22 * s, 16 * s);
                        // 眼睛
                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(p.x - 6 * s, p.y - 37 * s, 4 * s, 4 * s);
                        ctx.fillRect(p.x + 2 * s, p.y - 37 * s, 4 * s, 4 * s);
                        // 血条
                        ctx.fillStyle = '#ff2222';
                        ctx.fillRect(p.x - z.radius * s, p.y - 50 * s, z.radius * 2 * s, 5 * s);
                        ctx.fillStyle = '#22ff22';
                        ctx.fillRect(p.x - z.radius * s, p.y - 50 * s, z.radius * 2 * s * (z.hp / z.maxHp), 5 * s);
                        // Boss标记
                        if (z.type === 'boss') {
                            ctx.fillStyle = '#ff00ff';
                            ctx.font = `bold ${18*s}px Arial`;
                            ctx.fillText('👑 BOSS', p.x, p.y - 58 * s);
                        }
                    }
                });

                // 绘制子弹
                bullets.forEach(b => {
                    const p = project3D(b.x, b.y, b.z);
                    if (p) {
                        if (b.fire) {
                            const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 22);
                            grad.addColorStop(0, 'rgba(255,200,0,0.9)');
                            grad.addColorStop(0.5, 'rgba(255,100,0,0.6)');
                            grad.addColorStop(1, 'rgba(255,50,0,0)');
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            ctx.fillStyle = b.color;
                            ctx.shadowColor = b.color;
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;
                        }
                    }
                });

                // 绘制粒子
                particles.forEach(pt => {
                    const p = project3D(pt.x, pt.y, pt.z);
                    if (p) {
                        const alpha = pt.life / pt.maxLife;
                        ctx.fillStyle = pt.color;
                        ctx.globalAlpha = alpha;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4 * alpha, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                });
            }

            // ==================== 更新 ====================
            function update(dt) {
                if (!gameStarted) return;

                // 连杀计时
                if (comboTimer > 0) {
                    comboTimer -= dt;
                    if (comboTimer <= 0) combo = 0;
                }

                // 生命恢复
                if (player.health < player.maxHealth) {
                    player.regenTimer += dt;
                    if (player.regenTimer > 5 && player.health > 0) {
                        player.health = Math.min(player.maxHealth, player.health + 2);
                        player.regenTimer = 0;
                    }
                }

                // 移动
                let moveX = 0,
                    moveZ = 0;
                if (keys['w']) moveZ -= 1;
                if (keys['s']) moveZ += 1;
                if (keys['a']) moveX -= 1;
                if (keys['d']) moveX += 1;
                const len = Math.hypot(moveX, moveZ);
                if (len > 0) { moveX /= len;
                    moveZ /= len; }

                const speed = player.vehicle ? player.vehicle.speed : player.speed;
                const cosY = Math.cos(yaw),
                    sinY = Math.sin(yaw);
                const wx = (moveX * cosY - moveZ * sinY) * speed;
                const wz = (moveX * sinY + moveZ * cosY) * speed;

                player.x += wx * dt;
                player.z += wz * dt;
                player.x = Math.max(20, Math.min(580, player.x));
                player.z = Math.max(20, Math.min(580, player.z));

                // 载具位置
                if (player.vehicle) {
                    player.vehicle.x = player.x;
                    player.vehicle.z = player.z;
                    if (player.vehicle.type === 'plane') player.y = 45;
                    else player.y = 0;
                } else {
                    // 跳跃
                    if (keys[' '] && player.onGround) {
                        player.vy = 32;
                        player.onGround = false;
                    }
                    player.vy -= 55 * dt;
                    player.y += player.vy * dt;
                    if (player.y <= 0) {
                        player.y = 0;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }

                // 载具交互 (E键)
                if (keys['e'] && !player.vehicle) {
                    for (const v of vehicles) {
                        if (v.active && Math.hypot(v.x - player.x, v.z - player.z) < 55) {
                            player.vehicle = v;
                            player.x = v.x;
                            player.z = v.z;
                            if (v.type === 'plane') player.y = 45;
                            else player.y = 0;
                            break;
                        }
                    }
                } else if (keys['e'] && player.vehicle) {
                    player.vehicle = null;
                    player.y = 0;
                }

                // 换弹
                if (keys['r'] && !player.reloading && player.ammo < player.maxAmmo) {
                    player.reloading = true;
                    player.reloadTime = weapons[player.weaponIndex].reloadTime;
                    document.getElementById('reload-bar').style.display = 'block';
                }
                if (player.reloading) {
                    player.reloadTime -= dt;
                    const progress = ((weapons[player.weaponIndex].reloadTime - player.reloadTime) / weapons[player
                        .weaponIndex].reloadTime) * 100;
                    document.getElementById('reload-progress').style.width = Math.min(100, progress) + '%';
                    if (player.reloadTime <= 0) {
                        player.ammo = player.maxAmmo;
                        player.reloading = false;
                        document.getElementById('reload-bar').style.display = 'none';
                    }
                }

                // 射击
                const weapon = weapons[player.weaponIndex];
                if (mouseDown && !player.reloading && player.ammo > 0 &&
                    performance.now() - player.lastFireTime > weapon.fireRate * 1000) {
                    const dx = -Math.sin(yaw) * Math.cos(pitch);
                    const dy = Math.sin(pitch);
                    const dz = -Math.cos(yaw) * Math.cos(pitch);
                    const muzzleY = player.vehicle ? player.y + 35 : player.y + 25;

                    if (weapon.pellets) {
                        for (let i = 0; i < weapon.pellets; i++) {
                            const spreadX = (Math.random() - 0.5) * weapon.spread;
                            const spreadY = (Math.random() - 0.5) * weapon.spread;
                            bullets.push(new Bullet(player.x, muzzleY, player.z, dx + spreadX, dy + spreadY, dz +
                                spreadX, weapon.damage / weapon.pellets, weapon.bulletSpeed, weapon.color, weapon
                                .fire));
                        }
                    } else {
                        bullets.push(new Bullet(player.x, muzzleY, player.z, dx, dy, dz, weapon.damage, weapon
                            .bulletSpeed, weapon.color, weapon.fire));
                    }

                    player.ammo--;
                    player.lastFireTime = performance.now();
                    pitch += 0.004;
                    // 枪口粒子
                    spawnParticles(player.x + dx * 10, muzzleY + dy * 10, player.z + dz * 10, '#ffcc00', 3);
                }

                // 载具武器
                if (player.vehicle && mouseDown && player.vehicle.attackCooldown <= 0) {
                    const dx = -Math.sin(yaw) * Math.cos(pitch);
                    const dy = Math.sin(pitch);
                    const dz = -Math.cos(yaw) * Math.cos(pitch);
                    bullets.push(new Bullet(player.x, player.y + 35, player.z, dx, dy, dz, player.vehicle.weaponDamage,
                        850, '#ff0000'));
                    player.vehicle.attackCooldown = 0.1;
                    spawnParticles(player.x + dx * 15, player.y + 35, player.z + dz * 15, '#ff8800', 2);
                }
                if (player.vehicle && player.vehicle.attackCooldown > 0) player.vehicle.attackCooldown -= dt;

                // 切换武器
                for (let i = 0; i < weapons.length; i++) {
                    if (keys[String(i + 1)]) {
                        player.weaponIndex = i;
                        player.ammo = weapons[i].ammoMax;
                        player.maxAmmo = weapons[i].ammoMax;
                        player.reloading = false;
                        document.getElementById('reload-bar').style.display = 'none';
                        updateWeaponSlots();
                    }
                }

                // 僵尸AI
                zombies.forEach(z => {
                    const dx = player.x - z.x;
                    const dz = player.z - z.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist > 20 && dist < 900) {
                        z.x += (dx / dist) * z.speed * dt;
                        z.z += (dz / dist) * z.speed * dt;
                    }
                    if (dist < z.radius + 12 && z.attackCooldown <= 0) {
                        if (player.vehicle) {
                            player.vehicle.hp -= z.damage;
                            spawnParticles(player.x, player.y + 15, player.z, '#ff0000', 5);
                            if (player.vehicle.hp <= 0) {
                                player.vehicle.active = false;
                                player.vehicle = null;
                                player.y = 0;
                                spawnParticles(player.x, player.y, player.z, '#ff6600', 20);
                            }
                        } else {
                            if (player.damageCooldown <= 0) {
                                const actualDamage = armor > 0 ? Math.floor(z.damage * 0.4) : z.damage;
                                player.health -= actualDamage;
                                if (armor > 0) armor--;
                                player.damageCooldown = 0.5;
                                document.getElementById('damage-vignette').style.opacity = '1';
                                setTimeout(() => document.getElementById('damage-vignette').style.opacity = '0',
                                150);
                                spawnParticles(player.x, player.y + 15, player.z, '#ff0000', 8);
                            }
                        }
                        z.attackCooldown = 0.8;
                    }
                    if (z.attackCooldown > 0) z.attackCooldown -= dt;
                    if (z.hitFlash > 0) z.hitFlash -= dt;
                    z.x = Math.max(10, Math.min(590, z.x));
                    z.z = Math.max(10, Math.min(590, z.z));
                });

                if (player.damageCooldown > 0) player.damageCooldown -= dt;

                // 子弹更新
                bullets.forEach(b => {
                    b.x += b.dx * b.speed * dt;
                    b.y += b.dy * b.speed * dt;
                    b.z += b.dz * b.speed * dt;
                    b.life -= dt;

                    zombies.forEach(z => {
                        if (b.life > 0 && z.hp > 0 && Math.hypot(z.x - b.x, z.z - b.z) < z.radius) {
                            z.hp -= b.damage;
                            z.hitFlash = 0.2;
                            spawnParticles(b.x, b.y, b.z, b.fire ? '#ff6600' : '#ffcc00', 3);
                            b.life = 0;

                            if (z.hp <= 0) {
                                // 击杀
                                combo++;
                                comboTimer = 3;
                                money += z.money;
                                score += z.money;
                                totalKills++;

                                // 爆头判定 (随机)
                                if (Math.random() < 0.25) {
                                    headshots++;
                                    money += 50;
                                    score += 50;
                                }

                                // 连杀奖励
                                if (combo >= 3) money += combo * 30;

                                // 爆炸僵尸
                                if (z.type === 'exploder') {
                                    spawnParticles(z.x, z.y + 15, z.z, '#ff4400', 25);
                                    zombies.forEach(z2 => {
                                        if (z2 !== z && Math.hypot(z2.x - z.x, z2.z - z.z) < 70) {
                                            z2.hp -= 55;
                                            z2.hitFlash = 0.3;
                                        }
                                    });
                                }

                                // 击杀消息
                                const killMsg = document.createElement('div');
                                killMsg.className = 'kill-msg';
                                killMsg.textContent = `💀 ${z.type} +${z.money}💰`;
                                document.getElementById('kill-feed').appendChild(killMsg);
                                setTimeout(() => killMsg.remove(), 2500);

                                // 连杀提示
                                if (combo >= 3) {
                                    const cd = document.getElementById('combo-display');
                                    cd.textContent = `🔥 ${combo}连杀！`;
                                    cd.style.opacity = '1';
                                    setTimeout(() => cd.style.opacity = '0', 1000);
                                }
                            }
                        }
                    });

                    vehicles.forEach(v => {
                        if (b.life > 0 && v.active && v !== player.vehicle && Math.hypot(v.x - b.x, v.z - b.z) <
                            30) {
                            v.hp -= b.damage;
                            b.life = 0;
                            if (v.hp <= 0) {
                                v.active = false;
                                money += 400;
                                spawnParticles(v.x, v.y + 20, v.z, '#ff8800', 20);
                            }
                        }
                    });
                });

                bullets = bullets.filter(b => b.life > 0);
                zombies = zombies.filter(z => z.hp > 0);
                particles = particles.filter(p => p.life > 0);
                particles.forEach(p => {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.z += p.vz * dt;
                    p.vy -= 30 * dt;
                    p.life -= dt;
                    if (p.y < 0) { p.y = 0;
                        p.life = 0; }
                });

                // 波次检查
                if (zombies.length === 0 && gameStarted) {
                    wave++;
                    money += 500 + wave * 100;
                    score += 500;
                    spawnWave();
                }

                // HUD更新
                document.getElementById('hud-health').textContent = Math.floor(player.health) + (armor > 0 ? `+${armor}` :
                    '');
                document.getElementById('hud-zombies').textContent = zombies.length;
                document.getElementById('hud-money').textContent = money;
                document.getElementById('hud-ammo').textContent = `${player.ammo}/${player.maxAmmo}`;
                document.getElementById('hud-wave').textContent = wave;
                document.getElementById('hud-combo').textContent = combo;

                // 购买按钮状态
                document.getElementById('buy-health').disabled = money < 200 || player.health >= player.maxHealth;
                document.getElementById('buy-armor').disabled = money < 500 || armor >= 10;
                document.getElementById('buy-ammo').disabled = money < 300 || player.ammo >= player.maxAmmo;

                // 死亡
                if (player.health <= 0) {
                    gameStarted = false;
                    alert(`💀 你死了！\n\n🏆 最终得分: ${score}\n💰 金钱: ${money}\n🔫 击杀: ${totalKills}\n🎯 爆头: ${headshots}\n🌊 到达波数: ${wave}`);
                    location.reload();
                }
            }

            function updateWeaponSlots() {
                document.querySelectorAll('.wpn-slot').forEach(slot => {
                    slot.classList.toggle('active', parseInt(slot.dataset.w) === player.weaponIndex);
                });
            }

            // ==================== 商店 ====================
            document.getElementById('buy-health').addEventListener('click', () => {
                if (money >= 200 && player.health < player.maxHealth) {
                    money -= 200;
                    player.health = Math.min(player.maxHealth, player.health + 50);
                }
            });
            document.getElementById('buy-armor').addEventListener('click', () => {
                if (money >= 500 && armor < 10) {
                    money -= 500;
                    armor += 2;
                }
            });
            document.getElementById('buy-ammo').addEventListener('click', () => {
                if (money >= 300 && player.ammo < player.maxAmmo) {
                    money -= 300;
                    player.ammo = player.maxAmmo;
                }
            });

            // ==================== 输入 ====================
            document.getElementById('start-btn').addEventListener('click', () => {
                gameStarted = true;
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('weapon-bar').style.display = 'flex';
                document.getElementById('shop').style.display = 'flex';
                updateWeaponSlots();
                canvas.requestPointerLock();
                spawnWave();
            });

            canvas.addEventListener('click', () => {
                if (gameStarted && !isPointerLocked) canvas.requestPointerLock();
            });
            document.addEventListener('pointerlockchange', () => { isPointerLocked = document.pointerLockElement ===
                    canvas; });
            document.addEventListener('mousemove', (e) => {
                if (isPointerLocked && gameStarted) {
                    yaw -= e.movementX * 0.003;
                    pitch -= e.movementY * 0.003;
                    pitch = Math.max(-1.3, Math.min(1.3, pitch));
                }
            });
            document.addEventListener('mousedown', (e) => { if (e.button === 0) mouseDown = true; });
            document.addEventListener('mouseup', () => { mouseDown = false; });
            document.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === ' ') e.preventDefault();
            });
            document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

            document.querySelectorAll('.wpn-slot').forEach(slot => {
                slot.addEventListener('click', () => {
                    const wi = parseInt(slot.dataset.w);
                    player.weaponIndex = wi;
                    player.ammo = weapons[wi].ammoMax;
                    player.maxAmmo = weapons[wi].ammoMax;
                    player.reloading = false;
                    document.getElementById('reload-bar').style.display = 'none';
                    updateWeaponSlots();
                });
            });

            // ==================== 游戏循环 ====================
            let lastTime = performance.now();

            function gameLoop() {
                const now = performance.now();
                const dt = Math.min((now - lastTime) / 1000, 0.1);
                lastTime = now;
                update(dt);
                drawWorld();
                requestAnimationFrame(gameLoop);
            }
            gameLoop();
        })();
    </script>
</body>
</html>
