<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Minecraft · 出生带宝箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #1a1a1a; }
        #info {
            position: absolute; top: 16px; left: 16px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 30px;
            font-size: 13px; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none; z-index: 10; user-select: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6); font-size: 28px;
            pointer-events: none; z-index: 6;
            text-shadow: 0 0 6px rgba(0,0,0,0.6);
            user-select: none;
        }
        #controls-hint {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.6);
            padding: 8px 20px; border-radius: 40px;
            font-size: 13px; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none; z-index: 10;
            white-space: nowrap;
        }
        #controls-hint span { color: #aaffaa; margin: 0 6px; }
        @media (max-width:600px) {
            #controls-hint { font-size: 10px; padding: 5px 12px; white-space: normal; width: 85%; text-align: center; bottom: 12px; }
            #info { font-size: 10px; top: 10px; left: 10px; padding: 4px 12px; }
        }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background: rgba(0,0,0,0.15); z-index: 5; cursor: pointer;
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; background: rgba(0,0,0,0.85);
            padding: 24px 48px; border-radius: 16px;
            font-size: 26px; border: 1px solid #666;
            z-index: 20; backdrop-filter: blur(6px);
            pointer-events: none;
            text-align: center;
        }
        #loading .progress {
            font-size: 16px;
            margin-top: 10px;
            color: #aaa;
        }

        /* 背包 UI */
        #inventory-ui {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,30,0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            gap: 6px;
            z-index: 15;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .inv-slot {
            width: 48px; height: 48px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #fff;
            cursor: pointer; position: relative;
            transition: 0.1s; image-rendering: pixelated;
        }
        .inv-slot:hover { border-color: #ffcc44; background: rgba(255,255,255,0.08); }
        .inv-slot.active {
            border-color: #ffaa00;
            background: rgba(255,170,0,0.25);
            box-shadow: 0 0 16px rgba(255,170,0,0.2);
        }
        .inv-slot .count {
            position: absolute; bottom: 1px; right: 4px;
            font-size: 10px; color: #fff;
            text-shadow: 0 0 4px #000;
            background: rgba(0,0,0,0.6);
            padding: 0 4px; border-radius: 4px;
        }
        .inv-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; border-radius: 4px; }

        #held-item {
            position: absolute; bottom: 148px; left: 50%;
            transform: translateX(-50%);
            width: 48px; height: 48px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 12;
            backdrop-filter: blur(4px);
        }
        #held-item canvas { width: 40px; height: 40px; image-rendering: pixelated; }
        #held-label {
            position: absolute; bottom: 200px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 2px 14px; border-radius: 20px;
            pointer-events: none; z-index: 12;
            white-space: nowrap; border: 1px solid rgba(255,255,255,0.1);
        }
        #inventory-label {
            position: absolute; bottom: 132px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 10px; letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 2px 14px; border-radius: 20px;
            z-index: 14; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #coord-info {
            position: absolute; bottom: 240px; right: 20px;
            color: rgba(255,255,255,0.5); font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px; border-radius: 8px;
            pointer-events: none; z-index: 12;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 物品栏 (选物栏) */
        #item-selector {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
        }
        #item-selector.show { display: flex; }
        #item-selector h2 {
            color: #fff;
            margin-bottom: 20px;
            font-weight: normal;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        #item-grid {
            display: grid;
            grid-template-columns: repeat(8, 64px);
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 70vh;
            overflow-y: auto;
        }
        .item-cell {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            color: #fff;
            font-size: 10px;
            text-align: center;
            padding: 4px;
        }
        .item-cell:hover {
            background: rgba(255,255,255,0.15);
            border-color: #ffaa00;
            transform: scale(1.05);
        }
        .item-cell canvas {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }
        .item-cell .item-name {
            margin-top: 2px;
            font-size: 9px;
            opacity: 0.8;
        }
        .close-selector {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 4px 16px;
            border-radius: 30px;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .close-selector:hover {
            background: rgba(255,255,255,0.2);
        }
        @media (max-width:600px) {
            #item-grid { grid-template-columns: repeat(6, 54px); gap: 6px; padding: 12px; }
            .item-cell { width: 54px; height: 54px; }
            .item-cell canvas { width: 32px; height: 32px; }
            #item-selector h2 { font-size: 18px; }
        }
        #chest-message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 18px;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #chest-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading">
        ⛏️ 生成世界...
        <div class="progress" id="progress-text">0%</div>
    </div>
    <div id="info">🎁 出生点旁有宝箱 · 实心方块</div>
    <div id="crosshair">✚</div>
    <div id="controls-hint">
        <span>🖱️</span> 左键挖掘 · 右键放置/开箱 · <span>WASD</span> 移动 · <span>Tab</span> 物品栏
    </div>
    <div id="blocker" onclick="focusGame()"></div>
    <div id="chest-message">📦 宝箱已开启！获得物品</div>

    <div id="inventory-label">🎒 背包</div>
    <div id="held-label">手持: 空</div>
    <div id="held-item"><canvas id="heldCanvas" width="40" height="40"></canvas></div>
    <div id="inventory-ui"></div>
    <div id="coord-info">📍 0, 0, 0</div>

    <!-- 物品选择器 -->
    <div id="item-selector">
        <div class="close-selector" onclick="toggleSelector()">✕</div>
        <h2>📦 物品栏 (点击选择)</h2>
        <div id="item-grid"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 80);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 指针锁定 ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        window.focusGame = () => controls.lock();
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'block');

        // --- 灯光 ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.1);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -50;
        sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50;
        sun.shadow.camera.bottom = -50;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xccddff, 0.4);
        fill.position.set(-30, 20, -40);
        scene.add(fill);
        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.5);
        scene.add(hemi);

        // --- 纹理生成器 ---
        function createBlockTexture(baseColor, detailColor = null, border = true, special = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 32, 32);
            if (border) {
                ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                ctx.lineWidth = 1.8;
                ctx.strokeRect(0.5, 0.5, 31, 31);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(1.5, 1.5, 29, 29);
            }
            if (detailColor) {
                for (let i = 0; i < 40; i++) {
                    const x = Math.floor(Math.random() * 28) + 2;
                    const y = Math.floor(Math.random() * 28) + 2;
                    ctx.fillStyle = detailColor;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            // 特殊标志（箱子锁）
            if (special) {
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🔒', 16, 16);
            }
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 32; i += 8) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 32);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(32, i);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- 预生成所有材质 (共享) ---
        const BLOCK_TYPES = {
            GRASS: { name: '草地', color: '#7cb342', detail: '#558b2f' },
            DIRT: { name: '泥土', color: '#8d6e63', detail: '#6d4c41' },
            STONE: { name: '石頭', color: '#9e9e9e', detail: '#757575' },
            WOOD: { name: '木頭', color: '#8B5A2B', detail: '#6B4226' },
            LEAVES: { name: '樹葉', color: '#2E7D32', detail: '#1B5E20' },
            PLANKS: { name: '木板', color: '#deb887', detail: '#c4a47a' },
            BRICK: { name: '紅磚', color: '#b85a3a', detail: '#8d3a22' },
            SAND: { name: '沙地', color: '#f5e6b0', detail: '#d4c48a' },
            CHEST: { name: '寶箱', color: '#8B4513', detail: '#A0522D' },
        };

        const materialCache = {};
        const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);

        function getBlockMaterial(typeKey, special = false) {
            if (!materialCache[typeKey]) {
                const block = BLOCK_TYPES[typeKey];
                const tex = createBlockTexture(block.color, block.detail, true, special);
                materialCache[typeKey] = new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 0.85,
                    metalness: 0.05
                });
            }
            return materialCache[typeKey];
        }

        function createBlockMesh(typeKey, pos, special = false) {
            const mat = getBlockMaterial(typeKey, special);
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { blockType: typeKey, isBlock: true };
            if (typeKey === 'CHEST') {
                mesh.userData.isChest = true;
                // 箱子物品列表
                mesh.userData.chestItems = [
                    { type: 'block', id: 'PLANKS', count: 16 },
                    { type: 'block', id: 'BRICK', count: 8 },
                    { type: 'block', id: 'STONE', count: 20 },
                    { type: 'gun', id: 'PISTOL', count: 1 },
                    { type: 'tool', id: 'PICKAXE', count: 1 },
                    { type: 'block', id: 'DIRT', count: 24 },
                    { type: 'block', id: 'SAND', count: 12 },
                ];
            }
            return mesh;
        }

        // --- 世界生成 (分帧) ---
        const worldObjects = [];
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        let generationComplete = false;

        async function generateWorld() {
            return new Promise((resolve) => {
                const range = 24;
                const heightRange = 10;
                const total = (range * 2) * (range * 2) * 5;
                let count = 0;
                const progressText = document.getElementById('progress-text');

                let x = -range;
                let z = -range;
                let phase = 0;

                function generateNextChunk() {
                    let batch = 0;
                    const BATCH_SIZE = 300;

                    while (batch < BATCH_SIZE && x < range) {
                        // 跳过出生点附近 (避免挡住玩家)
                        const isSpawn = (Math.abs(x) < 2 && Math.abs(z) < 2);
                        if (!isSpawn) {
                            const noise = Math.sin(x * 0.25) * Math.cos(z * 0.2) * 1.5 + Math.sin(x * 0.08 + z * 0.12) * 0.8;
                            const topY = Math.floor(noise + 3);
                            if (topY >= 0) {
                                if (phase === 0) {
                                    // 草地
                                    const pos = new THREE.Vector3(x, topY, z);
                                    const mesh = createBlockMesh('GRASS', pos);
                                    worldGroup.add(mesh);
                                    worldObjects.push(mesh);
                                    batch++;
                                } else if (phase === 1) {
                                    for (let d = 1; d <= 2; d++) {
                                        const yPos = topY - d;
                                        if (yPos < -2) continue;
                                        const pos = new THREE.Vector3(x, yPos, z);
                                        const mesh = createBlockMesh('DIRT', pos);
                                        worldGroup.add(mesh);
                                        worldObjects.push(mesh);
                                        batch++;
                                    }
                                } else if (phase === 2) {
                                    for (let d = 3; d < 6; d++) {
                                        const yPos = topY - d;
                                        if (yPos < -heightRange) continue;
                                        const pos = new THREE.Vector3(x, yPos, z);
                                        const mesh = createBlockMesh('STONE', pos);
                                        worldGroup.add(mesh);
                                        worldObjects.push(mesh);
                                        batch++;
                                    }
                                } else if (phase === 3) {
                                    // 矿石 (用金块颜色)
                                    if (Math.random() < 0.03) {
                                        const depth = 2 + Math.floor(Math.random() * 6);
                                        const yPos = topY - depth;
                                        if (yPos >= -heightRange) {
                                            const pos = new THREE.Vector3(x, yPos, z);
                                            const oreMat = new THREE.MeshStandardMaterial({
                                                map: createBlockTexture('#FFD700', '#DAA520'),
                                                roughness: 0.7
                                            });
                                            const mesh = new THREE.Mesh(geometry, oreMat);
                                            mesh.position.copy(pos);
                                            mesh.castShadow = true;
                                            mesh.receiveShadow = true;
                                            mesh.userData = { blockType: 'GOLD', isBlock: true };
                                            worldGroup.add(mesh);
                                            worldObjects.push(mesh);
                                            batch++;
                                        }
                                    }
                                }
                            }
                        } else {
                            // 出生点区域：只放置草地和泥土，为玩家留空间
                            if (phase === 0) {
                                const noise = Math.sin(x * 0.25) * Math.cos(z * 0.2) * 1.5 + Math.sin(x * 0.08 + z * 0.12) * 0.8;
                                const topY = Math.floor(noise + 3);
                                if (topY >= 0) {
                                    const pos = new THREE.Vector3(x, topY, z);
                                    const mesh = createBlockMesh('GRASS', pos);
                                    worldGroup.add(mesh);
                                    worldObjects.push(mesh);
                                    batch++;
                                    // 泥土一层
                                    const dirtPos = new THREE.Vector3(x, topY - 1, z);
                                    const dirt = createBlockMesh('DIRT', dirtPos);
                                    if (dirt) { worldGroup.add(dirt);
                                        worldObjects.push(dirt);
                                        batch++; }
                                }
                            }
                        }

                        z++;
                        if (z >= range) {
                            z = -range;
                            x++;
                            if (x >= range) {
                                phase++;
                                x = -range;
                                z = -range;
                                if (phase > 4) {
                                    // 生成箱子
                                    generateChest();
                                    generateTrees();
                                    resolve();
                                    return;
                                }
                            }
                        }
                        count++;
                        if (count % 100 === 0) {
                            const pct = Math.min(100, Math.floor((count / total) * 100));
                            progressText.textContent = pct + '%';
                        }
                    }
                    requestAnimationFrame(generateNextChunk);
                }

                function generateChest() {
                    // 在出生点旁边 (2, 地表高度+1, 0) 放置箱子
                    const cx = 2;
                    const cz = 0;
                    const noise = Math.sin(cx * 0.25) * Math.cos(cz * 0.2) * 1.5 + Math.sin(cx * 0.08 + cz * 0.12) * 0.8;
                    const topY = Math.floor(noise + 3);
                    if (topY >= 0) {
                        const chestPos = new THREE.Vector3(cx, topY + 1, cz);
                        const chest = createBlockMesh('CHEST', chestPos, true);
                        worldGroup.add(chest);
                        worldObjects.push(chest);
                    }
                }

                function generateTrees() {
                    for (let i = 0; i < 30; i++) {
                        const x = (Math.random() - 0.5) * 40;
                        const z = (Math.random() - 0.5) * 40;
                        if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
                        const noise = Math.sin(x * 0.25) * Math.cos(z * 0.2) * 1.5 + Math.sin(x * 0.08 + z * 0.12) * 0.8;
                        const topY = Math.floor(noise + 3);
                        if (topY < 1) continue;
                        for (let j = 0; j < 3; j++) {
                            const pos = new THREE.Vector3(x, topY + 1 + j, z);
                            const mesh = createBlockMesh('WOOD', pos);
                            worldGroup.add(mesh);
                            worldObjects.push(mesh);
                        }
                        const leafOffsets = [
                            [0, 4, 0], [1, 3, 0], [-1, 3, 0], [0, 3, 1], [0, 3, -1],
                            [1, 4, 0], [-1, 4, 0], [0, 4, 1], [0, 4, -1],
                            [1, 3, 1], [-1, 3, -1], [1, 3, -1], [-1, 3, 1]
                        ];
                        for (const off of leafOffsets) {
                            const pos = new THREE.Vector3(x + off[0], topY + 1 + off[1], z + off[2]);
                            const mesh = createBlockMesh('LEAVES', pos);
                            worldGroup.add(mesh);
                            worldObjects.push(mesh);
                        }
                    }
                    // 边界光柱
                    const bMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200, transparent: true, opacity: 0.15 });
                    const boundaryPos = [
                        [-26, 0, -26], [26, 0, -26], [-26, 0, 26], [26, 0, 26]
                    ];
                    for (const p of boundaryPos) {
                        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 0.5), bMat);
                        pillar.position.set(p[0], 2, p[1]);
                        pillar.castShadow = true;
                        worldGroup.add(pillar);
                        const top = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6),
                            new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500 }));
                        top.position.set(p[0], 4.2, p[1]);
                        worldGroup.add(top);
                    }
                    // 设置玩家出生在地面
                    const spawnNoise = Math.sin(0)*Math.cos(0)*1.5 + Math.sin(0)*0.8;
                    const spawnY = Math.floor(spawnNoise + 3) + 1.8;
                    camera.position.set(0, spawnY, 0);
                    document.getElementById('loading').style.display = 'none';
                    generationComplete = true;
                    setTimeout(() => controls.lock(), 400);
                }

                requestAnimationFrame(generateNextChunk);
            });
        }

        await generateWorld();

        // --- 碰撞检测 ---
        const playerWidth = 0.6;
        const playerHeight = 1.8;
        const halfWidth = playerWidth / 2;

        function isBlocked(pos) {
            const px = pos.x;
            const py = pos.y;
            const pz = pos.z;
            for (const obj of worldObjects) {
                const bPos = obj.position;
                const half = 0.45;
                if (px + halfWidth > bPos.x - half && px - halfWidth < bPos.x + half &&
                    py + playerHeight > bPos.y - half && py < bPos.y + half &&
                    pz + halfWidth > bPos.z - half && pz - halfWidth < bPos.z + half) {
                    return true;
                }
            }
            return false;
        }

        function tryMove(newPos) {
            const testX = new THREE.Vector3(newPos.x, camera.position.y, camera.position.z);
            const testZ = new THREE.Vector3(camera.position.x, camera.position.y, newPos.z);
            if (!isBlocked(testX)) camera.position.x = newPos.x;
            if (!isBlocked(testZ)) camera.position.z = newPos.z;
        }

        // --- 物品系统 ---
        const GUN_TYPES = {
            PISTOL: { name: '手枪', damage: 20, fireRate: 200, range: 30, color: '#ffaa00', detail: '#cc8800' },
            RIFLE: { name: '步枪', damage: 35, fireRate: 400, range: 60, color: '#44aa44', detail: '#228822' },
        };
        const TOOL_TYPES = {
            PICKAXE: { name: '镐子', color: '#aaaaaa', detail: '#888888' },
            SHOVEL: { name: '铲子', color: '#bbaa77', detail: '#997755' },
        };

        const ALL_ITEMS = [];
        for (const [key, data] of Object.entries(BLOCK_TYPES)) {
            if (key === 'CHEST') continue;
            ALL_ITEMS.push({ id: key, type: 'block', data: data });
        }
        for (const [key, data] of Object.entries(GUN_TYPES)) {
            ALL_ITEMS.push({ id: key, type: 'gun', data: data });
        }
        for (const [key, data] of Object.entries(TOOL_TYPES)) {
            ALL_ITEMS.push({ id: key, type: 'tool', data: data });
        }

        let inventory = [];
        let selectedSlot = 0;
        const MAX_STACK = 64;

        function addItemToInventory(type, id) {
            const existing = inventory.find(i => i.type === type && i.id === id && i.count < MAX_STACK);
            if (existing) { existing.count++; }
            else { inventory.push({ type, id, count: 1 }); }
            updateUI();
        }

        function removeItemFromInventory(type, id) {
            const idx = inventory.findIndex(i => i.type === type && i.id === id);
            if (idx === -1) return false;
            const item = inventory[idx];
            if (item.count > 1) { item.count--; }
            else { inventory.splice(idx, 1); }
            updateUI();
            return true;
        }

        function getHeldItem() {
            if (inventory.length === 0 || selectedSlot >= inventory.length) return null;
            return inventory[selectedSlot];
        }

        function getItemInfo(type, id) {
            if (type === 'block') return BLOCK_TYPES[id];
            if (type === 'gun') return GUN_TYPES[id];
            if (type === 'tool') return TOOL_TYPES[id];
            return null;
        }

        function updateUI() {
            const container = document.getElementById('inventory-ui');
            container.innerHTML = '';
            inventory.forEach((item, idx) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot' + (idx === selectedSlot ? ' active' : '');
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const info = getItemInfo(item.type, item.id);
                if (info) {
                    ctx.fillStyle = info.color || '#888';
                    ctx.fillRect(0, 0, 32, 32);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(0.5, 0.5, 31, 31);
                    if (info.detail) {
                        for (let i=0; i<20; i++) {
                            const x = Math.floor(Math.random() * 28) + 2;
                            const y = Math.floor(Math.random() * 28) + 2;
                            ctx.fillStyle = info.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                }
                slot.appendChild(canvas);
                if (item.count > 1) {
                    const c = document.createElement('span');
                    c.className = 'count';
                    c.textContent = item.count;
                    slot.appendChild(c);
                }
                slot.addEventListener('click', () => { selectedSlot = idx; updateUI(); updateHeld(); });
                container.appendChild(slot);
            });
            if (inventory.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'color:rgba(255,255,255,0.3);padding:6px 14px;font-size:13px;';
                empty.textContent = '🈳 挖掘或开启宝箱';
                container.appendChild(empty);
            }
            updateHeld();
        }

        function updateHeld() {
            const heldCanvas = document.getElementById('heldCanvas');
            const ctx = heldCanvas.getContext('2d');
            ctx.clearRect(0, 0, 40, 40);
            const item = getHeldItem();
            if (item) {
                const info = getItemInfo(item.type, item.id);
                if (info) {
                    ctx.fillStyle = info.color || '#888';
                    ctx.fillRect(2, 2, 36, 36);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(2, 2, 36, 36);
                    if (info.detail) {
                        for (let i=0; i<20; i++) {
                            const x = Math.floor(Math.random() * 30) + 5;
                            const y = Math.floor(Math.random() * 30) + 5;
                            ctx.fillStyle = info.detail;
                            ctx.fillRect(x, y, 2, 2);
                        }
                    }
                    document.getElementById('held-label').textContent = '手持: ' + info.name + (item.count > 1 ? ' x' + item.count : '');
                }
            } else {
                document.getElementById('held-label').textContent = '手持: 空';
            }
        }

        // --- 箱子交互 ---
        function openChest(chestObj) {
            const items = chestObj.userData.chestItems || [];
            if (items.length === 0) {
                showMessage('📭 宝箱是空的');
                return;
            }
            // 将物品加入背包
            items.forEach(item => {
                for (let i = 0; i < item.count; i++) {
                    addItemToInventory(item.type, item.id);
                }
            });
            // 清空宝箱
            chestObj.userData.chestItems = [];
            showMessage('📦 宝箱已开启！获得 ' + items.reduce((sum, it) => sum + it.count, 0) + ' 件物品');
            // 改变箱子外观（可选） - 这里简单改颜色
            chestObj.material.color.setHex(0x8B5A2B);
        }

        let messageTimeout = null;
        function showMessage(text) {
            const el = document.getElementById('chest-message');
            el.textContent = text;
            el.classList.add('show');
            if (messageTimeout) clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, 3000);
        }

        // --- 物品选择器 ---
        let selectorOpen = false;
        window.toggleSelector = function() {
            selectorOpen = !selectorOpen;
            const el = document.getElementById('item-selector');
            if (selectorOpen) {
                el.classList.add('show');
                renderItemGrid();
                if (controls.isLocked) controls.unlock();
            } else {
                el.classList.remove('show');
                controls.lock();
            }
        };

        function renderItemGrid() {
            const grid = document.getElementById('item-grid');
            grid.innerHTML = '';
            ALL_ITEMS.forEach(item => {
                const cell = document.createElement('div');
                cell.className = 'item-cell';
                const canvas = document.createElement('canvas');
                canvas.width = 40; canvas.height = 40;
                const ctx = canvas.getContext('2d');
                const info = item.data;
                ctx.fillStyle = info.color || '#888';
                ctx.fillRect(0, 0, 40, 40);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0.5, 0.5, 39, 39);
                if (info.detail) {
                    for (let i=0; i<30; i++) {
                        const x = Math.floor(Math.random() * 36) + 2;
                        const y = Math.floor(Math.random() * 36) + 2;
                        ctx.fillStyle = info.detail;
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
                cell.appendChild(canvas);
                const nameSpan = document.createElement('span');
                nameSpan.className = 'item-name';
                nameSpan.textContent = info.name || item.id;
                cell.appendChild(nameSpan);
                cell.addEventListener('click', () => {
                    const existing = inventory.find(i => i.type === item.type && i.id === item.id);
                    if (existing) {
                        selectedSlot = inventory.indexOf(existing);
                    } else {
                        addItemToInventory(item.type, item.id);
                        const newItem = inventory.find(i => i.type === item.type && i.id === item.id);
                        if (newItem) selectedSlot = inventory.indexOf(newItem);
                    }
                    updateUI();
                    toggleSelector();
                });
                grid.appendChild(cell);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') { e.preventDefault(); toggleSelector(); }
        });

        // --- 生物 (装饰) ---
        const entities = [];
        const MOB_TYPES = {
            COW: { name: '牛', color: 0x8B8B8B, health: 20, speed: 0.02, aggressive: false },
            PIG: { name: '猪', color: 0xFFB6C1, health: 15, speed: 0.025, aggressive: false },
        };

        function createMob(type, pos) {
            const data = MOB_TYPES[type];
            if (!data) return null;
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.6), bodyMat);
            body.position.y = 0.4;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            const headMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
            head.position.y = 0.9;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
            for (let side of [-0.25, 0.25]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.3, 0.15), legMat);
                leg.position.set(side, 0.15, 0);
                leg.castShadow = true;
                group.add(leg);
            }
            group.position.copy(pos);
            group.userData = {
                type, health: data.health, maxHealth: data.health,
                speed: data.speed, aggressive: false,
                wanderTimer: 0,
                velocity: new THREE.Vector3((Math.random()-0.5)*0.02, 0, (Math.random()-0.5)*0.02)
            };
            scene.add(group);
            entities.push(group);
            return group;
        }

        function spawnMobs() {
            const types = ['COW', 'PIG'];
            for (let i=0; i<12; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                const x = (Math.random() - 0.5) * 40;
                const z = (Math.random() - 0.5) * 40;
                if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
                const noise = Math.sin(x*0.25)*Math.cos(z*0.2)*1.5 + Math.sin(x*0.08+z*0.12)*0.8;
                const y = Math.floor(noise + 3) + 0.5;
                if (y < 0.5) continue;
                createMob(type, new THREE.Vector3(x, y, z));
            }
        }
        spawnMobs();

        // --- 挖掘与放置 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersect() {
            if (!controls.isLocked) return null;
            mouse.set(0, 0);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(worldObjects);
            return hits.length > 0 ? hits[0] : null;
        }

        function digBlock() {
            const hit = getIntersect();
            if (!hit) return;
            const obj = hit.object;
            if (!obj.userData.isBlock) return;
            // 箱子不可挖掘
            if (obj.userData.isChest) {
                showMessage('🔒 宝箱无法挖掘，请右键打开');
                return;
            }
            const type = obj.userData.blockType;
            if (type) {
                addItemToInventory('block', type);
                scene.remove(obj);
                const idx = worldObjects.indexOf(obj);
                if (idx > -1) worldObjects.splice(idx, 1);
                updateUI();
            }
        }

        function placeBlock() {
            const held = getHeldItem();
            if (!held || held.type !== 'block') return;
            const hit = getIntersect();
            if (!hit) return;
            const obj = hit.object;
            if (!obj.userData.isBlock) return;
            // 不能放置在箱子上
            if (obj.userData.isChest) return;
            const normal = hit.face.normal.clone();
            normal.transformDirection(obj.matrixWorld);
            const pos = obj.position.clone().add(normal.multiplyScalar(0.95));
            const exists = worldObjects.some(o => o.position.distanceTo(pos) < 0.1 && o !== obj);
            if (exists) return;
            const playerPos = camera.position.clone();
            if (Math.abs(playerPos.x - pos.x) < 1.0 && Math.abs(playerPos.z - pos.z) < 1.0 && Math.abs(playerPos.y - pos.y) < 2.0) {
                return;
            }
            if (!removeItemFromInventory('block', held.id)) return;
            const mesh = createBlockMesh(held.id, pos);
            worldGroup.add(mesh);
            worldObjects.push(mesh);
            updateUI();
        }

        // 鼠标事件
        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            if (e.button === 0) {
                // 左键：先检测是否点击箱子，如果是则打开箱子（但左键通常挖掘，我们让左键也能开箱？但更符合习惯是右键开箱，左键挖掘）
                // 所以左键挖掘不变
                digBlock();
            } else if (e.button === 2) {
                // 右键：先检测是否点击箱子
                const hit = getIntersect();
                if (hit && hit.object.userData.isChest) {
                    openChest(hit.object);
                } else {
                    placeBlock();
                }
            }
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- 键盘移动 (带碰撞) ---
        const keys = { w:false, a:false, s:false, d:false, shift:false, space:false };
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'w': case 'W': keys.w=true; e.preventDefault(); break;
                case 'a': case 'A': keys.a=true; e.preventDefault(); break;
                case 's': case 'S': keys.s=true; e.preventDefault(); break;
                case 'd': case 'D': keys.d=true; e.preventDefault(); break;
                case 'Shift': keys.shift=true; e.preventDefault(); break;
                case ' ': keys.space=true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'w': case 'W': keys.w=false; e.preventDefault(); break;
                case 'a': case 'A': keys.a=false; e.preventDefault(); break;
                case 's': case 'S': keys.s=false; e.preventDefault(); break;
                case 'd': case 'D': keys.d=false; e.preventDefault(); break;
                case 'Shift': keys.shift=false; e.preventDefault(); break;
                case ' ': keys.space=false; e.preventDefault(); break;
            }
        });

        let velocityY = 0;
        const gravity = -0.02;
        const jumpSpeed = 0.25;

        function updateMovement() {
            if (!controls.isLocked) return;
            const speed = keys.shift ? 0.25 : 0.12;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            const mx = (keys.d?1:0) - (keys.a?1:0);
            const mz = (keys.s?1:0) - (keys.w?1:0);
            let moveX = 0, moveZ = 0;
            if (mx !== 0 || mz !== 0) {
                const fwd = dir.clone().multiplyScalar(-mz);
                const side = right.clone().multiplyScalar(mx);
                const total = fwd.add(side).normalize().multiplyScalar(speed);
                moveX = total.x;
                moveZ = total.z;
            }

            if (moveX !== 0 || moveZ !== 0) {
                const newPos = camera.position.clone();
                newPos.x += moveX;
                newPos.z += moveZ;
                tryMove(newPos);
            }

            if (keys.space && camera.position.y <= 1.8) {
                velocityY = jumpSpeed;
            }
            velocityY += gravity;
            const newY = camera.position.y + velocityY;
            const testPos = new THREE.Vector3(camera.position.x, newY, camera.position.z);
            if (!isBlocked(testPos)) {
                camera.position.y = newY;
            } else {
                if (velocityY < 0) velocityY = 0;
                else velocityY = 0;
            }
            if (camera.position.y < 0.5) {
                camera.position.y = 0.5;
                velocityY = 0;
            }

            document.getElementById('coord-info').textContent =
                `📍 ${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;
        }

        setInterval(updateMovement, 16);

        // --- 生物AI ---
        function updateMobs() {
            const dt = 1/60;
            entities.forEach(mob => {
                const data = mob.userData;
                data.wanderTimer -= dt;
                if (data.wanderTimer <= 0) {
                    data.wanderTimer = 2 + Math.random() * 5;
                    const angle = Math.random() * Math.PI * 2;
                    const spd = data.speed * 2;
                    data.velocity.set(Math.cos(angle)*spd, 0, Math.sin(angle)*spd);
                }
                if (data.velocity) {
                    mob.position.x += data.velocity.x * dt;
                    mob.position.z += data.velocity.z * dt;
                    if (Math.abs(mob.position.x) > 28 || Math.abs(mob.position.z) > 28) {
                        data.velocity.x *= -1;
                        data.velocity.z *= -1;
                    }
                    if (data.velocity.length() > 0.001) {
                        mob.lookAt(mob.position.clone().add(data.velocity));
                    }
                }
                const groundY = Math.floor(Math.sin(mob.position.x*0.25)*Math.cos(mob.position.z*0.2)*1.5 + Math.sin(mob.position.x*0.08+mob.position.z*0.12)*0.8 + 3);
                mob.position.y = groundY + 0.5;
            });
        }

        // --- 云朵 ---
        const clouds = [];
        for (let i=0; i<12; i++) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.4, roughness:0.1 });
            const pos = [[0,0,0,1.8,0.4,1.2],[-1.2,0.2,0.2,1.4,0.3,0.9],[1.2,0.1,-0.2,1.4,0.3,0.9],[-0.6,0.3,-0.7,1.0,0.2,0.7],[0.7,0.2,0.8,1.0,0.2,0.7]];
            for (const p of pos) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), mat);
                box.position.set(p[0],p[1],p[2]);
                g.add(box);
            }
            g.position.set((Math.random()-0.5)*100, 14+Math.random()*8, (Math.random()-0.5)*100);
            scene.add(g);
            clouds.push(g);
        }

        // --- 动画循环 ---
        function animate() {
            const time = performance.now() * 0.0001;
            clouds.forEach((c, i) => {
                c.position.x += Math.sin(time + i) * 0.002;
                c.position.z += Math.cos(time*0.7 + i) * 0.002;
            });
            updateMobs();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始化UI
        updateUI();
        console.log('✅ 出生点宝箱已放置，右键打开获得物品');
    </script>
</body>
</html>
