<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Minecraft 风格 - 网页版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            user-select: none;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 15px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        #controls-hint span {
            display: inline-block;
            margin: 0 8px;
            color: #aaffaa;
        }
        @media (max-width: 600px) {
            #controls-hint {
                font-size: 11px;
                padding: 6px 14px;
                white-space: normal;
                width: 80%;
                text-align: center;
                bottom: 15px;
            }
            #info {
                font-size: 11px;
                top: 12px;
                left: 12px;
                padding: 5px 14px;
            }
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.1);
            z-index: 5;
            cursor: pointer;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 24px;
            border: 1px solid #888;
            z-index: 20;
            backdrop-filter: blur(6px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">⛏️ 載入世界...</div>
    <div id="info">🎮 3D Minecraft · 隨機地形</div>
    <div id="controls-hint">
        <span>🖱️</span> 滑鼠拖曳視角 · <span>W A S D</span> 移動 · <span>空白</span> 跳躍 · <span>Shift</span> 奔跑
    </div>
    <div id="blocker" onclick="focusGame()"></div>

    <!-- 引入 Three.js 核心庫與擴展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化場景、相機、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 天空藍
        
        // 相機
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 12, 20);
        camera.lookAt(0, 0, 0);

        // WebGL渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 加載完成後隱藏 loading ---
        document.getElementById('loading').style.display = 'none';

        // --- 指針鎖定控制 (第一人稱) ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        
        function focusGame() {
            controls.lock();
        }
        
        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
        });
        controls.addEventListener('unlock', () => {
            blocker.style.display = 'block';
        });

        // 預設鎖定
        setTimeout(() => {
            controls.lock();
        }, 500);

        // --- 輔助元素 (可選) ---
        // 環境光 + 定向光 (陰影)
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 120;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.4);
        fillLight.position.set(-20, 10, -30);
        scene.add(fillLight);

        // 增加一些氛圍光
        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.6);
        scene.add(hemiLight);

        // --- 創建地面 (超大地圖) ---
        function createGround() {
            const groundGroup = new THREE.Group();
            
            // 使用紋理生成器創建草地色塊
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // 草地底色
            ctx.fillStyle = '#7cb342';
            ctx.fillRect(0, 0, 64, 64);
            
            // 雜點增加細節
            for (let i = 0; i < 600; i++) {
                const x = Math.floor(Math.random() * 64);
                const y = Math.floor(Math.random() * 64);
                const bright = Math.random() * 40 + 30;
                ctx.fillStyle = `rgb(${bright+80}, ${bright+120}, ${bright+40})`;
                ctx.fillRect(x, y, 1, 1);
            }
            
            // 隨機小草
            ctx.strokeStyle = '#4caf50';
            ctx.lineWidth = 2;
            for (let i = 0; i < 80; i++) {
                const x = Math.floor(Math.random() * 64);
                const y = Math.floor(Math.random() * 64);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x+2, y-6);
                ctx.stroke();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(20, 20);

            // 地面方塊 (用一個大平面 + 紋理)
            const groundMat = new THREE.MeshStandardMaterial({ 
                map: texture,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            groundGroup.add(ground);

            // 隨機生成樹木、石頭、小花 (裝飾)
            for (let i = 0; i < 180; i++) {
                const x = (Math.random() - 0.5) * 70;
                const z = (Math.random() - 0.5) * 70;
                // 避免中心區域太擠
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                
                const type = Math.random();
                if (type < 0.35) { // 樹
                    createTree(groundGroup, x, 0, z);
                } else if (type < 0.5) { // 石頭
                    createRock(groundGroup, x, 0, z);
                } else if (type < 0.65) { // 小花
                    createFlower(groundGroup, x, 0, z);
                }
            }

            // 遠景雲朵
            for (let i = 0; i < 25; i++) {
                const x = (Math.random() - 0.5) * 140;
                const z = (Math.random() - 0.5) * 140;
                if (Math.abs(x) < 30 && Math.abs(z) < 30) continue;
                createCloud(groundGroup, x, 12 + Math.random() * 8, z);
            }

            return groundGroup;
        }

        // --- 輔助函數: 方塊紋理 (通用) ---
        function createBlockTexture(baseColor, detailColor = null) {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            // 底色
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 32, 32);
            
            // 邊框線 (立體感)
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, 32, 32);
            
            // 內部細節
            if (detailColor) {
                for (let i = 0; i < 20; i++) {
                    const x = Math.floor(Math.random() * 32);
                    const y = Math.floor(Math.random() * 32);
                    ctx.fillStyle = detailColor;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            
            // 隨機雜點
            for (let i = 0; i < 50; i++) {
                const x = Math.floor(Math.random() * 32);
                const y = Math.floor(Math.random() * 32);
                const bright = Math.random() * 40 + 20;
                ctx.fillStyle = `rgba(${bright}, ${bright}, ${bright}, 0.3)`;
                ctx.fillRect(x, y, 1, 1);
            }
            
            return new THREE.CanvasTexture(canvas);
        }

        // --- 創建樹 ---
        function createTree(group, x, y, z) {
            const treeGroup = new THREE.Group();
            
            // 樹幹 (棕色)
            const trunkMat = new THREE.MeshStandardMaterial({ 
                map: createBlockTexture('#8B5A2B', '#6B4226'),
                roughness: 0.9
            });
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), trunkMat);
            trunk.position.y = 0.9;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            treeGroup.add(trunk);

            // 樹葉 (綠色)
            const leafMat = new THREE.MeshStandardMaterial({ 
                map: createBlockTexture('#2E7D32', '#1B5E20'),
                roughness: 0.7
            });
            const leafPositions = [
                [0, 2.0, 0, 1.4, 1.2, 1.4],
                [-0.8, 2.4, 0.6, 1.0, 0.8, 1.0],
                [0.8, 2.4, -0.6, 1.0, 0.8, 1.0],
                [0.6, 2.4, 0.8, 1.0, 0.8, 1.0],
                [-0.6, 2.4, -0.8, 1.0, 0.8, 1.0],
                [0, 3.0, 0, 1.0, 0.6, 1.0]
            ];
            for (const pos of leafPositions) {
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(pos[3], pos[4], pos[5]), leafMat);
                leaf.position.set(pos[0], pos[1], pos[2]);
                leaf.castShadow = true;
                leaf.receiveShadow = true;
                treeGroup.add(leaf);
            }

            treeGroup.position.set(x, y, z);
            group.add(treeGroup);
        }

        // --- 創建石頭 ---
        function createRock(group, x, y, z) {
            const rockMat = new THREE.MeshStandardMaterial({
                map: createBlockTexture('#9E9E9E', '#757575'),
                roughness: 0.95
            });
            const size = 0.4 + Math.random() * 0.5;
            const rock = new THREE.Mesh(new THREE.BoxGeometry(size, size * 0.6, size * 0.8), rockMat);
            rock.position.set(x, y + size * 0.3, z);
            rock.rotation.y = Math.random() * Math.PI;
            rock.rotation.x = (Math.random() - 0.5) * 0.2;
            rock.castShadow = true;
            rock.receiveShadow = true;
            group.add(rock);
        }

        // --- 創建小花 (彩色小方塊) ---
        function createFlower(group, x, y, z) {
            const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const flowerMat = new THREE.MeshStandardMaterial({
                map: createBlockTexture(color, '#ffffff'),
                roughness: 0.6
            });
            const flower = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), flowerMat);
            flower.position.set(x, y + 0.2, z);
            flower.castShadow = true;
            flower.receiveShadow = true;
            group.add(flower);
            
            // 加一個小莖
            const stemMat = new THREE.MeshStandardMaterial({ color: '#4CAF50' });
            const stem = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.05), stemMat);
            stem.position.set(x, y, z);
            group.add(stem);
        }

        // --- 創建雲朵 (裝飾) ---
        function createCloud(group, x, y, z) {
            const cloudGroup = new THREE.Group();
            const cloudMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.7,
                roughness: 0.1,
                emissive: new THREE.Color(0xeeeeee),
                emissiveIntensity: 0.1
            });
            
            const positions = [
                [0, 0, 0, 1.6, 0.5, 1.0],
                [-1.0, 0.2, 0.2, 1.2, 0.4, 0.8],
                [1.0, 0.1, -0.2, 1.2, 0.4, 0.8],
                [-0.5, 0.4, -0.6, 0.8, 0.3, 0.6],
                [0.6, 0.3, 0.7, 0.8, 0.3, 0.6]
            ];
            for (const p of positions) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(p[3], p[4], p[5]), cloudMat);
                box.position.set(p[0], p[1], p[2]);
                box.castShadow = false;
                box.receiveShadow = false;
                cloudGroup.add(box);
            }
            cloudGroup.position.set(x, y, z);
            group.add(cloudGroup);
        }

        // --- 生成世界 ---
        const worldGroup = createGround();
        scene.add(worldGroup);

        // --- 添加一些隨機的 "礦石" 方塊在地面 (趣味) ---
        function addOreBlocks() {
            const oreMat = new THREE.MeshStandardMaterial({
                map: createBlockTexture('#FFD700', '#DAA520'),
                emissive: new THREE.Color(0x553300),
                emissiveIntensity: 0.2
            });
            for (let i = 0; i < 30; i++) {
                const x = (Math.random() - 0.5) * 60;
                const z = (Math.random() - 0.5) * 60;
                if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
                const ore = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), oreMat);
                ore.position.set(x, 0.1, z);
                ore.castShadow = true;
                ore.receiveShadow = true;
                scene.add(ore);
            }
        }
        addOreBlocks();

        // --- 邊界圍欄 (光柱) 防止走太遠 ---
        function createBoundaryBeacons() {
            const beaconMat = new THREE.MeshStandardMaterial({
                color: 0xffaa00,
                emissive: 0x442200,
                transparent: true,
                opacity: 0.3
            });
            const positions = [
                [-38, 0, -38], [38, 0, -38], [-38, 0, 38], [38, 0, 38],
                [-38, 0, 0], [38, 0, 0], [0, 0, -38], [0, 0, 38]
            ];
            for (const pos of positions) {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 0.5), beaconMat);
                pillar.position.set(pos[0], 1, pos[1]);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                scene.add(pillar);
                
                // 頂部小光點
                const topMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500 });
                const top = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6), topMat);
                top.position.set(pos[0], 2.2, pos[1]);
                scene.add(top);
            }
        }
        createBoundaryBeacons();

        // --- 添加霧效 ---
        scene.fog = new THREE.Fog(0x87CEEB, 40, 80);

        // --- 動態雲朵 (緩慢飄動) ---
        const clouds = [];
        scene.children.forEach(child => {
            if (child.type === 'Group') {
                child.children.forEach(sub => {
                    if (sub.type === 'Group' && sub.children.length > 0 && sub.children[0].material && sub.children[0].material.color.getHex() === 0xffffff) {
                        clouds.push(sub);
                    }
                });
            }
        });

        // --- 輔助網格 (可選, 這裡不啟用) ---
        // const gridHelper = new THREE.GridHelper(80, 20, 0x888888, 0x444444);
        // scene.add(gridHelper);

        // --- 動畫循環 ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() * 0.0001;

            // 雲朵飄動
            clouds.forEach((cloud, index) => {
                cloud.position.x += Math.sin(elapsedTime + index) * 0.001;
                cloud.position.z += Math.cos(elapsedTime * 0.7 + index) * 0.001;
            });

            // 控制更新 (pointer lock 模式下自動更新)
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- 窗口大小調整 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 鍵盤監聽 (移動) ---
        const keyState = {
            w: false, a: false, s: false, d: false,
            shift: false, space: false
        };

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keyState.w = true; e.preventDefault(); break;
                case 'KeyA': keyState.a = true; e.preventDefault(); break;
                case 'KeyS': keyState.s = true; e.preventDefault(); break;
                case 'KeyD': keyState.d = true; e.preventDefault(); break;
                case 'ShiftLeft': keyState.shift = true; e.preventDefault(); break;
                case 'Space': keyState.space = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keyState.w = false; e.preventDefault(); break;
                case 'KeyA': keyState.a = false; e.preventDefault(); break;
                case 'KeyS': keyState.s = false; e.preventDefault(); break;
                case 'KeyD': keyState.d = false; e.preventDefault(); break;
                case 'ShiftLeft': keyState.shift = false; e.preventDefault(); break;
                case 'Space': keyState.space = false; e.preventDefault(); break;
            }
        });

        // 移動邏輯 (每幀更新)
        function updateMovement() {
            if (!controls.isLocked) return;
            
            const speed = keyState.shift ? 0.25 : 0.12;
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            direction.y = 0;
            direction.normalize();
            
            const right = new THREE.Vector3();
            right.crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();

            const moveX = (keyState.d ? 1 : 0) - (keyState.a ? 1 : 0);
            const moveZ = (keyState.s ? 1 : 0) - (keyState.w ? 1 : 0);
            
            if (moveX !== 0 || moveZ !== 0) {
                const forward = direction.clone().multiplyScalar(-moveZ);
                const sideways = right.clone().multiplyScalar(moveX);
                const total = forward.add(sideways).normalize().multiplyScalar(speed);
                
                camera.position.x += total.x;
                camera.position.z += total.z;
            }

            // 跳躍 (簡易重力)
            if (keyState.space && camera.position.y <= 1.5) {
                camera.position.y += 0.3;
            } else if (camera.position.y > 1.5) {
                camera.position.y -= 0.03;
            } else if (camera.position.y < 1.5) {
                camera.position.y = 1.5;
            }
        }

        // 在動畫循環中加入移動更新
        setInterval(() => {
            updateMovement();
        }, 16); // 約 60fps

        console.log('🎮 Minecraft 3D 世界已啟動！');
    </script>
</body>
</html>
