<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>僵尸枪战·载具风暴 精致版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0f0c;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 800px;
      background: #1d2b24;
      box-shadow: 0 0 60px rgba(0, 255, 100, 0.2);
      border-radius: 24px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 30%, #2c4a3a, #0e1f16);
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      color: #e0ffe8;
      text-shadow: 0 0 10px #00c853, 0 2px 4px black;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 1px;
      z-index: 10;
    }
    .badge {
      background: rgba(10, 25, 18, 0.7);
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid #4caf7a;
      box-shadow: 0 0 15px #1e5a3a;
    }
    #ammo-panel {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 15, 5, 0.8);
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid #b3ffb0;
      color: #f2ffe6;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 12px #69f0ae;
      letter-spacing: 2px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      z-index: 10;
    }
    #vehicle-status {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(20, 35, 25, 0.85);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid #9dffb0;
      color: #cdffd8;
      font-weight: bold;
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 20;
      filter: drop-shadow(0 0 8px #aaffaa);
    }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="1200" height="800"></canvas>
  <div id="hud">
    <div class="badge" id="healthDisplay">❤️ 100</div>
    <div class="badge" id="zombieCount">🧟 0</div>
    <div class="badge" id="vehicleName">🚶 步行</div>
  </div>
  <div id="ammo-panel" id="ammoDisplay">🔫 30 / 无限</div>
  <div id="vehicle-status" id="vehicleHp">载具HP: --</div>
  <svg id="crosshair" viewBox="0 0 100 100" width="30" height="30">
    <circle cx="50" cy="50" r="28" fill="none" stroke="#c8ffb0" stroke-width="4" opacity="0.8"/>
    <line x1="50" y1="10" x2="50" y2="30" stroke="#eaffdd" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="70" x2="50" y2="90" stroke="#eaffdd" stroke-width="6" stroke-linecap="round"/>
    <line x1="10" y1="50" x2="30" y2="50" stroke="#eaffdd" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="50" x2="90" y2="50" stroke="#eaffdd" stroke-width="6" stroke-linecap="round"/>
  </svg>
</div>

<script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const healthDisplay = document.getElementById('healthDisplay');
    const zombieCountSpan = document.getElementById('zombieCount');
    const vehicleNameSpan = document.getElementById('vehicleName');
    const ammoDisplay = document.getElementById('ammoDisplay');
    const vehicleHpSpan = document.getElementById('vehicleHp');

    // ---------- 地图尺寸 ----------
    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 2000;
    const LAKE_CENTER_X = 1700, LAKE_CENTER_Y = 500, LAKE_RADIUS = 280;

    // ---------- 输入状态 ----------
    const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
    let mouseX = 0, mouseY = 0;
    let mouseDown = false;

    // ---------- 玩家属性 ----------
    let player = {
      x: 400, y: 900,
      vx: 0, vy: 0,
      width: 28, height: 40,
      health: 100,
      maxHealth: 100,
      speed: 180,
      onGround: true,
      climbing: false,
      vehicle: null,         // 当前载具引用 (null表示步行)
      weapon: 'rifle',
      ammo: 30,
      maxAmmo: 30,
      lastDirection: 1
    };

    // ---------- 载具系统 ----------
    const vehicles = [];
    class Vehicle {
      constructor(type, x, y, hp, maxHp, speed, color, name) {
        this.type = type; // 'boat', 'car', 'plane'
        this.x = x; this.y = y;
        this.width = type === 'plane' ? 70 : type === 'boat' ? 90 : 80;
        this.height = type === 'plane' ? 45 : type === 'boat' ? 40 : 50;
        this.hp = hp; this.maxHp = maxHp;
        this.speed = speed;
        this.color = color;
        this.name = name;
        this.direction = 1;
        this.active = true;
        this.attackCooldown = 0;
        this.bullets = [];
      }
      draw(ctx) {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        // 船
        if (this.type === 'boat') {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, 45, 20, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#6d4c2f';
          ctx.fillRect(-25, -22, 50, 12);
          ctx.fillStyle = '#ddd';
          ctx.font = 'bold 12px monospace';
          ctx.fillText('🚤', -15, -8);
        } else if (this.type === 'car') {
          ctx.fillStyle = this.color;
          ctx.fillRect(-40, -20, 80, 40);
          ctx.fillStyle = '#222';
          ctx.fillRect(-20, -30, 40, 16);
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(15, -25, 6, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#333';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText('🚗', -25, -10);
        } else if (this.type === 'plane') {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.moveTo(-35, 0); ctx.lineTo(35, -15); ctx.lineTo(35, 15); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#f0f0f0';
          ctx.beginPath();
          ctx.arc(25, 0, 8, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111';
          ctx.font = 'bold 10px monospace';
          ctx.fillText('✈️', -15, -15);
        }
        ctx.restore();
        // 血条
        if (this.hp < this.maxHp) {
          ctx.fillStyle = '#ff5555';
          ctx.fillRect(this.x-35, this.y-40, 70, 8);
          ctx.fillStyle = '#55ff55';
          ctx.fillRect(this.x-35, this.y-40, 70 * (this.hp/this.maxHp), 8);
        }
      }
    }

    // 创建载具：船、汽车、飞机
    vehicles.push(new Vehicle('boat', 1500, 480, 200, 200, 150, '#5c4e3d', '巡逻艇'));
    vehicles.push(new Vehicle('car', 600, 1200, 180, 180, 220, '#3a6ea5', '装甲车'));
    vehicles.push(new Vehicle('plane', 2200, 300, 300, 300, 280, '#7b8c9e', '武装飞机'));

    // ---------- 僵尸群 ----------
    let zombies = [];
    const ZOMBIE_COUNT = 45;
    class Zombie {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.width = 26; this.height = 38;
        this.hp = 50;
        this.maxHp = 50;
        this.speed = 40 + Math.random() * 50;
        this.damage = 8;
        this.attackCooldown = 0;
        this.color = `hsl(${80 + Math.random()*40}, 60%, 45%)`;
      }
      draw(ctx) {
        ctx.fillStyle = '#2f5e3a';
        ctx.fillRect(this.x-13, this.y-19, 26, 38);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x-8, this.y-25, 16, 14);
        ctx.fillStyle = '#ff5555';
        ctx.fillRect(this.x-5, this.y-18, 3, 3);
        ctx.fillRect(this.x+2, this.y-18, 3, 3);
      }
    }

    function spawnZombies() {
      zombies = [];
      for (let i=0; i<ZOMBIE_COUNT; i++) {
        let x = 300 + Math.random() * 2400;
        let y = 300 + Math.random() * 1400;
        zombies.push(new Zombie(x, y));
      }
    }
    spawnZombies();

    // ---------- 子弹系统 ----------
    let bullets = [];
    class Bullet {
      constructor(x, y, angle, speed, damage, isPlayer = true) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.damage = damage;
        this.radius = 4;
        this.isPlayer = isPlayer;
        this.life = 1.2;
      }
    }

    // ---------- 攀爬与碰撞 ----------
    function isLake(x, y) {
      const dx = x - LAKE_CENTER_X, dy = y - LAKE_CENTER_Y;
      return (dx*dx + dy*dy) < LAKE_RADIUS * LAKE_RADIUS;
    }

    function canClimbAt(x, y) {
      // 简单模拟：墙面或树木附近可攀爬（地图上设置一些攀爬点：城市边缘）
      if (x > 2200 && x < 2700 && y > 1200 && y < 1600) return true;
      if (x > 400 && x < 800 && y > 1500 && y < 1700) return true;
      return false;
    }

    // ---------- 枪械定义 ----------
    const weapons = [
      { name: '步枪', damage: 24, range: 700, fireRate: 8, ammoMax: 30 },
      { name: '霰弹枪', damage: 45, range: 250, fireRate: 3, ammoMax: 12 },
      { name: '狙击枪', damage: 90, range: 900, fireRate: 1.2, ammoMax: 8 },
      { name: '冲锋枪', damage: 14, range: 400, fireRate: 15, ammoMax: 40 }
    ];
    let currentWeaponIndex = 0;

    // ---------- 相机 ----------
    let camera = { x: 0, y: 0 };

    // ---------- 辅助函数 ----------
    function updateCamera() {
      camera.x = player.x - canvas.width/2;
      camera.y = player.y - canvas.height/2;
      camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, camera.x));
      camera.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, camera.y));
    }

    function drawWorld() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // 地面纹理
      ctx.fillStyle = '#2a3d2e';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
      for (let i=0; i<140; i+=20) {
        ctx.fillStyle = '#3a5240';
        ctx.fillRect(i*20, 0, 8, WORLD_HEIGHT);
        ctx.fillRect(0, i*20, WORLD_WIDTH, 8);
      }

      // 城市建筑
      const buildings = [
        [250, 250, 160, 200, '#5a4e3c'], [700, 150, 200, 250, '#6a5c46'], [1200, 300, 250, 280, '#4e5a40'],
        [2100, 200, 220, 300, '#7a6a4a'], [2600, 400, 180, 250, '#5e5040'], [1800, 1100, 260, 220, '#6f5f48'],
        [300, 1100, 200, 240, '#4f5a3e'], [1000, 1300, 240, 260, '#7c654a'], [2200, 1400, 280, 200, '#5c5e3c']
      ];
      buildings.forEach(b => {
        ctx.fillStyle = b[4];
        ctx.fillRect(b[0], b[1], b[2], b[3]);
        ctx.fillStyle = '#3b3520';
        ctx.fillRect(b[0]+10, b[1]+10, b[2]-20, b[3]-20);
        ctx.fillStyle = '#b3a68b';
        for (let wy=b[1]+20; wy<b[1]+b[3]-20; wy+=40) {
          for (let wx=b[0]+15; wx<b[0]+b[2]-15; wx+=30) ctx.fillRect(wx, wy, 12, 18);
        }
      });

      // 湖泊
      ctx.fillStyle = '#2c7a9c';
      ctx.beginPath();
      ctx.ellipse(LAKE_CENTER_X, LAKE_CENTER_Y, LAKE_RADIUS, LAKE_RADIUS, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#3f9fc8';
      ctx.beginPath();
      ctx.ellipse(LAKE_CENTER_X-20, LAKE_CENTER_Y-10, LAKE_RADIUS-40, LAKE_RADIUS-30, 0, 0, Math.PI*2);
      ctx.fill();

      // 载具绘制
      vehicles.forEach(v => v.draw(ctx));

      // 僵尸绘制
      zombies.forEach(z => z.draw(ctx));

      // 子弹
      bullets.forEach(b => {
        ctx.fillStyle = b.isPlayer ? '#ffe066' : '#ff5555';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, 2*Math.PI);
        ctx.fill();
      });

      // 玩家
      if (player.vehicle) {
        // 已在载具上绘制载具，玩家以标记显示在载具上
        ctx.fillStyle = '#f4d03f';
        ctx.beginPath();
        ctx.arc(player.x, player.y-25, 12, 0, 2*Math.PI);
        ctx.fill();
      } else {
        ctx.fillStyle = '#f4d03f';
        ctx.fillRect(player.x-14, player.y-20, 28, 40);
        ctx.fillStyle = '#222';
        ctx.fillRect(player.x-8, player.y-28, 16, 12);
      }
      ctx.restore();
    }

    // ---------- 更新逻辑 ----------
    function update(dt) {
      if (dt > 0.1) dt = 0.1;

      // 玩家移动
      let moveX = 0, moveY = 0;
      if (keys.w) moveY -= 1;
      if (keys.s) moveY += 1;
      if (keys.a) moveX -= 1;
      if (keys.d) moveX += 1;
      let len = Math.hypot(moveX, moveY);
      if (len > 0) { moveX /= len; moveY /= len; }

      const currentSpeed = player.vehicle ? player.vehicle.speed : player.speed;
      player.vx = moveX * currentSpeed;
      player.vy = moveY * currentSpeed;

      if (keys.space && !player.vehicle && !isLake(player.x, player.y)) {
        player.vy = -250;
      }

      // 载具驾驶模式
      if (player.vehicle) {
        player.x += player.vx * dt;
        player.y += player.vy * dt;
        player.vehicle.x = player.x;
        player.vehicle.y = player.y;
      } else {
        player.x += player.vx * dt;
        player.y += player.vy * dt;
      }

      // 地图边界
      player.x = Math.max(30, Math.min(WORLD_WIDTH-30, player.x));
      player.y = Math.max(30, Math.min(WORLD_HEIGHT-30, player.y));

      // 载具交互 (按E进入/离开)
      if (keys.e && !player.vehicle) {
        for (let v of vehicles) {
          if (v.active && Math.hypot(player.x-v.x, player.y-v.y) < 60) {
            player.vehicle = v;
            player.x = v.x; player.y = v.y;
            break;
          }
        }
      } else if (keys.e && player.vehicle) {
        player.vehicle = null;
      }

      // 攀爬检测
      const canClimb = canClimbAt(player.x, player.y);
      player.climbing = canClimb && !player.vehicle;

      // 载具攻击
      if (player.vehicle) {
        if (mouseDown && player.vehicle.attackCooldown <= 0) {
          const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
          bullets.push(new Bullet(player.x, player.y-25, angle, 400, 15, true));
          player.vehicle.attackCooldown = 0.25;
        }
        if (player.vehicle.attackCooldown > 0) player.vehicle.attackCooldown -= dt;
        vehicleHpSpan.innerText = `载具HP: ${Math.floor(player.vehicle.hp)}/${player.vehicle.maxHp}`;
      } else {
        vehicleHpSpan.innerText = `载具HP: --`;
      }

      // 射击 (非载具)
      if (mouseDown && !player.vehicle && player.ammo > 0) {
        const weapon = weapons[currentWeaponIndex];
        const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        bullets.push(new Bullet(player.x, player.y-20, angle, 600, weapon.damage, true));
        player.ammo--;
        if (player.ammo < 0) player.ammo = 0;
      }

      // 换枪 (数字键1-4)
      if (keys['1']) { currentWeaponIndex = 0; player.ammo = 30; player.maxAmmo=30; }
      if (keys['2']) { currentWeaponIndex = 1; player.ammo = 12; player.maxAmmo=12; }
      if (keys['3']) { currentWeaponIndex = 2; player.ammo = 8; player.maxAmmo=8; }
      if (keys['4']) { currentWeaponIndex = 3; player.ammo = 40; player.maxAmmo=40; }

      // 僵尸AI与碰撞
      zombies.forEach(z => {
        const dx = player.x - z.x;
        const dy = player.y - z.y;
        const dist = Math.hypot(dx, dy) || 0.01;
        if (dist < 500 && dist > 20) {
          z.x += (dx/dist) * z.speed * dt;
          z.y += (dy/dist) * z.speed * dt;
        }
        if (dist < 32 && z.attackCooldown <= 0) {
          if (player.vehicle) {
            player.vehicle.hp -= z.damage;
            if (player.vehicle.hp <= 0) {
              player.vehicle.active = false;
              player.vehicle = null;
            }
          } else {
            player.health -= z.damage;
          }
          z.attackCooldown = 1.0;
        }
        if (z.attackCooldown > 0) z.attackCooldown -= dt;
        // 边界
        z.x = Math.max(20, Math.min(WORLD_WIDTH-20, z.x));
        z.y = Math.max(20, Math.min(WORLD_HEIGHT-20, z.y));
      });

      // 子弹更新
      bullets.forEach(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        // 击中僵尸
        if (b.isPlayer) {
          zombies.forEach(z => {
            if (Math.hypot(z.x-b.x, z.y-b.y) < 18 && z.hp > 0) {
              z.hp -= b.damage;
              b.life = 0;
            }
          });
          vehicles.forEach(v => {
            if (v.active && Math.hypot(v.x-b.x, v.y-b.y) < 40 && v !== player.vehicle) {
              v.hp -= b.damage;
              b.life = 0;
            }
          });
        }
      });
      bullets = bullets.filter(b => b.life > 0 && b.x > 0 && b.x < WORLD_WIDTH && b.y > 0 && b.y < WORLD_HEIGHT);
      zombies = zombies.filter(z => z.hp > 0);

      if (zombies.length === 0) spawnZombies();
      if (player.health <= 0) {
        player.health = 100;
        player.x = 400; player.y = 900;
        player.vehicle = null;
      }

      // HUD更新
      healthDisplay.innerText = `❤️ ${Math.floor(player.health)}`;
      zombieCountSpan.innerText = `🧟 ${zombies.length}`;
      const vehName = player.vehicle ? player.vehicle.name : '步行';
      vehicleNameSpan.innerText = `🚶 ${vehName}`;
      ammoDisplay.innerText = `🔫 ${player.ammo} / ${weapons[currentWeaponIndex].name}`;

      updateCamera();
    }

    // ---------- 渲染循环 ----------
    function gameLoop() {
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      update(dt);
      drawWorld();
      requestAnimationFrame(gameLoop);
    }
    let lastTime = performance.now();

    // ---------- 事件监听 ----------
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'a' || key === 's' || key === 'd' || key === ' ') keys[key] = true;
      if (key === 'e') keys.e = true;
      if (key === 'shift') keys.shift = true;
      if (key === '1') keys['1'] = true;
      if (key === '2') keys['2'] = true;
      if (key === '3') keys['3'] = true;
      if (key === '4') keys['4'] = true;
      e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'a' || key === 's' || key === 'd' || key === ' ') keys[key] = false;
      if (key === 'e') keys.e = false;
      if (key === 'shift') keys.shift = false;
      if (key === '1') keys['1'] = false;
      if (key === '2') keys['2'] = false;
      if (key === '3') keys['3'] = false;
      if (key === '4') keys['4'] = false;
      e.preventDefault();
    });
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      mouseX = (e.clientX - rect.left) * scaleX + camera.x;
      mouseY = (e.clientY - rect.top) * scaleY + camera.y;
    });
    canvas.addEventListener('mousedown', (e) => { if (e.button === 0) mouseDown = true; });
    canvas.addEventListener('mouseup', () => { mouseDown = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    gameLoop();
  })();
</script>
</body>
</html>
